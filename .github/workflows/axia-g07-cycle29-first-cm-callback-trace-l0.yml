# Exact first CM output source gap versus official Jazzy CmdVel subscriber callback.
name: AXIA G07 Cycle29 first CM callback trace L0
on:
  push:
    branches: ['fix/g07-cycle29-first-cm-callback-lttng-20261116']
    paths:
      - '.github/workflows/axia-g07-cycle29-first-cm-callback-trace-l0.yml'
      - 'd06/live/g07_cycle29_first_cm_callback_trace.py'
      - 'd06/tests/test_g07_cycle29_first_cm_callback_trace.py'
      - 'd06/docs/G07_CYCLE29_CM_CALLBACK_FIRST_GAP_REPORT_20261116_KO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  exact-first-gap-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: 'Actual WSL2 150ms boundary and callback mapping RED GREEN, no ROS Goal'
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s d06/tests -p 'test_g07_cycle29_first_cm_callback_trace.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_g07_cycle27_first_120ms_rpc_relation.py' -v
          echo AXIA_G07_CYCLE29_CM_CALLBACK_L0_PASS_NO_ROS_NO_GOAL_OWNER_HOLD
