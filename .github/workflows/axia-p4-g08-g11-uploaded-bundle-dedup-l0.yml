name: AXIA P4 G08 G11 uploaded RAW scope and duplicate-reference regression L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g08-g11-uploaded-bundle-dedup-l0.yml']
permissions:
  contents: read
jobs:
  sealed-raw-scope-regression-without-owner-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Exact sealed Instructor source without RAW export
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 91a5c78b3992ada4a2dad70848f4919c67c58c19
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: ROS-free synthetic-index requalification contract tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '91a5c78b3992ada4a2dad70848f4919c67c58c19'
          python3 -m py_compile tools/p4_g11_bundle_requalification_contract.py\n          python3 -m unittest discover -s tests/unit -p test_p4_g11_bundle_requalification_contract.py -v
          echo AXIA_P4_G08_G11_704_REF_NOT_704_GOALS_RAW_SCOPE_L0_PASS_FORMAL_0_OF_15
      - name: Always erase private solution
        if: always()
        shell: bash
        run: rm -rf -- .git docs ros2_ws scripts tools tests fixtures scenarios configs results training
