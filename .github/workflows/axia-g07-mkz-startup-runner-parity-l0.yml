name: AXIA G07 MKZ Owner/CI identical staged runner (PUBLIC L0)
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-mkz-startup-runner-parity-l0.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-mkz-owner-runner-public-l0
  cancel-in-progress: false
jobs:
  g07-first-startup-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact Instructor SHA on PUBLIC CI only, no private Actions
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: b3b2d82dda17e9d6b7290bde9c7d03e832c17ace
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Regress exact first NAVIGATION_START failure using 95s sanitized fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = b3b2d82dda17e9d6b7290bde9c7d03e832c17ace
          python3 -m pip install -q --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_owner_mkz_startup_runner_parity_20261112.py \
            tests/unit/test_p2_g07_ordered_nav2_shutdown_20261112.py \
            tests/unit/test_p2_g07_owner_h3ii_shutdown_truth_20261112.py
          echo AXIA_G07_MKZ_SHARED_STARTUP_PARITY_PUBLIC_L0_PASS_NO_ROS_NO_GOAL
      - name: Destroy private Instructor source on public runner
        if: always()
        shell: bash
        run: rm -rf -- .git tests tools scripts ros2_ws configs docs training results
