name: AXIA G07 C31 native Localization shutdown ACK first boundary L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-c31-native-shutdown-ack-l0.yml']
permissions:
  contents: read
jobs:
  localizer-first-response-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact sealed instructor candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 527e6037a96d062a9ad0031b8ec860ab7659a10d
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Assert immutable RED candidate and execute reduced fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 527e6037a96d062a9ad0031b8ec860ab7659a10d
          python3 -m unittest discover -s tests/unit -p test_g07_c31_native_shutdown_ack_trace.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_gui_readonly_scope.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_guard_small_reverse_first_latch.py -v
          echo AXIA_G07_C31_NATIVE_ACK_GUI_AND_FIRST_GUARD_RED_GREEN_L0_PASS_NO_ROS_NO_GOAL
      - name: Remove instructor checkout
        if: always()
        run: rm -rf -- tests tools ros2_ws training docs scripts
