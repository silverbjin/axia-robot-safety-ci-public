name: AXIA P3 G09 time indexed PNU synthetic L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - '.github/workflows/axia-p3-g09-time-indexed-l0.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  private-g09-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact sealed Instructor G09 source (not public)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: ca52f6fccc53dbd8a8d6591112b194d5fe975934
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact SHA and G09 RED regression (offline only)
        shell: bash
        run: |
          set -euo pipefail
          cd instructor
          test "$(git rev-parse HEAD)" = 'ca52f6fccc53dbd8a8d6591112b194d5fe975934'
          export PYTHONPATH="$PWD/ros2_ws/src/axia_scenario_verifier"
          python3 -m unittest discover -s tests/unit -p 'test_p3_g09_time_indexed.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_p3_mvp.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_p3_integrated_provenance_20261113.py' -v
          python3 scripts/run_p3_mvp.py --scenario S04 --results-root "$RUNNER_TEMP/p3-g09" --allow-partial-ci
          echo AXIA_G09_L0_PASS_NO_ROS_NO_GOAL_NO_FAULT
      - name: Erase private temporary source
        if: always()
        shell: bash
        run: rm -rf -- instructor
