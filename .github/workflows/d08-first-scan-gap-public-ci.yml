name: AXIA D08 VG0B5q first Scan receive gap L0 (sanitized)
on:
  push:
    branches: ['fix/d08-first-scan-gap-boundary-20261119']
    paths:
      - 'd08/tests/test_d08_field_first_518ms_receive_boundary.py'
      - 'd08/harness/d08_scan_gap_trace.py'
      - 'd08/harness/d08_same_world_replan.py'
      - '.github/workflows/d08-first-scan-gap-public-ci.yml'
      - 'd08/docs/reports/D08_FIRST_SCAN_GAP_CAUSALITY_20261119_KO.md'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: d08-first-gap-${{ github.ref }}
  cancel-in-progress: true
jobs:
  l0-sanitized-field-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: RED / GREEN first wall Scan gap evidence, not Gazebo proof
        shell: bash
        run: |
          set -Eeuo pipefail
          echo "D08_FIRST_GAP_L0_CHECKOUT_SHA=$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 -m pip install -q pytest==8.3.5
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q \
            d08/tests/test_d08_field_first_518ms_receive_boundary.py \
            d08/tests/test_d08_scan_gap_trace.py \
            d08/tests/test_d08_same_world_replan.py
          echo D08_FIRST_SCAN_518394MS_FIELD_CONTRACT_L0_PASS_NOT_GAZEBO
