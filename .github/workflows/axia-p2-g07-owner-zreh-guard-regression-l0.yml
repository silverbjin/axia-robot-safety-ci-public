name: AXIA G07 Owner zreh4rQQ CM slowdown direction skew RED GREEN L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p2-g07-owner-zreh-guard-regression-l0.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-owner-zreh-real-trace-l0
  cancel-in-progress: false
jobs:
  real-owner-trace-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: axia-instructor-sealed
    steps:
      - name: Checkout pinned exact Instructor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: b9b3a93d99e8386a8f2b29b0814897d497ab04aa
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Deterministic actual WSL2 owner trace and all existing safety guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'b9b3a93d99e8386a8f2b29b0814897d497ab04aa'
          python3 -m pip install -q --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_guard_zreh_owner_cm_skew.py \
            tests/unit/test_p2_g07_guard_kca1_cm_slowdown.py \
            tests/unit/test_p2_g07_guard_nearzero_owner_trace.py \
            tests/unit/test_p2_g07_guard_async_owner_trace.py \
            tests/unit/test_p2_base_guard_policy.py \
            tests/unit/test_p2_guard_cancel_contract.py \
            tests/unit/test_p2_guard_parameter_init_contract.py
          python3 -m py_compile ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py
          bash -n scripts/p2_guard_ros_smoke_ci.sh
          echo 'AXIA_G07_ZREH_OWNER_CM_SLOWDOWN_L0_GREEN_PASS_NO_GOAL'
      - name: Mutation safety gate - old historical origin magnitude bound must break Owner regression
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py
          cp "$TARGET" /tmp/zreh_policy_original.py
          trap 'cp /tmp/zreh_policy_original.py "$TARGET"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py')
          s=p.read_text()
          old='and origin.linear_x != 0'
          assert s.count(old)==1
          p.write_text(s.replace(old,'and 0 < abs(origin.linear_x) <= 0.01'))
          PY
          set +e
          python3 -m pytest -q \
            tests/unit/test_p2_g07_guard_zreh_owner_cm_skew.py::test_zreh_actual_30pct_delayed_cm_direction_change_no_false_latch \
            >/tmp/zreh_expected_mutation_red.log 2>&1
          RC=$?
          set -e
          if [[ "$RC" -eq 0 ]];then
            echo AXIA_ZREH_MUTATION_GATE_BLOCKED_REGRESSION_TEST_BLIND
            exit 2
          fi
          grep -q 'a real matching old 30pct CM output must not permanently cancel Nav2 Goal' \
            /tmp/zreh_expected_mutation_red.log || { cat /tmp/zreh_expected_mutation_red.log;exit 2; }
          echo AXIA_ZREH_MUTATION_EXPECTED_RED_CAUGHT_PASS
      - name: Purge sealed private source
        if: always()
        shell: bash
        run: rm -rf -- .git tests tools scripts ros2_ws configs docs fixtures results
