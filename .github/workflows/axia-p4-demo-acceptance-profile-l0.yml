name: AXIA P4 reduced demo acceptance profile contract L0 (v1 unchanged)
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-demo-acceptance-profile-l0.yml']
permissions:
  contents: read
jobs:
  demo-profile-safety-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: axia-instructor-sealed
    steps:
      - name: Exact private instructor candidate only; no raw Owner evidence
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: db66ee840e432a610f2d142937d9ec59543ea44d
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: G00-G10 scoped pass reuse vs mandatory safety blockers
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = db66ee840e432a610f2d142937d9ec59543ea44d
          python3 -m unittest discover -s tests/unit -p test_p4_demo_acceptance_profile.py -v
          python3 tools/p4_demo_acceptance.py --verify-current             --output "$RUNNER_TEMP/axia_mvp_demo_acceptance_result.json"
          python3 - "$RUNNER_TEMP/axia_mvp_demo_acceptance_result.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['profile_id']=='AXIA_MVP_DEMO_ACCEPTED'
          assert a['status']=='HOLD'
          assert a['scenario_reused_evidence_count']==5
          assert a['legacy_g11_formal_accepted_count']==0
          assert a['v1_formal_remains_unaccepted'] is True
          assert a['certified_estop'] is False
          status=json.load(open('docs/reports/AXIA_MVP_DEMO_ACCEPTANCE_STATUS_20261114.json'))
          assert status['status']=='HOLD'
          assert status['g07_first_timing_violation']['resolved'] is False
          assert status['s02_contact']['native_contact_zero_verified'] is False
          assert status['wsl2_integrated']['verified'] is False
          assert status['owner_final_approval']['approved'] is False
          ci=status['g07_first_timing_violation']['ci_scoped_current_pinned_source_review']
          assert ci['ci_run_id']==43670809154
          assert ci['private_runtime_source_sha']=='116144d1f549d24a2f1ed83fdf85723e7f148595'
          assert ci['owner_wsl2_timing_verified'] is False
          assert status['s02_contact']['ci_scoped_current_pinned_source_review']['native_observed_iterations']==27508
          assert status['s02_contact']['ci_scoped_current_pinned_source_review']['native_positive_contacts']==0
          print('AXIA_P4_CURRENT_G07_S02_CI_EVIDENCE_LINKED_GLOBAL_OWNER_HOLD_L0_PASS')
          print("AXIA_MVP_DEMO_PROFILE_ADOPTED_HOLD_SAFETY_GATES_NOT_BYPASSED_L0_PASS_NO_ROS_NO_GOAL")
          PY
      - name: Remove protected source after test
        if: always()
        shell: bash
        run: rm -rf -- .git ros2_ws instructor training tests tools docs configs fixtures scenarios scripts
