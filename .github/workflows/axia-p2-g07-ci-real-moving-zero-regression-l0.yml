name: AXIA G07 real moving Guard normal ZERO vs safety STOP L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - '.github/workflows/axia-p2-g07-ci-real-moving-zero-regression-l0.yml'
permissions:
  contents: read
concurrency:
  group: axia-g07-real-moving-normal-zero-l0
  cancel-in-progress: false
jobs:
  owner-sim-real-trace-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: axia-instructor-sealed
    steps:
      - name: Exact private Instructor commit in sealed environment
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 08d820c421a9df9eab6ad2de13b62adb83a879eb
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Actual Gazebo moving Goal first Guard latch regression including STOP negative controls
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '08d820c421a9df9eab6ad2de13b62adb83a879eb'
          python3 -m pip install -q --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_guard_authorized_transient_zero.py \
            tests/unit/test_p2_g07_guard_zreh_owner_cm_skew.py \
            tests/unit/test_p2_g07_guard_kca1_cm_slowdown.py \
            tests/unit/test_p2_g07_guard_nearzero_owner_trace.py \
            tests/unit/test_p2_base_guard_policy.py \
            tests/unit/test_p2_guard_cancel_contract.py \
            tests/unit/test_p2_guard_parameter_init_contract.py \
            tests/unit/test_p2_g07_ci_moving_goal_oracle.py \
            tests/unit/test_p2_g07_ci_stop_stage.py
          python3 -m py_compile \
            ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py \
            ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_node.py
          echo 'AXIA_G07_REAL_MOVING_NORMAL_ZERO_SAFETY_L0_PASS'
      - name: Mutation guard - removing normal controller-zero permission reintroduces actual Goal cancel
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py
          cp "$TARGET" /tmp/g07_normal_zero_guard_original.py
          trap 'cp /tmp/g07_normal_zero_guard_original.py "$TARGET"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py')
          s=p.read_text()
          needle='if authorized_controller_zero:'
          assert s.count(needle)==1
          p.write_text(s.replace(needle,'if False and authorized_controller_zero:'))
          PY
          set +e
          python3 -m pytest -q tests/unit/test_p2_g07_guard_authorized_transient_zero.py::test_actual_gazebo_normal_goal_zero_blocks_old_cm_without_false_cancel > /tmp/g07_moving_expected_red.log 2>&1
          RC=$?
          set -e
          if [[ "$RC" -eq 0 ]];then echo AXIA_G07_NORMAL_ZERO_MUTATION_NOT_DETECTED;exit 2;fi
          grep -q 'Healthy NORMAL goal pause must not falsely cancel' /tmp/g07_moving_expected_red.log || { cat /tmp/g07_moving_expected_red.log;exit 2; }
          echo AXIA_G07_NORMAL_ZERO_MUTATION_REINTRODUCED_ERROR_CAUGHT_PASS
      - name: Destroy private solution
        if: always()
        shell: bash
        run: rm -rf -- .git tests tools scripts configs ros2_ws docs fixtures results
