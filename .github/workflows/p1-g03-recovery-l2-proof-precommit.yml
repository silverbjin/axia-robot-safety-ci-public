name: P1 G03 real Recovery sidecar precommit L0
on:
  push:
    branches: [feat/secure-instructor-cloud-bridge]
    paths: ['.github/workflows/p1-g03-recovery-l2-proof-precommit.yml']
permissions:
  contents: read
concurrency:
  group: axia-g03-recovery-precommit-l0
  cancel-in-progress: false
jobs:
  policy-no-motion:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - run: |
          echo 'SCOPE=L0_STATIC_UNIT_NO_GAZEBO_NO_GOAL_NO_FAULT'
          echo 'AUTO_OPERATOR_APPROVAL=DISABLED'
  protected-instructor-l0:
    needs: policy-no-motion
    if: github.repository == 'silverbjin/axia-robot-safety-ci-public' && github.actor == 'silverbjin' && github.ref == 'refs/heads/feat/secure-instructor-cloud-bridge' && github.event_name == 'push'
    environment: axia-instructor-sealed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      EXACT_PRIVATE_SHA: '26ad2ff8aec7f6a2b63ea6dcc1da37beeecd1b01'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify private credential exists
        env:
          CRED: ${{ secrets.AXIA_CLOUD_CI }}
        run: test -n "$CRED"
      - name: Checkout exact private staging SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: '26ad2ff8aec7f6a2b63ea6dcc1da37beeecd1b01'
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
          fetch-depth: 1
          path: _private
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pytest==8.3.5
      - name: Exact SHA + safe mode + shell compile
        shell: bash
        run: |
          set -euo pipefail
          cd _private
          test "$(git rev-parse HEAD)" = "$EXACT_PRIVATE_SHA"
          bash -n scripts/p1_t08_g03_recovery_3x_owner.sh
          python -m py_compile tools/p1_t08_g03_recovery_sidecar.py
          bash scripts/p1_t08_g03_recovery_3x_owner.sh --plan >/tmp/g03_plan_private
          grep -q AUTO_YES=DISABLED /tmp/g03_plan_private
          echo 'G03_L2_PRECOMMIT_BASH_COMPILE_PLAN_PASS'
      - name: New scoped R08 synthetic contract (safe failures only)
        shell: bash
        run: |
          set -euo pipefail
          cd _private
          if timeout 80s python -m pytest -q tests/unit/test_p1_t08_r08_scoped_final.py > /tmp/r08_synthetic_private 2>&1; then
            echo R08_SCOPED_SYNTHETIC_9_PASS
          else
            grep -E '^(FAILED|ERROR|[0-9]+ failed|[0-9]+ error|E  )' /tmp/r08_synthetic_private | head -35 | sed -E 's#(/home/[^ ]+|/tmp/[^ ]+)#<PRIVATE_PATH>#g' || true
            echo R08_SCOPED_SYNTHETIC_BLOCKED
            exit 2
          fi
      - name: R08 Owner local-signoff A/B/C read-only contract (no real evidence)
        shell: bash
        run: |
          set -euo pipefail
          cd _private
          python -m py_compile scripts/p1_r08_local_signoff_prepare.py
          if timeout 90s python -m pytest -q tests/unit/test_p1_r08_local_signoff_prepare.py > /tmp/r08_signoff_private 2>&1; then
            echo 'R08_OWNER_SIGNOFF_PREP_13_SYNTHETIC_PASS'
          else
            grep -E '^(FAILED|ERROR|[0-9]+ failed|[0-9]+ error|E  )' /tmp/r08_signoff_private | head -35 | sed -E 's#(/home/[^ ]+|/tmp/[^ ]+)#<PRIVATE_PATH>#g' || true
            echo 'R08_OWNER_SIGNOFF_PREP_BLOCKED'
            exit 2
          fi
      - name: Integration docs and main-approved conflict resolutions
        shell: bash
        run: |
          set -euo pipefail
          cd _private
          test "$(git hash-object docs/operations/P1_G03_L2_RECOVERY_ONE_SHOT_20261108_KO.md)" = "e0ff40c245bd6557adf19505d04ce97cc08366c7"
          test "$(git hash-object docs/operations/P1_R08_SCOPED_FINAL_ONE_PASS_20261108_KO.md)" = "f49586321e879406a0d6ed42dd4005138b3a0380"
          test "$(git hash-object docs/reports/P1_C4_SCAN_NINE_R08_READINESS_20261108_KO.md)" = "da7d5134a5f8cef8455d0229bf8c4e7e0b3da0b6"
          test "$(git hash-object docs/reports/P1_R08_G03_RECOVERY_CMD_SILENCE_RCA_20261108_KO.md)" = "a52832df11c3554cbf3f112e20b6c9d5160c49bb"
          test -f docs/reports/AXIA_P1_R08_FINAL_ACCEPTANCE_REPORT_20261108_KO.md
          test -f docs/handovers/AXIA_P2_G05_G06_G07_DEVELOPMENT_HANDOVER_20261108_KO.md
          grep -q P1_R08_ATTESTATION_METADATA_PENDING docs/reports/AXIA_P1_R08_FINAL_ACCEPTANCE_REPORT_20261108_KO.md
          grep -q 'G05/G06/G07' docs/handovers/AXIA_P2_G05_G06_G07_DEVELOPMENT_HANDOVER_20261108_KO.md
          test -f tools/p1_t08_r08_scoped_final.py
          test -f tools/p1_t08_g03_recovery_sidecar.py
          echo 'P1_INTEGRATION_DOCS_CONFLICT_RESOLUTIONS_PASS'
      - name: New G03 interlock tests and prior C3/C4 no-motion oracles
        shell: bash
        run: |
          set -euo pipefail
          cd _private
          if timeout 180s python -m pytest -q             tests/unit/test_p1_t08_g03_recovery_sidecar.py             tests/unit/test_p1_t08_g03_recovery_path_contract.py             tests/unit/test_p1_t08_r08_scoped_final.py             tests/unit/test_p1_t08_c4_operator_sequential.py             tests/unit/test_p1_t08_c4_scan_triplicate_review.py             tests/unit/test_p1_t08_c4_resume.py             tests/unit/test_p1_t08_trace_oracle.py             > /tmp/g03_test_private 2>&1; then
              echo 'G03_L2_PRECOMMIT_PROTECTED_L0_PASS'
          else
              grep -E '^(FAILED|ERROR|[0-9]+ failed|[0-9]+ error|E  )' /tmp/g03_test_private | head -35 | sed -E 's#(/home/[^ ]+|/tmp/[^ ]+)#<PRIVATE_PATH>#g' || true
              echo 'G03_L2_PRECOMMIT_PROTECTED_L0_BLOCKED'
              exit 2
          fi
      - name: Remove private material
        if: always()
        run: |
          rm -rf _private
          rm -f /tmp/g03_plan_private /tmp/g03_test_private /tmp/r08_synthetic_private /tmp/r08_signoff_private
          echo 'G03_L2_PRECOMMIT_PRIVATE_CLEANUP'
      - name: Testing limits
        if: always()
        run: echo 'G03_GAZEBO_RECOVERY=NOT_RUN R08=INCONCLUSIVE CERTIFIED_ESTOP=false'
