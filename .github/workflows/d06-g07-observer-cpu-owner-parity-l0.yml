name: D06 G07 Observer CPU CI Owner exact-source parity L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/d06-g07-observer-cpu-owner-parity-l0.yml']
permissions:
  contents: read
jobs:
  sealed-static-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Exact private instructor candidate used only within sealed public CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 6e402e30f5036285f067b5dffed085eff41af599
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: RED first - actual Owner and CI Observer CPU reservation (NO ROS/GOAL)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = '6e402e30f5036285f067b5dffed085eff41af599'
          bash -n instructor/scripts/p2_owner_l3_wsl2.sh
          bash -n instructor/scripts/p2_no_goal_smoke_ci.sh
          python3 -m py_compile instructor/tools/p2_g07_observer_cpu_plan.py
          python3 -m py_compile instructor/tools/p2_g07_official_cm_cpu_affinity.py
          python3 instructor/tests/unit/test_p2_g07_observer_cpu_reservation_20261115.py
          python3 instructor/tests/unit/test_p2_g07_official_cm_core_affinity_20261115.py
          python3 instructor/tests/unit/test_p2_g07_cm_affinity_restore_before_shutdown.py
          echo 'D06_G07_OBSERVER_CPU_OWNER_CI_PARITY_L0_PASS_NO_ROS_NO_GOAL'
      - name: Delete all private source; retain only sanitized job verdict
        if: always()
        run: rm -rf -- instructor
