# AXIA G07 GUI ONLY: actual ROS 2 Jazzy/Gazebo Harmonic Waffle, real
# independent gz sim -g + rviz2 Xvfb windows, NO Nav2 lifecycle/Goal.
# Reuse 2026-11-15 exact original Instructor SHA; Owner WSLg remains unverified.
name: AXIA G07 rollback native WSLg policy GUI-only physical Gazebo Xvfb L2 NO_GOAL
on:
  push:
    branches: ['release/p2-g06-cm-ttl-20261110']
    paths: ['.github/workflows/axia-g07-rollback-wslg-gui-no-goal-physical-l2.yml']
permissions:
  contents: read
jobs:
  actual-gazebo-two-gui-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 26
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Frozen 2026-11-15 Instructor proven GUI baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 01d45d46b6eb6a05b1bd313d73f1fc3549575545
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Source-pinned old dual-GUI with native WSLg only policy
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 8a43b8ea5c437cb526f940b5b2f08fc6f57eca9c
          path: gui
          persist-credentials: false
      - name: Frozen 2026-11-15 RViz and Marker display
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 0f66059d9110f8e667200bbca22396bd0c78c02e
          path: visual
          persist-credentials: false
      - name: Exact source and 9 read-only regression tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = 01d45d46b6eb6a05b1bd313d73f1fc3549575545
          test "$(git -C gui -c safe.directory="$PWD/gui" rev-parse HEAD)" = 8a43b8ea5c437cb526f940b5b2f08fc6f57eca9c
          python3 -m unittest discover -s gui/d06/tests -p 'test_g07_precycle36_dual_gui_rollback_contract.py' -v
          python3 -m unittest discover -s gui/d06/tests -p 'test_g07_rollback_wslg_actual_evidence_20261116.py' -v
          bash -n gui/d06/scripts/g07_shared_gui_clients.sh
          bash -n instructor/scripts/p4_g07_shared_runtime.sh
          echo AXIA_G07_ROLLBACK_L2_TEST_CONTRACT_9_PASS_NO_ROS_NO_GOAL
      - name: Install exact official GUI test tools without base ROS upgrades
        shell: bash
        run: |
          set -Eeuo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends --no-upgrade \
            ros-jazzy-rviz2 ros-jazzy-visualization-msgs xvfb xauth x11-utils libgl1-mesa-dri
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          for c in Xvfb rviz2 gz colcon ros2 xwininfo;do command -v "$c" || exit 3;done
          echo AXIA_G07_ROLLBACK_GUI_XVFB_DEPS_INSTALLED_NO_GOAL
      - name: Actual headless Gazebo World/Waffle and two real display windows NO_GOAL
        shell: bash
        timeout-minutes: 11
        env:
          ROS_DOMAIN_ID: '72'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_rollback_gui_l2_72
          AXIA_P0_SIM_ONLY: '1'
          AXIA_G07_UNIFIED_GUI_SIDECAR: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '0'
        run: |
          set -Eeuo pipefail
          root="$PWD"
          mkdir -p "$root/actual-gui-evidence/visual"
          chmod 700 "$root/actual-gui-evidence/visual"
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          Xvfb :99 -screen 0 1530x900x24 > "$root/actual-gui-evidence/xvfb.log" 2>&1 &
          xvfb_pid=$!
          launch_pid='' gui_pid=''
          cleanup() {
            trap - EXIT
            set +e
            if [[ "$gui_pid" =~ ^[0-9]+$ ]];then
              kill -TERM "$gui_pid" 2>/dev/null || true
              wait "$gui_pid" 2>/dev/null || true
            fi
            if [[ "$launch_pid" =~ ^[0-9]+$ ]];then
              kill -INT -- "-$launch_pid" 2>/dev/null || true
              sleep 4
              kill -TERM -- "-$launch_pid" 2>/dev/null || true
              wait "$launch_pid" 2>/dev/null || true
            fi
            kill -TERM "$xvfb_pid" 2>/dev/null || true
            wait "$xvfb_pid" 2>/dev/null || true
            echo AXIA_G07_ROLLBACK_GUI_ONLY_L2_CLEANUP_DISPLAY_ONLY_NO_GOAL
          }
          trap cleanup EXIT
          sleep 1
          kill -0 "$xvfb_pid"
          cd "$root/instructor"
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --base-paths ros2_ws/src --packages-select \
            axia_safety_supervisor axia_fault_injector axia_scenario_verifier \
            --event-handlers console_direct+ > "$root/actual-gui-evidence/build.log" 2>&1
          set +u
          source install/setup.bash
          set -u
          export ROS_DOMAIN_ID=72 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION=axia_p2_rollback_gui_l2_72 AXIA_P0_SIM_ONLY=1
          source scripts/p4_g07_shared_runtime.sh
          world="$(ros2 pkg prefix nav2_minimal_tb3_sim)/share/nav2_minimal_tb3_sim/worlds/tb3_sandbox.sdf.xacro"
          waffle="$(ros2 pkg prefix nav2_minimal_tb3_sim)/share/nav2_minimal_tb3_sim/urdf/gz_waffle.sdf.xacro"
          python3 tools/p2_l3_world_overlay.py --source "$world" \
             --output "$root/actual-gui-evidence/g07_world.sdf.xacro" \
             --manifest "$root/actual-gui-evidence/world_manifest.json"
          python3 tools/p2_g07_demo_lidar_overlay.py --source "$waffle" \
             --output "$root/actual-gui-evidence/g07_waffle.sdf.xacro" \
             --manifest "$root/actual-gui-evidence/waffle_manifest.json"
          axia_g07_shared_launch owner-gui \
            "$PWD/ros2_ws/src/axia_safety_bringup/launch/axia_tb3_p2.launch.py" \
            "$root/actual-gui-evidence/g07_world.sdf.xacro" \
            "$root/actual-gui-evidence/g07_waffle.sdf.xacro" \
            "$root/actual-gui-evidence/launch.log"
          launch_pid="$AXIA_G07_SHARED_LAUNCH_PID"
          test "$(axia_g07_shared_headless_mode owner-gui)" = True
          actual=0
          for i in {1..150};do
            timeout 5s gz service -l > "$root/actual-gui-evidence/services.txt" 2>/dev/null || true
            if grep -Fq '/world/default/control' "$root/actual-gui-evidence/services.txt" &&
               grep -Fq '/world/default/model/turtlebot3_waffle/' "$root/actual-gui-evidence/services.txt";then
              actual=1;break
            fi
            sleep .4
          done
          test "$actual" = 1
          echo AXIA_G07_ROLLBACK_REAL_GAZEBO_WORLD_WAFFLE_SERVICES_PASS_NO_GOAL
          # EXACT old dual GUI subprocess, but CI gets unchanged llvmpipe.
          # The one-use CI GUI auth flag exists only in this subshell;
          # no Nav2 command/Goal process is launched anywhere in this job.
          ( AXIA_G07_CI_SIM_GOAL_ALLOWED=1 \
            bash "$root/gui/d06/scripts/g07_shared_gui_clients.sh" ci \
              "$root/actual-gui-evidence/visual" "$root/visual" "$root/gui" ) \
              > "$root/actual-gui-evidence/visual/sidecar.log" 2>&1 &
          gui_pid=$!
          for i in {1..120};do
            [[ -s "$root/actual-gui-evidence/visual/display_attestation.json" ]] && break
            kill -0 "$gui_pid" 2>/dev/null || break
            sleep .5
          done
          test -s "$root/actual-gui-evidence/visual/display_attestation.json" || {
            tail -n 70 "$root/actual-gui-evidence/visual/sidecar.log"; exit 3;
          }
          python3 - "$root/actual-gui-evidence/visual/display_attestation.json" <<'PY'
          import json,sys
          with open(sys.argv[1],encoding='utf-8') as f:d=json.load(f)
          assert d['real_rviz_window'] is True,d
          assert d['real_gazebo_gui_window'] is True,d
          assert d['headless_server_required'] is True,d
          assert d['wslg_verified'] is False,d
          assert d['new_cmd_vel_publisher_authorized'] is False,d
          print('AXIA_G07_ROLLBACK_REAL_TWO_GUI_XVFB_L2_PASS_OWNER_WSLG_NOT_VERIFIED_NO_GOAL')
          PY
          kill -0 "$gui_pid"
          kill -0 "$launch_pid"
          echo 'AXIA_MVP_DEMO_ACCEPTED=HOLD CERTIFIED_ESTOP=false'
