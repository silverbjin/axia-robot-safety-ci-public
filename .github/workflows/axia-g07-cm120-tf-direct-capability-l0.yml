name: AXIA G07 CM120 official TF direct boundary capability NO GOAL L0
on:
  push:
    branches: ['release/p2-g06-cm-ttl-20261110']
    paths: ['.github/workflows/axia-g07-cm120-tf-direct-capability-l0.yml']
permissions:
  contents: read
jobs:
  cm-tf-direct-cause-capability-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Verify installed official CM ELF and trace access WITHOUT ROS or Goal
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v python3 >/dev/null
          test -d /opt/ros/jazzy/lib
          python3 - <<'PY'
          import json, pathlib, subprocess, re
          prefix=pathlib.Path('/opt/ros/jazzy/lib')
          libs=list(prefix.rglob('*collision_monitor*.so*'))
          bins=[p for p in libs if p.is_file() and not p.is_symlink()]
          def symbols(p,dynamic):
              cmd=['nm','-C']
              if dynamic:cmd+=['-D']
              cmd+=[str(p)]
              try:
                  r=subprocess.run(cmd,text=True,stdout=subprocess.PIPE,
                                   stderr=subprocess.DEVNULL,timeout=10,check=False)
                  return r.stdout if r.returncode==0 else ''
              except (OSError,subprocess.TimeoutExpired):
                  return ''
          names=['nav2_collision_monitor::Source::getTransform',
                 'nav2_collision_monitor::Scan::getData',
                 'nav2_collision_monitor::CollisionMonitor::process',
                 'nav2_util::getTransform']
          dynamic_hits={k:False for k in names}
          local_hits={k:False for k in names}
          for p in bins[:50]:
              dyn=symbols(p,True)
              loc=symbols(p,False)
              for n in names:
                  dynamic_hits[n] |= n in dyn
                  local_hits[n] |= n in loc
          paranoid_path=pathlib.Path('/proc/sys/kernel/perf_event_paranoid')
          try: paranoid=int(paranoid_path.read_text().strip())
          except (OSError,ValueError): paranoid=None
          status=pathlib.Path('/proc/self/status').read_text()
          assert re.search(r'^CapEff:\s*([0-9a-fA-F]+)$','CapEff:\t0000000000000000')
          m=re.search(r'^CapEff:\s*([0-9a-fA-F]+)$',status,re.M)
          caps=int(m.group(1),16) if m else 0
          perf_cap=bool(caps&(1<<38))
          sys_admin_cap=bool(caps&(1<<21))
          bpf_cap=bool(caps&(1<<39))
          tracefs=any(p.exists() for p in (
            pathlib.Path('/sys/kernel/tracing/uprobe_events'),
            pathlib.Path('/sys/kernel/debug/tracing/uprobe_events')))
          tracefs_write=any(p.exists() and __import__('os').access(p,__import__('os').W_OK)
            for p in (pathlib.Path('/sys/kernel/tracing/uprobe_events'),
                      pathlib.Path('/sys/kernel/debug/tracing/uprobe_events')))
          result={
             'scope':'OFFICIAL_JAZZY_ELF_NO_ROS_NO_GOAL_CAPABILITY_ONLY',
             'cm_library_candidates':len(bins),
             'dynamic_symbol_hits':dynamic_hits,
             'full_symbol_hits':local_hits,
             'kernel_perf_event_paranoid':paranoid,
             'cap_perfmon':perf_cap,'cap_sys_admin':sys_admin_cap,
             'cap_bpf':bpf_cap,
             'tracefs_uprobe_events_present':tracefs,
             'tracefs_uprobe_events_writable':tracefs_write,
             'ros_callback_start_end_already_proven_in_cycle05':True,
             'tf_function_entry_exit_recorded_in_cycle05':False,
             'ros_or_gazebo_started':False,
             'goal_sent':False,
             'tf_duration_proven':False,
             'cm120_root_cause':'CAUSE_UNPROVEN',
             'cm120_release':'HOLD',
             'owner_l3':'NOT_RUN'
          }
          print('AXIA_G07_CM120_DIRECT_TF_CAPABILITY_PREFLIGHT '+json.dumps(result,sort_keys=True))
          if len(bins)==0:
              print('AXIA_G07_CM120_TF_ELF_MISSING_NO_INFERRED_SYMBOL_HOLD')
          if not tracefs_write and not (perf_cap or sys_admin_cap):
              print('AXIA_G07_CM120_KERNEL_UPROBE_ACCESS_NOT_AUTHORIZED_IN_CI_HOLD')
          if not any(dynamic_hits.values()) and not any(local_hits.values()):
              print('AXIA_G07_CM120_TF_OR_CM_INSTRUMENTABLE_ELF_SYMBOL_UNVERIFIED_HOLD')
          print('AXIA_G07_CM120_CAUSE_UNPROVEN_NO_GOAL_NO_POLICY_MUTATION')
          PY
          echo AXIA_MVP_DEMO_ACCEPTED=HOLD CERTIFIED_ESTOP=false
