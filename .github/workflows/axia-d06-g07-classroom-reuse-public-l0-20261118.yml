name: D06 G07 historical Gazebo drive classroom source reuse L0
on:
  push:
    branches: [feat/d06-g07-classroom-reuse-20261118]
    paths:
      - 'd06/scripts/axia_d06_g07_classroom_once.sh'
      - 'd06/tests/test_d06_g07_classroom_reuse.py'
      - '.github/workflows/axia-d06-g07-classroom-reuse-public-l0-20261118.yml'
      - 'd06/docs/AXIA_D06_G07_CLASSROOM_REUSE_20261118_KO.md'
  pull_request:
    paths:
      - 'd06/scripts/axia_d06_g07_classroom_once.sh'
      - 'd06/tests/test_d06_g07_classroom_reuse.py'
      - '.github/workflows/axia-d06-g07-classroom-reuse-public-l0-20261118.yml'
      - 'd06/docs/AXIA_D06_G07_CLASSROOM_REUSE_20261118_KO.md'
permissions:
  contents: read
jobs:
  d06-public-reuse-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: RED GREEN source-only no goal contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n d06/scripts/axia_d06_g07_classroom_once.sh
          python3 -m unittest discover -s d06/tests -p 'test_d06_g07_classroom_reuse.py' -v
          bash d06/scripts/axia_d06_g07_classroom_once.sh --self-check
          echo 'D06_G07_CLASSROOM_PUBLIC_L0_PASS SIX_TESTS NO_ROS_NO_GAZEBO_NO_GOAL'
          echo 'D06_G07_CLASSROOM_OWNER_MOVING_L3=NOT_RUN'
          echo 'AXIA_MVP_DEMO_ACCEPTED=HOLD CERTIFIED_ESTOP=false'
