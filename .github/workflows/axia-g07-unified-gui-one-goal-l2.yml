                                  "FIRST_CM_RMW_ORACLE_UNVERIFIED_HOLD",
                                  "CM_CALLBACK_IDENTITY_UNVERIFIED_HOLD",
                                  "CM_CALLBACK_TOPIC_IDENTITY_UNVERIFIED_HOLD"):
              raise SystemExit(3)
          PY

