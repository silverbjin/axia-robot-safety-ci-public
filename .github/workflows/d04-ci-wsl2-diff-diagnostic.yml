name: AXIA D04 CI-vs-WSL2 offline diagnosis (NO ROS, read-only)
on:
  push:
    branches: ["feature/d04-yolo-ros-package-20261109"]
    paths:
      - "scripts/d04_ci_wsl2_diff.py"
      - "tests/test_d04_ci_wsl2_diff.py"
      - ".github/workflows/d04-ci-wsl2-diff-diagnostic.yml"
  pull_request:
    paths:
      - "scripts/d04_ci_wsl2_diff.py"
      - "tests/test_d04_ci_wsl2_diff.py"
      - ".github/workflows/d04-ci-wsl2-diff-diagnostic.yml"
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test offline evidence parser only (not ROS/Gazebo runtime)
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.3.5
          python -m compileall -q scripts/d04_ci_wsl2_diff.py
          python -m pytest -q tests/test_d04_ci_wsl2_diff.py
