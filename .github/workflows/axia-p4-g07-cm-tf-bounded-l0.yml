name: AXIA P4 G07 CM TF bounded lookup-only fail closed L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-cm-tf-bounded-l0.yml']
permissions:
  contents: read
jobs:
  g07-tf-timeout-safety-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: aa5145ba466038b085e00c98cd65c22e255a57fb
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = aa5145ba466038b085e00c98cd65c22e255a57fb
          python3 -m unittest discover -s tests/unit -p test_p4_g07_cm_tf_bounded.py -v
          echo AXIA_P4_G07_CM_TF_BOUNDED_L0_PASS_NO_ROS_NO_GOAL
      - if: always()
        shell: bash
        run: rm -rf -- .git tools tests scripts docs configs ros2_ws
