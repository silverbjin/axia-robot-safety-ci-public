name: AXIA P4 G08 G11 Owner missing original local filesystem finder L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g08-g11-owner-missing-raw-finder-l0.yml']
permissions:
  contents: read
jobs:
  local-only-no-ros-no-goal-missing-raw-locator:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Synthetic temporary Owner home missing raw locator
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p test_axia_p4_g11_owner_missing_raw_locator.py -v
          python3 -m py_compile tools/axia_p4_g11_owner_missing_raw_locator.py
          echo AXIA_P4_G08_G11_OWNER_MISSING_RAW_FINDER_NO_ROS_NO_GOAL_L0_PASS
