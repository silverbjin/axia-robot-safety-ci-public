      - 'd06/docs/AXIA_D06_WSL2_OWNER_CI_KERNEL_FIRST_FAILURE_RCA_20261118_KO.md'
permissions:
  contents: read
jobs:
  d06-public-reuse-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: e9adb73d658859a53976d9848aa75bd5be710def
          path: student
          persist-credentials: false
      - name: RED GREEN source-only no goal contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n d06/scripts/axia_d06_g07_classroom_once.sh
          test "$(git -C student rev-parse HEAD)" = e9adb73d658859a53976d9848aa75bd5be710def
          python3 -m unittest discover -s d06/tests -p 'test_d06_g07_classroom_reuse.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_d06_g07_owner_mode_field_regression.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_d06_g07_here_doc_execution.py' -v
          bash d06/scripts/axia_d06_g07_classroom_once.sh --self-check
          echo 'D06_G07_CLASSROOM_PUBLIC_L0_PASS FIFTEEN_PLUS_FIVE_OWNER_PARITY_PLUS_THREE_HEREDOC_TESTS NO_ROS_NO_GAZEBO_NO_GOAL'
          echo 'D06_G07_CLASSROOM_OWNER_MOVING_L3=NOT_RUN'
          echo 'AXIA_MVP_DEMO_ACCEPTED=HOLD CERTIFIED_ESTOP=false'
