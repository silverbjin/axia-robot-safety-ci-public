          e=p/"actual_ros_events.jsonl"
          if not f.is_file() or not e.is_file():
              print("AXIA_G07_FIRST_CM_RPC_L2_NO_GOAL_EVIDENCE_DIAGNOSTIC_NOT_RUN")
              sys.exit(3)
          v=json.loads(f.read_text())
          events=[json.loads(row) for row in e.read_text().splitlines()]
          started=[row["t"] for row in events if row.get("kind")=="owner_goal_published"]
          rpc=v.get("stop_native_rpc_monotonic_window")
          if len(started)!=1 or not isinstance(rpc,dict):
              print("AXIA_G07_FIRST_CM_RPC_L2_NO_NATIVE_STOP_RPC_WINDOW_HOLD")
              sys.exit(3)
          result=cm_native_stop_rpc_overlap(
              events,goal_start=started[0],
              end=max(row["t"] for row in events if type(row.get("t")) in (int,float)),
              rpc_started=rpc.get("started_at"),
              rpc_finished=rpc.get("ended_at"),
              first_guard_tick=(v.get("first_guard_latch") or {}).get("tick_monotonic"))
          print("AXIA_G07_FIRST_CM_RPC_L2_CLASSIFICATION "+json.dumps(result,sort_keys=True))
          assert result["rpc_caused_cm_delay_proven"] is False
          assert result["g07_timing_resolved"] is False
          assert result["ready_for_wsl2_owner_goal"] is False
          if result["status"] in (
                  "CM_RMW_GAP_DURING_NATIVE_STOP_RPC_CANDIDATE",
                  "CM_RMW_GAP_WITHOUT_NATIVE_STOP_RPC_OVERLAP",
                  "CM_RMW_SEQUENCE_OR_SUPERVISOR_COVERAGE_INCOMPLETE",
                  "RIGHT_CENSORED_AT_FIRST_GUARD_LATCH",
                  "RMW_PROVENANCE_MISSING_OR_INVALID"):
              print("AXIA_G07_CM_150MS_FIRST_SOURCE_GAP_NOT_RESOLVED_HOLD")
              sys.exit(3)
          print("AXIA_G07_NO_GAP_IN_THIS_CI_ONLY_OWNER_WSL2_G07_HOLD")
          PY
      - name: Delete all Instructor source and raw ROS / Gazebo evidence
        if: always()
        shell: bash
        run: rm -rf -- instructor ci-tools
