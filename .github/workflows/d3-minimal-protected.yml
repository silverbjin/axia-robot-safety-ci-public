name: AXIA D3 minimum public mirror Python gate (NO ROS/GAZEBO)
on:
  push:
    branches:
      - feat/d3-minimal-exact-sha-ci-20261108
    paths:
      - .github/workflows/d3-minimal-protected.yml
      - ci/d3_minimal_manifest.json
      - ci/d3_public_snapshot/**
      - tests/test_d3_minimal_manifest.py
permissions:
  contents: read
concurrency:
  group: d3-mirror-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate sanitized D3 manifest
        run: python3 -m unittest discover -s tests -p test_d3_minimal_manifest.py -v
  public-d3-python:
    needs: public-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test byte-identical public-safe D3 contract and CLI
        shell: bash
        run: |
          set -euo pipefail
          # Compare Git blob SHAs with the reviewed, locally tested Instructor exact SHA.
          test "$(git hash-object ci/d3_public_snapshot/axia_d3_demo/__init__.py)" = 99087d55418c25a84402bbf383ed33bf046eb2bb
          test "$(git hash-object ci/d3_public_snapshot/axia_d3_demo/contract.py)" = a787ad5716261aff2c84c96e59859f0338bada03
          test "$(git hash-object ci/d3_public_snapshot/axia_d3_demo/cli.py)" = 2e40c33fbf7dadbbbaf930422432c45ce232d962
          test "$(git hash-object ci/d3_public_snapshot/models/pedestrian_proxy.sdf)" = 9f57fb073a9fec2c313a249472c2d6542202a8a6
          test "$(git hash-object ci/d3_public_snapshot/test/test_d3_contract.py)" = 40e7b301417fc5a6ba3dbfca8f1a9c23a22506fc
          test "$(git hash-object ci/d3_public_snapshot/test/test_d3_cli.py)" = 7a8401d7e40e1d6b5292810177a02a96c142f7b2
          python -m pip install --disable-pip-version-check -q pytest==8.3.5
          export PYTHONPATH="$PWD/ci/d3_public_snapshot"
          python -m pytest -q -ra ci/d3_public_snapshot/test
          echo D3_PUBLIC_MIRROR_SAME_BLOB_SHA_PYTHON_PASS_ROS_GAZEBO_NOT_RUN
