          obs=[json.loads(x) for x in samples.read_text().splitlines() if x.strip()]
          # Cycle36 read-only forensic: diagnose missing in-Goal Marker
          # without a fake scan or accepting old pre-Goal samples.
          observed_times=[x.get('t_monotonic') for x in obs
                          if type(x.get('t_monotonic')) in (float,int)]
          scan_counts=[x.get('actual_scan_messages',0) for x in obs
                       if type(x.get('actual_scan_messages',0)) is int]
          goal_samples=[x for x in obs if type(x.get('t_monotonic')) in (float,int)
                        and goal[0]<=x['t_monotonic']<=goal[0]+60]
          print('AXIA_G07_CYCLE36_MARKER_READONLY_MONOTONIC_WINDOW '+json.dumps({
              'goal_start':round(goal[0],3),
              'samples_total':len(obs),
              'samples_in_goal_window':len(goal_samples),
              'sample_first':min(observed_times) if observed_times else None,
              'sample_last':max(observed_times) if observed_times else None,
              'scan_max':max(scan_counts) if scan_counts else None,
              'scan_first':scan_counts[0] if scan_counts else None,
              'scan_last':scan_counts[-1] if scan_counts else None
          },sort_keys=True))
