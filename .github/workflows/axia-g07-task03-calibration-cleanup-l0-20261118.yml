name: AXIA G07 Task03 disposable native contact calibration cleanup public L0
on:
  push:
    branches: ['fix/g07-task03-formal-public-l2-20261118']
    paths:
      - '.github/workflows/axia-g07-task03-calibration-cleanup-l0-20261118.yml'
permissions:
  contents: read
jobs:
  cleanup-boundary-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 01752add2e30c90c4d3286ef3a450f97746ecb55
          path: student
          persist-credentials: false
      - name: GREEN actual disposable NO_GOAL 7 and post-Goal bounded Nav2 Localization ACK 3; no safety TTL waiver
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = 01752add2e30c90c4d3286ef3a450f97746ecb55
          cd student/block_B/day07/h01_runtime
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_g07_task03_calibration_cleanup.py -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tools -p test_g07_task03_localization_shutdown_budget.py -v
          echo TASK03_NO_GOAL_CALIBRATION_SHUTDOWN_ONLY_NO_NEW_GOAL
