name: AXIA G07 Owner first latch and timing boundary regression (PUBLIC CI ONLY)
on:
  push:
    branches: [fix/g07-owner-first-latch-20261112]
    paths:
      - '.github/workflows/axia-g07-owner-first-latch-l0.yml'
permissions:
  contents: read
concurrency:
  group: axia-g07-owner-first-latch-public-l0
  cancel-in-progress: false
jobs:
  owner-first-boundary-private-test-public-runner:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: axia-instructor-sealed
    steps:
      - name: Fetch exact private Instructor revision into ephemeral public CI runner
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 2ff746ce441aa675ea2ded40c67a4c07d5809024
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Verify exact Instructor source, run only offline Guard and timing regressions
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 2ff746ce441aa675ea2ded40c67a4c07d5809024
          python3 -m pip install -q --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_owner_tyw_first_boundary_20261112.py \
            tests/unit/test_p2_g07_guard_normal_turn_reverse_latency.py \
            tests/unit/test_p2_g07_guard_authorized_transient_zero.py \
            tests/unit/test_p2_g07_guard_kca1_cm_slowdown.py \
            tests/unit/test_p2_g07_guard_zreh_owner_cm_skew.py \
            tests/unit/test_p2_base_guard_policy.py
          echo AXIA_G07_OWNER_FIRST_BOUNDARY_PUBLIC_CI_L0_PASS_NO_ROS_NO_GOAL
      - name: Remove private Instructor code after ephemeral CI
        if: always()
        shell: bash
        run: rm -rf -- .git ros2_ws tests tools scripts configs docs results training
