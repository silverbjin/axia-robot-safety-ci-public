          test -f tools/native_g07_stop/g07_stop_service.cc
          echo AXIA_P4_G07_ONE_GOAL_NATIVE_TRANSPORT_CANDIDATE_SHARED_OWNER_CI
          test -f ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p4_g07_guard_tick_policy.py
          echo AXIA_P4_G07_SAME_OWNER_CI_FAST_GUARD_40MS_AND_RMW_CLOCK_DOMAIN_CANDIDATE
