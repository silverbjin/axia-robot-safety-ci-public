name: AXIA G07 PIYO actual Owner pair reconcile and timing PUBLIC L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-piyo-guard-pair-20261113-public-l0.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-piyo-pair-public-l0
  cancel-in-progress: false
jobs:
  first-pair-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: axia-instructor-sealed
    steps:
      - name: Exact Instructor commit in ephemeral PUBLIC CI only (no private Actions)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: eb984b73138e592caa67426eed9c60dde2ca2ebd
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Actual PIYO chronology and original Guard safety invariants
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = eb984b73138e592caa67426eed9c60dde2ca2ebd
          python3 -m pip install -q --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_owner_piyo_pair_boundary_20261113.py \
            tests/unit/test_p2_g07_owner_piyo_ci_bag_parity_20261113.py \
            tests/unit/test_p2_g07_owner_piyo_postgoal_exit_20261113.py \
            tests/unit/test_p2_g07_guard_async_owner_trace.py \
            tests/unit/test_p2_g07_guard_authorized_transient_zero.py \
            tests/unit/test_p2_g07_guard_nearzero_owner_trace.py \
            tests/unit/test_p2_g07_guard_normal_turn_reverse_latency.py \
            tests/unit/test_p2_g07_owner_tyw_first_boundary_20261112.py
          echo AXIA_G07_PIYO_FIRST_PAIR_GUARD_PUBLIC_L0_PASS_NO_ROS_NO_GOAL
      - name: Destroy private Instructor source from PUBLIC runner
        if: always()
        shell: bash
        run: rm -rf -- .git tools tests scripts ros2_ws configs docs training results
