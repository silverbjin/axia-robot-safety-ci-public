name: D08 Owner first real Scan Odom gap L0 and source lock
on:
  push:
    branches: ['feat/d08-unified-sensor-cm-path-20261118']
    paths:
      - 'd08/harness/d08_amcl_initial_pose.py'
      - 'd08/tests/test_d08_owner_first_scan_odom_gap_regression.py'
      - '.github/workflows/d08-owner-first-gap-regression-l0.yml'
permissions:
  contents: read
jobs:
  no-goal-first-gap-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Real Owner 819/752ms recorded first gaps, no-goal bounded recovery
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m pip install -q pytest==8.3.5
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python3 -m pytest -q \
            d08/tests/test_d08_owner_first_scan_odom_gap_regression.py \
            d08/tests/test_d08_static_amcl_witness.py \
            d08/tests/test_d08_amcl_tf_subscription_order.py \
            d08/tests/test_d08_amcl_initial_pose.py \
            d08/tests/test_d08_scan_gap_trace.py
          echo 'D08_FIRST_LIVE_SCAN_ODOM_GAP_L0_PASS_ROS_GAZEBO_NOT_RUN'
