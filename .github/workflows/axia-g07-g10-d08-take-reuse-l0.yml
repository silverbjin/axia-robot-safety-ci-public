name: AXIA G07 G10 Reuse Existing D08 Take Probe L0
on:
  push:
    branches: ['fix/g07-g50-first-boundary-ci-20261121']
    paths:
      - '.github/workflows/axia-g07-g10-d08-take-reuse-l0.yml'
permissions:
  contents: read
jobs:
  existing_d08_take_probe_contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 7d0f10902c338190e1476303e52803cd53927e3c
          path: student
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 87896a5c5a3e43f3bfc4b07e41f3fd42da16f3ca
          path: existing_d08
          persist-credentials: false
      - name: Original D08 take-complete exact source pairing without ROS
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/existing_d08/d08/harness"
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_g10_first_take_existing_d08.py' -v
          python3 -m py_compile tools/p2_g07_scan_wall_pregoal.py
          echo 'AXIA_G07_G10_D08_TAKE_REUSE_L0_PASS_REAL_JAZZY_NOT_RUN_RELEASE_HOLD'
