name: AXIA G07 G20 Actual Jazzy Plan Wire L1 NO GOAL
on:
  push:
    branches: ['fix/g07-g50-first-boundary-ci-20261121']
    paths: ['.github/workflows/axia-g07-g20-nav2-plan-wire-l1.yml']
permissions: {contents: read}
jobs:
  actual_jazzy_path_wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
    env:
      ROS_DOMAIN_ID: '95'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: fadb216a55db11301562a93eecf848bdb6688073
          path: student
          persist-credentials: false
      - name: Actual Jazzy separate DDS publisher/subscriber Path QoS contract; NO Goal
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          export PYTHONPATH="$GITHUB_WORKSPACE/student/block_B/day07/h01_runtime/tools${PYTHONPATH:+:$PYTHONPATH}"
          cat >/tmp/axia_g07_g20_plan_wire_l1.py <<'PY_L1'
          from multiprocessing import Process
          from time import monotonic
          import rclpy
          from rclpy.node import Node
          from rclpy.executors import MultiThreadedExecutor
          from rclpy.qos import QoSProfile, ReliabilityPolicy
          from nav_msgs.msg import Path
          from geometry_msgs.msg import PoseStamped
          from p2_g07_g20_nav2_plan_witness import PlanWitness

          ANCHOR=dict(map_pose=(-2.,-.5,0.),odom_pose=(0.,0.,0.),
                      world_pose=(-2.,-.5,0.),relative_motion_source='ros_odom',
                      world_pose_source='validated_official_nav2_world_spawn',
                      map_pose_source='tf_map_base_link')
          def path_publisher():
              rclpy.init()
              node=Node("axia_g07_l1_synthetic_plan_publisher_no_goal")
              pub=node.create_publisher(Path,"/plan",
                    QoSProfile(depth=1,reliability=ReliabilityPolicy.RELIABLE))
              def publish():
                  msg=Path();msg.header.frame_id="map"
                  msg.header.stamp=node.get_clock().now().to_msg()
                  for x,y in [(-2.,-.5),(-1.8,-.5),(-1.5,-.5),
                              (-1.5,-.3),(-1.6,.0),(-1.7,.7)]:
                      p=PoseStamped();p.header=msg.header
                      p.pose.position.x=x;p.pose.position.y=y
                      p.pose.orientation.w=1.
                      msg.poses.append(p)
                  pub.publish(msg)
              node.create_timer(.08,publish)
              try:rclpy.spin(node)
              finally:node.destroy_node();rclpy.try_shutdown()
          if __name__=="__main__":
              pub=Process(target=path_publisher,daemon=True);pub.start()
              rclpy.init()
              node=Node("axia_g07_l1_readonly_plan_witness_no_goal")
              witness=PlanWitness();received=[0]
              def on_path(m):
                  if witness.observe(m.header.frame_id,
                      [(p.pose.position.x,p.pose.position.y) for p in m.poses],
                      stamp_ns=m.header.stamp.sec*1_000_000_000+m.header.stamp.nanosec,
                      at_monotonic=monotonic()):
                      received[0]+=1
              node.create_subscription(Path,"/plan",on_path,
                 QoSProfile(depth=1,reliability=ReliabilityPolicy.RELIABLE))
              executor=MultiThreadedExecutor(num_threads=2);executor.add_node(node)
              try:
                  deadline=monotonic()+8
                  while monotonic()<deadline and received[0]<10:
                      executor.spin_once(timeout_sec=.05)
                  assert received[0]>=5,("PLAN_CROSS_PROCESS_NOT_RECEIVED",received[0])
                  result=witness.summarize(ANCHOR,(.125,.006,.1147),
                    fixture_world_xy=(-1.194325,-.41848),
                    at_monotonic=monotonic(),phase="AFTER_FIXTURE_ACK")
                  assert result["status"]=="NAV2_GLOBAL_PLAN_GEOMETRY_CANDIDATE_HOLD",result
                  assert result["nav2_local_trajectory_proven"] is False
                  assert result["root_cause_proven"] is False
                  print("AXIA_G07_G20_JAZZY_PLAN_QOS_TWO_PROCESS_L1_PASS "
                        f"messages={received[0]} points={result['plan_points']} "
                        "SIMULATED_PLAN_NOT_REAL_NAV2_GOAL_NOT_SENT_OWNER_L3_HOLD",flush=True)
              finally:
                  executor.shutdown(timeout_sec=2);node.destroy_node();rclpy.try_shutdown()
                  pub.terminate();pub.join(timeout=3)
          PY_L1
          python3 /tmp/axia_g07_g20_plan_wire_l1.py
