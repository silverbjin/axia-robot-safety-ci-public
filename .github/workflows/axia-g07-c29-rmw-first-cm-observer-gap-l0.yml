# T04 RED/GREEN: first real Gazebo C29 CM Observer 171.351ms gap at STOP,
# classify RMW source / receive / Observer without modifying Guard TTL.
name: AXIA G07 C29 first CM RMW observer provenance L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-c29-rmw-first-cm-observer-gap-l0.yml']
permissions:
  contents: read
jobs:
  first-rmw-diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 275d68012a6a1cdc5ce466f2581281b9614c4381
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Run initial CM Observer/RMW causality regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = 275d68012a6a1cdc5ce466f2581281b9614c4381
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_g07_c29_rmw_gap_first_cause.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_one_goal_first_ttl_join.py -v
          python3 -m py_compile tools/p2_g07_ci_moving_goal.py tools/p2_g07_ci_moving_goal_oracle.py
          echo AXIA_G07_C29_RMW_PROVENANCE_L0_PASS_NO_ROS_NO_GOAL
      - name: Purge Instructor private checkout
        if: always()
        shell: bash
        run: rm -rf -- instructor
