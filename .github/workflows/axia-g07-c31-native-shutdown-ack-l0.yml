name: AXIA G07 C31 native Localization shutdown ACK first boundary L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-c31-native-shutdown-ack-l0.yml']
permissions:
  contents: read
jobs:
  localizer-first-response-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact sealed instructor candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 77eb00993ab3884fe9641ad0f3668fdacf71bc1b
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Assert immutable RED candidate and execute reduced fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 77eb00993ab3884fe9641ad0f3668fdacf71bc1b
          python3 -m unittest discover -s tests/unit -p test_g07_c31_native_shutdown_ack_trace.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_gui_readonly_scope.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_guard_small_reverse_first_latch.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_one_goal_first_ttl_join.py -v
          # Existing safety priority tests use pytest-style free functions;
          # invoke them explicitly, not unittest discovery (would run ZERO).
          python3 - <<'PY_GUARD'
          import importlib.util,sys
          from pathlib import Path
          cases=('test_p2_g07_guard_normal_turn_reverse_latency.py',
                 'test_p2_g07_guard_cm_stale_on_physical_stop.py',
                 'test_p2_g07_guard_authorized_transient_zero.py')
          total=0
          for filename in cases:
              path=Path('tests/unit')/filename
              spec=importlib.util.spec_from_file_location('c31_'+path.stem,path)
              mod=importlib.util.module_from_spec(spec)
              sys.modules[spec.name]=mod
              spec.loader.exec_module(mod)
              tests=[getattr(mod,key) for key in vars(mod)
                     if key.startswith('test_') and callable(getattr(mod,key))]
              assert tests,filename
              for fn in tests:
                  fn()
                  total+=1
                  print('C31_PREEXISTING_SAFETY_POLICY_PASS '+fn.__name__)
          assert total>=11,total
          print('AXIA_G07_C31_EXISTING_SAFETY_TTL_STOP_REVERSE_REGRESSION_PASS',total)
          PY_GUARD
          echo AXIA_G07_C31_NATIVE_ACK_GUI_AND_FIRST_GUARD_RED_GREEN_L0_PASS_NO_ROS_NO_GOAL
      - name: Remove instructor checkout
        if: always()
        run: rm -rf -- tests tools ros2_ws training docs scripts
