name: AXIA G07 Cycle39 MVP scoped RViz + front scan L0
on:
  push:
    branches: ['fix/g07-cycle39-rviz-scan-timing-20261117']
    paths:
      - '.github/workflows/axia-g07-cycle39-display-scan-l0.yml'
      - 'd06/rviz/d06_safety_bubble.rviz'
      - 'd06/live/d06_readonly_monitor.py'
      - 'd06/tests/test_g07_cycle39_display_scan_timing.py'
  pull_request:
    branches: ['fix/g07-cycle38-d07-wslg-gpu-xcb-capture-20261117']
    paths:
      - '.github/workflows/axia-g07-cycle39-display-scan-l0.yml'
      - 'd06/rviz/d06_safety_bubble.rviz'
      - 'd06/live/d06_readonly_monitor.py'
      - 'd06/tests/test_g07_cycle39_display_scan_timing.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scoped-readonly-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Immutable C38 baseline for RED
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: c4dca31b210d28037116e49fe39d8d0b5aebdc34
          path: baseline
          persist-credentials: false
      - name: RED two exact original failures
        shell: bash
        run: |
          set -Eeuo pipefail
          cp d06/tests/test_g07_cycle39_display_scan_timing.py baseline/d06/tests/
          if PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
                -s baseline/d06/tests -p 'test_g07_cycle39_display_scan_timing.py' -v \
                > /tmp/axia_c39_scoped_red.log 2>&1; then
            echo AXIA_G07_C39_SCOPED_BASELINE_UNEXPECTED_PASS >&2
            exit 3
          fi
          grep -Fq 'FAILED (failures=2)' /tmp/axia_c39_scoped_red.log || {
            cat /tmp/axia_c39_scoped_red.log
            echo AXIA_G07_C39_SCOPED_RED_FAILURE_SET_DRIFT >&2
            exit 3
          }
          echo AXIA_G07_C39_SCOPED_RED_TWO_ORIGINAL_FAILURES_CONFIRMED
      - name: GREEN four minimal tests and scope closure
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s d06/tests \
             -p 'test_g07_cycle39_display_scan_timing.py' -v
          python3 -m py_compile d06/live/d06_readonly_monitor.py
          test ! -e d06/live/g07_cycle39_scan_geometry.py
          test ! -e d06/live/g07_cycle39_scan_timing.py
          test ! -e .github/workflows/axia-g07-cycle39-gazebo-scan-snapshot-l2.yml
          echo AXIA_G07_C39_MVP_SCOPED_PUBLIC_L0_PASS_4_OF_4_NO_ROS_NO_GOAL
          echo AXIA_MVP_DEMO_ACCEPTED=HOLD CERTIFIED_ESTOP=false
