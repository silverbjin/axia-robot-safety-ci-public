# One-shot public CI proof of byte-exact D07-H01 Owner launcher on a main-based release.
# NO ROS/Gazebo/Goal in this job; actual CI L2 is already #43912555634.
name: AXIA D07-H01 Cycle24 main-scoped Owner artifact L0
on:
  push:
    branches: [release/d07-h01-classroom-main-20261117]
    paths: ['.github/workflows/axia-d07-h01-cycle24-main-release-contract-l0.yml']
permissions:
  contents: read
jobs:
  exact-main-release-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: owner-source
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 5376fbf15acc6d6539b99f5387bbfade04f7ee62
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact files on main-based branch, then full public Owner L0
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C owner-source rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git -C instructor rev-parse HEAD)" = '5376fbf15acc6d6539b99f5387bbfade04f7ee62'
          test "$(git -C owner-source hash-object scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh)" = '7d45fcd1395717061ffeb138e9c74e9c1f766085'
          test "$(git -C owner-source hash-object tests/test_axia_d07_gpu_gui_owner_contract.py)" = '3442c9b67eeeb1d5fc83a6dd7649e69d938aa365'
          bash -n owner-source/scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh
          python3 -m unittest discover -s owner-source/tests -p test_axia_d07_gpu_gui_owner_contract.py -v
          bash owner-source/scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh --self-check
          grep -Fq 'AXIA_MVP_DEMO_ACCEPTED=HOLD' owner-source/docs/reports/AXIA_D07_H01_CYCLE24_OWNER_SCOPED_RELEASE_PUBLIC_20261117_KO.md
          echo AXIA_D07_H01_CYCLE24_MAIN_SCOPED_RELEASE_L0_PASS_NO_ROS_NO_GAZEBO_NO_GOAL
      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf -- instructor
