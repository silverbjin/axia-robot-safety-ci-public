name: AXIA P4 G11 G07 WSL2 first Guard CM TTL + partial RAW regression L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g11-g07-owner-cm-first-boundary-l0.yml']
permissions:
  contents: read
jobs:
  first-cm-ttl-preserve-failclosed:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact private synthetic regression without Owner raw
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: ac2e742c385d3e12fd5cf62aad8a7f6d1e6a9854
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: First Guard CM internal TTL and partial capture truth
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = ac2e742c385d3e12fd5cf62aad8a7f6d1e6a9854
          python3 -m unittest discover -s tests/unit -p test_p4_g11_g07_joined_raw_review.py -v
          python3 -m py_compile tools/p4_g11_g07_joined_raw_review.py
          echo AXIA_G11_FIRST_GUARD_CM_TTL_REGRESSION_L0_PASS_NO_ROS_NO_GOAL
      - name: Remove private source and synthetic fixtures
        if: always()
        shell: bash
        run: rm -rf -- .git docs ros2_ws scripts tools tests fixtures scenarios configs results training
