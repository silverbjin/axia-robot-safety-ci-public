name: D07 H01 GUI read-only L0 on public sealed release
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/d07-h01-gui-readonly-l0.yml']
permissions:
  contents: read
jobs:
  no-goal-gui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: db9c2c3a327b4d63ef6438801c2c4c4403959a96
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact source + instructor L0 no-Gazebo tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = 'db9c2c3a327b4d63ef6438801c2c4c4403959a96'
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_d07_h01_gui_owner_contract.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_path_visual.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_gui_evidence.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_gui_cm_scope.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_restore_native_neighbor.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_preintrusion_timing_join.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_gui_lidar_noise_overlay.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_native_master_full_restore.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_planner_source_barrier.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_post_free_plan_epoch.py -v
          python3 -m py_compile tools/d07_h01_geometry_l2.py tools/d07_h01_path_visual.py tools/p2_staged_no_goal.py tools/d07_h01_cm_lifecycle_ready.py
          bash -n scripts/p2_no_goal_smoke_ci.sh scripts/d07_h01_gui_no_goal_once.sh
          echo D07_H01_GUI_L0_PASS_NO_ROS_NO_GAZEBO_NO_GOAL
      - name: Destroy private checkout
        if: always()
        run: rm -rf -- instructor
