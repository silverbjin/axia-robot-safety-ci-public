name: AXIA G07 Task01 sealed private SHA256 custody canary NO GOAL
on:
  push:
    branches: ['fix/g07-cm120-task01-autopilot-preacceptance-20261117']
    paths:
      - '.github/workflows/axia-g07-cm120-task01-private-custody-canary-sealed-l0.yml'
permissions:
  contents: read
concurrency:
  group: axia-g07-task01-private-custody-sealed
  cancel-in-progress: false
jobs:
  real-private-remote-canary-no-goal:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: axia-instructor-sealed
    steps:
      - name: Public exact candidate (trusted branch)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Sealed Instructor evidence branch only, no instructor code executed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: evidence/g07-cm120-task01-20261117
          token: ${{ secrets.AXIA_CLOUD_CI }}
          fetch-depth: 1
          path: private-custody
          persist-credentials: false
      - name: Private SHA256 canary write, remote fetch and byte-exact readback
        shell: bash
        env:
          GITHUB_ACTIONS: 'true'
          AXIA_P0_SIM_ONLY: '1'
          AXIA_G07_TASK01_GOAL_ALLOWED: '0'
          AXIA_CLOUD_CI: ${{ secrets.AXIA_CLOUD_CI }}
          AXIA_G07_TASK01_PRIVATE_CUSTODY_DIR: ${{ github.workspace }}/private-custody
        run: |
          set -Eeuo pipefail
          bash -n d06/scripts/g07_task01_private_custody_canary.sh
          bash d06/scripts/g07_task01_private_custody_canary.sh
          echo AXIA_G07_TASK01_SEALED_PRIVATE_READBACK_PASS_NO_ROS_NO_GOAL
      - name: No private files remain in public runner workspace
        if: always()
        shell: bash
        run: |
          rm -rf -- private-custody
