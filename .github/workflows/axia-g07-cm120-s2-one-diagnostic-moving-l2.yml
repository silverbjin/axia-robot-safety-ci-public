          export AXIA_G07_CYCLE36_INTEGRATED_GUI=0
          export AXIA_G07_GUI_SCENE_OVERLAY=1
          export AXIA_G07_C37_SCENE_RATE_HZ=25
          echo AXIA_G07_C37_HEADLESS_SCENE_TWO_GUI_MOVING_GOAL_SCOPE_ARMED
