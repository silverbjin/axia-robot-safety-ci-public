# No Goal, NO Nav2 action, no safety parameter mutation, no E-Stop claim.
name: AXIA G07 Task01 read-only same-run ROS clock subscriber NO GOAL Harmonic L2
on:
  push:
    branches: ['release/p2-g06-cm-ttl-20261110']
    paths: ['.github/workflows/axia-g07-task01-live-clock-no-goal-l2-20261117.yml']
permissions:
  contents: read
jobs:
  bounded-actual-tf-clock:
    runs-on: ubuntu-24.04
    timeout-minutes: 17
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Private candidate only in sealed public CI
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 2df98da9cb9507ce905acbe82da46e93a79f0398
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Immutable old private baseline for RED only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 0682caeb413c9830107b1a0d297d36597896bed7
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: baseline
          persist-credentials: false
      - name: Exact public read-only clock probe source, separate immutable SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 74b076cc4d92a49e26953452b1c722ffb5550df3
          path: public-clock
          persist-credentials: false
      - name: Verified published Task01 clock probe code only, NO Goal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C public-clock rev-parse HEAD)" = '74b076cc4d92a49e26953452b1c722ffb5550df3'
          python3 public-clock/d06/diagnostic/g07_clock_probe_ros.py --help >/dev/null
          PYTHONPATH="$PWD/public-clock" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s public-clock/d06/tests -p 'test_g07_task01_first_gap_clock_probe.py' -v
          PYTHONPATH="$PWD/public-clock" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s public-clock/d06/tests -p 'test_g07_task01_clock_probe_public_export.py' -v
          echo AXIA_G07_TASK01_NO_GOAL_SAME_RUN_CLOCK_PROBE_L0_READY
      - name: Actual RED → GREEN pure audit tests, NO ROS or Goal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 2df98da9cb9507ce905acbe82da46e93a79f0398
          test "$(git -C baseline -c safe.directory="$PWD/baseline" rev-parse HEAD)" = 0682caeb413c9830107b1a0d297d36597896bed7
          cp tests/unit/test_g07_cm120_cycle03_common_gap.py baseline/tests/unit/
          if (cd baseline && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
              -s tests/unit -p 'test_g07_cm120_cycle03_common_gap.py' -v) \
              > /tmp/axia_g07_c02_red.log 2>&1;then
            echo AXIA_G07_C02_BASELINE_UNEXPECTED_GREEN >&2
            exit 3
          fi
          grep -Fq 'FAILED (errors=2)' /tmp/axia_g07_c02_red.log || {
            cat /tmp/axia_g07_c02_red.log
            echo AXIA_G07_C02_RED_NOT_REPRODUCIBLE >&2
            exit 3
          }
          grep -E '^Ran |^FAILED|FileNotFoundError' /tmp/axia_g07_c02_red.log | tail -n 8 || true
          echo AXIA_G07_C03_RED_OLD_SOURCE_HAS_NO_COMMON_GAP_FIELDS
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
              -s tests/unit -p 'test_g07_cm120_cycle03_common_gap.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
              -s tests/unit -p 'test_g07_cm120_tf_clock_no_goal_audit.py' -v
          python3 -m py_compile tools/p4_g07_cm120_tf_clock_readonly.py
          bash -n scripts/p2_no_goal_smoke_ci.sh scripts/p4_g07_shared_runtime.sh
          grep -Fq "AXIA_G07_CM120_TF_AUDIT_NO_GOAL" scripts/p2_no_goal_smoke_ci.sh
          echo AXIA_G07_C03_NO_GOAL_L0_GREEN_3_PLUS_PREV4_NO_CMDVEL
      - name: Existing official Gazebo + Nav2 startup, bounded TF / clock audit, NO GOAL
        shell: bash
        env:
          ROS_DOMAIN_ID: '88'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_p4_shared_88
          AXIA_P0_SIM_ONLY: '1'
          AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
          AXIA_P2_G07_OWNER_PARITY_CHECK: '1'
          AXIA_G07_OWNER_STARTUP_PARITY: '1'
          AXIA_G07_CI_OWNER_BAG_PARITY: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '0'
          AXIA_G07_SHUTDOWN_L2_ONLY: '1'
          AXIA_P4_G07_SHARED_PREFLIGHT_ONLY: '1'
          AXIA_G07_CM120_TF_AUDIT_NO_GOAL: '1'
          AXIA_P2_SMOKE_RESULTS: results/p4-g07-cm120-tfclock-no-goal-l2
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +e
          # READ ONLY: independent subscriber /clock host-monotonic receive.
          # Not the official TF Buffer's internal clock; no cmd_vel / Goal.
          PROBE="$RUNNER_TEMP/g07_task01_clock_probe.jsonl"
          python3 public-clock/d06/diagnostic/g07_clock_probe_ros.py \
             --out "$PROBE" --max-duration-sec 700 \
             >"$RUNNER_TEMP/g07_task01_clock_probe.log" 2>&1 &
          CLOCK_PID=$!
          sleep 1
          kill -0 "$CLOCK_PID" || {
            echo AXIA_G07_TASK01_CLOCK_PROBE_FAILED_BEFORE_NO_GOAL >&2
            exit 3
          }
          timeout --signal=TERM --kill-after=10s 650s bash scripts/p2_no_goal_smoke_ci.sh \
            >"$RUNNER_TEMP/g07_cm120_tf_clock_no_goal.log" 2>&1
          rc=$?
          kill -TERM "$CLOCK_PID" 2>/dev/null || true
          wait "$CLOCK_PID" 2>/dev/null
          CLOCK_RC=$?
          set -e
          if [[ "$CLOCK_RC" -ne 0 || ! -f "$PROBE" ]]; then
            echo "AXIA_G07_TASK01_CLOCK_FILE_OR_CHILD_EXIT_HOLD clock_rc=$CLOCK_RC"
            exit 3
          fi
          python3 - "$PROBE" <<'PY'
          import json,sys
          from pathlib import Path
          rows=[json.loads(x) for x in Path(sys.argv[1]).read_text().splitlines()]
          if len(rows)<15: raise SystemExit("CLOCK_NO_GOAL_LESS_THAN_15_SAMPLES_HOLD")
          if any(b['mono_ns']<=a['mono_ns'] or b['sim_ns']<a['sim_ns']
                 for a,b in zip(rows,rows[1:])):
              raise SystemExit("CLOCK_NO_GOAL_NONMONOTONIC_HOLD")
          wall_ns=rows[-1]['mono_ns']-rows[0]['mono_ns']
          sim_ns=rows[-1]['sim_ns']-rows[0]['sim_ns']
          if not wall_ns>0 or not sim_ns>0:
              raise SystemExit("CLOCK_NO_GOAL_NO_CLOCK_PROGRESS_HOLD")
          print("AXIA_G07_TASK01_REAL_NO_GOAL_CLOCK_PROBE "+json.dumps({
              "samples":len(rows),"sim_to_wall_ratio":round(sim_ns/wall_ns,6),
              "clock_subscriber_only":True,"first_moving_gap_proven":False,
              "tf_buffer_clock_proven":False,
              "goal_sent":False,"cm120_release_pass":False
          },sort_keys=True))
          print("AXIA_G07_TASK01_REAL_NO_GOAL_CLOCK_PROBE_PASS_NOT_CM_CAUSALITY")
          PY
          grep -E 'AXIA_G07_CM120_(BASE_SHIFT|NO_GOAL_TF_CLOCK_AUDIT)' "$RUNNER_TEMP/g07_cm120_tf_clock_no_goal.log" || true
          python3 - "$rc" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path("results/p4-g07-cm120-tfclock-no-goal-l2")
          rc=int(sys.argv[1])
          audit_path=root/"g07_cm120_tf_clock_no_goal.json"
          if not audit_path.exists():
              print("AXIA_G07_C02_REAL_TF_AUDIT_MISSING_FIRST_BOUNDARY")
              raise SystemExit(3)
          audit=json.loads(audit_path.read_text())
          if (root/"startup_verdict.json").exists():
              startup=json.loads((root/"startup_verdict.json").read_text())
          else:
              startup={}
          print("AXIA_G07_C03_NO_GOAL_REAL_TF_CLOCK_RESULT "+json.dumps({
            "rc":rc,"status":audit.get("status"),
            "sim_to_wall_factor":audit.get("sim_to_wall_factor"),
            "tf_odom_count":audit.get("tf_odom_count"),
            "tf_max_wall_interarrival_s":audit.get("tf_max_wall_interarrival_s"),
            "odom_max_wall_interarrival_s":audit.get("odom_max_wall_interarrival_s"),
            "scan_max_wall_interarrival_s":audit.get("scan_max_wall_interarrival_s"),
            "clock_tf_max_sim_age_s":audit.get("clock_tf_max_sim_age_s"),
            "clock_odom_tf_max_gap_overlap_s":audit.get("clock_odom_tf_max_gap_overlap_s"),
            "clock_odom_tf_max_gap_coincident":audit.get("clock_odom_tf_max_gap_coincident"),
            "clock_max_gap_sim_step_s":audit.get("clock_max_gap_sim_step_s"),
            "odom_max_gap_sim_step_s":audit.get("odom_max_gap_sim_step_s"),
            "tf_max_gap_sim_step_s":audit.get("tf_max_gap_sim_step_s"),
            "callback_causality_proven":False, "goal_sent":startup.get("goal_sent")
          },sort_keys=True))
          assert startup.get("status") == "SMOKE_READY" and startup.get("goal_sent") is False
          assert audit.get("status") == "OBSERVED_NO_GOAL_NOT_CM_CALLBACK_PROOF"
          assert isinstance(audit.get("clock_odom_tf_max_gap_coincident"),bool)
          assert type(audit.get("clock_odom_tf_max_gap_overlap_s")) in (int,float)
          assert audit.get("coincident_gap_causality_proven") is False
          assert audit.get("goal_sent") is False and audit.get("formal_owner_accepted") is False
          sd=json.loads((root/"g07_ordered_shutdown.json").read_text())
          assert sd.get("status") == "NAV2_LIFECYCLE_SHUTDOWN_ACK" and rc==0
          PY
          grep -F 'AXIA_G07_CM120_BASE_SHIFT_CORRECTION_TRUE_READBACK_NO_GOAL' "$RUNNER_TEMP/g07_cm120_tf_clock_no_goal.log"
          grep -F 'AXIA_G07_CM120_NO_GOAL_TF_CLOCK_AUDIT_COMPLETED_NOT_CM_CAUSALITY_NOT_OWNER_L3' "$RUNNER_TEMP/g07_cm120_tf_clock_no_goal.log"
          echo AXIA_G07_C03_COMMON_GAP_REAL_GAZEBO_NAV2_OBSERVED_NO_GOAL_CAUSALITY_UNPROVEN
          echo AXIA_MVP_DEMO_ACCEPTED=HOLD CERTIFIED_ESTOP=false
      - name: Always remove sealed Instructor source and raw ROS artifacts
        if: always()
        shell: bash
        run: |
          rm -rf -- baseline .git docs tools tests configs scripts ros2_ws results \
            "$RUNNER_TEMP/g07_cm120_tf_clock_no_goal.log" "$RUNNER_TEMP/g07_task01_clock_probe.jsonl" "$RUNNER_TEMP/g07_task01_clock_probe.log" public-clock /tmp/axia_g07_c02_red.log
