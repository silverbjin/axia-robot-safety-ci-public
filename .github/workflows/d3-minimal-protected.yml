name: AXIA D3 v2 dynamic scene public-safe Python and Bash gate (NO ROS/GAZEBO)
on:
  push:
    branches:
      - feat/d3-minimal-exact-sha-ci-20261108
    paths:
      - .github/workflows/d3-minimal-protected.yml
      - ci/d3_minimal_manifest.json
      - ci/d3_public_snapshot/**
      - tests/test_d3_minimal_manifest.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axia-d3-v2-${{ github.ref }}
  cancel-in-progress: true
jobs:
  d3-public-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify exact D3 reviewed Git blob SHAs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object ci/d3_public_snapshot/axia_d3_demo/scenario.py)" = "7989573a2919a19b85085fa270889ba131331357"
          test "$(git hash-object ci/d3_public_snapshot/axia_d3_demo/contract.py)" = "87cd8f4151ea61a3d34c4277f12df08a37056dac"
          test "$(git hash-object ci/d3_public_snapshot/models/pedestrian_proxy.sdf)" = "9c864cc660626563124ff7eda446ffcda9e63b8e"
          test "$(git hash-object ci/d3_public_snapshot/test/test_d3_live_scenario.py)" = "ad67e17f00e16a4d37d9f491cf2b0349b615d184"
          test "$(git hash-object ci/d3_public_snapshot/training/d03/d3_demo/scripts/run_d3_live_scene.sh)" = "e1256d2109c12db02a1a79fe54738bfe31777106"
          test "$(git hash-object ci/d3_public_snapshot/training/d03/d3_demo/scripts/run_d3_preview.sh)" = "91cb87969bd7181255cfd3553e3fbbba1b00cb2d"
          test "$(git hash-object ci/d3_public_snapshot/training/d03/d3_demo/scripts/d3_route.sh)" = "f01dc44253d272551eb31140e7faae1cb6234704"
          test "$(git hash-object ci/d3_public_snapshot/training/d03/d3_demo/scripts/d3_session.sh)" = "11d50ea09e2768a68f075919217673cb2f821cf5"
          test "$(git hash-object ci/d3_public_snapshot/setup.py)" = "21337fd41323b3bb40b5fd26d5cba8c245deed4b"
          test "$(git hash-object ci/d3_public_snapshot/training/d03/d3_demo/scripts/d3_wsl2_prepare_once.sh)" = "217a548d47558a39689d69b9a1ae74be883156a3"
          test "$(git hash-object ci/d3_public_snapshot/review_only/test_d3_v2_static.py)" = "4f0400244e157bda9882c4878df45d8f9ee9ee11"
          test "$(git hash-object ci/d3_public_snapshot/review_only/instructor.gitignore)" = "eced4013ba86186f5a2510eb566437717fea6cba"
          echo D3_REVIEWED_BLOB_SHA_ALL_MATCH
      - name: Python contracts, moving proxy and scenario fail-closed tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -q pytest==8.3.5
          export PYTHONPATH="$PWD/ci/d3_public_snapshot"
          python -m pytest -q -ra ci/d3_public_snapshot/test
          python -m unittest discover -s tests -p test_d3_minimal_manifest.py -v
      - name: Syntax and SDF model geometry (not runtime Gazebo)
        shell: bash
        run: |
          set -euo pipefail
          for script in ci/d3_public_snapshot/training/d03/d3_demo/scripts/*.sh; do bash -n "$script"; done
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          root=Path('ci/d3_public_snapshot')
          m=ET.parse(root/'models/pedestrian_proxy.sdf')
          assert m.find('.//collision[@name="lower_body_scan_collision"]') is not None
          assert len(m.findall('.//visual')) >= 6
          PY
          python - <<'PY'
          from pathlib import Path
          src=Path('ci/d3_public_snapshot/training/d03/d3_demo/scripts')
          for n in ('d3_route.sh','d3_wsl2_prepare_once.sh','run_d3_preview.sh','run_d3_live_scene.sh'):
              c=(src/n).read_text()
              i=c.index('source /opt/ros/jazzy/setup.bash')
              assert 'set +u' in c[:i], n
              assert 'set -u' in c[i:], n
          s=(src/'run_d3_preview.sh').read_text()
          assert '-p entity_name:=d3_pedestrian_proxy' in s
          ignores=(Path('ci/d3_public_snapshot/review_only/instructor.gitignore').read_text().splitlines())
          for item in ('/build/','/install/','/log/'):
              assert item in ignores, item
          print('D3_ROS_NOUNSET_REMOVE_AND_COLCON_IGNORE_STATIC_PASS')
          PY
          echo D3_PUBLIC_SAFE_PYTHON_BASH_SDF_PASS_ROS_GAZEBO_NOT_RUN
