name: AXIA D08 one-world Gazebo live harness (public L0)
on:
  push:
    branches: ['feature/d08-gazebo-live-ci-20261110']
    paths:
      - 'd08/harness/**'
      - 'd08/tests/test_d08_live_public_harness.py'
      - 'd08/scripts/**'
      - '.github/workflows/d08-gazebo-live-public-ci.yml'
  pull_request:
    paths:
      - 'd08/harness/**'
      - 'd08/tests/test_d08_live_public_harness.py'
      - 'd08/scripts/**'
      - '.github/workflows/d08-gazebo-live-public-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-world-and-sensor-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile exact public D08 harness and reproduce synthetic XML negative gates
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.3.5
          python -m compileall -q d08/harness
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q d08/tests/test_d08_live_public_harness.py
          echo 'D08_PUBLIC_L0_ONLY_ROS_GAZEBO_NOT_RUN'
  real-gazebo-one-world-rgbd:
    needs: public-world-and-sensor-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install only official Waffle and Gazebo registered RGBD dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates python3-yaml \
            ros-jazzy-nav2-minimal-tb3-sim ros-jazzy-turtlebot3-gazebo \
            ros-jazzy-ros-gz ros-jazzy-xacro ros-jazzy-rclpy \
            ros-jazzy-sensor-msgs libgl1-mesa-dri libglx-mesa0 \
            python3-numpy xvfb xauth
      - name: Pull fixed-Hash public Gazebo Actor mesh for CI only
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axia-d08-assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 100 \
            -o /tmp/axia-d08-assets/walk.dae \
            'https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae'
          echo '49af0df3a319d1cb8ca2cebf02dbd00f625e5d5bec820bc5e109925b18b65c6e  /tmp/axia-d08-assets/walk.dae' | sha256sum -c -
      - name: Start real Gazebo server, native Waffle spawn and registered ROS RGBD sample
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          python3 -u d08/scripts/d08_public_gazebo_l2.py \
            --actor /tmp/axia-d08-assets/walk.dae \
            --out results/d08-gazebo-one-world
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/d08-gazebo-one-world/verdict.json').read_text())
          assert v['status']=='D08_REAL_GAZEBO_WAFFLE_RGBD_NO_GOAL_PASS'
          assert v['actual_rgbd']['matched'] is True
          assert v['goal_sent'] is False and v['cmd_vel_published'] is False
          assert v['collision_ground_truth'] is False
          print('D08_REAL_GAZEBO_L2_NO_GOAL_VERIFIED')
          PY
      - name: Remove external actor asset before artifact collection
        if: always()
        shell: bash
        run: rm -f /tmp/axia-d08-assets/walk.dae
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d08-real-gazebo-one-world-no-goal
          path: results/d08-gazebo-one-world/
          retention-days: 7
          if-no-files-found: warn
