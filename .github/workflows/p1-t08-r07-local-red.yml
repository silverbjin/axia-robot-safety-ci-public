name: AXIA P1-T08 R07 fault local RED (NO Goal/Fault)
on:
  push:
    branches: [feat/secure-instructor-cloud-bridge]
    paths:
      - '.github/workflows/p1-t08-r07-local-red.yml'
      - 'scripts/private_r07_local_red.py'
permissions:
  contents: read
jobs:
  sealed-expected-red:
    if: github.repository == 'silverbjin/axia-robot-safety-ci-public' && github.actor == 'silverbjin' && github.ref == 'refs/heads/feat/secure-instructor-cloud-bridge'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment:
      name: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - env:
          PRIVATE_READ_TOKEN: ${{ secrets.AXIA_CLOUD_CI }}
        run: test -n "$PRIVATE_READ_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 08c19e550a11e5707e3bee689baa61958021d9f8
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
          fetch-depth: 1
          path: _instructor_private
      - name: RED missing R07 local adapter
        run: python3 scripts/private_r07_local_red.py
      - if: always()
        run: rm -rf _instructor_private
