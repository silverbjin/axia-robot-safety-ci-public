name: AXIA D04 Gazebo YOLO 3x stability (NO GOAL, read-only)

on:
  pull_request:
    paths:
      - 'scripts/d04_yolo_stability.py'
      - 'tests/test_d04_yolo_stability.py'
      - '.github/workflows/d04-yolo-3x-stability.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l0-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit gates only (not Gazebo/YOLO success)
        run: |
          set -euo pipefail
          python -m pip install pytest==8.3.5
          python -m compileall -q scripts/d04_yolo_person_runtime.py
          python -m pytest -q tests/test_d04_yolo_stability.py tests/test_d04_yolo_person_runtime.py tests/test_d04_waffle_pi_rgb_preflight.py

  external-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check official Gazebo example actor URL without redistribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axia-d04-assets
          curl --fail -L --retry 3 --retry-delay 2 --connect-timeout 15 \
            --max-time 100 -o /tmp/axia-d04-assets/walk.dae \
            'https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae'
          test -s /tmp/axia-d04-assets/walk.dae
          grep -qi 'COLLADA' /tmp/axia-d04-assets/walk.dae
          file /tmp/axia-d04-assets/walk.dae
          sha256sum /tmp/axia-d04-assets/walk.dae
      - name: Check AGPL-3.0 evaluation-only YOLO26n ONNX model SHA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail -L --retry 3 --retry-delay 2 --connect-timeout 15 \
            --max-time 110 -o /tmp/axia-d04-assets/yolo26n.onnx \
            'https://huggingface.co/unileon-robotics/YOLO26-ONNX/resolve/main/yolo26n.onnx'
          echo '4f44c33cea12d4b5785e5e7c0a20c13d0c62a77de607ce96a40d6036c7d7bbcf  /tmp/axia-d04-assets/yolo26n.onnx' | sha256sum -c -
          echo "MODEL_LICENSE=AGPL-3.0; ephemeral CI evaluation only, no distribution"
          rm -f /tmp/axia-d04-assets/yolo26n.onnx /tmp/axia-d04-assets/walk.dae

  real-gazebo-yolo:
    needs: [l0-contracts, external-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    container:
      image: ros:jazzy-ros-base-noble
    env:
      AXIA_TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEBIAN_FRONTEND: noninteractive
      MAKEFLAGS: -j2
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install official ROS Jazzy Gazebo Harmonic and minimal C++ build deps
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential cmake pkg-config \
            python3-colcon-common-extensions python3-rosdep \
            ros-jazzy-turtlebot3-gazebo ros-jazzy-ros-gz \
            ros-jazzy-rclpy ros-jazzy-sensor-msgs ros-jazzy-cv-bridge \
            ros-jazzy-pluginlib ros-jazzy-vision-msgs ros-jazzy-message-filters \
            ros-jazzy-tf2-ros ros-jazzy-lifecycle-msgs \
            libcurl4-openssl-dev libopencv-dev python3-opencv python3-numpy \
            libgl1-mesa-dri libglx-mesa0 xvfb xauth
      - name: Fetch pinned MIT yolo_ros 5.0.0 source and build actual C++ engine
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/axia-yolo-ws/src
          git clone https://github.com/mgonzs13/yolo_ros.git /tmp/axia-yolo-ws/src/yolo_ros
          git -C /tmp/axia-yolo-ws/src/yolo_ros checkout --detach 94d2dd500cb26027ee9c019f4d3a02029ac615cc
          test "$(git -C /tmp/axia-yolo-ws/src/yolo_ros rev-parse HEAD)" = "94d2dd500cb26027ee9c019f4d3a02029ac615cc"
          cd /tmp/axia-yolo-ws
          colcon build --merge-install --executor sequential --packages-up-to yolo_bringup \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            --event-handlers console_direct+
          source install/setup.bash
          ros2 pkg prefix yolo_bringup
          ros2 pkg prefix yolo_ros
      - name: Fetch person actor and pinned ONNX model (not uploaded or committed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axia-d04-assets
          curl --fail -L --retry 3 --connect-timeout 15 --max-time 100 \
            -o /tmp/axia-d04-assets/walk.dae \
            'https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae'
          curl --fail -L --retry 3 --connect-timeout 15 --max-time 110 \
            -o /tmp/axia-d04-assets/yolo26n.onnx \
            'https://huggingface.co/unileon-robotics/YOLO26-ONNX/resolve/main/yolo26n.onnx'
          echo '4f44c33cea12d4b5785e5e7c0a20c13d0c62a77de607ce96a40d6036c7d7bbcf  /tmp/axia-d04-assets/yolo26n.onnx' | sha256sum -c -
          sha256sum /tmp/axia-d04-assets/walk.dae
      - name: Three sequential actual Waffle Pi Gazebo YOLO cold starts
        shell: bash
        env:
          AXIA_ACTOR_DAE: /tmp/axia-d04-assets/walk.dae
          AXIA_ONNX_PATH: /tmp/axia-d04-assets/yolo26n.onnx
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/axia-yolo-ws/install/setup.bash
          export TURTLEBOT3_GAZEBO_SHARE="$(ros2 pkg prefix turtlebot3_gazebo)/share/turtlebot3_gazebo"
          echo "ROBOTIS_SHARE=$TURTLEBOT3_GAZEBO_SHARE"
          python3 scripts/d04_yolo_stability.py --rounds 3 --out results/d04-yolo-stability
      - name: Remove AGPL model and actor binaries before artifact collection
        if: always()
        shell: bash
        run: rm -f /tmp/axia-d04-assets/yolo26n.onnx /tmp/axia-d04-assets/walk.dae || true
      - name: Upload 3x logs and actual annotated PNGs (no weights or source)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d04-real-yolo-3x-stability
          path: results/d04-yolo-stability/
          retention-days: 14
          if-no-files-found: warn
