name: AXIA P4 G13 PC1 original CI-kernel gate before Nav2 no-Goal L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g13-pc1-ci-kernel-mode-l0.yml']
  pull_request:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - 'scripts/axia_p4_g13_external_no_goal_once.sh'
      - '.github/workflows/axia-p4-g13-pc1-ci-kernel-mode-l0.yml'
permissions:
  contents: read
jobs:
  original-first-failure-and-owner-vs-ci-mode:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Public actual PR source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: public
          persist-credentials: false
      - name: Private source pinned exactly for CI mode-boundary contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 16698fe93ebe6319c2bbd0ac9fd2ea063e14cdf8
          path: instructor
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Original sanitized PC1 receipt and forbidden CI-kernel on WSL2 RED GREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          AXIA_G13_CI_STAGE=private_pin
          trap 'rc=$?; { printf "stage=%s\\nexit_code=%s\\n" "$AXIA_G13_CI_STAGE" "$rc"; if [[ -f "$RUNNER_TEMP/g13_private_unittest.log" ]];then grep -E "^(FAIL|ERROR): test_" "$RUNNER_TEMP/g13_private_unittest.log" || true;fi; } >"$RUNNER_TEMP/g13_scoped_diag.txt"' EXIT
          test "$(git -C instructor rev-parse HEAD)" = 16698fe93ebe6319c2bbd0ac9fd2ea063e14cdf8
          AXIA_G13_CI_STAGE=private_unittest
          python3 -m unittest discover -s instructor/tests/unit -p test_p4_g13_pc1_owner_vs_ci_kernel_no_goal.py -v >"$RUNNER_TEMP/g13_private_unittest.log" 2>&1 || {
            grep -E "^(FAIL|ERROR): test_" "$RUNNER_TEMP/g13_private_unittest.log" || true
            exit 3
          }
          AXIA_G13_CI_STAGE=bash_syntax
          bash -n instructor/scripts/p2_no_goal_smoke_ci.sh
          bash -n public/scripts/axia_p4_g13_external_no_goal_once.sh
          ROOT="$HOME/.axia_g13_external_pc_evidence/g13-PC1-ci_kernel_fixture"
          mkdir -p "$ROOT/actual"
          printf '%s\n' \
            'AXIA_G07_ENV_PARITY_BLOCKED mismatches=ci_kernel' \
            'P2_G07_NO_GOAL_CI_USERSPACE_PARITY_BLOCKED' \
            'G07_REAL_SHUTDOWN_L2_NO_NAV2_ACK' \
            'P2_L2_SMOKE_RC=3' >"$ROOT/smoke.log"
          printf '%s\n' 'AXIA_G07_ENV_PARITY_BLOCKED mismatches=ci_kernel' >"$ROOT/actual/g07_userspace_parity.log"
          printf '%s\n' '{"mode":"ci","wsl_detected":true,"status":"PARITY_BLOCKED","mismatch":{"ci_kernel":"CI_NOT_WSL2_REQUIRED"},"goal_sent":false}' >"$ROOT/actual/g07_userspace_parity.json"
          printf '%s\n' '{"label":"PC1","run_exit_code":3,"goal_sent":false,"no_goal_smoke_pass":false}' >"$ROOT/g13_no_goal_receipt.json"
          AXIA_G13_CI_STAGE=read_only_inspector
          bash public/scripts/axia_p4_g13_external_no_goal_once.sh --inspect "$ROOT" >"$RUNNER_TEMP/g13_pc1_inspect.txt"
          grep -Fq 'AXIA_G13_PREVIOUS_RUN_FIRST_FAILURE=CI_KERNEL_MODE_ON_WSL2' "$RUNNER_TEMP/g13_pc1_inspect.txt"
          grep -Fq 'AXIA_G13_PREVIOUS_RUN_DIAGNOSTIC_ONLY_NO_GOAL_NO_RETRY' "$RUNNER_TEMP/g13_pc1_inspect.txt"
          ! grep -Fq 'REAL_JAZZY_HARMONIC_NO_GOAL_L2_PASS' "$RUNNER_TEMP/g13_pc1_inspect.txt"
          echo AXIA_G13_PC1_CI_KERNEL_WRONG_MODE_FIRST_FAILURE_L0_PASS_NO_ROS_NO_GOAL
      - name: Preserve ONLY sanitized failing stage and test names
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axia-g13-scoped-ci-diagnostic
          path: ${{ runner.temp }}/g13_scoped_diag.txt
          if-no-files-found: warn
          retention-days: 1
      - name: Erase private source
        if: always()
        shell: bash
        run: rm -rf -- instructor
