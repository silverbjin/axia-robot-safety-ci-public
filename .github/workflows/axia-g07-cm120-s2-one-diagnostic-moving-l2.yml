          if not event_file.is_file():
              print("AXIA_G07_C05_REAL_FIRST_CM_GAP_EVENTS_MISSING_HOLD")
              raise SystemExit(3)
          observer=[json.loads(line) for line in event_file.read_text().splitlines()]
          anchors={"start":json.loads((root/"start_anchor.json").read_text()),
                   "end":json.loads((root/"end_anchor.json").read_text())}
          names={
            "ros2:rcl_subscription_init","ros2:rclcpp_subscription_init",
            "ros2:rclcpp_subscription_callback_added",
            "ros2:callback_start","ros2:callback_end"}
          # RED #44007105539: unfiltered CM event count exceeded 100k.
          # S0 GREEN #44009082369: only exact topic->callback rows retained.
          from d06.diagnostic.s0_cm_diag_readiness import select_exact_cm_callbacks
          def source_rows():
              for msg in bt2.TraceCollectionMessageIterator(str(root/"trace")):
                  if not isinstance(msg,bt2._EventMessageConst):
                      continue
                  event=msg.event
                  if event.name not in names:
                      continue
                  row={"name":event.name}
                  c=event.common_context_field
                  p=event.payload_field
                  for key in ("vpid","vtid"):
                      if c is not None and key in c:row[key]=int(c[key])
                  if c is not None and "procname" in c:
                      row["procname"]=str(c["procname"])
                  for key in ("subscription_handle","subscription","callback","topic_name"):
                      if key in p:row[key]=str(p[key])
                  snap=msg.default_clock_snapshot
                  if snap is not None:row["timestamp_ns"]=snap.ns_from_origin
                  yield row
          selected=select_exact_cm_callbacks(source_rows())
          print("AXIA_G07_S0_ACTUAL_CM_CALLBACK_FILTER_COUNTS "+
