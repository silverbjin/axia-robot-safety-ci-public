name: AXIA P2 T07 Owner L3 contract (NO Goal/Fault in CI)
on:
  pull_request:
    paths:
      - '.github/workflows/p2-owner-l3-contract.yml'
      - 'scripts/axia_p2_owner_l3_once.sh'
      - 'tests/test_p2_owner_l3_once.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2-owner-l3-contract.yml'
      - 'scripts/axia_p2_owner_l3_once.sh'
      - 'tests/test_p2_owner_l3_once.py'
permissions:
  contents: read
concurrency:
  group: axia-p2-owner-l3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Public fail-closed Owner wrapper contract (never runs a Goal/Fault)
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/axia_p2_owner_l3_once.sh
          bash scripts/axia_p2_owner_l3_once.sh --self-check
          python3 -m unittest discover -s tests -p test_p2_owner_l3_once.py -v
          echo 'AXIA_P2_T07_PUBLIC_CONTRACT_PASS_L3_NOT_RUN'
  instructor-l0:
    needs: public-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'silverbjin/axia-robot-safety-ci-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: axia-instructor-sealed
    steps:
      - name: Checkout private SHA for read-only tests (no artifacts)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: d5be4b55a935c0c4d9ca3ff895ce44090ef07fd5
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Exact SHA P2 L0 + shell syntax; no Goal/Fault
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = d5be4b55a935c0c4d9ca3ff895ce44090ef07fd5
          python3 -m pip install --disable-pip-version-check --quiet pytest==8.3.5 PyYAML==6.0.2
          python3 -m pytest -q -ra tests/unit/test_p2_*.py
          python3 -m compileall -q tools/p2_l3_*.py tools/p2_live_fault_gate.py
          bash -n scripts/p2_owner_l3_wsl2.sh
          echo 'AXIA_P2_T07_PRIVATE_L0_EXACT_SHA_PASS_L3_NOT_RUN'
      - name: Remove private code and worktree
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts docs configs tests results build install log .git
  instructor-l1-qos:
    needs: instructor-l0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'silverbjin/axia-robot-safety-ci-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container:
      image: ros:jazzy-ros-base-noble
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: d5be4b55a935c0c4d9ca3ff895ce44090ef07fd5
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Jazzy Action status transient-local QoS / no runtime Goal or Fault
        shell: bash
        run: |
          set -eo pipefail
          # Jazzy setup scripts expect certain vars unset; source before nounset.
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          python3 - <<'PY'
          from rclpy.qos import QoSProfile, QoSDurabilityPolicy, QoSReliabilityPolicy
          q=QoSProfile(depth=10)
          q.reliability=QoSReliabilityPolicy.RELIABLE
          q.durability=QoSDurabilityPolicy.TRANSIENT_LOCAL
          assert q.durability == QoSDurabilityPolicy.TRANSIENT_LOCAL
          from pathlib import Path
          s=Path('tools/p2_live_fault_gate.py').read_text()
          assert 'action,action_qos' in s and 'TRANSIENT_LOCAL' in s
          print('AXIA_P2_T07_JAZZY_QOS_L1_PASS_NO_GOAL_NO_FAULT')
          PY
      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts docs configs tests .git

  instructor-l1-real-pid:
    # Real Jazzy ROS processes, actual /proc read, no Gazebo, Goal or Fault.
    needs: instructor-l1-qos
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'silverbjin/axia-robot-safety-ci-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: ros:jazzy-ros-base-noble
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact private T07 SHA (never publish source)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: d5be4b55a935c0c4d9ca3ff895ce44090ef07fd5
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Build minimal actual Jazzy nodes and verify isolated /proc PID ownership
        shell: bash
        run: |
          set -eo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = d5be4b55a935c0c4d9ca3ff895ce44090ef07fd5
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq >/dev/null
          apt-get install -y -qq --no-install-recommends python3-colcon-common-extensions ros-jazzy-nav2-msgs ros-jazzy-nav2-collision-monitor python3-pytest >/dev/null
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          colcon build --merge-install --base-paths ros2_ws/src --packages-select axia_fault_injector axia_safety_supervisor --event-handlers console_cohesion+ > /tmp/axia_p2_l1_build.log 2>&1 || {
            tail -n 60 /tmp/axia_p2_l1_build.log
            exit 1
          }
          set +u
          source install/local_setup.bash
          set -u
          export ROS_DOMAIN_ID=89
          export ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION="axia_p2_pid_$GITHUB_RUN_ID"
          export AXIA_P0_SIM_ONLY=1
          export AXIA_P2_L1_PID_ONLY=1
          timeout --signal=TERM --kill-after=15s 100s python3 tools/p2_pid_real_l1.py --expected-sha d5be4b55a935c0c4d9ca3ff895ce44090ef07fd5
          echo 'AXIA_P2_T07_JAZZY_REAL_PROC_PID_L1_PASS_NO_GOAL_NO_FAULT'
          # No Nav2 Goal, no process Fault: exercise the ACTUAL Owner consent
          # function through a Linux controlling PTY, noncanonical VMIN,
          # redirected stdout, partial input, wrong/no response and an
          # actual rclpy executor concurrently spinning during approval.
          timeout --signal=TERM --kill-after=10s 75s python3 -m pytest -q -ra             tests/unit/test_p2_owner_tty_deadline_contract.py             tests/unit/test_p2_tty_stdio_contract.py
          # Deterministic fail-closed regression: fake worker waits indefinitely
          # and the ROS Owner parent must cancel approval before any Goal.
          # Covered by test_p2_owner_tty_deadline_contract.py.
          test -f tools/p2_tty_crash_consent_worker.py
          # MVP owner Shell approvals are validated via L0 one-shot receipt tests;
          # the legacy isolated-PTY helper remains non-runtime and need not
          # gate actual G05/G06/G07 safety functionality.
          test -f tools/p2_shell_owner_consent.py
          echo 'AXIA_P2_T07_JAZZY_REAL_PTY_CONSENT_L1_PASS_NO_GOAL_NO_FAULT'
      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts docs configs tests results build install log .git

