              print("AXIA_G07_C05_CM_CALLBACK_ROOT_CAUSE_UNPROVEN_HOLD")
              raise SystemExit(3)
          assert result["cm120_release_pass"] is False
          assert result["tf_lookup_causality_proven"] is False
          assert result["scheduler_causality_proven"] is False
          print("AXIA_G07_C05_ACTUAL_CM_CALLBACK_DURATION_OBSERVED_DIAGNOSTIC_NOT_RELEASE")
          from d06.diagnostic.analyze_first_cm_tf import analyze
          tf_file=Path("/tmp/axia_g07_cm120_tf_diag.log")
          if not tf_file.is_file():
              print("AXIA_G07_CM120_TF_DIAG_CM_LIBRARY_NOT_INVOKED_HOLD")
              raise SystemExit(3)
          verdict=analyze(observer,rows,tf_file.read_text().splitlines(),anchors)
          print("AXIA_G07_CM120_GATE_B_REAL_TF_CALLBACK_TIME "+
                json.dumps(verdict,sort_keys=True))
          print("AXIA_G07_S2_FIRST_CM_TF_OFFCPU_PROVENANCE "+
                json.dumps(verdict.get("s2_offcpu_provenance"),sort_keys=True))
          if not isinstance(verdict.get("s2_offcpu_provenance"),dict):
              raise SystemExit("S2_REAL_SCHEDULER_AND_SLEEP_PROVENANCE_MISSING_HOLD")
