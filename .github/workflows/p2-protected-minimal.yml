name: AXIA P2 exact SHA protected prelocal (NO GOAL / NO FAULT)
on:
  pull_request:
    paths:
      - '.github/workflows/p2-protected-minimal.yml'
      - 'scripts/p2_manifest.py'
      - 'tests/test_p2_manifest.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/p2-protected-minimal.yml'
      - 'scripts/p2_manifest.py'
      - 'tests/test_p2_manifest.py'
permissions:
  contents: read
concurrency:
  group: axia-p2-prelocal-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate public-only P2 CI manifest (no secrets on PR)
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_p2_manifest.py -v
  private-l0:
    needs: public-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'silverbjin/axia-robot-safety-ci-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: axia-instructor-sealed
    steps:
      - name: Checkout pinned private instructor P2 commit into ephemeral workspace
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 66e6d5c53a42b123716a4fbfd47d4de0b77f1269
          token: ${{ secrets.AXIA_CLOUD_CI }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python L0 exact source SHA, 72 focused P2 tests
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 66e6d5c53a42b123716a4fbfd47d4de0b77f1269
          python3 -m pip install --disable-pip-version-check --quiet pytest==8.3.5 PyYAML==6.0.2
          python3 -m pytest -q -ra tests/unit/test_p2_*.py
          echo 'AXIA_P2_PRIVATE_L0_EXACT_SHA_PASS_G05_G06_G07_NOT_ACCEPTED'
      - name: Remove private checkout (no artifacts)
        if: always()
        run: |
          rm -rf -- ros2_ws tools scripts docs configs tests .git
          echo 'AXIA_P2_L0_PRIVATE_CHECKOUT_REMOVED'
  private-l1:
    needs: private-l0
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'silverbjin/axia-robot-safety-ci-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ros:jazzy-ros-base-noble
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 66e6d5c53a42b123716a4fbfd47d4de0b77f1269
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Install only Python ROS middleware test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-colcon-common-extensions ros-jazzy-rclpy ros-jazzy-geometry-msgs \
            ros-jazzy-std-msgs ros-jazzy-std-srvs ros-jazzy-sensor-msgs \
            ros-jazzy-nav2-msgs ros-jazzy-action-msgs ros-jazzy-lifecycle-msgs
      - name: Sim-only ROS Jazzy guard TTL no Gazebo
        shell: bash
        env:
          ROS_DOMAIN_ID: '56'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths ros2_ws/src --packages-select axia_safety_supervisor --event-handlers console_direct+
          bash scripts/p2_guard_ros_smoke_ci.sh
      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts docs configs tests .git
  private-l2-no-goal:
    needs: private-l1
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'silverbjin/axia-robot-safety-ci-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    container:
      image: ros:jazzy-ros-base-noble
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 66e6d5c53a42b123716a4fbfd47d4de0b77f1269
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Install official Nav2 Waffle + Gazebo Harmonic once
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            procps git python3-yaml python3-colcon-common-extensions \
            ros-jazzy-nav2-bringup ros-jazzy-navigation2 ros-jazzy-nav2-minimal-tb3-sim \
            ros-jazzy-ros-gz ros-jazzy-rclpy ros-jazzy-rosgraph-msgs \
            ros-jazzy-nav-msgs ros-jazzy-sensor-msgs ros-jazzy-geometry-msgs \
            ros-jazzy-std-msgs ros-jazzy-std-srvs ros-jazzy-lifecycle-msgs \
            ros-jazzy-nav2-msgs ros-jazzy-action-msgs
      - name: Official Waffle P2 command graph /clock /scan /odom NO goal
        shell: bash
        env:
          ROS_DOMAIN_ID: '56'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          set -eo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 66e6d5c53a42b123716a4fbfd47d4de0b77f1269
          bash scripts/p2_no_goal_smoke_ci.sh
          echo 'P2_L2_NO_GOAL_SMOKE_ONLY_G05_G06_G07_NOT_ACCEPTED'
      - name: Remove private checkout and private logs (no artifacts)
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts docs configs tests results build install log .git
