name: AXIA D04 ROS 2 package L0/L1 (source-only, NO P1 goal)

on:
  push:
    branches: ["feature/d04-yolo-ros-package-20261109"]
    paths:
      - "d04/axia_d04_vision_demo/**"
      - "tests/test_d04_pkg_contract.py"
      - "tests/test_d04_nav2_headless_regression.py"
      - "tests/test_d04_observable_demo.py"
      - "tests/test_d04_packaged_owner_contract.py"
      - "tests/test_d04_owner_recovery.py"
      - "scripts/d04_packaged_p1_yolo_gate.py"
      - "scripts/axia_d04_ros_package_wsl2_once.sh"
      - ".github/workflows/d04-ros-package-verify.yml"
  pull_request:
    paths:
      - "d04/axia_d04_vision_demo/**"
      - "tests/test_d04_pkg_contract.py"
      - "tests/test_d04_nav2_headless_regression.py"
      - "tests/test_d04_observable_demo.py"
      - "tests/test_d04_packaged_owner_contract.py"
      - "tests/test_d04_owner_recovery.py"
      - "scripts/d04_packaged_p1_yolo_gate.py"
      - "scripts/axia_d04_ros_package_wsl2_once.sh"
      - ".github/workflows/d04-ros-package-verify.yml"

permissions:
  contents: read

jobs:
  l0-python-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          python -m pip install --quiet pytest==8.3.5
          python -m pytest -q tests/test_d04_pkg_contract.py tests/test_d04_packaged_owner_contract.py tests/test_d04_observable_demo.py tests/test_d04_nav2_headless_regression.py tests/test_d04_owner_recovery.py

  l1-jazzy-colcon:
    needs: l0-python-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    container:
      image: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install only Jazzy package build tools and official launch dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            python3-colcon-common-extensions python3-pytest \
            ros-jazzy-launch ros-jazzy-launch-ros ros-jazzy-ament-index-python \
            ros-jazzy-nav2-bringup ros-jazzy-nav2-minimal-tb3-sim \
            ros-jazzy-turtlebot3-gazebo ros-jazzy-ros-gz-image
      - name: Real colcon package build and installed launch argument discovery
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          colcon build --base-paths d04/axia_d04_vision_demo \
            --packages-select axia_d04_vision_demo --event-handlers console_direct+
          source install/setup.bash
          test -n "$(ros2 pkg prefix axia_d04_vision_demo)"
          ros2 launch axia_d04_vision_demo d04_p1_yolo.launch.py --show-args \
            | tee results-d04-package-show-args.log
          grep -q "p1_launch" results-d04-package-show-args.log
          grep -q "onnx_model" results-d04-package-show-args.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d04-ros-package-l1-log
          path: |
            results-d04-package-show-args.log
            log/latest_build/
          retention-days: 14
          if-no-files-found: warn
