# Actual 44306415620 first /scan raw 400.119ms while /safety/scan 119.38ms, ROS RTF .984428;
# public L0 test_d06_native_raw_scan_ttl_boundary captures it and NEVER relaxes 300ms.
name: AXIA D06 G07 real native separated LiDAR and ROS Clock RTF L2
on:
  push:
    branches: ['fix/d06-wslg-lidar-vs-rtf-ci-20261118']
    paths:
      - '.github/workflows/axia-d06-g07-lidar-rtf-separation-native-l2-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axia-d06-g07-lidar-rtf-separation-native-l2
  cancel-in-progress: false
jobs:
  same-runtime-native-readonly:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
    env:
      ROS_DOMAIN_ID: '86'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      GZ_PARTITION: axia_p2_no_goal_sensor
      AXIA_P0_SIM_ONLY: '1'
      AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
      AXIA_G07_OWNER_STARTUP_PARITY: '1'
      AXIA_P2_G07_RELOCATED_OBSTACLE: '1'
      AXIA_G07_OWNER_SENSOR_TRUTH_NO_GOAL: '1'
      AXIA_G07_CI_SENSOR_TRUTH_NO_GOAL: '1'
      AXIA_G07_CI_SIM_GOAL_ALLOWED: '0'
      AXIA_G07_TASK04_OWNER_MOVING_L3: '0'
      AXIA_G07_TASK04_CI_GUI_MOVING: '0'
      AXIA_G07_CI_OWNER_BAG_PARITY: '0'
      AXIA_G07_TASK02_SIMPLE_TF_CANDIDATE: '0'
      AXIA_D07_H01_GUI_NO_GOAL: '0'
      AXIA_WSLG_SENSOR_PROBE_DURATION_SEC: '20'
      QT_QPA_PLATFORM: offscreen
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: f541c36a3984aa65a13de03ef60861103718afb1
          path: student
          persist-credentials: false
      - name: Actual frozen source and sensor admission contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = f541c36a3984aa65a13de03ef60861103718afb1
          test "$(git -C ci rev-parse HEAD)" = "$GITHUB_SHA"
          cd student/block_B/day07/h01_runtime
          set +u;source /opt/ros/jazzy/setup.bash;set -u
          bash -n scripts/p2_no_goal_smoke_ci.sh
          python3 -m py_compile tools/g07_wslg_no_goal_sensor_probe.py
          python3 -m unittest discover -s tools -p 'test_g07_wslg_no_goal_sensor_probe.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_owner_clock_world_launch.py' -v
          echo AXIA_G07_NATIVE_NO_GOAL_SOURCE_L0_PASS
      - name: Real Gazebo and ROS /scan /safety/scan /clock /odom no Goal
        timeout-minutes: 24
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u;source /opt/ros/jazzy/setup.bash;set -u
          if ! command -v Xvfb >/dev/null || ! command -v rviz2 >/dev/null || ! command -v xwininfo >/dev/null;then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends xvfb x11-utils ros-jazzy-rviz2
          fi
          export DISPLAY=:97
          Xvfb :97 -screen 0 1600x900x24 -nolisten tcp > "$GITHUB_WORKSPACE/xvfb.log" 2>&1 &
          xvfb_pid=$!
          trap 'kill -TERM "$xvfb_pid" 2>/dev/null || true' EXIT
          sleep 2
          kill -0 "$xvfb_pid"
          export GZ_PARTITION="axia_p2_no_goal_sensor_$GITHUB_RUN_ID"
          export AXIA_P2_SMOKE_RESULTS="$GITHUB_WORKSPACE/native"
          cd "$GITHUB_WORKSPACE/student/block_B/day07/h01_runtime"
          setsid timeout --signal=TERM --kill-after=10s 1000s \
            bash scripts/p2_no_goal_smoke_ci.sh \
            > "$GITHUB_WORKSPACE/no_goal_native.log" 2>&1 &
          sensor_pid=$!
          gazebo_seen=0;rviz_seen=0
          for ((i=0;i<780;i++));do
            kill -0 "$sensor_pid" 2>/dev/null || break
            windows="$(timeout 4s xwininfo -root -tree 2>/dev/null || true)"
            grep -Eiq 'Gazebo' <<< "$windows" && gazebo_seen=1
            grep -Eiq 'RViz' <<< "$windows" && rviz_seen=1
            sleep 1
          done
          set +e;wait "$sensor_pid";rc=$?;set -e
          echo "AXIA_G07_NATIVE_SENSOR_NO_GOAL_SMOKE_RC=$rc GAZEBO_X11=$gazebo_seen RVIZ_X11=$rviz_seen"
          [[ "$gazebo_seen" == 1 && "$rviz_seen" == 1 ]] || {
            echo 'AXIA_G07_NO_GOAL_GUI_CLIENTS_NOT_PROVEN_L2' >&2;exit 3;
          }
          grep -E 'G07_WSLG_NO_GOAL_SENSOR_|AXIA_G07_WSLG_NO_GOAL_SENSOR_TRUTH|P2_L2_SMOKE_RC|P2_NO_GOAL_BLOCKED' "$GITHUB_WORKSPACE/no_goal_native.log" | tail -n 15 || true
          if [[ "$rc" -ne 0 ]]; then
            for f in "$GITHUB_WORKSPACE/native/launch.log" \
                     "$GITHUB_WORKSPACE/native/staged_startup.log" \
                     "$GITHUB_WORKSPACE/native/g07_wslg_sensor_truth.log" \
                     "$GITHUB_WORKSPACE/no_goal_native.log";do
              if [[ -r "$f" ]];then echo "=== FIRST NO_GOAL EVIDENCE $f";tail -n 55 "$f";fi
            done
            exit 3
          fi
          python3 - "$GITHUB_WORKSPACE/native/g07_wslg_sensor_truth.json" "$GITHUB_WORKSPACE/native/teardown.txt" <<'PY'
          import json,sys
          from pathlib import Path
          p=Path(sys.argv[1]);e=json.loads(p.read_text())
          assert e["schema"]=="axia_g07_wslg_no_goal_sensor_truth_v1"
          assert e["status"]=="NO_GOAL_SENSOR_WINDOW_CLEAR_CANDIDATE"
          assert e["goal_sent"] is False and e["fixture_moved"] is False
          assert e["certified_estop"] is False
          assert e["metrics"]["safety"]["count"]>=20
          assert e["metrics"]["raw"]["count"]>=20
          assert e["metrics"]["safety"]["front_median_m"]>.75
          assert e["metrics"]["safety"]["side_median_m"]>1.20
          assert e["metrics"]["safety"]["max_receipt_gap_sec"]<=.3
          assert e["metrics"]["raw"]["max_receipt_gap_sec"]<=.3
          t=e["rtf_diagnostics"]
          assert t["ros_clock_rtf"] is not None and t["ros_clock_rtf"]>0
          assert t["sim_elapsed_sec"]>0 and t["wall_elapsed_sec"]>0
          assert 8.0 <= t["safety_source_hz"] <= 12.5
          assert t["safety_wall_hz"]>0
          assert e["goal_sent"] is False
          print("AXIA_G07_NATIVE_INDEPENDENT_RTF_OBSERVED",t["ros_clock_rtf"],t["safety_source_hz"],t["safety_wall_hz"],t["timing_pattern"])
          assert not any("exit code -11" in ln or "SIGSEGV" in ln for ln in
                         Path(sys.argv[1]).parent.joinpath("launch.log").read_text().splitlines())

          assert Path(sys.argv[2]).read_text().strip()=="P2_L2_GRACEFUL_TEARDOWN"
          print("AXIA_G07_NATIVE_REAL_ROS_NO_GOAL_SCAN_CLEAR_TTL_SHUTDOWN_L2_PASS",e["metrics"]["safety"])
          PY
          echo 'D06_WSLG_SENSOR_HARDWARE_PARITY=NOT_RUN'
          echo 'D06_GAZEBO_LIVE_RELEASE=HOLD CERTIFIED_ESTOP=false'
      - name: Upload numeric NO_GOAL report only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axia-g07-no-goal-native-scan-${{ github.run_id }}
          path: |
            native/g07_wslg_sensor_truth.json
            native/teardown.txt
          retention-days: 14
          if-no-files-found: warn
