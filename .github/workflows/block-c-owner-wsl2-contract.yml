name: AXIA Block C Owner WSL2 final acceptance runner PUBLIC CONTRACT
on:
  push:
    branches: ['main', 'feat/block-c-owner-acceptance-*']
    paths:
      - 'block_c/scripts/axia_block_c_owner_final_once.sh'
      - 'block_c/tests/test_owner_wsl2_acceptance_contract.py'
      - 'docs/AXIA_BLOCK_C_OWNER_FINAL_ACCEPTANCE_20261116_KO.md'
      - '.github/workflows/block-c-owner-wsl2-contract.yml'
  pull_request:
    paths:
      - 'block_c/scripts/axia_block_c_owner_final_once.sh'
      - 'block_c/tests/test_owner_wsl2_acceptance_contract.py'
      - 'docs/AXIA_BLOCK_C_OWNER_FINAL_ACCEPTANCE_20261116_KO.md'
      - '.github/workflows/block-c-owner-wsl2-contract.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-script-safe-public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - name: RED→GREEN public contract (NO private checkout, no ROS/WSL2 claim)
        shell: bash
        run: |
          set -euo pipefail
          bash -n block_c/scripts/axia_block_c_owner_final_once.sh
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q block_c/tests/test_owner_wsl2_acceptance_contract.py
          bash block_c/scripts/axia_block_c_owner_final_once.sh --self-check
          echo BLOCK_C_OWNER_PUBLIC_SCRIPT_CONTRACT_PASS
          echo BLOCK_C_OWNER_WSL2_NOT_RUN_PRIVATE_SOURCE_NOT_CHECKED
