name: AXIA G07 Task04 owner WSL2 public GUI pregate L0
on:
  push:
    branches: ['fix/g07-task04-owner-wsl2-public-pregate-20261118']
    paths:
      - '.github/workflows/axia-g07-task04-owner-wsl2-pregate-public-l0-20261118.yml'
permissions:
  contents: read
jobs:
  task04-public-owner-wsl2-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Task04 RED owner public GUI stage must never impersonate CI Goal
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s tests -p test_g07_task04_owner_public_wsl2_pregate.py -v
