name: AXIA G07 C32 exact Localization server-stage vs native ACK L0
on:
  push:
    branches: [fix/g07-c32-localization-server-stage-20261117]
    paths:
      - '.github/workflows/axia-g07-c32-localization-server-stage-l0.yml'
      - 'd06/tests/test_g07_c32_localization_native_server_boundary.py'
      - 'd06/diagnostic/g07_c32_localization_stage.py'
permissions:
  contents: read
jobs:
  native-server-stage-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    steps:
      - name: Checkout public diagnostic only (no private answers, ROS or Goal)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout exact Instructor native client RED candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: e2d0ef7f291799bf7dd3e9d09ee9e51d4df36546
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact original response missing vs SIGINT and active server regression
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s d06/tests -p test_g07_c32_localization_native_server_boundary.py -v
          python3 -m py_compile d06/diagnostic/g07_c32_localization_stage.py
          echo AXIA_G07_C32_NATIVE_SERVER_STAGE_NO_FALSE_ACK_L0_PASS_NO_ROS_NO_GOAL
      - name: Sealed native wall-clock client regression (GREEN after implementation)
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = e2d0ef7f291799bf7dd3e9d09ee9e51d4df36546
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_g07_c32_native_request_wall_boundaries.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_native_shutdown_ack_trace.py -v
          echo AXIA_G07_C32_NATIVE_REQUEST_TIME_WINDOW_L0_PASS_NO_GOAL
      - name: Always remove private checkout
        if: always()
        run: rm -rf -- instructor
