name: AXIA G07 Observer First IO Flush Timing L0
on:
  push:
    branches: ['fix/g07-observer-io-first-boundary-ci-20261121']
    paths: ['.github/workflows/axia-g07-observer-io-first-boundary-l0.yml']
permissions: {contents: read}
jobs:
  original-seven-channel-first-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 885f2cdd78f36393ef850987fb6be344accd2412
          path: student
          persist-credentials: false
      - name: Regress original seven-channel 360-378ms and Observer flush timing
        run: |
          set -Eeuo pipefail
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_observer_io_first_boundary.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_task04_mvp_minimal_fix.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_scan_wall_pregoal.py' -v
          echo 'AXIA_G07_OBSERVER_FIRST_IO_TIMING_L0_ONLY_NO_GAZEBO_NO_GOAL'
