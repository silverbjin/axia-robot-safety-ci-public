# RED→GREEN exact Instructor G07 8-CPU WSL2 CM role affinity, no ROS/Goal.
name: AXIA G07 Cycle22 sealed CM exclusive CPU WSL2 L0
on:
  push:
    branches: ['fix/g07-cycle22-cm-exclusive-sixplus-cpu-20261116']
    paths:
      - '.github/workflows/axia-g07-cycle22-cm-exclusive-wsl2-l0.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: axia-g07-cycle22-sealed-no-ros
  cancel-in-progress: false
jobs:
  sealed-no-ros-no-goal:
    runs-on: ubuntu-24.04
    environment: axia-instructor-sealed
    timeout-minutes: 12
    steps:
      - name: Exact Instructor source pinned
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: b0047545b8c097fa1b02986c1ed8000085f7b6a7
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Real Owner 8-CPU topology RED or GREEN (no ROS)
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = b0047545b8c097fa1b02986c1ed8000085f7b6a7
          cd instructor
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle22_wsl2_cm_exclusive_cpu_first_gap_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_field_official_cm_cpu_parity_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_p4_g07_goal_observer_cpu_parity_20261115.py' -v
          bash -n scripts/p2_owner_l3_wsl2.sh
          bash -n scripts/p2_no_goal_smoke_ci.sh
          python3 -m py_compile tools/p2_g07_official_cm_cpu_affinity.py tools/p2_g07_goal_observer_cpu_plan.py
          echo AXIA_G07_CYCLE22_SEALED_8CPU_CM_EXCLUSIVE_L0_PASS_NO_ROS_NO_GOAL_OWNER_NOT_RUN
      - name: Remove sealed instructor source
        if: always()
        run: rm -rf -- instructor
