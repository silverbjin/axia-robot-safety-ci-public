name: AXIA P4 reduced demo one final Owner TTY admission source L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-mvp-final-owner-prepare-l0.yml', 'scripts/axia_p4_mvp_final_owner_once.sh']
permissions:
  contents: read
jobs:
  read-only-final-owner-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exact current CI evidence pinned and strict one-Goal TTY contract
        shell: bash
        run: |
          set -Eeuo pipefail
          script=scripts/axia_p4_mvp_final_owner_once.sh
          bash -n "$script"
          # The Owner TTY path contains Python heredocs unreachable in a
          # headless CI run. Parse their AST before the one-shot can be used.
          python3 - <<'PY'
          import ast,re
          from pathlib import Path
          lines=Path("scripts/axia_p4_mvp_final_owner_once.sh").read_text().splitlines()
          blocks=[]
          for i,line in enumerate(lines):
              if re.search(r"<<'PY'(?:\s|$)",line):
                  block=[]
                  for candidate in lines[i+1:]:
                      if candidate=="PY":
                          break
                      block.append(candidate)
                  else:
                      raise AssertionError("OWNER_PYTHON_HEREDOC_UNTERMINATED")
                  blocks.append("\n".join(block))
          assert len(blocks)>=2,("OWNER_PYTHON_HEREDOC_COUNT",len(blocks))
          for body in blocks:
              ast.parse(body)
          print(f"AXIA_P4_FINAL_OWNER_EMBEDDED_PYTHON_AST_PASS blocks={len(blocks)}")
          PY
          bash "$script" --self-check
          grep -Fq "d3ad8987d7e10208981691a764592fafa1746263" "$script"
          grep -Fq "28a51df564faae518e511eb67fbe2edc5639c9b8" "$script"
          grep -Fq "43665710312" "$script"
          grep -Fq "AXIA_G11_RUN_CUSTODY_REQUIRED=1" "$script"
          grep -Fq -- "--mvp-relocated-obstacle" "$script"
          grep -Fq "YES-P2-G07-GOAL" "$script"
          grep -Fq "AXIA_MVP_DEMO_ACCEPTED=HOLD" "$script"
          grep -Fq "AXIA_P4_OWNER_FIRST_PREGOAL_BOUNDARY_LOCKED_NO_GOAL_RAW" "$script"
          if bash "$script" >"$RUNNER_TEMP/s02_owner_no_tty.log" 2>&1;then
            echo AXIA_P4_OWNER_FALSE_NO_TTY_GOAL_ALLOWED
            exit 3
          fi
          grep -Fq "AXIA_P4_FINAL_OWNER_BLOCKED_CONTROLLING_TTY_REQUIRED_NO_GOAL" "$RUNNER_TEMP/s02_owner_no_tty.log"
          if bash "$script" --admission-check >"$RUNNER_TEMP/g07_admission.log" 2>&1;then
            echo AXIA_P4_OWNER_FALSE_ADMISSION_READY
            exit 3
          fi
          grep -Fq "AXIA_P4_OWNER_ADMISSION_BLOCKED_FIRST_CM_150MS_GUARD_STALE" "$RUNNER_TEMP/g07_admission.log"
          echo AXIA_P4_OWNER_LATEST_CI_FIRST_CM_161MS_SAFETY_HOLD_L0_PASS
          echo AXIA_P4_FINAL_OWNER_NO_TTY_NEGATIVE_L0_PASS
          echo AXIA_P4_FINAL_OWNER_EXECUTOR_PINNED_BUT_GOAL_BLOCKED_OWNER_NOT_RUN
