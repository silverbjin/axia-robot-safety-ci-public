# Official Nav2 Jazzy PlannerServer + rolling obstacle costmap, L1 CI TEST ONLY.
# No Nav2 Navigation Goal, ControllerServer, CollisionMonitor, /cmd_vel, Gazebo or robot motion.
planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 2.0
    planner_plugins: ["GridBased"]
    costmap_update_timeout: 2.0
    GridBased:
      plugin: "nav2_navfn_planner::NavfnPlanner"
      tolerance: 0.0
      use_astar: false
      allow_unknown: false
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      global_frame: map
      robot_base_frame: base_footprint
      rolling_window: true
      track_unknown_space: false
      width: 4
      height: 4
      resolution: 0.05
      update_frequency: 5.0
      publish_frequency: 5.0
      robot_radius: 0.20
      transform_tolerance: 0.5
      plugins: ["obstacle_layer", "inflation_layer"]
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /axia/d07/test/scan
          data_type: "LaserScan"
          marking: true
          clearing: true
          inf_is_valid: true
          obstacle_max_range: 2.5
          raytrace_max_range: 3.0
          obstacle_min_range: 0.0
          raytrace_min_range: 0.0
          max_obstacle_height: 2.0
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.33
        cost_scaling_factor: 3.0
      always_send_full_costmap: true
