name: AXIA G07 G10 Existing D08 Take-complete Actual Jazzy L1
on:
  push:
    branches: ['fix/g07-g50-first-boundary-ci-20261121']
    paths: ['.github/workflows/axia-g07-g10-d08-take-real-l1.yml']
permissions: {contents: read}
jobs:
  two_process_real_rclpy_l1:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
    env:
      ROS_DOMAIN_ID: '97'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: f6b77dd6ab0f3e8427825ffe7c5508afaec7d1ad
          path: student
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 87896a5c5a3e43f3bfc4b07e41f3fd42da16f3ca
          path: d08
          persist-credentials: false
      - name: Actual Jazzy two-process read-only Scan MessageInfo and D08 take hook
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          export PYTHONPATH="$GITHUB_WORKSPACE/student/block_B/day07/h01_runtime/tools:$GITHUB_WORKSPACE/d08/d08/harness${PYTHONPATH:+:$PYTHONPATH}"
          python3 -c "import rclpy; print('AXIA_G07_G10_REAL_JAZZY_RCLPY_IMPORTED_AFTER_SETUP_PASS')"
          cat > /tmp/g07_first_take_l1.py <<'PY_L1'
          from multiprocessing import Process
          from time import monotonic
          import rclpy
          from rclpy.node import Node
          from rclpy.executors import SingleThreadedExecutor, await_or_execute
          from rclpy.exceptions import InvalidHandle
          from rclpy.subscription import Subscription
          from rclpy.qos import qos_profile_sensor_data
          from sensor_msgs.msg import LaserScan
          from rosgraph_msgs.msg import Clock
          from p2_g07_scan_rmw_first_pair import normalize_scan_message_info
          from d08_rcl_take_dispatch_probe import TakeTimeline,build_scan_take_executor

          def publisher():
              rclpy.init()
              n=Node("axia_g07_l1_take_pub_no_goal")
              scan=n.create_publisher(LaserScan,"/scan",10)
              clock=n.create_publisher(Clock,"/clock",10)
              def scan_pub():
                  msg=LaserScan()
                  msg.header.stamp=n.get_clock().now().to_msg()
                  msg.header.frame_id="base_scan"
                  msg.range_min=.12;msg.range_max=3.5
                  msg.angle_min=-3.14159;msg.angle_max=3.14159
                  msg.angle_increment=.01745329
                  msg.ranges=[1.7]*360
                  scan.publish(msg)
              def clock_pub():
                  msg=Clock();msg.clock=n.get_clock().now().to_msg()
                  clock.publish(msg)
              n.create_timer(.1,scan_pub)
              n.create_timer(1/300,clock_pub)
              try:rclpy.spin(n)
              finally:n.destroy_node();rclpy.try_shutdown()

          if __name__=="__main__":
              p=Process(target=publisher,daemon=True);p.start()
              rclpy.init()
              node=Node("axia_g07_l1_take_sub_no_goal")
              timeline=TakeTimeline(limit=1024)
              cls=build_scan_take_executor(SingleThreadedExecutor,
                  InvalidHandle,await_or_execute,Subscription.CallbackType.MessageOnly)
              ex=cls(timeline)
              received=[];clocks=[]
              def scan_cb(msg,info):
                  src,recv,seq=normalize_scan_message_info(info)
                  received.append((monotonic(),src,recv,seq))
              sub=node.create_subscription(LaserScan,"/scan",scan_cb,qos_profile_sensor_data)
              node.create_subscription(Clock,"/clock",lambda msg:clocks.append(monotonic()),qos_profile_sensor_data)
              ex.add_node(node);ex.arm_scan(sub)
              try:
                  deadline=monotonic()+10
                  while monotonic()<deadline and len(received)<35:
                      ex.spin_once(timeout_sec=.04)
                  assert len(received)>=20,("ACTUAL_RMW_SCAN_RECEIVE_MISSING",len(received))
                  assert len(clocks)>=150,("ACTUAL_RMW_CLOCK_RECEIVE_MISSING",len(clocks))
                  assert all(row[1]>0 and row[2]>0 for row in received),("RMW_INFO_MISSING",received[:2])
                  entries=timeline.snapshot()
                  takes=[row for row in entries if row["stage"]=="take_complete"]
                  calls=[row for row in entries if row["stage"]=="callback_dispatch"]
                  assert len(takes)>=20 and len(calls)>=20,(len(takes),len(calls))
                  stamps=set(x["source_stamp_ns"] for x in takes)&set(x["source_stamp_ns"] for x in calls)
                  assert len(stamps)>=20,len(stamps)
                  assert len(set(x["source_stamp_ns"] for x in takes))>=20
                  mx=max((b[0]-a[0] for a,b in zip(received,received[1:])),default=0)*1000
                  print("AXIA_G07_G10_REAL_JAZZY_D08_TAKE_HOOK_L1_PASS "+
                        f"scan={len(received)} clock={len(clocks)} take={len(takes)} callback={len(calls)} "+
                        f"exact_header_join={len(stamps)} callback_gap_max_ms={mx:.3f} "+
                        "GAZEBO_NOT_RUN_GOAL_NOT_SENT_ROOT_UNDETERMINED_OWNER_L3_HOLD",flush=True)
              finally:
                  ex.shutdown(timeout_sec=2);node.destroy_node();rclpy.try_shutdown()
                  p.terminate();p.join(timeout=5)
          PY_L1
          python3 /tmp/g07_first_take_l1.py
