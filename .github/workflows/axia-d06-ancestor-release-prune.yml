name: AXIA D06 legacy Owner ref compare direction safety audit (NO DELETE)
on:
  push:
    branches: ['ops/d04-d08-merged-branch-prune-20261115']
    paths: ['.github/workflows/axia-d06-ancestor-release-prune.yml']
permissions:
  contents: read
jobs:
  prove_newer_observer_unmerged_and_preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Previous RED proved observer is newer, not ancestor; preserve ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, subprocess
          R='silverbjin/axia-robot-safety-ci-public'
          observer='release/d06-g07-observer-owner-20261115'
          pinned='release/d06-g07-owner-g11-pinned-20261115'
          def api(p):
              x=subprocess.run(['gh','api',p],capture_output=True,text=True,timeout=35)
              if x.returncode:raise RuntimeError(x.stderr[:200])
              return json.loads(x.stdout)
          a=api(f'repos/{R}/branches/{observer}')
          b=api(f'repos/{R}/branches/{pinned}')
          assert a['commit']['sha']=='f443fb4d6b246db2024dff225c7b77c97d7f50a9'
          assert b['commit']['sha']=='67b8995cc7fdd506b12f348fc7e5241dcedddc67'
          c=api(f'repos/{R}/compare/{observer}...{pinned}')
          assert c['ahead_by']==0 and c['behind_by']>=2,c
          print('AXIA_D06_OBSERVER_OWNER_HAS_TWO_UNMERGED_COMMITS_PRESERVE')
          print('AXIA_D06_ANCESTRY_DIRECTION_CORRECTED_NO_DELETE')
          PY
