name: AXIA Block C Owner evidence scoped post-acceptance audit (PUBLIC synthetic)
on:
  push:
    branches: ['feat/block-c-owner-final-wsl2-*']
    paths:
      - 'block_c/scripts/axia_block_c_evidence_audit.py'
      - 'block_c/tests/test_owner_evidence_audit.py'
      - '.github/workflows/block-c-owner-evidence-audit.yml'
  pull_request:
    paths:
      - 'block_c/scripts/axia_block_c_evidence_audit.py'
      - 'block_c/tests/test_owner_evidence_audit.py'
      - '.github/workflows/block-c-owner-evidence-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence-scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Synthetic Owner evidence PASS/FAIL boundaries (never private archive)
        shell: bash
        run: |
          set -Eeuo pipefail
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q block_c/tests/test_owner_evidence_audit.py
          echo BLOCK_C_PUBLIC_EVIDENCE_SCOPED_AUDIT_CONTRACT_PASS
          echo BLOCK_C_OWNER_PRIVATE_EVIDENCE_NOT_UPLOADED
          echo BLOCK_C_OWNER_WSL2_NOT_RUN_BY_THIS_CI
