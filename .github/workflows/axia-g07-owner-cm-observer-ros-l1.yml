name: AXIA G07 Owner CM Observer actual ROS Jazzy scheduling L1
on:
  push:
    branches: ['fix/g07-owner-1ibycgpg-cm120-firstclock-20261121']
    paths: ['.github/workflows/axia-g07-owner-cm-observer-ros-l1.yml']
permissions: {contents: read}
jobs:
  callback-queue-ab-synthetic-no-goal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
    env:
      ROS_DOMAIN_ID: '91'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      FASTDDS_BUILTIN_TRANSPORTS: UDPv4
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 734231a1b6b65d5ee34639f7c4cc2c68a537ef66
          path: student
          persist-credentials: false
      - name: No actual robot, real rclpy two-worker forced stall A/B
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_cm_observer_group_isolation.py' -v
          timeout 60s python3 tools/g07_cm_observer_groups_ros_l1.py
          echo 'AXIA_G07_CM120_ROS_JAZZY_L1_SYNTHETIC_PASS_NOT_WSL2_OR_GAZEBO'
