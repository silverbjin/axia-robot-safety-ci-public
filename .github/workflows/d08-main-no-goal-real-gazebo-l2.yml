name: D08 main public real Gazebo near/restore + exact C++ yolo_ros replay (NO GOAL)
on:
  push:
    branches: ['main','release/d08-public-no-goal-ci-main-20261115']
    paths:
      - 'd08/**'
      - '.github/workflows/d08-main-no-goal-real-gazebo-l2.yml'
  pull_request:
    paths:
      - 'd08/**'
      - '.github/workflows/d08-main-no-goal-real-gazebo-l2.yml'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: d08-main-public-no-goal-${{ github.ref }}
  cancel-in-progress: true
env:
  AXIA_D08_EXACT_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  l0-human-proxy-red-green:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Minimal original D08 public source and no-Goal regressions
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.3.5
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q \
            d08/tests/test_d08_main_public_only_contract.py \
            d08/tests/test_d08_unified_runtime_provenance.py \
            d08/tests/test_d08_public_person_range.py \
            d08/tests/test_d08_scan_gap_trace.py \
            d08/tests/test_d08_field_first_518ms_receive_boundary.py \
            d08/tests/test_d08_native_gazebo_scan_causal_trace.py \
            d08/tests/test_d08_native_clock_first_gap_layer.py \
            d08/tests/test_d08_ros_isolated_process_first_gap.py \
            d08/tests/test_d08_worst_scan_pair_process_alignment.py \
            d08/tests/test_d08_scan_gap_blocking_span_contract.py \
            d08/tests/test_d08_probes_armed_before_scan_observer.py \
            d08/tests/test_d08_observer_executor_ab_contract.py \
            d08/tests/test_d08_native_probe_apt_contract.py \
            d08/tests/test_d08_independent_clock_evidence_history.py \
            d08/tests/test_d08_yolo_archive_gate.py \
            d08/tests/test_d08_official_ort_nuget.py \
            d08/tests/test_d08_one_world_official_nav2_launch.py \
            d08/tests/test_d08_workflow_python_heredoc.py \
            d08/tests/test_d08_yolo_first_boundary.py \
            d08/tests/test_d08_amcl_initial_pose.py \
            d08/tests/test_d08_job_independence.py \
            d08/tests/test_d08_same_world_replan.py \
            d08/tests/test_d08_amcl_tf_subscription_order.py \
            d08/tests/test_d08_static_amcl_witness.py \
            d08/tests/test_d08_owner_first_scan_odom_gap_regression.py \
            d08/tests/test_d08_amcl_service_discovery_starvation.py \
            d08/tests/test_d08_owner_ci_field_boundaries.py \
            d08/tests/test_d08_owner_blank_scene_and_compact.py \
            d08/tests/test_d08_owner_temp_world_startup_order.py \
            d08/tests/test_d08_live_person_range.py \
            d08/tests/test_d08_live_person_range_session.py \
            d08/tests/test_d08_roi_physical_trace.py \
            d08/tests/test_d08_live_same_world_wiring.py \
            d08/tests/test_d08_ci_single_world_priority.py \
            d08/tests/test_d08_owner_gui_runner_contract.py \
            d08/tests/test_d08_task04_native_path_and_rviz.py \
            d08/tests/test_d08_task04_exact_sha_and_failclosed.py \
            d08/tests/test_d08_official_cm_native_readonly.py \
            d08/tests/test_d08_collocated_human_proxy.py \
            d08/tests/test_d08_g07_lidar_visible_proxy.py \
            d08/tests/test_d08_rgbd_alignment_evidence.py \
            d08/tests/test_d08_live_public_harness.py
          python -m compileall -q d08/harness/d08_live_world.py \
            d08/harness/d08_amcl_initial_pose.py \
            d08/harness/d08_same_world_replan.py \
            d08/harness/d08_live_person_range.py \
            d08/scripts/d08_public_gazebo_l2.py \
            d08/scripts/d08_actual_rgb_onnx_probe.py \
            d08/scripts/d08_ui9_yolo_replay_probe.py
          bash -n d08/scripts/d08_owner_no_goal_bootstrap.sh
          bash d08/scripts/d08_owner_no_goal_bootstrap.sh --self-check
          echo D08_PUBLIC_MAIN_NO_GOAL_L0_PASS
  gazebo-contact-positive-once:
    needs: l0-human-proxy-red-green
    if: github.head_ref != 'fix/d08-first-scan-gap-boundary-20261119' && github.head_ref != 'fix/d08-native-scan-first-gap-20261119' && github.head_ref != 'fix/d08-scan-independent-ros-process-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
      MAKEFLAGS: -j2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install official Waffle/Gazebo RGBD (no modified ROS or Nav2)
        shell: bash
        run: |
          set -euo pipefail
          # Actual #43053264733: apt-get update returned 0 despite
          # archive.ubuntu.com/security.ubuntu.com DNS errors, then
          # 'python3-venv has no installation candidate' obscured cause.
          # Treat missing APT indices as INFRA BLOCKED, never Gazebo failed.
          if ! apt-get update -qq \
               -o APT::Update::Error-Mode=any \
               -o Acquire::Retries=1; then
            echo 'D08_CI_APT_REPOSITORY_UNREACHABLE: network/DNS prerequisite failed before ROS/Gazebo L2' >&2
            exit 2
          fi
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates python3-yaml \
            ros-jazzy-nav2-minimal-tb3-sim ros-jazzy-turtlebot3-gazebo \
            ros-jazzy-ros-gz ros-jazzy-xacro ros-jazzy-rclpy \
            ros-jazzy-nav2-collision-monitor ros-jazzy-nav2-bringup \
            ros-jazzy-navigation2 \
            ros-jazzy-sensor-msgs libgl1-mesa-dri libglx-mesa0 \
            python3-numpy python3-venv xvfb xauth
      - name: Validate the existing D04 human COLLADA asset SHA
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axia-d08-assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 100 \
            -o /tmp/axia-d08-assets/walk.dae \
            'https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae'
          echo '49af0df3a319d1cb8ca2cebf02dbd00f625e5d5bec820bc5e109925b18b65c6e  /tmp/axia-d08-assets/walk.dae' | sha256sum -c -
      - name: Real Gazebo grounded human RGBD and native LiDAR set_pose
        shell: bash
        run: |
          set -eo pipefail
          # ROS 2 setup.bash reads optional env vars, so do not enable nounset.
          source /opt/ros/jazzy/setup.bash
          python3 -u d08/scripts/d08_public_gazebo_l2.py \
            --actor /tmp/axia-d08-assets/walk.dae \
            --out results/d08-human-contact-calibration \
            --lidar-pre-goal --cm-cadence-l1
          python3 - <<'PY'
          import json
          from pathlib import Path
          root=Path('results/d08-human-contact-calibration')
          v=json.loads((root/'verdict.json').read_text())
          assert v['status']=='D08_REAL_GAZEBO_WAFFLE_RGBD_NO_GOAL_PASS'
          # Owner 1XZYehm8: old upstream intel depth + new 640x480 RGBD
          # rendered concurrently under WSLg. Assert REAL official Waffle
          # copied model has only D08 camera, without changing /opt/ros.
          assert v['overlay_manifest']['d08_unused_upstream_depth_sensor_removed'] is True
          import xml.etree.ElementTree as ET
          robot=ET.parse(v['overlay_manifest']['robot_sdf']).getroot()
          assert robot.find(".//sensor[@name='intel_realsense_r200_depth']") is None
          assert robot.find(".//sensor[@name='axia_d08_registered_rgbd']") is not None
          assert robot.find(".//sensor[@name='hls_lfcd_lds']/update_rate").text=='10'
          print('D08_REAL_GAZEBO_SINGLE_RGBD_GPU_LOAD_L2_PASS')
          assert v['actual_rgbd']['matched'] is True
          assert v['contact_topic_proven'] is True
          assert v['pregoal_lidar']['status']=='PASS_ACTUAL_GAZEBO_SET_POSE_PLUS_LIDAR'
          assert v['pregoal_lidar']['slowzone_actual_rgbd']['matched'] is True, v
          stop=v['pregoal_lidar']['stop_probe']
          assert stop['status']=='PASS_REAL_STATIC_GAZEBO_STOPZONE_SCAN'
          assert stop['candidate_dispatch_m']==.30
          assert .14<=stop['actual_stop_front_m']<=.37,stop
          assert stop['native_set_pose_ack'] is True
          assert stop['actual_robot_moved'] is False
          # Actual 640x480 registered RGBD AFTER stop set_pose at ~0.35m.
          # Catch the old Owner pants-only screenshot on real Gazebo pixels.
          assert v['actual_stop_rgbd']['matched'] is True,v
          assert v['actual_stop_visual']['status']=='VISUAL_FRAMING_CANDIDATE',v
          assert v['actual_stop_visual']['sampled_head_skin_pixels']>=50,v
          assert v['actual_stop_visual']['sampled_shirt_green_pixels']>=150,v
          assert v['actual_stop_visual']['sampled_navy_pants_pixels']>=150,v
          assert v['actual_stop_visual']['yolo_person_detection_verified'] is False
          print('D08_REAL_GAZEBO_STOPZONE_RGBD_FULLBODY_FRAMING_L2_PASS')
          assert stop['owner_goal_sent'] is False
          assert stop['collision_ground_truth'] is False
          print('D08_REAL_GAZEBO_STATIC_STOPZONE_DISTANCE_L2_PASS')
          # UI9 Owner fail at 1.35m: verify REAL Gazebo contact/human
          # near-to-original restoration on native set_pose ACK + /scan.
          ui9=v['ui9_reversible_pose']
          assert ui9['status']=='PASS_ACTUAL_GAZEBO_UI9_NEAR_AND_RESTORE_NO_GOAL',ui9
          assert ui9['near_world_xyz_m']==[-1.63,-.5,.24],ui9
          assert ui9['far_world_xyz_m']==[-.58,-.5,.24],ui9
          assert ui9['near_native_ack'] and ui9['far_native_ack'],ui9
          assert ui9['near_actual_registered_rgbd']['matched'] is True,ui9
          assert .14<=ui9['near_actual_scan']['front_m']<.4,ui9
          assert ui9['far_actual_scan']['front_m']>.75,ui9
          for key in ('near_actual_scan','far_actual_scan'):
              assert ui9[key]['scan_count']>=20,ui9
              assert ui9[key]['wall_gap_max_sec']<.5,ui9
              assert ui9[key]['no_synthetic_scan'] is True,ui9
          assert ui9['goal_sent'] is False and ui9['robot_moved'] is False
          assert ui9['private_d05_verified'] is False
          assert ui9['safety_ttl_modified'] is False
          print('D08_UI9_REAL_GAZEBO_NEAR_RESTORE_L2_PASS')
          # Owner AxvMA7TI: real /scan wall callback gaps reached 0.55s
          # despite valid simulated sensor stamps. Monitor ACTUAL wall-time.
          for phase in ('before','after'):
              m=v['pregoal_lidar'][phase]
              assert m['scan_count']>=20
              assert m['wallclock_measured'] is True
              assert m['wall_gap_max_sec'] < .5, (phase, m)
              assert m['sim_stamp_period_median_sec'] <= .13, (phase, m)
          print('D08_REAL_WALLCLOCK_SCAN_WATCHDOG_MARGIN_L2_PASS')
          cm=v['cm_cadence_l1']
          assert cm['status']=='REAL_NAV2_CM_L1_CADENCE_PASS',cm
          assert cm['cm_lifecycle_finalized_before_signal'] is True,cm
          assert cm['cm_exit_code']==0,cm
          assert cm['cm_sigsegv_observed'] is False,cm
          print('D08_REAL_NAV2_CM_ORDERED_LIFECYCLE_EXIT_ZERO_L2_PASS')
          assert cm['synthetic_scan'] is True
          assert cm['no_goal'] is True
          assert cm['cmd_vel_robot_published'] is False
          assert cm['private_guard_executed'] is False
          assert cm['callback_wall_max_sec']<.15
          assert cm['scan_qos_discovery_verified'] is True
          assert cm['warmup_output_count']>=10
          assert cm['output_count']>=74 and cm['input_count']==82,cm
          assert cm['steady_delivery_ratio']>=.90,cm
          # Owner ODDlcnNN: original test measured CM AFTER physical set_pose.
          # This probe now mutates actual Gazebo while official CM is sending.
          assert cm['gazebo_set_pose_during_cm'] is True,cm
          assert cm['gazebo_concurrent_service_ack'] is True,cm
          assert cm['cm_max_gap_during_gazebo_service_sec']<.15,cm
          assert cm['stop_scan_is_synthetic_replay_of_real_gazebo_front'] is True
          assert cm['measured_static_stop_front_replayed_m']<=.37
          assert cm['stop_output_samples']>=15
          # Owner l0KClvT6: after a genuine StopZone zero, continued
          # 20Hz Supervisor input does not ensure CM keeps sending zero.
          # Official Jazzy stop_pub_timeout=1s then ends output; Guard
          # must fail-close at its UNCHANGED 150ms input TTL.
          assert cm['post_stop_supervised_input_count']==100,cm
          assert cm['post_stop_supervised_input_elapsed_sec']>=4.7,cm
          assert cm['post_stop_native_cm_stop_pub_timeout_sec']==1.0,cm
          assert cm['post_stop_guard_cm_ttl_sec_unchanged']==.15,cm
          assert cm['post_stop_last_cm_output_age_sec']>.15,cm
          assert cm['post_stop_guard_fail_closed_required'] is True,cm
          print('D08_REAL_CM_POST_STOP_ZERO_TIMEOUT_5S_FAIL_CLOSED_L2_PASS')
          assert cm['stop_zero_output_samples']>=15
          print('D08_REAL_GAZEBO_SERVICE_DURING_NATIVE_CM_150MS_L2_PASS')
          print('D08_REAL_MEASURED_STOP_FRONT_OFFICIAL_CM_REPLAY_ZERO_L2_PASS')
          assert cm['output_speed_nonzero_count']>=20
          print('D08_REAL_GAZEBO_CONCURRENT_CM_L1_PASS_NO_GOAL')
          assert v['pregoal_lidar']['after']['front_m'] > 0.4
          assert v['pregoal_lidar']['after']['front_m'] < 0.75
          # Positive contact calibration already proven independently
          # in public CI #42831813671; avoid a second calibration.
          assert v['collision_ground_truth'] is False
          assert v['goal_sent'] is False and v['cmd_vel_published'] is False
          print('D08_G07_NO_GOAL_REAL_LIDAR_MOVE_L2_PASS')
          print('D08_G07_ROBOT_NO_COLLISION_NOT_CLAIMED')
          PY
          # This asserts real camera *framing* only, not YOLO inference.
          python3 d08/harness/d08_visible_person_frame.py \
            results/d08-human-contact-calibration/real_gazebo_rgb.ppm
      - name: BgYnTVv7 real Gazebo RGB -> exact pinned ONNX person class (NO GOAL)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv /tmp/axia_d08_onnx_venv
          /tmp/axia_d08_onnx_venv/bin/pip install -q --disable-pip-version-check \
            'onnxruntime==1.20.1' 'numpy==1.26.4' 'pillow==11.1.0'
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 160 \
            -o /tmp/axia-d08-assets/yolo26n.onnx \
            'https://huggingface.co/unileon-robotics/YOLO26-ONNX/resolve/main/yolo26n.onnx'
          echo '4f44c33cea12d4b5785e5e7c0a20c13d0c62a77de607ce96a40d6036c7d7bbcf  /tmp/axia-d08-assets/yolo26n.onnx' | sha256sum -c -
          source /tmp/axia_d08_onnx_venv/bin/activate
          # No synthetic frame: these PPM files came from the earlier real
          # Gazebo/Jazzy ROS Image callbacks in THIS job. Pre-Goal person class
          # must be positive; RGB pixel counts alone are insufficient.
          python3 d08/scripts/d08_actual_rgb_onnx_probe.py \
            --frame results/d08-human-contact-calibration/real_gazebo_slowzone_rgb.ppm \
            --stop-frame results/d08-human-contact-calibration/real_gazebo_stop_rgb.ppm \
            --model /tmp/axia-d08-assets/yolo26n.onnx \
            --report results/d08-human-contact-calibration/onnx_real_frame_verdict.json \
            | tee /tmp/d08_bgyntv7_real_onnx.log
          # New UI9 pre-Goal near frame MUST independently classify as
          # person on exact pinned model, not just reused old Stop image.
          python3 d08/scripts/d08_actual_rgb_onnx_probe.py \
            --frame results/d08-human-contact-calibration/real_gazebo_ui9_near_rgb.ppm \
            --stop-frame results/d08-human-contact-calibration/real_gazebo_stop_rgb.ppm \
            --model /tmp/axia-d08-assets/yolo26n.onnx \
            --report results/d08-human-contact-calibration/onnx_ui9_near_real_frame_verdict.json \
            | tee /tmp/d08_ui9_near_real_onnx.log
          grep -F 'D08_ACTUAL_ONNX_PERSON_FRAME_L2_PASS' /tmp/d08_ui9_near_real_onnx.log
          echo 'D08_UI9_NEAR_ACTUAL_RGB_ONNX_PERSON_L2_PASS'
          grep -F 'D08_ACTUAL_ONNX_PERSON_FRAME_L2_PASS' /tmp/d08_bgyntv7_real_onnx.log
          ( cd results/d08-human-contact-calibration
            sha256sum onnx_real_frame_verdict.json onnx_ui9_near_real_frame_verdict.json >> SHA256SUMS )
      - name: Remove external mesh (not part of artifact)
        if: always()
        run: rm -f /tmp/axia-d08-assets/walk.dae
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d08-main-real-no-goal-evidence
          path: |
            results/d08-human-contact-calibration/
          retention-days: 7
          if-no-files-found: warn

  gazebo-official-nav2-oneworld:
    needs: l0-human-proxy-red-green
    # Owner 2026-11-18 raw first /scan 819ms /odom 752ms gap: previously
    # skipped Nav2/AMCL here even while the overall public workflow was GREEN.
    # On this exact PR, one real official Nav2 same-world job is REQUIRED.
    # Other branches retain their existing manual diagnostic scope.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && (github.head_ref == 'feat/d08-unified-sensor-cm-path-20261118' || github.head_ref == 'fix/d08-first-scan-gap-boundary-20261119' || github.head_ref == 'fix/d08-native-scan-first-gap-20261119' || github.head_ref == 'fix/d08-scan-independent-ros-process-20261119'))
    runs-on: ubuntu-24.04
    timeout-minutes: 22
    container:
      image: ros:jazzy-ros-base-noble
    env:
      DEBIAN_FRONTEND: noninteractive
      MAKEFLAGS: -j2
      AXIA_D08_CI_REAL_SUBSCRIBER_PAUSE_SEC: "0.65"
      # CI-only two-second readiness-decision delay while real ROS sensor
      # subscriptions/TF continue; this does NOT pause Gazebo publishers.
      AXIA_D08_CI_AMCL_SERVICE_READY_DELAY_SEC: "2.0"
      AXIA_D08_NATIVE_RX_PROBE: ${{ (github.head_ref == 'fix/d08-native-scan-first-gap-20261119' || github.head_ref == 'fix/d08-scan-independent-ros-process-20261119') && '1' || '0' }}
      AXIA_D08_ROS_ISOLATED_RX_PROBE: ${{ github.head_ref == 'fix/d08-scan-independent-ros-process-20261119' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install official Nav2 Gazebo Harmonic Waffle (NO Goal)
        shell: bash
        run: |
          set -euo pipefail
          if ! apt-get update -qq -o APT::Update::Error-Mode=any -o Acquire::Retries=1;then
            echo 'D08_NAV2_ONEWORLD_CI_APT_INFRA_BLOCKED'
            exit 2
          fi
          apt-get install -y -qq --no-install-recommends \
            git curl ca-certificates python3-yaml python3-numpy \
            ros-jazzy-nav2-minimal-tb3-sim ros-jazzy-turtlebot3-gazebo \
            ros-jazzy-ros-gz ros-jazzy-xacro ros-jazzy-rclpy \
            ros-jazzy-nav2-collision-monitor ros-jazzy-nav2-bringup \
            ros-jazzy-navigation2 ros-jazzy-sensor-msgs \
            libgl1-mesa-dri libglx-mesa0 xvfb xauth
          if [ "$AXIA_D08_NATIVE_RX_PROBE" = "1" ]; then
            # Only this CI diagnostic image needs native Python bindings.
            # Official Gazebo Harmonic Noble binaries: signed OSRF repository.
            # Do NOT install the gz-harmonic meta-package or upgrade the
            # already-pinned ROS Jazzy/Gazebo libraries for this probe.
            curl -fLsS --retry 2 --connect-timeout 15 --max-time 60 \
              https://packages.osrfoundation.org/gazebo.gpg \
              -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
            test -s /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable noble main" \
              > /etc/apt/sources.list.d/axia-gazebo-stable.list
            apt-get update -qq -o APT::Update::Error-Mode=any -o Acquire::Retries=1
            apt-get install -y -qq --no-install-recommends --no-upgrade \
              python3-gz-transport13 python3-gz-msgs10
            /usr/bin/python3 -c 'from gz.transport13 import Node; from gz.msgs10.laserscan_pb2 import LaserScan; from gz.msgs10.clock_pb2 import Clock; print("D08_NATIVE_PYTHON_APT_IMPORT_L2_PASS")'
          fi
      - name: Validate fixed SHA public human visual geometry
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axia-d08-nav2-assets
          curl --fail --location --retry 3 --connect-timeout 15 --max-time 100 \
            'https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae' \
            -o /tmp/axia-d08-nav2-assets/walk.dae
          echo '49af0df3a319d1cb8ca2cebf02dbd00f625e5d5bec820bc5e109925b18b65c6e  /tmp/axia-d08-nav2-assets/walk.dae' | sha256sum -c -
      - name: RED reproduce actual Gazebo 255 on not-yet-generated Nav2 temp SDF
        shell: bash
        run: |
          set -eo pipefail
          # ROS setup uses optional unbound vars; never source under set -u.
          source /opt/ros/jazzy/setup.bash
          python3 - <<'PY'
          import json,os,subprocess,tempfile
          from pathlib import Path
          root=Path('results/d08-startup-red');root.mkdir(parents=True,exist_ok=True)
          with tempfile.TemporaryDirectory(prefix='d08_nav2_red_') as d:
              missing=Path(d)/'nav2_xacro_not_written_yet.sdf'
              assert not missing.exists()
              env=os.environ.copy();env['GZ_PARTITION']='axia_d08_red_'+str(os.getpid())
