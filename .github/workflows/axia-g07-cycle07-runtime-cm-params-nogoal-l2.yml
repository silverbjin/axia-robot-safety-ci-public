name: AXIA G07 Cycle07 installed CM YAML vs live runtime NO_GOAL L2
on:
  push:
    branches: ['release/p2-g06-cm-ttl-20261110']
    paths: ['.github/workflows/axia-g07-cycle07-runtime-cm-params-nogoal-l2.yml']
permissions:
  contents: read
jobs:
  actual-no-goal-cm-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Exact protected Instructor Cycle07 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 493aeae195d0c62331da0ca150b6ae518638156f
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Immutable previous Cycle06 Instructor baseline
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 67664552d9283d24db25fadb329733f83dc27878
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: baseline
          persist-credentials: false
      - name: TDD RED old live-provenance contract missing then GREEN3 pure NO_GOAL
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '493aeae195d0c62331da0ca150b6ae518638156f'
          test "$(git -C baseline -c safe.directory="$PWD/baseline" rev-parse HEAD)" = '67664552d9283d24db25fadb329733f83dc27878'
          cp tests/unit/test_g07_cycle07_cm_source_timeout_runtime.py baseline/tests/unit/
          if (cd baseline && PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
               -s tests/unit -p 'test_g07_cycle07_cm_source_timeout_runtime.py' -v) \
               > /tmp/axia_c07_red.log 2>&1;then
            echo AXIA_G07_C07_OLD_BASELINE_UNEXPECTED_GREEN >&2;exit 3
          fi
          grep -Fq "No module named 'p4_g07_cm_param_contract'" /tmp/axia_c07_red.log || {
            cat /tmp/axia_c07_red.log
            echo AXIA_G07_C07_EXPECTED_FIRST_RED_DRIFT >&2;exit 3
          }
          echo AXIA_G07_C07_RED_MISSING_LIVE_CM_PARAM_PROVENANCE_ANALYZER
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
               -s tests/unit -p 'test_g07_cycle07_cm_source_timeout_runtime.py' -v
          python3 -m py_compile tools/p4_g07_cm_param_contract.py
          bash -n scripts/p2_no_goal_smoke_ci.sh
          echo AXIA_G07_C07_L0_GREEN3_NO_ROS_NO_GOAL
      - name: Actual installed Nav2 YAML and live official CM readback with Gazebo no Goal
        shell: bash
        env:
          ROS_DOMAIN_ID: '88'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_p4_shared_88
          AXIA_P0_SIM_ONLY: '1'
          AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
          AXIA_P2_G07_OWNER_PARITY_CHECK: '1'
          AXIA_G07_OWNER_STARTUP_PARITY: '1'
          AXIA_G07_CI_OWNER_BAG_PARITY: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '0'
          AXIA_G07_SHUTDOWN_L2_ONLY: '1'
          AXIA_P4_G07_SHARED_PREFLIGHT_ONLY: '1'
          AXIA_G07_C07_CM_PARAM_READBACK_NO_GOAL: '1'
          AXIA_G07_C06_SIMPLE_TF_SIM: '0'
          AXIA_P2_SMOKE_RESULTS: results/p4-g07-cycle07-cm-params-nogoal
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          set +e
          timeout --signal=TERM --kill-after=10s 650s \
            bash scripts/p2_no_goal_smoke_ci.sh >"$RUNNER_TEMP/g07_c07_nogoal.log" 2>&1
          rc=$?
          set -e
          grep -F 'AXIA_G07_C07_ORIGINAL_CM_RUNTIME_PARAM_PROVENANCE' "$RUNNER_TEMP/g07_c07_nogoal.log" || true
          python3 - "$rc" <<'PY'
          import json,sys
          from pathlib import Path
          root=Path("results/p4-g07-cycle07-cm-params-nogoal")
          result=root/"g07_c07_cm_param_contract.json"
          if not result.is_file():
              print("AXIA_G07_C07_FIRST_REAL_PARAM_READBACK_MISSING_HOLD")
              raise SystemExit(3)
          x=json.loads(result.read_text())
          start=json.loads((root/"startup_verdict.json").read_text())
          finish=json.loads((root/"g07_ordered_shutdown.json").read_text())
          print("AXIA_G07_C07_INSTALLED_SOURCE_VS_LIVE_CM_RESULT "+json.dumps({
            "source_timeout_sec":x.get("source_timeout_sec"),
            "transform_tolerance_sec":x.get("transform_tolerance_sec"),
            "base_shift_correction":x.get("base_shift_correction"),
            "source_sha256":x.get("official_nav2_installed_source_sha256"),
            "provenance_status":x.get("status"),
            "startup_status":start.get("status"),"goal_sent":start.get("goal_sent"),
            "shutdown_status":finish.get("status"),"rc":int(sys.argv[1])},sort_keys=True))
          assert x.get("status")=="ORIGINAL_CM_RUNTIME_PARAMS_MATCH_NO_GOAL"
          assert start.get("status")=="SMOKE_READY" and start.get("goal_sent") is False
          assert finish.get("status")=="NAV2_LIFECYCLE_SHUTDOWN_ACK"
          assert int(sys.argv[1])==0
          PY
          echo AXIA_G07_C07_REAL_NO_GOAL_INSTALLED_CM_PARAM_PROVENANCE_L2_PASS
          echo AXIA_MVP_DEMO_ACCEPTED=HOLD CERTIFIED_ESTOP=false
      - name: Always erase sealed private sources and raw runtime evidence
        if: always()
        shell: bash
        run: |
          rm -rf -- baseline .git docs tools tests configs scripts ros2_ws results \
            "$RUNNER_TEMP/g07_c07_nogoal.log" /tmp/axia_c07_red.log
