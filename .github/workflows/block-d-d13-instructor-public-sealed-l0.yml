name: AXIA D13 Public-Only Instructor Sealed L0
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/block-d-d13-instructor-public-sealed-l0.yml'
      - 'tests/test_instructor_public_ci_policy_l0.py'
      - 'docs/operations/AXIA_INSTRUCTOR_PUBLIC_CI_ONLY_POLICY_20261121_KO.md'
  push:
    branches:
      - policy/public-sealed-instructor-ci-20261121
      - release/p2-g06-cm-ttl-20261110
      - main
    paths:
      - '.github/workflows/block-d-d13-instructor-public-sealed-l0.yml'
      - 'tests/test_instructor_public_ci_policy_l0.py'
      - 'docs/operations/AXIA_INSTRUCTOR_PUBLIC_CI_ONLY_POLICY_20261121_KO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-policy-student-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    steps:
      - name: Checkout Public CI contract
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Public-only source pins, secret isolation and no-ROS policy
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_instructor_public_ci_policy_l0.py' -v
          echo 'INSTRUCTOR_PUBLIC_ONLY_POLICY_CONTRACT_PASS'
      - name: Checkout exact released Student main (public only)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: f1e69d72201bcb81478a9aac615cdb9d169821f7
          path: student
          persist-credentials: false
      - name: D13 Student release doc contract and exactly two intentional TODO REDs
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = 'f1e69d72201bcb81478a9aac615cdb9d169821f7'
          python3 -m unittest discover -s student/block_D/tests -p test_d13_guide_contract.py -v
          set +e
          (cd student && python3 -m unittest discover -s block_D/day13/tests -p 'test_*.py' -v) > "$RUNNER_TEMP/d13_expected_red.log" 2>&1
          test_rc=$?
          set -e
          test "$test_rc" -eq 1
          grep -q 'Ran 10 tests' "$RUNNER_TEMP/d13_expected_red.log"
          grep -q 'FAILED (failures=2)' "$RUNNER_TEMP/d13_expected_red.log"
          set +e
          python3 student/block_D/day13/run_lab.py --out "$RUNNER_TEMP/d13_public" > "$RUNNER_TEMP/d13_runner.log" 2>&1
          run_rc=$?
          set -e
          test "$run_rc" -eq 2
          grep -q 'D13_STUDENT_RESULT=RED_EXPECTED_TODO' "$RUNNER_TEMP/d13_runner.log"
          python3 - "$RUNNER_TEMP/d13_public/d13_results.json" <<'PY'
          import json,sys
          x=json.load(open(sys.argv[1],encoding="utf-8"))
          assert len(x["cases"])==8
          assert sum(bool(z["pass"]) for z in x["cases"])==6
          assert {z["id"] for z in x["cases"] if not z["pass"]} == {
              "P_same_time_overlap","N_same_route_different_time"}
          assert x["scope"]=="OFFLINE_SYNTHETIC_L0_NOT_ROS"
          PY
          echo 'PUBLIC_D13_STUDENT_3_DOC_TESTS_10_CASE_TESTS_8_FIXTURES_PASS_INTENTIONAL_RED_2'
          echo 'PUBLIC_ONLY_NO_ROS_GAZEBO_GOAL'
      - name: Remove Student checkout and temporary logs
        if: always()
        shell: bash
        run: |
          rm -rf -- student
          rm -f -- "$RUNNER_TEMP/d13_expected_red.log" "$RUNNER_TEMP/d13_runner.log"
          rm -rf -- "$RUNNER_TEMP/d13_public"

  protected-instructor-l0:
    # No private secret on pull_request or untrusted branch. Protect this environment.
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/p2-g06-cm-ttl-20261110'
    environment: axia-instructor-sealed
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Checkout exact private Instructor release candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: c833d001804aa8522ee8d6e5a45d002d7e9c92df
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Verify original sealed G09 and D13 Instructor docs without publishing raw traces
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = 'c833d001804aa8522ee8d6e5a45d002d7e9c92df'
          test "$(git -C instructor hash-object training/block_D/day13/solution/p3_oracles.py)" = '85dd0fa35b2e7982b0c86020fdd4f4952e6a039f'
          if [ -d instructor/.github/workflows ]; then
            test -z "$(find instructor/.github/workflows -maxdepth 1 -type f -name '*.yml' -print)"
          fi
          set +e
          (cd instructor && python3 -m unittest discover -s training/block_D/day13/tests -p 'test_*.py' -v) > "$RUNNER_TEMP/private_d13_ref.log" 2>&1
          rc_ref=$?
          (cd instructor && python3 -m unittest discover -s training/block_D/tests -p test_d13_guide_contract.py -v) > "$RUNNER_TEMP/private_d13_docs.log" 2>&1
          rc_docs=$?
          set -e
          if [ "$rc_ref" -ne 0 ] || [ "$rc_docs" -ne 0 ] ||
             ! grep -q 'Ran 8 tests' "$RUNNER_TEMP/private_d13_ref.log" ||
             ! grep -q 'Ran 3 tests' "$RUNNER_TEMP/private_d13_docs.log" ||
             ! grep -qE '^OK$' "$RUNNER_TEMP/private_d13_ref.log" ||
             ! grep -qE '^OK$' "$RUNNER_TEMP/private_d13_docs.log"; then
            echo 'PRIVATE_D13_L0_HOLD (private diagnostics not published)'
            exit 1
          fi
          echo 'PRIVATE_D13_L0_PASS instructor_sha=c833d001804aa8522ee8d6e5a45d002d7e9c92df reference=8 docs=3'
          echo 'NO_ROS_GAZEBO_GOAL_NO_PRIVATE_ANSWER_EXPORT'
      - name: Destroy all private source and logs
        if: always()
        shell: bash
        run: |
          rm -rf -- instructor
          rm -f -- "$RUNNER_TEMP/private_d13_ref.log" "$RUNNER_TEMP/private_d13_docs.log"
