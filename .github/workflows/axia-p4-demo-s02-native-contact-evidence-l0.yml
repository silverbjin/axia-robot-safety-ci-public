name: AXIA P4 S02 Harmonic native Contact evidence L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-demo-s02-native-contact-evidence-l0.yml']
permissions:
  contents: read
jobs:
  source-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Exact sealed Instructor checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 9c24bb17e7842110f34b91a2990b21571a363ae5
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: S02 native Contact RED/GREEN no ROS or Gazebo
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 9c24bb17e7842110f34b91a2990b21571a363ae5
          python3 -m unittest discover -s tests/unit -p test_p4_demo_s02_native_contact_evidence.py -v
          python3 -m unittest discover -s tests/unit -p test_p4_s02_physics_frame_contract.py -v
          python3 -m unittest discover -s tests/unit -p test_p4_s02_ecm_plugin_contract.py -v
          python3 -m unittest discover -s tests/unit -p test_p4_demo_acceptance_profile.py -v
          python3 tools/p4_demo_acceptance.py --verify-current --require-ready && {
            echo 'AXIA_S02_FALSE_PROFILE_READY'; exit 2;
          } || rc=$?
          test "${rc:-0}" -eq 3
          echo AXIA_S02_NATIVE_ECM_FRAME_CONTRACT_L0_PASS_NO_GAZEBO_NO_GOAL_PROFILE_HOLD
      - name: Erase protected checkout
        if: always()
        shell: bash
        run: rm -rf -- .git docs tools tests configs scripts ros2_ws training
