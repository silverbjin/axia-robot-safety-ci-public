# P4 prior L2 PASS #43674784552; new GUI overlay is unverified until actual L2 pass.
# PIYO actual public bag-loaded Goal L2 #43338381501: CLEAR/SLOW/STOP/odom
# and real 14-topic SQLite bag PASS, official Nav2 shutdown ACK PASS,
# but 10s Gazebo launch cleanup expired (rc3). Actual CM children exit0.
# Regressed first post-goal cleanup boundary RED #43339194903
# -> GREEN #43339388986 (53 PASS); both WSL2 Owner and CI use
# a bounded 26s post-ACK launch grace, no CM/Scan TTL changes.
name: AXIA G07 Unified GUI stress - original P4 one simulation Goal L2
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    # Authorized release-only CI simulation; preserve unmerged integration branch.
    # HOLD: only an explicit source-reviewed CI trigger after the CM
    # STOP-period cause has a GREEN regression may authorize the costly
    # simulation Goal. Editing this workflow alone never auto-moves a robot.
    paths: ['.github/workflows/axia-g07-unified-gui-one-goal-l2.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-unified-gui-stress-real-gazebo-l2
  cancel-in-progress: false
jobs:
  real-gazebo-nav2-moving-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      # Docker bridge resolver failed in #43041110273 and #43042223936;
      # use explicit public resolvers only for this GitHub CI container.
      # This does not change ROS networking, source, TTL or WSL2 runtime.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Private Instructor exact commit sealed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: c1d778c0f8ad68837487b65fc4f8557aef842887
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Public Unified CI candidate and public main display assets (separate SHAs)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 2e18ed484250b452d29caaefd9449023399bf53c
          path: unified-public
          persist-credentials: false
      - name: Published D06 read-only viewer sources pinned at public main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 0f66059d9110f8e667200bbca22396bd0c78c02e
          path: visual
          persist-credentials: false
      - name: Public L0 GREEN, SHA fidelity, and no additional command publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C unified-public rev-parse HEAD)" = "2e18ed484250b452d29caaefd9449023399bf53c"
          test "$(git -C visual rev-parse HEAD)" = '0f66059d9110f8e667200bbca22396bd0c78c02e'
          export PYTHONPATH="$PWD/unified-public"
          python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_unified_first_timing_regression.py' -v
          python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_unified_gui_sidecar_contract.py' -v
          bash -n unified-public/d06/scripts/g07_unified_ci_readonly_display.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('visual/d06/live/d06_readonly_monitor.py').read_text()
          pubs=re.findall(r'create_publisher\([^\n]+',s)
          assert len(pubs)==1 and 'MarkerArray' in pubs[0]
          assert not re.search(r'create_publisher\(\s*(?:Twist|Pose)',s)
          print('AXIA_G07_UNIFIED_READONLY_MARKER_SINGLE_PUBLISHER_L0_PASS')
          PY
      - name: Field RED to GREEN owned official CM CPU and 2-core native STOP L0
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = 'c1d778c0f8ad68837487b65fc4f8557aef842887'
          cd instructor
          python3 -m unittest discover -s tests/unit -p 'test_g07_field_official_cm_cpu_parity_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle22_wsl2_cm_exclusive_cpu_first_gap_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle25_fourcpu_cm_goal_nonoverlap_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle26_first_cm_gap_scheduler_probe_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle28_prearmed_native_stop_priority_parity_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_p4_g07_goal_observer_cpu_parity_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_first_cm_rpc_thread_state_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle11_cm_tf_headroom_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle12_stop_rpc_cm_fresh_alignment_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle13_first_localization_startup_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle14_first_120ms_rmw_margin_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle15_combined_tf_fast_fail_and_stop_alignment_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle16_first_localization_shutdown_20261115.py' -v
          bash -n scripts/p2_no_goal_smoke_ci.sh
          bash -n scripts/p2_owner_l3_wsl2.sh
          python3 -m py_compile tools/p2_g07_official_cm_cpu_affinity.py tools/p2_g07_goal_observer_cpu_plan.py
          echo AXIA_G07_FIELD_OFFICIAL_CM_L0_GREEN_NO_ROS_NO_GOAL
      - name: Exact immutable runtime image and 25-package/5-file parity without apt reinstall
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = 'c1d778c0f8ad68837487b65fc4f8557aef842887'
          test "$ROS_DISTRO" = jazzy
          cd instructor
          mkdir -p results/p2-g07-ci-moving
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          export ROS_DOMAIN_ID=83 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION=axia_p2_ci_moving_83 AXIA_P0_SIM_ONLY=1
          python3 tools/p2_g07_owner_env_parity.py --mode ci \
            --output results/p2-g07-ci-moving/core_parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/p2-g07-ci-moving/core_parity.json').read_text())
          assert v['status']=='CORE_PARITY_PASS'
          assert v['checked_packages']==25 and v['checked_official_files']==5
          assert v['wsl_kernel_equal_ci'] is False
          print('AXIA_G07_RUNTIME_DIGEST_25_5_ENV_PARITY_PASS_NO_APT')
          PY
      - name: Use independently GREEN L0 oracle; syntax-check actual runner without pip
        shell: bash
        run: |
          set -euo pipefail
          cd instructor
          python3 -m py_compile tools/p4_g07_proc_sched.py
          python3 -m py_compile tools/p2_g07_ci_moving_goal.py tools/p2_g07_ci_moving_goal_oracle.py tools/p2_g07_lifecycle_service.py tools/p2_staged_no_goal.py tools/p4_g07_prearmed_stop.py
          bash -n scripts/p2_no_goal_smoke_ci.sh
          echo 'AXIA_G07_CI_MOVING_GOAL_RUNNER_STATIC_PASS_L0_VERIFIED_SEPARATELY'
      - name: Install test-only official RViz and Xvfb overlay without upgrading base ROS
        shell: bash
        run: |
          set -Eeuo pipefail
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 'ros-jazzy-*' 2>/dev/null | sort > /tmp/g07_ros_before.tsv
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends --no-upgrade             ros-jazzy-rviz2 ros-jazzy-visualization-msgs xvfb xauth x11-utils libgl1-mesa-dri
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 'ros-jazzy-*' 2>/dev/null | sort > /tmp/g07_ros_after.tsv
          python3 - <<'PY'
          from pathlib import Path
          def pkgs(f):return dict(x.split('\t',1) for x in Path(f).read_text().splitlines() if '\t' in x)
          before=pkgs('/tmp/g07_ros_before.tsv');after=pkgs('/tmp/g07_ros_after.tsv')
          changed={k:(v,after.get(k)) for k,v in before.items() if after.get(k)!=v}
          assert before and not changed,'AXIA_G07_EXISTING_ROS_PACKAGE_DRIFT_'+repr(changed)
          print('AXIA_G07_GUI_OVERLAY_BASE_VERSION_FROZEN_DIGEST_PLUS_OVERLAY_NOT_IDENTICAL')
          PY
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          for cmd in Xvfb rviz2 xwininfo gz;do command -v "$cmd" || exit 3;done
          echo AXIA_G07_REAL_GUI_L2_PREREQUISITES_PRESENT_NO_GOAL
      - name: CI-only GUI role CPU preflight before original P4 Goal (no safety process changes)
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/unified-public"
          python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_cycle23_cm_marker_role_conflict.py' -v
          GUI_CPU="$(python3 unified-public/d06/live/d06_gui_cpu_plan.py)"
          MONITOR_CPU="$(python3 unified-public/d06/live/d06_gui_cpu_plan.py --role monitor)"
          [[ "$GUI_CPU" =~ ^[0-9]+$ && "$MONITOR_CPU" =~ ^[0-9]+$ && "$GUI_CPU" != "$MONITOR_CPU" ]]
          echo "G07_UNIFIED_GUI_CPU_PREFLIGHT_NO_GOAL_PASS renderer=$GUI_CPU observer=$MONITOR_CPU"
      - name: Isolated S02 native physics observer build and identical positive calibration blob
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 'c1d778c0f8ad68837487b65fc4f8557aef842887'
          test "$(git hash-object tools/native_s02/s02_physics_witness.cc)" = 2035cf411972e35fa7d9b6d16766bbc784051ff8
          if ! command -v c++ >/dev/null || ! test -e /usr/include/gz/sim8/gz/sim/System.hh;then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++ make libgz-sim8-dev
          fi
          cmake -S tools/native_s02 -B "$RUNNER_TEMP/s02-native-one-goal-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s02-native-one-goal-build" --parallel 2
          test -s "$RUNNER_TEMP/s02-native-one-goal-build/libaxia_s02_physics_witness.so"
          python3 -m unittest discover -s tests/unit -p test_p4_s02_same_goal_review.py -q
          echo AXIA_S02_NATIVE_PLUGIN_SAME_VERIFIED_POSITIVE_BLOB_COMPILED_NO_GOAL
      - name: 'Cycle29: start official CM callback LTTng trace BEFORE single Goal (diagnostic only)'
        shell: bash
        run: |
          set -Eeuo pipefail
          command -v lttng
          TRACE="$RUNNER_TEMP/axia-g07-cycle29-ust"
          [[ ! -e "$TRACE" && ! -L "$TRACE" ]]
          mkdir -m 700 "$TRACE"
          SESSION="axia_g07_cycle29_$GITHUB_RUN_ID"
          lttng create "$SESSION" --output="$TRACE/raw" >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:callback_start' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:callback_end' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rclcpp_callback_register' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rcl_subscription_init' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rclcpp_subscription_init' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rclcpp_subscription_callback_added' >/dev/null
          lttng add-context --userspace -s "$SESSION" -t vpid >/dev/null
          lttng add-context --userspace -s "$SESSION" -t vtid >/dev/null
          lttng start "$SESSION" >/dev/null
          python3 -c 'import json,time;print(json.dumps({"mono_ns":time.monotonic_ns(),"wall_ns":time.time_ns()}))' \
            > "$TRACE/start_anchor.json"
          printf '%s\n' "$SESSION" > "$TRACE/session.txt"
          echo AXIA_G07_CYCLE29_LTTNG_OFFICIAL_CALLBACK_TRACE_STARTED_BEFORE_GOAL_DIAGNOSTIC_ONLY

      - name: Real Harmonic official TB3 Waffle and Nav2 ONE bounded simulation Goal
        shell: bash
        env:
          ROS_DOMAIN_ID: '83'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_ci_moving_83
          AXIA_P0_SIM_ONLY: '1'
          AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '1'
          AXIA_G07_CI_OWNER_OBSERVER_PARITY: '1'
          AXIA_G07_OWNER_STARTUP_PARITY: '1'
          AXIA_G07_CI_OWNER_BAG_PARITY: '1'
          AXIA_P2_SMOKE_RESULTS: results/p2-g07-ci-moving/real-l2
        run: |
          set -euo pipefail
          cd instructor
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 'c1d778c0f8ad68837487b65fc4f8557aef842887'
          export GZ_SIM_SYSTEM_PLUGIN_PATH="$RUNNER_TEMP/s02-native-one-goal-build:${GZ_SIM_SYSTEM_PLUGIN_PATH:-}"
          export AXIA_S02_ECM_WITNESS_CI=1 AXIA_S02_ECM_WITNESS_MOVING_ALLOWED=1
          export AXIA_S02_WITNESS_SOURCE_SHA=c1d778c0f8ad68837487b65fc4f8557aef842887
          export AXIA_S02_WITNESS_SESSION=s02_live_one_goal_83
          export AXIA_S02_ECM_WITNESS_REPORT="$PWD/results/p2-g07-ci-moving/real-l2/s02_ecm_witness.json"
          echo AXIA_S02_PUBLIC_SIM_ONLY_ONE_GOAL_NATIVE_CONTACT_WITNESS_ARMED
          # Exact CI and Owner executable must precompile native STOP before
          # Goal and then emit prearmed READY, no gz CLI fork in motion.
          test -f tools/native_g07_stop/CMakeLists.txt
          test -f tools/native_g07_stop/g07_stop_service.cc
          echo AXIA_P4_G07_ONE_GOAL_NATIVE_TRANSPORT_CANDIDATE_SHARED_OWNER_CI
          test -f ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p4_g07_guard_tick_policy.py
          echo AXIA_P4_G07_SAME_OWNER_CI_FAST_GUARD_40MS_AND_RMW_CLOCK_DOMAIN_CANDIDATE
          # The EXACT same Owner/CI Observer must enqueue telemetry without
          # holding a ROS callback while SQLite/Docker/WSLg evidence flushes.
          test -f tools/p4_g07_evidence_pump.py
          grep -Fq "BufferedEvidencePump(" tools/p2_l3_live_session.py
          echo AXIA_P4_G07_SHARED_ASYNC_OBSERVER_EVIDENCE_NO_CALLBACK_FS_IO_CANDIDATE
          # Only DISPLAY sidecar. Original P4 private Goal/STOP/Cancel/Shutdown
          # remains the single authority. This creates an Xvfb GUI overlay;
          # it is NOT real WSLg and is NOT equivalent to unchanged image bytes.
          # Shared P4 CI and Owner launcher run the same external GUI clients;
          # before one Goal each must attest actual display readiness.
          export AXIA_G07_UNIFIED_GUI_SIDECAR=1
          export AXIA_G07_GUI_READY_ATTESTATION_PATH="$PWD/results/p2-g07-ci-moving/real-l2/visual-readonly/display_attestation.json"
          export DISPLAY=:99 LIBGL_ALWAYS_SOFTWARE=1 GALLIUM_DRIVER=llvmpipe
          mkdir -p results/p2-g07-ci-moving/real-l2/visual-readonly
          Xvfb :99 -screen 0 1530x900x24             > results/p2-g07-ci-moving/real-l2/visual-readonly/xvfb.log 2>&1 &
          XVFB_PID=$!
          GUI_PID=''
          cleanup_visual() {
            [[ -z "$GUI_PID" ]] || {
              kill -TERM "$GUI_PID" 2>/dev/null || true
              wait "$GUI_PID" 2>/dev/null || true
            }
            kill -TERM "$XVFB_PID" 2>/dev/null || true
            wait "$XVFB_PID" 2>/dev/null || true
          }
          trap cleanup_visual EXIT
          sleep 1
          kill -0 "$XVFB_PID"
          bash ../unified-public/d06/scripts/g07_unified_ci_readonly_display.sh             "$PWD/results/p2-g07-ci-moving/real-l2" "$PWD/../visual"             > results/p2-g07-ci-moving/real-l2/visual-readonly/sidecar.log 2>&1 &
          GUI_PID=$!
          echo AXIA_G07_P4_ORIGINAL_SIM_ONLY_GOAL_WITH_DISPLAY_SIDECAR_CANDIDATE
          timeout --signal=TERM --kill-after=10s 900s \
            bash scripts/p2_no_goal_smoke_ci.sh || {
            echo 'AXIA_G07_CI_MOVING_GOAL_REAL_GAZEBO_BLOCKED'
            if [[ -f results/p2-g07-ci-moving/real-l2/g07_ordered_shutdown.json ]];then
              python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/p2-g07-ci-moving/real-l2/g07_ordered_shutdown.json').read_text())
          print('AXIA_S02_CI_NAV_FIRST_ACK_BOUNDARY '+json.dumps({
           k:v.get(k) for k in ('status','cm_managed_by_navigation',
           'navigation_ack','navigation_request_sent','navigation_elapsed_sec',
           's02_ci_shutdown_graph_observation','localization_ack')
          },sort_keys=True))
          PY
            fi
            for f in results/p2-g07-ci-moving/real-l2/{staged_startup,launch,g07_ci_pregoal,g07_ci_moving,g07_ordered_shutdown,rosbag}.log \
               results/p2-g07-ci-moving/real-l2/{teardown,teardown_processes}.txt;do
              if [[ -f "$f" ]];then echo "--- $(basename "$f") ---";tail -n 80 "$f";fi
            done
            exit 2
          }
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('results/p2-g07-ci-moving/real-l2')
          startup=json.loads((root/'startup_verdict.json').read_text())
          preg=json.loads((root/'g07_ci_pregoal/owner_pregoal_l2.json').read_text())
          data=json.loads((root/'g07_ci_moving/ci_moving_goal_result.json').read_text())
          assert startup['status']=='SMOKE_READY' and startup['goal_sent'] is False
          assert (root/'g07_demo_waffle_manifest.json').exists()
          for gate in ('localization_start','navigation_start'):
            native=json.loads((root/('startup_verdict.'+gate+'.native.json')).read_text())
            assert native['status']=='ACK' and native['success'] is True
            assert native['goal_sent'] is False and native['command']=='startup'
          print('AXIA_G07_SHARED_CI_OWNER_STAGED_NATIVE_STARTUP_L2_ACK_PASS')
          assert preg['status']=='P2_G07_OWNER_PREGOAL_L2_READY_NO_GOAL'
          assert (root/'rosbag2/metadata.yaml').is_file(), 'OWNER_14_TOPIC_BAG_NOT_RECORDED'
          import sqlite3
          dbs=list((root/'rosbag2').glob('*.db3'))
          assert len(dbs)==1
          conn=sqlite3.connect('file:'+str(dbs[0])+'?mode=ro',uri=True)
          assert conn.execute('pragma quick_check').fetchone()[0]=='ok'
          counts=dict(conn.execute('select topics.name,count(messages.id) from topics left join messages on topics.id=messages.topic_id group by topics.name'))
          for name in ('/clock','/scan','/odom','/cmd_vel_supervised','/cmd_vel_pre_guard','/axia/p2/base_guard'):
            assert counts.get(name,0)>0,(name,counts)
          print('AXIA_G07_PUBLIC_CI_WSL2_MATCHED_14_TOPIC_REAL_BAG_L2_PASS')
          assert data['status']=='CI_GAZEBO_MOVING_GOAL_CANDIDATE'
          assert data['goal_sent'] is True and data['goal_status_executing'] is True
          assert all(data['goal_status_at_'+k]==2 for k in ('clear','slow','stop'))
          assert data['odom_stopped_dwell_sec']>=1
          assert data['guard_latched'] is False
          assert data.get('goal_cancel_ack') is True
          assert data.get('goal_cancel_uuid') == data['goal_uuid']
          assert data.get('goal_cancel_status') == 5
          print('AXIA_G07_REAL_EXACT_NAV2_GOAL_CANCEL_ACK_BEFORE_LIFECYCLE_PASS')
          assert data['owner_observer_parity_survived_15s'] is True
          print('AXIA_G07_CI_OWNER_OBSERVER_PARITY_L2_VALIDATED_2_WORKERS_NO_SIGSEGV')
          assert data['certified_estop'] is False and data['gate_accepted'] is False
          # Same official ordered shutdown and native CM exit audit as Owner.
          # These are actual POST-GOAL processes, not a separate NO-GOAL run.
          teardown=json.loads((root/'g07_ordered_shutdown.json').read_text())
          cm_audit=json.loads((root/'g07_shutdown_audit.json').read_text())
          assert teardown['status']=='NAV2_LIFECYCLE_SHUTDOWN_ACK'
          assert teardown['cm_managed_by_navigation'] is True
          assert teardown['navigation_ack'] and teardown['localization_ack']
          assert cm_audit['status']=='SHUTDOWN_CLEAN_CANDIDATE'
          assert cm_audit['cm_exit_code']==0
          assert 'P2_L2_GRACEFUL_TEARDOWN' in (root/'teardown.txt').read_text()
          print('AXIA_G07_REAL_POST_GOAL_OWNER_IDENTICAL_NAV2_SHUTDOWN_CM_EXIT0_PASS')
          assert data['owner_l3_accepted'] is False
          print('AXIA_G07_CI_REAL_HARMONIC_NAV2_MOVING_GOAL_CLEAR_SLOW_STOP_L2_PASS_OWNER_L3_NOT_RUN')
          PY
      - name: First 120ms original CM publication gap vs native STOP RPC (read-only diagnostics)
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          EVENT="$PWD/instructor/results/p2-g07-ci-moving/real-l2/g07_ci_moving/actual_ros_events.jsonl"
          RESULT="$PWD/instructor/results/p2-g07-ci-moving/real-l2/g07_ci_moving/ci_moving_goal_result.json"
          CHECK="$PWD/unified-public/d06/live/g07_cycle27_first120_rpc_relation.py"
          if [[ -s "$EVENT" && -s "$RESULT" && -s "$CHECK" ]];then
            python3 "$CHECK" --events "$EVENT" --result "$RESULT" || {
              echo AXIA_G07_CYCLE27_ACTUAL_FIRST_120MS_RPC_ATTRIBUTION_UNVERIFIED_HOLD
            }
          else
            echo AXIA_G07_CYCLE27_ACTUAL_FIRST_120MS_RPC_ORIGINAL_MISSING_HOLD_NO_INFERENCE
          fi
          echo AXIA_G07_CYCLE27_FIRST_GAP_DIAG_NOT_RELEASE_AUTHORITY
      - name: 'Cycle29: first CM RMW gap versus real official callback spans (NOT acceptance)'
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          TRACE="$RUNNER_TEMP/axia-g07-cycle29-ust"
          if [[ ! -r "$TRACE/session.txt" ]];then
            echo AXIA_G07_CYCLE29_TRACE_SESSION_MISSING_NOT_AN_ACCEPTANCE_PASS
