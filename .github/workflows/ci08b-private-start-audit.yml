name: AXIA CI08B guarded typed Start ACK Python contracts (NO ROS START)
on:
  push:
    branches: [feat/secure-instructor-cloud-bridge]
    paths:
      - '.github/workflows/ci08b-private-start-audit.yml'
permissions:
  contents: read
concurrency:
  group: axia-ci08b-no-actuation
  cancel-in-progress: false
jobs:
  ci08b-private-python:
    if: github.repository == 'silverbjin/axia-robot-safety-ci-public' && github.actor == 'silverbjin' && github.ref == 'refs/heads/feat/secure-instructor-cloud-bridge' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: axia-instructor-sealed
    steps:
      - name: Fetch pinned instructor code temporarily
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: ef5cdd3d514188ea83c774b0f24b437593ab965d
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
          fetch-depth: 1
          path: _instructor_private
      - name: Python fake ROS contracts only - never a service request or Goal
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          set +e
          ( cd _instructor_private && PYTHONPATH=.:tests/unit python3 -m unittest discover -s tests/unit -p test_p1_cloud_g00_start_ack.py -v ) > "$LOG" 2>&1
          RC=$?
          set -e
          if [[ "$RC" == 0 ]] && grep -Eq '^Ran 11 tests in ' "$LOG" && grep -qx 'OK' "$LOG"; then
            echo 'AXIA_CI08B_PRIVATE_UNIT=PASS tests=11 start_called=false goal_sent=false gate_accepted=false'
          else
            echo 'AXIA_CI08B_PRIVATE_UNIT=BLOCKED reason=UNIT_CONTRACT_FAILED start_called=false goal_sent=false gate_accepted=false'
            exit 2
          fi
      - name: Private temporary source cleanup
        if: always()
        shell: bash
        run: |
          rm -rf _instructor_private
          echo AXIA_PRIVATE_TEMP_CLEANUP_DONE
