name: D04 main consolidation branch-ledger public contract (NO ROS)
on:
  push:
    branches: ['docs/d04-main-consolidation-20261115']
    paths:
      - '.github/workflows/d04-main-merge-docs-ci.yml'
      - 'tests/test_d04_main_integration_ledger.py'
      - 'docs/D04_MAIN_INTEGRATION_BRANCH_LEDGER_20261115_KO.md'
  pull_request:
    paths:
      - '.github/workflows/d04-main-merge-docs-ci.yml'
      - 'tests/test_d04_main_integration_ledger.py'
      - 'docs/D04_MAIN_INTEGRATION_BRANCH_LEDGER_20261115_KO.md'
permissions:
  contents: read
jobs:
  publication-contract-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Public D04 source ledger static checks, no private repository
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.3.5
          python -m pytest -q tests/test_d04_main_integration_ledger.py
          echo 'D04_MAIN_CONSOLIDATION_PUBLIC_DOCS_PASS'
          echo 'No private checkout, no instructor answers, no ROS/Gazebo/Goal'
          echo 'D04_RUNTIME_CI_NOT_REEXECUTED_FOR_DOCS_ONLY'
