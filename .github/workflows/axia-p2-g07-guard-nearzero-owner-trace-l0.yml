name: AXIA G07 Owner nearzero Guard trace RED GREEN L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - '.github/workflows/axia-p2-g07-guard-nearzero-owner-trace-l0.yml'
permissions:
  contents: read
concurrency:
  group: axia-p2-g07-nearzero-owner-trace-l0
  cancel-in-progress: false
jobs:
  actual-owner-nearzero-l0:
    runs-on: ubuntu-24.04
    environment: axia-instructor-sealed
    timeout-minutes: 10
    steps:
      - name: Checkout private exact source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 4cec24c1787934375569f9ff37b1cb3922fede43
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Real Owner near-ZERO sign-flip + existing Guard trace + STOP TTL and cancel
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '4cec24c1787934375569f9ff37b1cb3922fede43'
          python3 -m pip install --disable-pip-version-check -q pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_guard_nearzero_owner_trace.py \
            tests/unit/test_p2_g07_guard_async_owner_trace.py \
            tests/unit/test_p2_base_guard_policy.py \
            tests/unit/test_p2_guard_cancel_contract.py \
            tests/unit/test_p2_guard_parameter_init_contract.py
          echo 'AXIA_G07_OWNER_NEARZERO_GUARD_L0_PASS_NO_GOAL'
      - name: Negative-control mutation must make the actual Owner regression FAIL
        shell: bash
        run: |
          set -euo pipefail
          TARGET='ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py'
          cp -- "$TARGET" /tmp/g07_owner_policy_original.py
          trap 'cp -- /tmp/g07_owner_policy_original.py "$TARGET"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path('ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py')
          s=p.read_text()
          a='and (not reversed_linear or near_zero_linear_crossing)'
          b='and not reversed_linear'
          assert s.count(a)==1
          p.write_text(s.replace(a,b))
          PY
          set +e
          python3 -m pytest -q \
            tests/unit/test_p2_g07_guard_nearzero_owner_trace.py::test_owner_nearzero_sign_flip_must_hold_zero_without_false_goal_cancel \
            >/tmp/g07_nearzero_mutation_expected_red.log 2>&1
          RC=$?
          set -e
          if [[ "$RC" -eq 0 ]]; then
            echo 'AXIA_G07_NEARZERO_MUTATION_GATE_FAIL_TEST_DID_NOT_DETECT_REGRESSION'
            exit 2
          fi
          grep -q 'owner G07 near-zero jitter must not immediately CANCEL Goal' \
            /tmp/g07_nearzero_mutation_expected_red.log || {
            cat /tmp/g07_nearzero_mutation_expected_red.log; exit 2;
          }
          echo 'AXIA_G07_NEARZERO_MUTATION_EXPECTED_RED_CAUGHT_PASS'
      - name: Clear sealed private checkout
        if: always()
        shell: bash
        run: rm -rf -- .git tools scripts tests ros2_ws configs docs fixtures results
