# PIYO actual public bag-loaded Goal L2 #43338381501: CLEAR/SLOW/STOP/odom
# and real 14-topic SQLite bag PASS, official Nav2 shutdown ACK PASS,
# but 10s Gazebo launch cleanup expired (rc3). Actual CM children exit0.
# Regressed first post-goal cleanup boundary RED #43339194903
# -> GREEN #43339388986 (53 PASS); both WSL2 Owner and CI use
# a bounded 26s post-ACK launch grace, no CM/Scan TTL changes.
name: AXIA G07 C32 first Localization server SHUTDOWN boundary real Gazebo L2
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    # HOLD: only an explicit source-reviewed CI trigger after the CM
    # STOP-period cause has a GREEN regression may authorize the costly
    # simulation Goal. Editing this workflow alone never auto-moves a robot.
    paths: ['.github/workflows/axia-g07-c32-localization-server-ack-probe-real-l2.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-ci-real-gazebo-moving-goal-l2
  cancel-in-progress: false
jobs:
  real-gazebo-nav2-moving-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      # Docker bridge resolver failed in #43041110273 and #43042223936;
      # use explicit public resolvers only for this GitHub CI container.
      # This does not change ROS networking, source, TTL or WSL2 runtime.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Private Instructor exact commit sealed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: fe2081a0cd3013779ca82361756602fdac50a539
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Checkout exact public D06 read-only monitor and RViz assets
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: a293d0f3b16358619e2e8812d880e3165157b529
          path: d06-public
          persist-credentials: false
      - name: Exact immutable runtime image and 25-package/5-file parity without apt reinstall
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = 'fe2081a0cd3013779ca82361756602fdac50a539'
          test "$ROS_DISTRO" = jazzy
          cd instructor
          mkdir -p results/g07-c32-ci-server-probe
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          export ROS_DOMAIN_ID=101 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION=axia_p2_ci_moving_c30_101 AXIA_P0_SIM_ONLY=1
          python3 tools/p2_g07_owner_env_parity.py --mode ci \
            --output results/g07-c32-ci-server-probe/core_parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/g07-c32-ci-server-probe/core_parity.json').read_text())
          assert v['status']=='CORE_PARITY_PASS'
          assert v['checked_packages']==25 and v['checked_official_files']==5
          assert v['wsl_kernel_equal_ci'] is False
          print('AXIA_G07_RUNTIME_DIGEST_25_5_ENV_PARITY_PASS_NO_APT')
          PY
      - name: Use independently GREEN L0 oracle; syntax-check actual runner without pip
        shell: bash
        run: |
          set -euo pipefail
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_p4_g07_first_guard_cm_delivery_boundary.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_one_goal_first_ttl_join.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c29_rmw_gap_first_cause.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c30_xacro_gz_startup_order.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c32_localization_server_boundary.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c32_goal_terminal_before_lifecycle.py -v
          python3 -m py_compile tools/p2_g07_ci_goal_terminal.py
          python3 -m py_compile tools/p2_g07_localization_shutdown_trace.py tools/p2_g07_lifecycle_service.py
          python3 -m unittest discover -s tests/unit -p test_g07_c31_native_shutdown_ack_trace.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_gui_readonly_scope.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_guard_small_reverse_first_latch.py -v
          python3 -m py_compile tools/p2_g07_world_xacro_order.py ros2_ws/src/axia_safety_bringup/launch/axia_tb3_p2.launch.py
          python3 -m py_compile tools/p2_g07_ci_moving_goal.py tools/p2_g07_ci_moving_goal_oracle.py tools/p2_g07_lifecycle_service.py tools/p2_staged_no_goal.py
          bash -n scripts/p2_no_goal_smoke_ci.sh
          echo 'AXIA_G07_CI_MOVING_GOAL_RUNNER_STATIC_PASS_L0_VERIFIED_SEPARATELY'
      - name: Xvfb actual GUI, original RViz2 and D06 read-only prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          # The immutable ROS runtime has rviz2 under /opt/ros/jazzy/bin.
          # Source BEFORE executable discovery, just as C30 GUI L2 did.
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          for p in d06-public/d06/rviz/d06_safety_bubble.rviz d06-public/d06/live/d06_readonly_monitor.py; do
            test -s "$p" || { echo AXIA_G07_C31_D06_PINNED_ASSET_MISSING; exit 2; }
          done
          missing=()
          command -v Xvfb >/dev/null || missing+=(xvfb)
          command -v xwininfo >/dev/null || missing+=(x11-utils)
          command -v rviz2 >/dev/null || missing+=(ros-jazzy-rviz2)
          if (( ${#missing[@]} )); then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends "${missing[@]}"
          fi
          for c in Xvfb xwininfo rviz2 gz ros2 colcon setsid; do command -v "$c"; done
          python3 -m py_compile d06-public/d06/live/d06_readonly_monitor.py
          echo AXIA_G07_C31_D06_READONLY_GUI_DEPENDENCIES_PRESENT
      - name: Real Harmonic official TB3 Waffle and Nav2 ONE bounded simulation Goal
        shell: bash
        env:
          ROS_DOMAIN_ID: '101'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_ci_moving_c30_101
          AXIA_P0_SIM_ONLY: '1'
          AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '1'
          AXIA_G07_CI_OWNER_OBSERVER_PARITY: '1'
          AXIA_G07_OWNER_STARTUP_PARITY: '1'
          AXIA_G07_CI_OWNER_BAG_PARITY: '1'
          AXIA_P2_SMOKE_RESULTS: results/g07-c32-ci-server-probe/real-l2
          AXIA_G07_C31_CI_D06_READONLY_GUI: '1'
          AXIA_G07_C32_LOCALIZATION_TRACE: '1'
          AXIA_G07_C32_QUIESCE_GOAL: '1'
          DISPLAY: ':99'
          QT_QPA_PLATFORM: xcb
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          set -euo pipefail
          cd instructor
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 'fe2081a0cd3013779ca82361756602fdac50a539'
          # One simulation session: launch the unchanged owner-parity moving
          # runner, wait for real Nav2 staged readiness, attach the PUBLIC D06
          # read-only monitor/RViz plus a Gazebo -g CLIENT (not a server).
          OUT=results/g07-c32-ci-server-probe
          mkdir -p "$OUT/sidecar"
          Xvfb :99 -screen 0 1600x900x24 -nolisten tcp > "$OUT/sidecar/xvfb.log" 2>&1 &
          XV_PID=$!
          SMOKE_PID='' GZGUI_PID='' RVIZ_PID='' MON_PID=''
          cleanup_c31() {
            set +e
            for pid in "$MON_PID" "$RVIZ_PID" "$GZGUI_PID"; do
              [[ -n "$pid" ]] || continue
              kill -INT -- "-$pid" 2>/dev/null || true
              sleep .3
              kill -TERM -- "-$pid" 2>/dev/null || true
              wait "$pid" 2>/dev/null || true
            done
            if [[ -n "$SMOKE_PID" ]]; then
              kill -TERM "$SMOKE_PID" 2>/dev/null || true
              wait "$SMOKE_PID" 2>/dev/null || true
            fi
            kill "$XV_PID" 2>/dev/null || true
            wait "$XV_PID" 2>/dev/null || true
          }
          trap cleanup_c31 EXIT
          sleep 2
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          # STOP delivery violation in actual L2 #44025131410:
          # CM 177.685ms > strict 150ms. Do NOT change TTL/QoS/Guard.
          # Isolate non-owning Xvfb GUI readers from the original safety
          # executor cores; same last allowed core is already reserved for
          # low-priority evidence IO. No changes to Gazebo physics server.
          C32_GUI_CPU="$(python3 -c 'import os; a=os.sched_getaffinity(0); assert len(a)>=2; print(max(a))')"
          echo "AXIA_G07_C32_GUI_LOW_PRIORITY_ISOLATION_CORE=$C32_GUI_CPU"
          timeout --signal=TERM --kill-after=10s 900s             bash scripts/p2_no_goal_smoke_ci.sh > "$OUT/moving_stdout.log" 2>&1 &
          SMOKE_PID=$!
          READY="$OUT/real-l2/startup_verdict.json"
          STAGED_READY=0
          for ((n=0;n<3000;n++)); do
            if [[ -s "$READY" ]] && python3 - "$READY" <<'PY_C31_BOOT'
          import json,sys
          try:
              v=json.load(open(sys.argv[1]))
              assert v.get('status')=='SMOKE_READY' and v.get('goal_sent') is False
          except Exception:
              sys.exit(3)
          PY_C31_BOOT
            then STAGED_READY=1; break; fi
            if ! kill -0 "$SMOKE_PID" 2>/dev/null; then break; fi
            sleep .2
          done
          if [[ "$STAGED_READY" != 1 ]]; then
            echo AXIA_G07_C31_REAL_STAGED_STARTUP_NOT_READY_GUI_GOAL_HOLD
            tail -n 80 "$OUT/moving_stdout.log" || true
            exit 3
          fi
          echo AXIA_G07_C31_GENUINE_NAV2_STAGED_STARTUP_BEFORE_D06_GUI
          setsid nice -n 15 taskset -c "$C32_GUI_CPU" gz sim -g -v 3 > "$OUT/sidecar/gazebo_gui.log" 2>&1 &
          GZGUI_PID=$!
          setsid nice -n 15 taskset -c "$C32_GUI_CPU" rviz2 -d ../d06-public/d06/rviz/d06_safety_bubble.rviz             --ros-args -p use_sim_time:=true > "$OUT/sidecar/rviz.log" 2>&1 &
          RVIZ_PID=$!
          setsid nice -n 15 taskset -c "$C32_GUI_CPU" python3 -u ../d06-public/d06/live/d06_readonly_monitor.py             --out "$OUT/sidecar" > "$OUT/sidecar/readonly_monitor.log" 2>&1 &
          MON_PID=$!
          sleep 3
          for pid in "$GZGUI_PID" "$RVIZ_PID" "$MON_PID"; do
            kill -0 "$pid" 2>/dev/null || {
              echo AXIA_G07_C31_D06_GUI_SIDECAR_DIED_BEFORE_GOAL
              tail -n 40 "$OUT/sidecar/gazebo_gui.log" || true
              tail -n 40 "$OUT/sidecar/rviz.log" || true
              tail -n 40 "$OUT/sidecar/readonly_monitor.log" || true
              exit 3
            }
          done
          xwininfo -root -tree > "$OUT/sidecar/window_tree.txt" || true
          for ((n=0;n<30;n++)); do
            if [[ -s "$OUT/sidecar/readonly_samples.jsonl" ]] &&
              python3 - "$OUT/sidecar/readonly_samples.jsonl" <<'PY_C31_SCAN'
          import json,sys
          from pathlib import Path
          rows=[json.loads(x) for x in Path(sys.argv[1]).read_text().splitlines() if x.strip()]
          assert rows and max(x.get('actual_scan_messages',0) for x in rows)>0
          PY_C31_SCAN
            then break; fi
            sleep 1
          done
          python3 - "$OUT/sidecar/readonly_samples.jsonl" <<'PY_C31_SIDECAR'
          import json,sys
          from pathlib import Path
          rows=[json.loads(x) for x in Path(sys.argv[1]).read_text().splitlines() if x.strip()]
          assert rows and max(x.get('actual_scan_messages',0) for x in rows)>0
          assert all(x.get('certified_estop') is False for x in rows)
          assert all(x.get('safety_cm_attested_by_this_node') is False for x in rows)
          print('AXIA_G07_C31_REAL_D06_READONLY_SCAN_RVIZ_SIDECAR_BEFORE_GOAL_PASS')
          PY_C31_SIDECAR
          for pid in "$GZGUI_PID" "$RVIZ_PID" "$MON_PID"; do kill -0 "$pid"; done
          git -c safe.directory="$PWD" rev-parse HEAD > "$OUT/real-l2/c31_gui_ready.sha"
          echo AXIA_G07_C31_DUAL_GUI_READONLY_READY_SENT_TO_ONE_GOAL_RUNNER
          set +e
          wait "$SMOKE_PID"
          RC=$?
          set -e
          SMOKE_PID=''
          echo "AXIA_G07_C31_ONE_GOAL_PLUS_D06_GUI_SHARED_RC=$RC"
          if [[ "$RC" != 0 ]]; then
            for f in "$OUT/real-l2"/{staged_startup,launch,g07_ci_pregoal,g07_ci_moving,g07_c32_goal_terminal,g07_ordered_shutdown,rosbag}.log                "$OUT/real-l2"/{teardown,teardown_processes}.txt "$OUT/moving_stdout.log"; do
              if [[ -f "$f" ]]; then echo "--- $(basename "$f") ---"; tail -n 80 "$f"; fi
            done
            if [[ -f "$OUT/real-l2/g07_ordered_shutdown.json" ]]; then
              cat "$OUT/real-l2/g07_ordered_shutdown.json"
            fi
            # Read-only official server-side failure context, NEVER a native ACK.
            echo AXIA_G07_C32_LOCALIZATION_SERVER_SHUTDOWN_RAW_LAUNCH_CONTEXT_BEGIN
            test -f "$OUT/real-l2/launch.log" || echo AXIA_G07_C32_ACTUAL_LAUNCH_LOG_MISSING
            wc -lc "$OUT/real-l2/launch.log" || true
            grep -aE 'lifecycle_manager_(navigation|localization)|\[(amcl|map_server|collision_monitor|controller_server)-' "$OUT/real-l2/launch.log" \
              | tail -n 170 || true
            echo AXIA_G07_C32_LOCALIZATION_SERVER_SHUTDOWN_RAW_LAUNCH_CONTEXT_END
            if [[ -s "$OUT/real-l2/g07_c32_localization_server_trace.json" ]]; then
              cat "$OUT/real-l2/g07_c32_localization_server_trace.json"
            else
              echo AXIA_G07_C32_TRACE_NOT_CAPTURED_CLIENT_OR_LAUNCH_CAUSE_UNPROVEN
            fi
            echo AXIA_G07_C31_SINGLE_RUN_GUI_GOAL_TTL_SHUTDOWN_L2_HOLD
            exit 3
          fi
          for pid in "$GZGUI_PID" "$RVIZ_PID" "$MON_PID"; do
            kill -0 "$pid" || { echo AXIA_G07_C31_SIDECAR_PREMATURE_EXIT; exit 3; }
          done
          python3 - "$OUT/sidecar/readonly_samples.jsonl" <<'PY_C31_POST'
          import json,sys
          from pathlib import Path
          rows=[json.loads(x) for x in Path(sys.argv[1]).read_text().splitlines() if x.strip()]
          assert len(rows)>=3
          assert max(x.get('actual_scan_messages',0) for x in rows)>0
          print('AXIA_G07_C31_D06_SIDECAR_REAL_SCANS_SURVIVED_GOAL_STOP_PASS')
          PY_C31_POST
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('results/g07-c32-ci-server-probe/real-l2')
          # Real original World Xacro must finish before original Nav2 gz server.
          launch=(root/'launch.log').read_text(errors='replace')
          import re
          ready='AXIA_G07_WORLD_XACRO_READY_BEFORE_GZ'
          assert ready in launch, 'G07_C30_XACRO_READY_MARKER_NOT_IN_ACTUAL_LAUNCH'
          starts=list(re.finditer(r'\[INFO\] \[gz-\d+\]: process started',launch))
          assert len(starts)==1, 'GAZEBO_SERVER_SPAWN_COUNT_MISMATCH'
          assert launch.index(ready)<starts[0].start(), 'GAZEBO_SERVER_START_BEFORE_WORLD_READY'
          assert not re.search(r'\[ERROR\] \[gz-\d+\]: process has died',launch)
          print('AXIA_G07_C31_REAL_OFFICIAL_XACRO_BEFORE_GZ_NO_GOAL_AT_START_L2_PASS')
          startup=json.loads((root/'startup_verdict.json').read_text())
          preg=json.loads((root/'g07_ci_pregoal/owner_pregoal_l2.json').read_text())
          data=json.loads((root/'g07_ci_moving/ci_moving_goal_result.json').read_text())
          assert startup['status']=='SMOKE_READY' and startup['goal_sent'] is False
          assert (root/'g07_demo_waffle_manifest.json').exists()
          for gate in ('localization_start','navigation_start'):
            native=json.loads((root/('startup_verdict.'+gate+'.native.json')).read_text())
            assert native['status']=='ACK' and native['success'] is True
            assert native['goal_sent'] is False and native['command']=='startup'
          print('AXIA_G07_SHARED_CI_OWNER_STAGED_NATIVE_STARTUP_L2_ACK_PASS')
          assert preg['status']=='P2_G07_OWNER_PREGOAL_L2_READY_NO_GOAL'
          assert (root/'rosbag2/metadata.yaml').is_file(), 'OWNER_14_TOPIC_BAG_NOT_RECORDED'
          import sqlite3
          dbs=list((root/'rosbag2').glob('*.db3'))
          assert len(dbs)==1
          conn=sqlite3.connect('file:'+str(dbs[0])+'?mode=ro',uri=True)
          assert conn.execute('pragma quick_check').fetchone()[0]=='ok'
          counts=dict(conn.execute('select topics.name,count(messages.id) from topics left join messages on topics.id=messages.topic_id group by topics.name'))
          for name in ('/clock','/scan','/odom','/cmd_vel_supervised','/cmd_vel_pre_guard','/axia/p2/base_guard'):
            assert counts.get(name,0)>0,(name,counts)
          print('AXIA_G07_PUBLIC_CI_WSL2_MATCHED_14_TOPIC_REAL_BAG_L2_PASS')
          assert data.get('source_sha')=='fe2081a0cd3013779ca82361756602fdac50a539'
          assert data.get('first_timing_violation') is None
          for key, bound in (
              ('max_source_interval_sec',.15),('max_cm_interval_sec',.15),
              ('max_guard_interval_sec',.15),('max_supervisor_fsm_interval_sec',.15),
              ('max_scan_interval_sec',.30),('max_odom_interval_sec',.30),
              ('max_clock_interval_sec',.30)):
              assert isinstance(data.get(key),(int,float)) and 0<data[key]<bound,(key,data.get(key),bound)
          assert data.get('observed_odom_moved_m',0)>=.05
          assert data.get('stop_post_ack_distinct_ros_scan_count',0)>=2
          print('AXIA_G07_C31_REAL_MOVING_TTL_150_300_MS_AND_ODOM_EVIDENCE_PASS')
          assert data['status']=='CI_GAZEBO_MOVING_GOAL_CANDIDATE'
          assert data['goal_sent'] is True and data['goal_status_executing'] is True
          assert all(data['goal_status_at_'+k]==2 for k in ('clear','slow','stop'))
          assert data['odom_stopped_dwell_sec']>=1
          assert data['guard_latched'] is False
          assert data['owner_observer_parity_survived_15s'] is True
          print('AXIA_G07_CI_OWNER_OBSERVER_PARITY_L2_VALIDATED_2_WORKERS_NO_SIGSEGV')
          assert data['certified_estop'] is False and data['gate_accepted'] is False
          # Same official ordered shutdown and native CM exit audit as Owner.
          # These are actual POST-GOAL processes, not a separate NO-GOAL run.
          teardown=json.loads((root/'g07_ordered_shutdown.json').read_text())
          cm_audit=json.loads((root/'g07_shutdown_audit.json').read_text())
          for manager in ('navigation','localization'):
              native=teardown.get(manager+'_native')
              assert isinstance(native,dict), 'C31_NATIVE_ACK_TIMING_MISSING:'+manager
              assert native.get('status')=='ACK' and native.get('ack_response_received') is True
              assert native.get('request_sent') is True
              assert isinstance(native.get('response_wait_sec'),(float,int))
              assert native.get('first_ack_failure') is None
          terminal=json.loads((root/'g07_c32_goal_terminal.json').read_text())
          assert terminal['ready_for_nav2_shutdown'] is True
          assert terminal['goal_terminal_verified'] is True
          assert terminal['goal_uuid']==data['goal_uuid']
          assert terminal['certified_estop'] is False
          assert terminal['status'] in ('EXACT_GOAL_CANCELED_TERMINAL','EXACT_GOAL_ALREADY_SUCCEEDED')
          print('AXIA_G07_C32_EXACT_OWNED_GOAL_TERMINAL_BEFORE_NATIVE_NAV2_ACK_PASS')
          print('AXIA_G07_C31_REAL_NATIVE_NAV2_SHUTDOWN_REQUEST_RESPONSE_TRACE_PASS')
          assert teardown['status']=='NAV2_LIFECYCLE_SHUTDOWN_ACK'
          assert teardown['cm_managed_by_navigation'] is True
          assert teardown['navigation_ack'] and teardown['localization_ack']
          assert cm_audit['status']=='SHUTDOWN_CLEAN_CANDIDATE'
          assert cm_audit['cm_exit_code']==0
          assert 'P2_L2_GRACEFUL_TEARDOWN' in (root/'teardown.txt').read_text()
          print('AXIA_G07_REAL_POST_GOAL_OWNER_IDENTICAL_NAV2_SHUTDOWN_CM_EXIT0_PASS')
          assert data['owner_l3_accepted'] is False
          print('AXIA_G07_CI_REAL_HARMONIC_NAV2_MOVING_GOAL_CLEAR_SLOW_STOP_L2_PASS_OWNER_L3_NOT_RUN')
          print('AXIA_G07_C31_REAL_GAZEBO_ONE_GOAL_CLEAR_SLOW_STOP_L2_PASS_NO_OWNER')
          PY
      - name: Post-Goal cross-node first CM TTL read-only diagnostic
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,str(Path('tools').resolve()))
          from p2_g07_ci_moving_goal_oracle import first_guard_cm_delivery_boundary
          folder=Path('results/g07-c32-ci-server-probe/real-l2/g07_ci_moving')
          summary=folder/'ci_moving_goal_result.json'
          events=folder/'actual_ros_events.jsonl'
          if not summary.is_file() or not events.is_file():
              print('AXIA_P4_G07_L2_CROSS_NODE_DIAGNOSTIC_BLOCKED_NO_ORIGINAL_RUN')
              sys.exit(3)
          verdict=json.loads(summary.read_text())
          rows=[json.loads(line) for line in events.read_text().splitlines()]
          starts=[row['t'] for row in rows if row.get('kind')=='owner_goal_published']
          if len(starts)!=1:
              print('AXIA_P4_G07_L2_GOAL_START_AMBIGUOUS_NO_SIGNOFF')
              sys.exit(3)
          result=first_guard_cm_delivery_boundary(
              rows,verdict.get('first_guard_latch'),goal_start=starts[0])
          print('AXIA_P4_G07_L2_FIRST_CM_GUARD_BOUNDARY '+json.dumps(result,sort_keys=True))
          assert result['safety_pass'] is False
          assert result['cm_publisher_stopped_proven'] is False
          if result['status']=='GUARD_INTERNAL_CM_TTL_BREACH':
              print('AXIA_P4_G07_REAL_L2_FIRST_GUARD_CM_STALE_BLOCKED_150MS')
              sys.exit(3)
          if result['status']!='NO_FIRST_GUARD_LATCH_TRACE':
              print('AXIA_P4_G07_L2_FIRST_GUARD_BOUNDARY_INCONCLUSIVE')
              sys.exit(3)
          if (verdict.get('status')!='CI_GAZEBO_MOVING_GOAL_CANDIDATE'
                  or verdict.get('first_timing_violation') is not None
                  or verdict.get('guard_latched') is not False):
              print('AXIA_P4_G07_L2_G07_ORIGINAL_ORACLE_HOLD')
              sys.exit(3)
          print('AXIA_P4_G07_L2_CROSS_NODE_FIRST_CM_GUARD_NO_BREACH_IN_CI_ONLY')
          print('AXIA_G07_C31_REAL_ONE_GOAL_FIRST_CM_GUARD_DELIVERY_L2_PASS_CI_ONLY')
          print('AXIA_P4_G07_OWNER_WSL2_NOT_RUN_SCHEDULER_UNVERIFIED_FORMAL_HOLD')
          PY
      - name: Delete all Instructor and public D06 and raw ROS / Gazebo evidence
        if: always()
        shell: bash
        run: rm -rf -- instructor d06-public ci-tools
