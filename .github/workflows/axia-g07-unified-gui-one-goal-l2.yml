                  print("AXIA_G07_CYCLE30_ORACLE_GAP_WITHOUT_SOURCE_PAIR_HOLD")
                  raise SystemExit(3)
              print("AXIA_G07_CYCLE30_NO_CM_120MS_RMW_GAP_TRACE_NOT_REQUIRED_CI_ONLY")
              raise SystemExit(0)
          counts={"global":0,"other_pid":0}
          def cm_only_trace_events():
              for msg in bt2.TraceCollectionMessageIterator(sys.argv[1]):
                  if not isinstance(msg,bt2._EventMessageConst):
                      continue
                  counts["global"]+=1
                  event=msg.event
                  if event.name not in ("ros2:callback_start","ros2:callback_end",
                                        "ros2:rclcpp_callback_register",
                                        "ros2:rcl_subscription_init",
                                        "ros2:rclcpp_subscription_init",
                                        "ros2:rclcpp_subscription_callback_added"):
                      continue
                  if msg.default_clock_snapshot is None:
                      continue
                  vpid=int(event.common_context_field["vpid"])
                  if vpid!=pid:
                      counts["other_pid"]+=1
                      continue
                  p=event.payload_field
                  item={"name":event.name,
                        "timestamp_ns":int(msg.default_clock_snapshot.ns_from_origin),
                        "vpid":vpid,"vtid":int(event.common_context_field["vtid"])}
                  if event.name in ("ros2:callback_start","ros2:callback_end",
                                    "ros2:rclcpp_callback_register"):
                      item["callback"]=str(p["callback"])
                      if event.name=="ros2:rclcpp_callback_register":
                          item["symbol"]=str(p["symbol"])
                  elif event.name=="ros2:rcl_subscription_init":
                      item["subscription_handle"]=str(p["subscription_handle"])
                      item["topic_name"]=str(p["topic_name"])
                  elif event.name=="ros2:rclcpp_subscription_init":
                      item["subscription_handle"]=str(p["subscription_handle"])
                      item["subscription"]=str(p["subscription"])
                  elif event.name=="ros2:rclcpp_subscription_callback_added":
                      item["subscription"]=str(p["subscription"])
                      item["callback"]=str(p["callback"])
                  yield item
          try:
              trace,selected=select_cm_first_window(
                  cm_only_trace_events(),cm_pid=pid,first_pair=pair,
                  clock_anchors=anchors,max_cm_callbacks=40000,max_cm_regs=2048)
          except ValueError as exc:
              print("AXIA_G07_CYCLE30_CM_TRACE_FAIL_CLOSED "+str(exc))
              raise SystemExit(3)
          print("AXIA_G07_CYCLE30_TRACE_STREAM_BOUNDED "+
                json.dumps({"global_ros_events_scanned":counts["global"],
                  "other_pid_ros_events_ignored":counts["other_pid"],
                  "owned_cm_callback_events":selected["cm_callback_events_kept"],
                  "owned_cm_registration_events":selected["cm_register_events_kept"],
                  "raw_trace_exported":False,"owner_goal_authorized":False},
                  sort_keys=True))
          try:
              verified_handles,linked=resolve_cm_cmdvel_handles(trace,cm_pid=pid)
          except ValueError as exc:
              print("AXIA_G07_CYCLE31_TOPIC_CALLBACK_CHAIN_UNVERIFIED_HOLD "+str(exc))
              raise SystemExit(3)
