name: D08 Owner WSLg GUI-only renderer regression L0
on:
  push:
    branches:
      - fix/d08-owner-gui-renderer-isolation-20261120
    paths:
      - d08/scripts/d08_public_gazebo_l2.py
      - d08/tests/test_d08_owner_wslg_gui_renderer_only.py
      - .github/workflows/d08-owner-wslg-gui-renderer-l0.yml
  pull_request:
    paths:
      - d08/scripts/d08_public_gazebo_l2.py
      - d08/tests/test_d08_owner_wslg_gui_renderer_only.py
      - .github/workflows/d08-owner-wslg-gui-renderer-l0.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  owner-wslg-gui-isolation-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Native GLX SIGSEGV regression and scoped child environment
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s d08/tests -p 'test_d08_owner_wslg_gui_renderer_only.py' -v
          python3 -m py_compile d08/scripts/d08_public_gazebo_l2.py
          echo D08_OWNER_GUI_ONLY_SOFTWARE_L0_PASS_NO_WSLG_GPU_NO_GAZEBO
