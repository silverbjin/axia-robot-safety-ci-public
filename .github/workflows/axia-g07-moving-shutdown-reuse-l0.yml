name: AXIA G07 Moving shutdown reuse verified D06 L0
on:
  push:
    branches: [docs/g07-185-163-157-186-stabilization-recheck-20261120]
    paths: ['.github/workflows/axia-g07-moving-shutdown-reuse-l0.yml']
permissions:
  contents: read
jobs:
  existing-d06-regression-on-moving-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 95dc2cb468b000e04f73c253051d717c68ed3849
          path: student
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 86c68a121bedffbf1d2bb91e1efac6a40b88c798
          path: review
          persist-credentials: false
      - name: Reuse original per-manager first missing-ACK regression exactly
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = '95dc2cb468b000e04f73c253051d717c68ed3849'
          test "$(git -C review rev-parse HEAD)" = '86c68a121bedffbf1d2bb91e1efac6a40b88c798'
          python3 -m unittest discover -s review/d06/tests -p 'test_d06_localization_manager_callback_probe.py' -v
          python3 -m unittest discover -s review/d06/tests -p 'test_d06_c07_navigation_manager_service_liveness.py' -v
          (cd student/block_B/day07/h01_runtime && python3 -m unittest discover -s tools -p 'test_g07_task04_gui_bounded_teardown.py' -v)
          (cd student/block_B/day07/h01_runtime && python3 -m unittest discover -s tools -p 'test_g07_task04_shutdown_gui_order.py' -v)
          (cd student/block_B/day07/h01_runtime && python3 -m unittest discover -s tools -p 'test_g07_rmw_observer_executor_ab.py' -v)
          echo 'G07_MOVING_SHUTDOWN_D06_REUSE_L0_PASS_NO_ACTUAL_L2'
