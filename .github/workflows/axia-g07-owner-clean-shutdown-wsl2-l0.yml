name: AXIA G07 WSL2 Owner exact clean shutdown bootstrap (PUBLIC STATIC L0)
on:
  push:
    branches: [fix/g07-owner-clean-shutdown-wsl2-20261112]
    paths:
      - '.github/workflows/axia-g07-owner-clean-shutdown-wsl2-l0.yml'
      - 'scripts/axia_p2_g07_ci_pass_owner_wsl2_once.sh'
      - 'tests/test_g07_owner_clean_shutdown_wsl2_bootstrap_20261112.py'
permissions:
  contents: read
jobs:
  g07-exact-owner-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: No Goal/no private checkout, exact source plus 2 distinct public CI proofs
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s tests -p 'test_g07_owner_clean_shutdown_wsl2_bootstrap_20261112.py' -v
          echo AXIA_G07_OWNER_WSL2_CLEAN_SHUTDOWN_BOOTSTRAP_PUBLIC_L0_PASS_NO_ROS_NO_GOAL
