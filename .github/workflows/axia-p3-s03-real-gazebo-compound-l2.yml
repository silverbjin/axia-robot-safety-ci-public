# S03 one public CI-only actual Gazebo compound signal-loss L2.
# CM SIGSTOP+SIGCONT is a paused process, NOT a G06 SIGKILL crash.
name: AXIA P3 S03 real Gazebo Scan dropout plus CM pause one Goal L2
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p3-s03-real-gazebo-compound-l2.yml']
permissions:
  contents: read
concurrency:
  group: axia-p3-s03-real-compound-l2
  cancel-in-progress: false
jobs:
  real-s03-scan-drop-and-cm-pause:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Public fail-closed sim authorization checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Checkout exact immutable sealed Instructor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 8cfc4dfe9ac7431fbe3e8577894089fa8f9c2953
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact SHA and S03 unit/syntax tests BEFORE Goal or SIGSTOP
        shell: bash
        run: |
          set -Eeuo pipefail
          EXPECTED_SHA="8cfc4dfe9ac7431fbe3e8577894089fa8f9c2953"
          ACTUAL_SHA="$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          test "$ROS_DISTRO" = jazzy
          python3 -m unittest discover -s tests -p test_p3_s03_public_contract.py -v
          python3 -m unittest discover -s instructor/tests/unit -p test_p3_s03_compound_live_oracle.py -v
          python3 -m py_compile instructor/tools/p3_s03_cm_pause_ci.py instructor/tools/p3_s03_compound_live_oracle.py instructor/tools/p3_s03_compound_live_ci.py
          bash -n instructor/scripts/p2_no_goal_smoke_ci.sh
          echo AXIA_P3_S03_PUBLIC_9_PRIVATE_12_SOURCE_SYNTAX_PASS_NO_GOAL
      - name: Exact frozen G07 Docker runtime core parity, no apt pip
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          mkdir -p results/p3-s03-ci-combined
          export ROS_DOMAIN_ID=95 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION=axia_p2_s03_ci_95 AXIA_P0_SIM_ONLY=1
          python3 tools/p2_g07_owner_env_parity.py --mode ci --output results/p3-s03-ci-combined/core_parity.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          v=json.loads(Path('results/p3-s03-ci-combined/core_parity.json').read_text())
          assert v['status']=='CORE_PARITY_PASS'
          assert (v['checked_packages'],v['checked_official_files'])==(25,5)
          print('AXIA_P3_S03_G07_RUNTIME_25_5_PARITY_PASS')
          PY
      - name: Real isolated Gazebo Nav2 Goal + Scan drop + owned CM pause
        shell: bash
        env:
          ROS_DOMAIN_ID: '95'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_s03_ci_95
          AXIA_P0_SIM_ONLY: '1'
          AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '1'
          AXIA_P3_S03_CI_COMPOUND_ALLOWED: '1'
          AXIA_P3_S03_CI_CM_PAUSE_ALLOWED: '1'
          AXIA_G07_CI_OWNER_OBSERVER_PARITY: '1'
          AXIA_G07_OWNER_STARTUP_PARITY: '1'
          AXIA_G07_CI_OWNER_BAG_PARITY: '1'
          AXIA_P2_SMOKE_RESULTS: results/p3-s03-ci-combined/real-l2
        run: |
          set -Eeuo pipefail
          EXPECTED_SHA="8cfc4dfe9ac7431fbe3e8577894089fa8f9c2953"
          ACTUAL_SHA="$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)"
          test "$EXPECTED_SHA" = "$ACTUAL_SHA"
          EXPECTED_PRIVATE_SHA="$EXPECTED_SHA" PYTHONPATH="$PWD" python3 - <<'PY'
          import os
          from tools.p3_s01_public_contract import admit_s03
          assert admit_s03(dict(os.environ),source_sha=os.environ['EXPECTED_PRIVATE_SHA'],
            checkout_sha=os.environ['EXPECTED_PRIVATE_SHA'],case='S03',
            goals=1,goal=(-1.7,.7),cm_killed=False,
            operations=('scan_drop','cm_sigstop','cm_sigcont','scan_normal'))
          print('AXIA_P3_S03_CI_ONE_GOAL_BOUNDED_SIGSTOP_AUTHORIZED_NO_FAULT_YET')
          PY
          cd instructor
          timeout --signal=TERM --kill-after=10s 900s bash scripts/p2_no_goal_smoke_ci.sh || {
            echo AXIA_P3_S03_REAL_GAZEBO_COMPOUND_BLOCKED
            python3 ../tools/p3_s01_startup_first_boundary.py \
              --launch-log results/p3-s03-ci-combined/real-l2/launch.log \
              --native results/p3-s03-ci-combined/real-l2/startup_verdict.navigation_start.native.json \
              --output results/p3-s03-ci-combined/real-l2/first_nav_failure.json || true
            for f in results/p3-s03-ci-combined/real-l2/{staged_startup,launch,g07_ci_pregoal,p3_s03_compound,g07_ordered_shutdown,rosbag}.log;
            do if [[ -f "$f" ]];then echo "--- $(basename "$f") ---";tail -n 100 "$f";fi;done
            exit 2
          }
          python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          root=Path('results/p3-s03-ci-combined/real-l2')
          start=json.loads((root/'startup_verdict.json').read_text())
          r=json.loads((root/'p3_s03_compound/s03_compound_result.json').read_text())
          audit=json.loads((root/'p3_s03_compound/cm_pause/pause_audit.json').read_text())
          shutdown=json.loads((root/'g07_ordered_shutdown.json').read_text())
          cm=json.loads((root/'g07_shutdown_audit.json').read_text())
          assert start['status']=='SMOKE_READY' and not start['goal_sent']
          assert r['status']=='S03_REAL_COMPOUND_CANDIDATE' and r['goal_sent'] and r['fault_injected']
          assert r['oracle']['status']=='S03_REAL_SCAN_DROP_AND_CM_PAUSE_CANDIDATE',r
          assert len(r['goal_uuid'])==32 and r['goal_uuid']==r['oracle']['goal_uuid']
          assert r['oracle']['odom_zero_dwell_sec']>=1.0
          assert r['oracle']['stop_latency_sec']<=1.5 and r['oracle']['guard_latch_latency_sec']<=.9
          assert audit['signal']=='SIGSTOP' and audit['sigcont_restored']
          assert audit['owned_session_verified'] and audit['independent_guard_alive']
          assert not r['cm_killed'] and not r['formal_accepted'] and not r['certified_estop']
          assert r['oracle']['held_fault_manual_reset_rejection_tested'] is False
          assert shutdown['status']=='NAV2_LIFECYCLE_SHUTDOWN_ACK'
          assert shutdown['navigation_ack'] and shutdown['localization_ack']
          assert cm['status']=='SHUTDOWN_CLEAN_CANDIDATE' and cm['cm_exit_code']==0
          assert 'P2_L2_GRACEFUL_TEARDOWN' in (root/'teardown.txt').read_text()
          bag=root/'rosbag2';assert (bag/'metadata.yaml').is_file()
          dbs=list(bag.glob('*.db3'));assert len(dbs)==1
          c=sqlite3.connect('file:'+str(dbs[0])+'?mode=ro',uri=True)
          assert c.execute('pragma quick_check').fetchone()[0]=='ok'
          counts=dict(c.execute('select topics.name,count(messages.id) from topics left join messages on topics.id=messages.topic_id group by topics.name'))
          for name in ('/clock','/scan','/safety/scan','/odom','/cmd_vel_supervised','/cmd_vel_pre_guard','/cmd_vel','/axia/safety/state','/axia/p2/base_guard','/navigate_to_pose/_action/status'):
            assert counts.get(name,0)>0,(name,counts.get(name,0))
          print('AXIA_P3_S03_TRUE_GAZEBO_14_TOPIC_SQLITE_GOAL_SCAN_CM_GUARD_PASS')
          print('AXIA_P3_S03_REAL_SCAN_DROP_CM_SIGSTOP_GUARD_FIRST_LATCH_ODOM_CANCELED_CANDIDATE_PASS')
          print('AXIA_P3_S03_CM_CRASH_NOT_TESTED_HELD_FAULT_RESET_NOT_TESTED_G10_G11_FORMAL_HOLD')
          PY
      - name: Always delete private source and raw Gazebo/SQLite data
        if: always()
        shell: bash
        run: rm -rf -- instructor
