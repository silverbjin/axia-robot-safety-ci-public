          import bt2,json,sys
          from pathlib import Path
          sys.path.insert(0,str(Path("../unified-public").resolve()))
          from d06.live.g07_cycle29_first_cm_callback_trace import (
              classify_callback_gap,_first_source_pair)
          from d06.live.g07_cycle30_bounded_cm_trace import select_cm_first_window
          from d06.live.g07_cycle31_cm_topic_callback_identity import resolve_cm_cmdvel_handles
          root=Path("results/p2-g07-ci-moving/real-l2")
          event_path=root/"g07_ci_moving/actual_ros_events.jsonl"
          report_path=root/"g07_ci_moving/ci_moving_goal_result.json"
          cm_receipt=root/"g07_cm_owned_cpu_before.json"
          if not (event_path.is_file() and report_path.is_file() and cm_receipt.is_file()):
              print("AXIA_G07_CYCLE29_ORIGINAL_GOAL_CM_PID_OR_RMW_MISSING_HOLD")
              raise SystemExit(3)
          receipt=json.loads(cm_receipt.read_text())
          pid=receipt.get("cm_pid")
          assert type(pid) is int and pid>1, "CM_PID_NOT_OWNED_PROVEN"
          rows=[json.loads(x) for x in event_path.read_text().splitlines() if x.strip()]
          report=json.loads(report_path.read_text())
          anchors={"start":json.loads(Path(sys.argv[2]).read_text()),
                   "end":json.loads(Path(sys.argv[3]).read_text())}
          # Cycle30: actual L2 #43809629649 had >500k callback events
          # across unrelated ROS nodes. Iterate the trace ONCE, retain only
          # exact owned CM vpid and a bounded first output gap window.
          # Never silently truncate events of the CM itself. Preserve raw
          # trace only locally until this diagnostic step exits.
          pair=_first_source_pair(rows)
