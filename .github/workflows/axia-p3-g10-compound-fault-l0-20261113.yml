name: AXIA P3 G10 combined-fault fresh-reset isolated L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - '.github/workflows/axia-p3-g10-compound-fault-l0-20261113.yml'
permissions:
  contents: read
jobs:
  g10-isolated-l0:
    environment: axia-instructor-sealed
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: dd1040940fe615fd324cc49464d5d8129b5de1a4
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Verify exact private SHA and G10 combined fault synthetic oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'dd1040940fe615fd324cc49464d5d8129b5de1a4'
          export PYTHONPATH="$PWD/ros2_ws/src/axia_scenario_verifier"
          python3 -m unittest discover -s tests/unit -p test_p3_g10_compound.py -v
          echo AXIA_G10_COMPOUND_FAULT_L0_GREEN_ONLY_NO_ROS_NO_GOAL
      - name: Erase instructor source
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tests docs scripts fixtures tools configs .git
