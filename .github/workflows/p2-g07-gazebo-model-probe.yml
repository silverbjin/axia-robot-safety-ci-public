name: AXIA G07 native Gazebo pose CLI diagnostic (NO GOAL)
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/p2-g07-gazebo-model-probe.yml']
permissions: {contents: read}
jobs:
  actual-gazebo-model-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    environment: axia-instructor-sealed
    container:
      image: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 65b64dd4509a2067225ce6c44c9b32706abee28b
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Install pinned official Gazebo Harmonic/Nav2 Waffle once
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            procps git python3-yaml python3-colcon-common-extensions \
            ros-jazzy-nav2-bringup ros-jazzy-navigation2 ros-jazzy-nav2-minimal-tb3-sim \
            ros-jazzy-ros-gz ros-jazzy-rclpy ros-jazzy-rosgraph-msgs \
            ros-jazzy-nav-msgs ros-jazzy-sensor-msgs ros-jazzy-geometry-msgs \
            ros-jazzy-std-msgs ros-jazzy-std-srvs ros-jazzy-lifecycle-msgs \
            ros-jazzy-nav2-msgs ros-jazzy-action-msgs ros-jazzy-tf2-ros
      - name: Exact SHA + G07 native model probe during real NO GOAL readiness
        shell: bash
        env:
          ROS_DOMAIN_ID: '61'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
        run: |
          set -eo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 65b64dd4509a2067225ce6c44c9b32706abee28b
          set +u;source /opt/ros/jazzy/setup.bash;set -u
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/p2_no_goal_smoke_ci.sh')
          s=p.read_text()
          marker='# Stop the observer-owned launch; its clean shutdown remains independent'
          assert marker in s
          probe="""echo 'G07_NATIVE_GAZEBO_PROBE_BEGIN'
          set +e
          for args in 'model --help' 'model --list' 'model -m turtlebot3_waffle --pose -w default' 'model -m turtlebot3_waffle --pose'; do
            echo "G07_PROBE_CMD=gz $args"
            timeout 12s gz $args > /tmp/axia_gz_probe_stdout 2>/tmp/axia_gz_probe_stderr
            rc=$?
            echo "G07_PROBE_RC=$rc"
            echo 'G07_PROBE_STDOUT_BEGIN'; head -c 2400 /tmp/axia_gz_probe_stdout; echo
            echo 'G07_PROBE_STDERR_BEGIN'; head -c 2400 /tmp/axia_gz_probe_stderr; echo
          done
          set -e
          echo 'G07_NATIVE_GAZEBO_PROBE_END'
          """
          p.write_text(s.replace(marker,probe+'\n'+marker))
          PY
          timeout --signal=TERM --kill-after=5s 650s bash scripts/p2_no_goal_smoke_ci.sh
          echo 'G07_GAZEBO_NATIVE_MODEL_PROBE_ACTUAL_L2_NO_GOAL_NO_FAULT'
      - name: Delete private checkout and no retained artifacts
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts docs configs tests results build install log .git
