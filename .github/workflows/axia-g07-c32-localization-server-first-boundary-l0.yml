name: AXIA G07 C32 official Localization first server callback RED GREEN L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-c32-localization-server-first-boundary-l0.yml']
permissions:
  contents: read
jobs:
  localization-server-boundary-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact sealed C32 Instructor
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: fe2081a0cd3013779ca82361756602fdac50a539
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Reduced actual first server boundary fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = fe2081a0cd3013779ca82361756602fdac50a539
          python3 -m py_compile tools/p2_g07_lifecycle_service.py tools/p2_g07_localization_shutdown_trace.py
          python3 -m unittest discover -s tests/unit -p test_g07_c32_localization_server_boundary.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_native_shutdown_ack_trace.py -v
          python3 -m py_compile tools/p2_g07_lifecycle_service.py tools/p2_g07_ordered_shutdown.py
          bash -n scripts/p2_no_goal_smoke_ci.sh
          python3 -m py_compile tools/p2_g07_ci_goal_terminal.py
          bash -n scripts/p2_no_goal_smoke_ci.sh
          grep -Fq 'AXIA_G07_C32_QUIESCE_GOAL:-0' scripts/p2_no_goal_smoke_ci.sh
          grep -Fq 'AXIA_G07_C32_EXACT_GOAL_TERMINAL_VERIFIED_BEFORE_NAV2_SHUTDOWN' scripts/p2_no_goal_smoke_ci.sh
          python3 -m unittest discover -s tests/unit -p test_g07_c32_goal_terminal_before_lifecycle.py -v
          echo AXIA_G07_C32_SERVER_PHASE_AND_GOAL_TERMINAL_L0_PASS
      - name: Cleanup
        if: always()
        run: rm -rf -- tests tools scripts ros2_ws docs
