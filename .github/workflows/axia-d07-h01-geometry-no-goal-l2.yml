# D07-H01 public simulation NO GOAL: first prove official Nav2 can route
# around the real preloaded Waffle LiDAR-visible cylinder; no driving authority.
# This is not D07-H01 moving avoidance L2, Owner L3 or safety certification.
name: AXIA D07 H01 real Gazebo detour geometry NO GOAL L2
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-d07-h01-geometry-no-goal-l2.yml']
permissions:
  contents: read
concurrency:
  group: axia-d07-h01-real-geometry-no-goal
  cancel-in-progress: false
jobs:
  real-gazebo-real-nav2-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 42
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Exact public H01 admission contract from unmerged feature branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 5b6b10322ee3682f43815cd1a8d4b8135811f8fc
          path: ci-public-admission
          persist-credentials: false
      - name: Exact sealed Instructor H01 source, never publish private repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: dc5f8e2b2c5bf8e4bbab11804490b5a66b59014d
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Mandatory exact source, L0, no-goal code and shell syntax
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = 'dc5f8e2b2c5bf8e4bbab11804490b5a66b59014d'
          test "$(git -C ci-public-admission -c safe.directory="$PWD/ci-public-admission" rev-parse HEAD)" = '5b6b10322ee3682f43815cd1a8d4b8135811f8fc'
          ( cd ci-public-admission && python3 -m unittest discover -s tests -p test_d07_h01_public_contract.py -v )
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_d07_h01_oracle.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_runner_diagnostics.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_costmap_roundtrip.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_path_return.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_costmap_spatial.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_costmap_localization.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_drift.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_drift_runner.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_clearing_residue.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_costmap_cell_history.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_roi_path_probe_gate.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_path_cost_correlation.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_geometry_native_contact.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_live_obstacle_config.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_native_layers.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_amcl_pre_goal.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_free_planner_repeat.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_shared_free_route.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_first_lethal_native.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_nav2_scan_source.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_preintrusion_grid_baseline.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_native_corridor_return.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_native_topic_catchup.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_contact.py -v
          python3 -m py_compile tools/d07_h01_oracle.py tools/d07_h01_costmap_drift.py tools/d07_h01_geometry_l2.py tools/d07_h01_path_cost_correlation.py tools/d07_h01_nav2_clear_config.py tools/d07_h01_native_costmap_layers.py tools/d07_h01_amcl_pre_goal.py tools/d07_h01_free_planner_repeat.py tools/d07_h01_nav2_scan_source.py tools/d07_h01_preintrusion_baseline.py tools/d07_h01_native_corridor_return.py tools/d07_h01_native_topic_catchup.py
          bash -n scripts/p2_no_goal_smoke_ci.sh
          echo 'AXIA_D07_H01_PUBLIC_ADMISSION_PRIVATE_ORACLE_SYNTAX_L0_PASS_NO_ROS_NO_GOAL'
      - name: Exact official Jazzy/Harmonic/Nav2 runtime 25+5 parity
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          mkdir -p results/d07-h01-ci
          export ROS_DOMAIN_ID=95 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION=axia_p2_d07_h01_95 AXIA_P0_SIM_ONLY=1
          python3 tools/p2_g07_owner_env_parity.py --mode ci --output results/d07-h01-ci/runtime.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('results/d07-h01-ci/runtime.json').read_text())
          assert r['status']=='CORE_PARITY_PASS'
          assert (r['checked_packages'],r['checked_official_files'])==(25,5)
          print('AXIA_D07_H01_EXACT_RUNTIME_G07_25_PACKAGE_5_FILE_PASS')
          PY
      - name: ACTUAL Gazebo real Waffle and official Nav2 before/after detour (NO GOAL)
        shell: bash
        env:
          ROS_DOMAIN_ID: '95'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_d07_h01_95
          AXIA_P0_SIM_ONLY: '1'
          AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '1'
          AXIA_D07_H01_CI_ALLOWED: '1'
          AXIA_D07_H01_GEOMETRY_ONLY: '1'
          AXIA_G07_CI_OWNER_OBSERVER_PARITY: '1'
          AXIA_G07_OWNER_STARTUP_PARITY: '1'
          AXIA_G07_CI_OWNER_BAG_PARITY: '1'
          AXIA_P2_SMOKE_RESULTS: results/d07-h01-ci/real-l2
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = 'dc5f8e2b2c5bf8e4bbab11804490b5a66b59014d'
          cd instructor
          timeout --signal=TERM --kill-after=10s 870s bash scripts/p2_no_goal_smoke_ci.sh || {
            echo 'AXIA_D07_H01_REAL_GAZEBO_GEOMETRY_NO_GOAL_BLOCKED'
            for f in results/d07-h01-ci/real-l2/{staged_startup,launch,g07_ci_pregoal,d07_h01_geometry,g07_ordered_shutdown,rosbag}.log; do
              if [[ -f "$f" ]]; then echo "--- $(basename "$f") ---"; tail -n 100 "$f"; fi
            done
            exit 2
          }
          python3 - <<'PY'
          import json,sqlite3
          from pathlib import Path
          root=Path('results/d07-h01-ci/real-l2')
          pre=json.loads((root/'g07_ci_pregoal/owner_pregoal_l2.json').read_text())
          geo=json.loads((root/'d07_h01_geometry/d07_h01_geometry.json').read_text())
          assert pre['status']=='P2_G07_OWNER_PREGOAL_L2_READY_NO_GOAL'
          assert geo['status'] in (
              'D07_H01_REAL_NAV2_GEOMETRY_READY_NO_GOAL',
              'D07_H01_REAL_NAV2_GEOMETRY_CONTACT_HOLD_NO_GOAL'),geo
          if geo['status']=='D07_H01_REAL_NAV2_GEOMETRY_CONTACT_HOLD_NO_GOAL':
              assert geo['contact_topic_proven'] is False
              assert geo['route_oracle']['motion_admitted'] is False
              print('AXIA_D07_H01_CONTACT_HOLD_NO_GOAL_MOTION_NOT_ADMITTED')
          else:
              assert geo['contact_topic_proven'] is True
          assert geo['source_sha']=='dc5f8e2b2c5bf8e4bbab11804490b5a66b59014d'
          assert geo['goal_sent'] is False and geo['real_nav2'] is True
          assert geo['real_laser_scan'] is True and geo['actual_costmap_obstacle_observed'] is True
          assert geo['path_changed'] and geo['path_viable']
          assert geo['obstacle_restored_away'] is True
          assert geo['route_oracle']['geometry_ready'] is True
          assert geo['certified_estop'] is False and geo['formal_accepted'] is False
          assert (root/'d07_h01_geometry/d07_h01_before_after_actual_nav2_paths.json').is_file()
          bag=root/'rosbag2'
          assert (bag/'metadata.yaml').exists()
          dbs=list(bag.glob('*.db3'));assert len(dbs)==1
          conn=sqlite3.connect('file:'+str(dbs[0])+'?mode=ro',uri=True)
          assert conn.execute('pragma quick_check').fetchone()[0]=='ok'
          print('AXIA_D07_H01_REAL_GAZEBO_GEOMETRY_ONLY_SCOPED_PASS_CONTACT_MOTION_SEPARATE')
          print('AXIA_D07_H01_MOTION_GOAL_NOT_SENT_ODOM_CONTROL_AND_CONTACT_FREE_NOT_TESTED_OWNER_L3_NOT_RUN')
          PY
      - name: Always erase private source and original CI rosbag after log evidence
        if: always()
        shell: bash
        run: rm -rf -- instructor ci-public-admission
