name: AXIA P2 G07 relocated demo obstacle / open-map corridor L0 + L2 no Goal
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/p2-g07-relocated-obstacle-l2.yml']
permissions:
  contents: read
concurrency:
  group: axia-p2-g07-relocated-open-corridor-l2
  cancel-in-progress: false
jobs:
  private-l0:
    runs-on: ubuntu-24.04
    environment: axia-instructor-sealed
    timeout-minutes: 10
    steps:
      - name: Checkout exact isolated private P2 change
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 0f86ab6c4fda9eff7256087709be641fdd0df0b5
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Verify exact private SHA + RED-to-GREEN P2 G07 and prior safety regressions
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 0f86ab6c4fda9eff7256087709be641fdd0df0b5
          python3 -m pip install --disable-pip-version-check -q pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_demo_corridor_relocation.py \
            tests/unit/test_p2_g07_coordinate_frames.py \
            tests/unit/test_p2_g07_live_phase.py \
            tests/unit/test_p2_g07_preloaded_contact_world.py \
            tests/unit/test_p2_g07_mvp_motion_gate.py \
            tests/unit/test_p2_g07_stop_geometry_owner.py \
            tests/unit/test_p2_g07_physical_preflight_contract.py \
            tests/unit/test_p2_t07_owner_contract.py
          python3 -m compileall -q tools/p2_g07_demo_corridor.py tools/p2_l3_live_session.py tools/p2_l3_coordinate_frames.py
          bash -n scripts/p2_owner_l3_wsl2.sh scripts/p2_no_goal_smoke_ci.sh
          echo 'P2_G07_RELOCATED_CORRIDOR_L0_PASS_GAZEBO_NOT_RUN'
      - name: Remove private source
        if: always()
        run: rm -rf -- .git tools scripts tests configs ros2_ws docs fixtures results
