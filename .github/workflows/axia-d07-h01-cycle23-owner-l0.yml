# D07-H01 WSL2 one-shot static L0; no ROS/Gazebo, no moving Goal.
name: AXIA D07-H01 Cycle23 bounded no-ACK Owner bootstrap L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-d07-h01-cycle23-owner-l0.yml']
permissions:
  contents: read
jobs:
  exact-owner-bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Clone exact public Owner candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: f3d203612800d06c3be922cc3cd707e0bba78825
          path: owner-source
          persist-credentials: false
      - name: Clone exact private D07 source sealed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 5376fbf15acc6d6539b99f5387bbfade04f7ee62
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact Owner bootstrap and FIRST native failure priority L0
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C owner-source rev-parse HEAD)" = 'f3d203612800d06c3be922cc3cd707e0bba78825'
          test "$(git -C instructor rev-parse HEAD)" = '5376fbf15acc6d6539b99f5387bbfade04f7ee62'
          bash -n owner-source/scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh
          python3 -m unittest discover -s owner-source/tests -p test_axia_d07_gpu_gui_owner_contract.py -v
          bash owner-source/scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh --self-check
          grep -Fq "owner_first_staged_boundary.txt" owner-source/scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh
          ! grep -q 'AXIA_MVP_DEMO_ACCEPTED=PASS' owner-source/scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh
          echo D07_H01_CYCLE23_OWNER_ONE_SHOT_L0_PASS_NO_ROS_NO_GAZEBO_NO_GOAL
      - name: Destroy sealed Instructor checkout
        if: always()
        run: rm -rf -- instructor
