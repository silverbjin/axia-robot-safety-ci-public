    paths:
      - 'd06/scripts/axia_d06_g07_classroom_once.sh'
      - 'd06/tests/test_d06_g07_classroom_reuse.py'
      - 'd06/tests/test_d06_g07_owner_mode_field_regression.py'
      - 'd06/tests/test_d06_g07_here_doc_execution.py'
      - '.github/workflows/axia-d06-g07-owner-native-world-regression-20261118.yml'
      - '.github/workflows/axia-d06-g07-fixed-owner-native-moving-l2-20261118.yml'
      - '.github/workflows/axia-d06-g07-classroom-reuse-public-l0-20261118.yml'
      - 'd06/docs/AXIA_D06_G07_CLASSROOM_REUSE_20261118_KO.md'
      - 'd06/docs/AXIA_D06_WSL2_OWNER_CI_KERNEL_FIRST_FAILURE_RCA_20261118_KO.md'
  pull_request:
