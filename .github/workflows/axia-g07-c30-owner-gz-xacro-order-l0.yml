name: AXIA G07 C30 owner Gazebo world xacro before server RED GREEN L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-c30-owner-gz-xacro-order-l0.yml']
permissions:
  contents: read
jobs:
  owner-gazebo-xacro-race:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 7de5f39e8d9cf7c21998b5df7ea2dd5c0edd0b4c
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Replay sanitized owner gz255 first failure and prohibit Gazebo before Xacro is ready
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '7de5f39e8d9cf7c21998b5df7ea2dd5c0edd0b4c'
          python3 -m unittest discover -s tests/unit -p test_g07_c30_xacro_gz_startup_order.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c29_rmw_gap_first_cause.py -v
          python3 -m py_compile ros2_ws/src/axia_safety_bringup/launch/axia_tb3_p2.launch.py tools/p2_g07_world_xacro_order.py
          echo AXIA_G07_C30_GAZEBO_XACRO_FIRST_STARTUP_L0_PASS_NO_ROS_NO_GOAL
      - name: Clean sealed Instructor source
        if: always()
        shell: bash
        run: rm -rf -- .git docs ros2_ws scripts tools tests fixtures scenarios configs results training
