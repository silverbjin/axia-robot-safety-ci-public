name: AXIA P2 G07 targeted source and Zone L0 (NO Gazebo / NO Goal)
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - '.github/workflows/p2-g07-protected-minimal.yml'
      - 'scripts/axia_p2_g07_owner_once.sh'
      - 'tests/test_p2_g07_owner_once.py'
  pull_request:
    paths:
      - '.github/workflows/p2-g07-protected-minimal.yml'
      - 'scripts/axia_p2_g07_owner_once.sh'
      - 'tests/test_p2_g07_owner_once.py'
permissions:
  contents: read
concurrency:
  group: axia-p2-g07-${{ github.ref }}
  cancel-in-progress: true
jobs:
  public-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Public G07 one-case Owner wrapper and no-motion contract
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_p2_g07_owner_once.py -v
          echo 'P2_G07_PUBLIC_BOOTSTRAP_PASS_NO_GAZEBO_NO_GOAL'
  private-l0:
    needs: public-contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/release/p2-g06-cm-ttl-20261110'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 0af856dbf5dfcbbce62a6e6bd3242a25c91a343d
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Exact private G07 SHA and impacted pure L0 tests only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '0af856dbf5dfcbbce62a6e6bd3242a25c91a343d'
          python3 -m pip install --disable-pip-version-check --quiet pytest==8.3.5 PyYAML==6.0.2
          python3 -m pytest -q -ra tests/unit/test_p2_g07_live_phase.py tests/unit/test_p2_t07_owner_contract.py tests/unit/test_p2_evidence_oracles.py
          python3 -m py_compile tools/p2_l3_acceptance_contract.py tools/p2_l3_live_session.py
          bash -n scripts/p2_owner_l3_wsl2.sh
          echo 'P2_G07_PRIVATE_L0_PASS_GAZEBO_NOT_RUN'
      - name: Remove private checkout and any hidden content
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts docs configs tests results .git
