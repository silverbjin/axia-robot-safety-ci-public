name: AXIA CI07B protected immutable-bundle Python audit (NO AWS upload)
on:
  push:
    branches: [feat/secure-instructor-cloud-bridge]
    paths:
      - '.github/workflows/ci07b-private-bundle-audit.yml'
permissions:
  contents: read
concurrency:
  group: axia-ci07b-unit
  cancel-in-progress: false
jobs:
  ci07b-private-python:
    if: github.repository == 'silverbjin/axia-robot-safety-ci-public' && github.actor == 'silverbjin' && github.ref == 'refs/heads/feat/secure-instructor-cloud-bridge' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: axia-instructor-sealed
    steps:
      - name: Exact pinned private source in ephemeral directory
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 16f16eb837513e1a8b06d186f4c3d579507f4fbe
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
          fetch-depth: 1
          path: _instructor_private
      - name: Run private-only synthetic Python without publishing stdout
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          set +e
          ( cd _instructor_private && PYTHONPATH=.:tests/unit python3 -m unittest discover -s tests/unit -p test_p1_s3_custody.py -v ) > "$LOG" 2>&1
          RC=$?
          set -e
          if [[ "$RC" == 0 ]] && grep -Eq '^Ran 13 tests in ' "$LOG" && grep -qx 'OK' "$LOG"; then
            echo 'AXIA_CI07B_PRIVATE_UNIT=PASS tests=13 gate_accepted=false certified_estop=false'
          else
            echo 'AXIA_CI07B_PRIVATE_UNIT=BLOCKED reason=UNIT_CONTRACT_FAILED gate_accepted=false certified_estop=false'
            exit 2
          fi
      - name: Delete private source and temporary evidence
        if: always()
        shell: bash
        run: |
          rm -rf _instructor_private
          echo AXIA_PRIVATE_TEMP_CLEANUP_DONE
