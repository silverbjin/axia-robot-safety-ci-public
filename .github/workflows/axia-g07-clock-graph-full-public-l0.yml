name: AXIA G07 Clock Window Graph Full Public L0 Safety Contracts
on:
  push:
    branches: ['fix/g07-clock-retention-postgoal-graph-ci-20261121']
    paths:
      - '.github/workflows/axia-g07-clock-graph-full-public-l0.yml'
      - 'tests/test_g07_jazzy_info_dict_independent_cm.py'
      - 'd06/diagnostic/g07_independent_cm_rmw_witness.py'
permissions: {contents: read}
jobs:
  full-public-and-minimum-student-safety-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: public, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 92fa6c137eb751792eb6f830f55e64c4803c195c
          path: student
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with: {python-version: '3.12'}
      - name: Full public regression plus exact Student first seven-channel fix
        run: |
          set -Eeuo pipefail
          python -m pip install pytest==8.3.5 Pillow==11.3.0
          cd public
          python3 -m unittest discover -s tests -p 'test_g07_jazzy_info_dict_independent_cm.py' -v
          python3 -m pytest -q -ra tests
          cd ../student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_clock_window_postgoal_graph.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_scan_wall_pregoal.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_observer_io_first_boundary.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_task04_mvp_minimal_fix.py' -v
          echo 'AXIA_G07_CLOCK_GRAPH_PUBLIC_FULL_L0_PASS_REAL_GAZEBO_SEPARATE'
