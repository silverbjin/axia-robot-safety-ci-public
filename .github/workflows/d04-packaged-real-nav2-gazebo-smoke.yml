name: AXIA D04 installed Nav2 Gazebo 3x moving person and clean shutdown

on:
  push:
    branches: ['feature/d04-yolo-ros-package-20261109']
    paths:
      - 'scripts/d04_package_nav2_real_smoke.py'
      - 'scripts/d04_packaged_stability_3x.py'
      - 'scripts/d04_nav2_orderly_shutdown.py'
      - 'scripts/d04_nav2_initialpose_ready.py'
      - 'scripts/d04_bbox_motion_gate.py'
      - 'scripts/d04_yolo_person_runtime.py'
      - 'tests/test_d04_closeout.py'
      - 'scripts/d04_packaged_stability_3x.py'
      - 'scripts/d04_nav2_orderly_shutdown.py'
      - 'scripts/d04_nav2_initialpose_ready.py'
      - 'scripts/d04_bbox_motion_gate.py'
      - 'scripts/d04_yolo_person_runtime.py'
      - 'tests/test_d04_closeout.py'
      - 'tests/test_d04_packaged_nav2_real_smoke.py'
      - 'd04/axia_d04_vision_demo/**'
      - '.github/workflows/d04-packaged-real-nav2-gazebo-smoke.yml'
  pull_request:
    paths:
      - 'scripts/d04_package_nav2_real_smoke.py'
      - 'tests/test_d04_packaged_nav2_real_smoke.py'
      - 'd04/axia_d04_vision_demo/**'
      - '.github/workflows/d04-packaged-real-nav2-gazebo-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  l0-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit gates only (not Gazebo/YOLO success)
        run: |
          set -euo pipefail
          python -m pip install pytest==8.3.5
          python -m compileall -q scripts/d04_package_nav2_real_smoke.py scripts/d04_yolo_person_runtime.py scripts/d04_packaged_stability_3x.py scripts/d04_bbox_motion_gate.py scripts/d04_nav2_orderly_shutdown.py scripts/d04_nav2_initialpose_ready.py
          python -m pytest -q tests/test_d04_closeout.py tests/test_d04_packaged_nav2_real_smoke.py tests/test_d04_nav2_headless_regression.py tests/test_d04_yolo_person_runtime.py tests/test_d04_waffle_pi_rgb_preflight.py

  external-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Check official Gazebo example actor URL without redistribution
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axia-d04-assets
          curl --fail -L --retry 3 --retry-delay 2 --connect-timeout 15 \
            --max-time 100 -o /tmp/axia-d04-assets/walk.dae \
            'https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae'
          test -s /tmp/axia-d04-assets/walk.dae
          grep -qi 'COLLADA' /tmp/axia-d04-assets/walk.dae
          file /tmp/axia-d04-assets/walk.dae
          sha256sum /tmp/axia-d04-assets/walk.dae
      - name: Check AGPL-3.0 evaluation-only YOLO26n ONNX model SHA
        shell: bash
        run: |
          set -euo pipefail
          curl --fail -L --retry 3 --retry-delay 2 --connect-timeout 15 \
            --max-time 110 -o /tmp/axia-d04-assets/yolo26n.onnx \
            'https://huggingface.co/unileon-robotics/YOLO26-ONNX/resolve/main/yolo26n.onnx'
          echo '4f44c33cea12d4b5785e5e7c0a20c13d0c62a77de607ce96a40d6036c7d7bbcf  /tmp/axia-d04-assets/yolo26n.onnx' | sha256sum -c -
          echo "MODEL_LICENSE=AGPL-3.0; ephemeral CI evaluation only, no distribution"
          rm -f /tmp/axia-d04-assets/yolo26n.onnx /tmp/axia-d04-assets/walk.dae

  real-gazebo-package:
    needs: [l0-contracts, external-assets]
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ros:jazzy-ros-base-noble
    env:
      AXIA_TESTED_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      DEBIAN_FRONTEND: noninteractive
      MAKEFLAGS: -j2
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Install official ROS Jazzy Gazebo Harmonic and minimal C++ build deps
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            git curl ca-certificates build-essential cmake pkg-config \
            python3-colcon-common-extensions python3-rosdep \
            ros-jazzy-turtlebot3-gazebo ros-jazzy-ros-gz \
            ros-jazzy-nav2-bringup ros-jazzy-nav2-minimal-tb3-sim ros-jazzy-navigation2 \
            ros-jazzy-image-view ros-jazzy-xacro \
            ros-jazzy-rclpy ros-jazzy-sensor-msgs ros-jazzy-cv-bridge \
            ros-jazzy-geometry-msgs ros-jazzy-std-srvs \
            ros-jazzy-pluginlib ros-jazzy-vision-msgs ros-jazzy-message-filters \
            ros-jazzy-tf2-ros ros-jazzy-lifecycle-msgs \
            libcurl4-openssl-dev libopencv-dev python3-opencv python3-numpy \
            libgl1-mesa-dri libglx-mesa0 xvfb xauth
      - name: Fetch pinned MIT yolo_ros 5.0.0 source and build actual C++ engine
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          mkdir -p /tmp/axia-yolo-ws/src
          git clone https://github.com/mgonzs13/yolo_ros.git /tmp/axia-yolo-ws/src/yolo_ros
          git -C /tmp/axia-yolo-ws/src/yolo_ros checkout --detach 94d2dd500cb26027ee9c019f4d3a02029ac615cc
          test "$(git -C /tmp/axia-yolo-ws/src/yolo_ros rev-parse HEAD)" = "94d2dd500cb26027ee9c019f4d3a02029ac615cc"
          # Upstream vendor's bare curl -L can accept a transient 92-byte
          # GitHub release error page and then fail extracting it as a tarball.
          # Fetch only the official Microsoft release asset with strict checks.
          ORT=/tmp/axia-ort-cache/onnxruntime-linux-x64-1.20.0.tgz
          mkdir -p /tmp/axia-ort-cache
          for url in \
            'https://github.com/microsoft/onnxruntime/releases/download/v1.20.0/onnxruntime-linux-x64-1.20.0.tgz' \
            'https://api.github.com/repos/microsoft/onnxruntime/releases/assets/202999196'; do
            if curl --fail --location --retry 4 --retry-all-errors --retry-delay 2 \
                --connect-timeout 15 --max-time 130 \
                -H 'Accept: application/octet-stream' -o "${ORT}.tmp" "$url" \
               && test "$(stat -c %s "${ORT}.tmp")" = "6184676" \
               && tar -tzf "${ORT}.tmp" > /tmp/axia-ort-cache/archive_members.txt \
               && grep -Fq 'lib/libonnxruntime.so' /tmp/axia-ort-cache/archive_members.txt; then
              mv -f "${ORT}.tmp" "$ORT"
              break
            fi
            rm -f "${ORT}.tmp"
          done
          test -s "$ORT"
          test "$(stat -c %s "$ORT")" = "6184676"
          tar -tzf "$ORT" >/dev/null
          echo "OFFICIAL_ONNXRUNTIME_1_20_0_ARCHIVE_VERIFIED"
          sha256sum "$ORT"
          # The upstream ONNXRUNTIME_URL branch uses CMake NAME_WE which
          # truncates dotted versions (1.20.0 -> 1), causing install failure.
          # Use upstream-supported ONNXRUNTIME_ROOT with exact extract directory.
          tar -xzf "$ORT" -C /tmp/axia-ort-cache
          ORT_ROOT=/tmp/axia-ort-cache/onnxruntime-linux-x64-1.20.0
          test -s "$ORT_ROOT/lib/libonnxruntime.so"
          test -d "$ORT_ROOT/include"
          echo "ONNXRUNTIME_ROOT_EXTRACT_VERIFIED=$ORT_ROOT"
          cd /tmp/axia-yolo-ws
          colcon build --merge-install --executor sequential --packages-up-to yolo_bringup \
            --cmake-args -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            "-DONNXRUNTIME_ROOT=$ORT_ROOT" \
            --event-handlers console_direct+
          source install/setup.bash
          ros2 pkg prefix yolo_bringup
          ros2 pkg prefix yolo_ros
      - name: Build installed D04 ROS2 package
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/axia-yolo-ws/install/setup.bash
          colcon build --base-paths d04/axia_d04_vision_demo \
            --packages-select axia_d04_vision_demo --event-handlers console_direct+
          source install/setup.bash
          ros2 pkg prefix axia_d04_vision_demo
      - name: Fetch person actor and pinned ONNX model (not uploaded or committed)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/axia-d04-assets
          curl --fail -L --retry 3 --connect-timeout 15 --max-time 100 \
            -o /tmp/axia-d04-assets/walk.dae \
            'https://fuel.gazebosim.org/1.0/Mingfei/models/actor/tip/files/meshes/walk.dae'
          curl --fail -L --retry 3 --connect-timeout 15 --max-time 110 \
            -o /tmp/axia-d04-assets/yolo26n.onnx \
            'https://huggingface.co/unileon-robotics/YOLO26-ONNX/resolve/main/yolo26n.onnx'
          echo '4f44c33cea12d4b5785e5e7c0a20c13d0c62a77de607ce96a40d6036c7d7bbcf  /tmp/axia-d04-assets/yolo26n.onnx' | sha256sum -c -
          sha256sum /tmp/axia-d04-assets/walk.dae
      - name: Run installed package actual official Nav2/Gazebo YOLO inference
        shell: bash
        env:
          AXIA_ACTOR_DAE: /tmp/axia-d04-assets/walk.dae
          AXIA_ONNX_PATH: /tmp/axia-d04-assets/yolo26n.onnx
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          source /tmp/axia-yolo-ws/install/setup.bash
          source install/setup.bash
          test -n "$(ros2 pkg prefix axia_d04_vision_demo)"
          xvfb-run -a -s '-screen 0 1280x720x24' \
            python3 scripts/d04_packaged_stability_3x.py
      - name: Remove AGPL model and actor binaries before artifact collection
        if: always()
        shell: bash
        run: rm -f /tmp/axia-d04-assets/yolo26n.onnx /tmp/axia-d04-assets/walk.dae || true
      - name: Upload only logs, world text, ROS results and rendered PNG (no weights)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d04-packaged-real-nav2-person-3x
          path: results/d04-packaged-nav2-stability/
          retention-days: 14
          if-no-files-found: warn
