          print('AXIA_D07_C27_OWNER_FIRST_NATIVE_GPU_SOFTWARE_L0_PASS')
          PY
          test "$(git hash-object scripts/axia_d07_h01_gpu_gui_owner_wsl2_once.sh)" = b2874553a50fc784afc5c1bf49037bd46e6a7c3d
