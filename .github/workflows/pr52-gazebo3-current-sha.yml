name: AXIA P1 PR52 exact-SHA official Gazebo 3x no-prepause prelocal (no Goal)
on:
  push:
    branches: [feat/secure-instructor-cloud-bridge]
    paths:
      - '.github/workflows/pr52-gazebo3-current-sha.yml'
      - 'scripts/private_pr52_gazebo3_ci.py'
      - 'tests/test_private_pr52_gazebo3_ci.py'
permissions:
  contents: read
concurrency:
  group: axia-pr52-real-gazebo3-current-sha
  cancel-in-progress: false
jobs:
  public-no-motion-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Ensure latest private SHA and no Goal/Fault public dispatch
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_private_pr52_gazebo3_ci.py -v
          python3 -m compileall -q scripts/private_pr52_gazebo3_ci.py
  protected-current-sha-gazebo3:
    needs: public-no-motion-guard
    if: github.repository == 'silverbjin/axia-robot-safety-ci-public' && github.actor == 'silverbjin' && github.ref == 'refs/heads/feat/secure-instructor-cloud-bridge' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    container:
      image: ros:jazzy-ros-base-noble
    environment:
      name: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Require protected private source token without printing it
        shell: bash
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.AXIA_CLOUD_CI }}
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: f60ccc9e9da4f1f787df8bc2f66ebc8554250928
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
          fetch-depth: 1
          path: _instructor_private
      - name: Install official ROS2 Jazzy Nav2 Waffle Gazebo Harmonic
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential cmake procps python3-yaml python3-pytest \
            python3-colcon-common-extensions \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-nav2-minimal-tb3-sim ros-jazzy-ros-gz \
            ros-jazzy-rosbag2 ros-jazzy-rosbag2-storage-default-plugins \
            ros-jazzy-rosgraph-msgs ros-jazzy-tf2-ros \
            ros-jazzy-nav2-msgs ros-jazzy-rclpy ros-jazzy-action-msgs \
            ros-jazzy-nav-msgs ros-jazzy-sensor-msgs ros-jazzy-std-msgs \
            ros-jazzy-std-srvs ros-jazzy-geometry-msgs ros-jazzy-lifecycle-msgs
      - name: Execute existing protected official Nav2 overlay and Gazebo 3x
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          set -u
          python3 scripts/private_pr52_gazebo3_ci.py --private-root _instructor_private
      - name: Delete raw private checkout and evidence unconditionally
        if: always()
        shell: bash
        run: |
          rm -rf _instructor_private
          echo AXIA_PR52_PRIVATE_CLEANUP_COMPLETE
