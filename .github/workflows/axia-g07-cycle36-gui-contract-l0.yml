name: AXIA G07 Cycle36 GUI integrated restore contract L0
on:
  push:
    branches: ['fix/g07-cycle36-gui-restore-ci-first-20261116']
    paths:
      - '.github/workflows/axia-g07-cycle36-gui-contract-l0.yml'
      - 'd06/tests/test_g07_cycle36_gui_restore.py'
      - 'd06/scripts/g07_shared_gui_clients.sh'
      - 'd06/docs/G07_CYCLE36_RESTORE_POINT_AND_DEVELOPMENT_INVENTORY_20261116_KO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-gui-contract-no-ros:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Cycle36 public contract (RED then GREEN)
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s d06/tests -p 'test_g07_cycle36_gui_restore.py' -v
          bash -n d06/scripts/g07_shared_gui_clients.sh
          echo AXIA_G07_CYCLE36_PUBLIC_GUI_CONTRACT_L0_PASS_NO_ROS_NO_GOAL
# Private Instructor source stays sealed: its tests must be run only in the
# already-authorized protected release workflow, never a feature-branch job.
# This public L0 is intentionally NO_ROS_NO_GOAL and not a private acceptance.
