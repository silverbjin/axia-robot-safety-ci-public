# AXIA G07 Cycle37 SceneBroadcaster RED->GREEN L0, NO ROS, NO GOAL.
name: AXIA G07 Cycle37 SceneBroadcaster contract L0
on:
  push:
    branches: ['release/p2-g06-cm-ttl-20261110']
    paths: ['.github/workflows/axia-g07-cycle37-scene-broadcaster-l0.yml']
permissions:
  contents: read
jobs:
  contract:
    runs-on: ubuntu-24.04
    environment: axia-instructor-sealed
    timeout-minutes: 10
    steps:
      - name: Pinned private instructor Cycle37 candidate
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: a990366ed6189d7b943db0fb9b88af6effb77017
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Real structural G07 headless scene regression, no ROS and no Goal
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = a990366ed6189d7b943db0fb9b88af6effb77017
          cd instructor
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s tests/unit -p 'test_p4_g07_scene_broadcaster_overlay.py' -v
          bash -n scripts/p4_g07_shared_runtime.sh
          bash -n scripts/p2_no_goal_smoke_ci.sh
          bash -n scripts/p2_owner_l3_wsl2.sh
          echo AXIA_G07_CYCLE37_SCENE_CONTRACT_L0_PASS_NO_ROS_NO_GOAL
