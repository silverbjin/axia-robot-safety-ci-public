name: AXIA Velog Domain Knowledge Labs Public+Sealed L0
on:
  push:
    branches: [feat/velog-domain-knowledge-labs-20261123, release/velog-domain-knowledge-labs-20261123, release/p2-g06-cm-ttl-20261110]
    paths:
      - '.github/workflows/velog-domain-knowledge-labs-l0.yml'
      - 'velog_domain_labs_ci/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/velog-domain-knowledge-labs-l0.yml'
      - 'velog_domain_labs_ci/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  student-scaffold-expected-red:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout public validation only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Pin isolated independent Student TODO repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 89277c433a1b6485b8926712b54b6c0b133f11ec
          path: student
          persist-credentials: false
      - name: Check student SHA, five packages and no instructor answers
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = '89277c433a1b6485b8926712b54b6c0b133f11ec'
          python3 -m compileall -q student/velog_domain_labs/ros2_ws/src
          python3 velog_domain_labs_ci/check_student_contract.py student/velog_domain_labs
      - name: Assert student exercises are RED for the right reason (24 TODO errors)
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$(find student/velog_domain_labs/ros2_ws/src -mindepth 1 -maxdepth 1 -type d | paste -sd: -)"
          set +e
          python3 -m unittest discover -s student/velog_domain_labs/tests -p test_contracts.py -v > "$RUNNER_TEMP/student_red.log" 2>&1
          result=$?
          set -e
          test "$result" -ne 0
          python3 - "$RUNNER_TEMP/student_red.log" <<'PY'
          import pathlib,re,sys
          data=pathlib.Path(sys.argv[1]).read_text()
          assert 'Ran 24 tests' in data, 'unexpected test discovery count'
          assert re.search(r'FAILED \(errors=24\)',data), 'must be 24 TODO errors'
          assert data.count('NotImplementedError: TODO') >= 24, 'failures are not all TODO'
          print('AXIA_VELOG_STUDENT_EXPECTED_RED_24_OF_24_PASS_L0')
          PY
      - name: Remove external checkout and temporary logs
        if: always()
        run: rm -rf -- student "$RUNNER_TEMP/student_red.log"

  instructor-private-green-sealed:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/velog-domain-knowledge-labs-20261123' || github.ref == 'refs/heads/release/velog-domain-knowledge-labs-20261123' || github.ref == 'refs/heads/release/p2-g06-cm-ttl-20261110')
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact private Instructor SHA (protected environment)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: e049cd85ea52ba4d55c0b79dbb96aa8476a6b10e
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Private 24 public + 5 hidden reference tests (log never public)
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = 'e049cd85ea52ba4d55c0b79dbb96aa8476a6b10e'
          python3 -m compileall -q instructor/training/velog_domain_labs/ros2_ws/src
          export PYTHONPATH="$(find instructor/training/velog_domain_labs/ros2_ws/src -mindepth 1 -maxdepth 1 -type d | paste -sd: -)"
          if python3 -m unittest discover -s instructor/training/velog_domain_labs/tests -p 'test_*.py' > "$RUNNER_TEMP/teacher_tests.log" 2>&1; then
            if grep -q 'Ran 29 tests' "$RUNNER_TEMP/teacher_tests.log"; then
              echo 'AXIA_VELOG_INSTRUCTOR_PRIVATE_29_OF_29_GREEN_L0'
              echo 'PRIVATE_SOURCE_SHA=e049cd85ea52ba4d55c0b79dbb96aa8476a6b10e'
            else
              echo 'AXIA_VELOG_INSTRUCTOR_SEALED_HOLD_BAD_TEST_COUNT'
              exit 1
            fi
          else
            echo 'AXIA_VELOG_INSTRUCTOR_SEALED_HOLD_TEST_FAILURE'
            exit 1
          fi
      - name: Erase instructor source and private evidence
        if: always()
        shell: bash
        run: rm -rf -- instructor "$RUNNER_TEMP/teacher_tests.log"
