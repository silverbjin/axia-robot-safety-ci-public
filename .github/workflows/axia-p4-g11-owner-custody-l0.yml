name: AXIA P4 G11 Owner RAW Custody source registry L0 RED GREEN
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g11-owner-custody-l0.yml']
permissions:
  contents: read
jobs:
  sealed-owner-raw-custody-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: axia-instructor-sealed
    steps:
      - name: Exact protected Instructor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 04c13b63839e68822cba95a876106dbd0b13f227
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Fail closed G11 raw copy no Goal no ROS source registry and tamper tests
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = '04c13b63839e68822cba95a876106dbd0b13f227'
          python3 -m unittest discover -s tests/unit -p test_p4_g11_owner_raw_custody.py -v
          python3 -m py_compile tools/p3_owner_evidence_probe.py tools/p4_g11_owner_raw_custody.py
          bash -n scripts/p4_g11_owner_custody_once.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path("scripts/p4_g11_owner_custody_once.sh").read_text()
          assert "AXIA_G11_PRIVATE_SOURCE_SHA" in s
          assert "AXIA_G11_REMOTE_MIRROR:-0" in s
          assert "p3_owner_evidence_probe.py" in s
          assert "p4_g11_owner_raw_custody.py" in s
          assert "ros2 launch" not in s and "ros2 action" not in s
          print("AXIA_P4_G11_OWNER_NO_GOAL_OPTIONAL_PRIVATE_MIRROR_STATIC_PASS")
          PY
          echo AXIA_P4_G11_RAW_CUSTODY_L0_REGISTRY_TAMPER_AND_NO_FORMAL_ACCEPT_PASS
      - name: Erase protected private source
        if: always()
        shell: bash
        run: rm -rf -- .git docs ros2_ws scripts tools tests fixtures scenarios configs results training
