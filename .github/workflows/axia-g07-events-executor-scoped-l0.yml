name: AXIA G07 Jazzy Events Executor Scoped Runtime L0
on:
  push:
    branches: ['fix/g07-events-executor-jazzy-ci-20261121']
    paths: ['.github/workflows/axia-g07-events-executor-scoped-l0.yml']
permissions: {contents: read}
jobs:
  safely-gated-observer-and-pregoal:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 2b6b7eee4895ea66db119fc8f43894da38a1cdc4
          path: student
          persist-credentials: false
      - name: Scoped fail-closed EventsExecutor official Jazzy A/B
        run: |
          set -Eeuo pipefail
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_events_executor_ci_ab.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_pregoal_stream_discovery.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_observer_io_first_boundary.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_task04_mvp_minimal_fix.py' -v
          echo 'AXIA_G07_JAZZY_EVENTS_EXECUTOR_CI_SCOPED_L0_PASS_NO_GOAL'
