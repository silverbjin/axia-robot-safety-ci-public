name: AXIA G07 C32 native request-to-response wall bracket sealed L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-c32-private-native-epoch-l0.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-c32-native-epoch-sealed-l0
  cancel-in-progress: false
jobs:
  exact-private-native-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact Instructor C32 native client RED
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 09d39728692a3c0365088a49cdea76d022d516e3
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: RED missing native request clock bracket exact no-ACK response
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = 09d39728692a3c0365088a49cdea76d022d516e3
          python3 -m unittest discover -s tests/unit -p test_g07_c32_native_request_wall_boundaries.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c31_native_shutdown_ack_trace.py -v
          echo AXIA_G07_C32_NATIVE_WALL_BRACKET_GREEN_NO_ROS_NO_GOAL
      - name: Always erase sealed source
        if: always()
        run: rm -rf -- tests tools ros2_ws training docs scripts configs
