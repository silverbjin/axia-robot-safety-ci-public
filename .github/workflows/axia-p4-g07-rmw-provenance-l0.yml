name: AXIA P4 G07 RMW CM publication-receipt provenance L0 TDD
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-rmw-provenance-l0.yml']
permissions:
  contents: read
jobs:
  jazzy-rmw-cm-source-receive-ttls:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: axia-instructor-sealed
    steps:
      - name: Pin private synthetic test source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 3716555daec6f31fc1837849e988a4449e887fb3
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: No ROS Goal publication; RMW timing synthetic boundary
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 3716555daec6f31fc1837849e988a4449e887fb3
          python3 -m unittest discover -s tests/unit -p test_p4_g07_rmw_source_receive_provenance.py -v
          python3 -m py_compile tools/p2_g07_ci_moving_goal_oracle.py tools/p2_l3_live_session.py
          echo AXIA_G07_RMW_PROVENANCE_L0_PASS_NO_ROS_NO_GOAL
      - name: Remove private checkout
        if: always()
        shell: bash
        run: rm -rf -- .git docs ros2_ws scripts tools tests fixtures scenarios configs results training
