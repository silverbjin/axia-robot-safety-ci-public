                json.dumps(linked,sort_keys=True))
          result=classify_callback_gap(rows,report,trace,cm_pid=pid,
                      clock_anchors=anchors,cmd_callback_handles=verified_handles)
          print("AXIA_G07_CYCLE29_OFFICIAL_CM_CALLBACK_FIRST_GAP "+
                json.dumps(result,sort_keys=True))
          print("AXIA_G07_CYCLE29_INSTRUMENTED_SIMULATION_DIAGNOSTIC_ONLY_NOT_OWNER_RELEASE")
          print("AXIA_MVP_DEMO_ACCEPTED=HOLD")
