name: AXIA G07 C35 CLEAR first boundary read-only RED GREEN L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-c35-clear-first-boundary-l0.yml']
permissions:
  contents: read
jobs:
  clear-first-boundary:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: axia-instructor-sealed
    steps:
      - name: Checkout sealed exact Instructor C35 source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: a990c6302322d50a8d9d5f5acb08702fbbf512a6
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: First boundary fixture and unchanged real phase oracle
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = a990c6302322d50a8d9d5f5acb08702fbbf512a6
          python3 -m unittest discover -s tests/unit -p test_g07_c35_clear_first_boundary.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c32_goal_terminal_before_lifecycle.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c33_owner_terminal_evidence_wire.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c32_owner_terminal_parity_scope.py -v
          python3 -m unittest discover -s tests/unit -p test_g07_c34_mandatory_terminal_before_native_ack.py -v
          python3 -m py_compile tools/p2_g07_ci_moving_goal.py tools/p2_g07_clear_first_boundary.py tools/p2_g07_ci_goal_terminal.py
          bash -n scripts/p2_owner_l3_wsl2.sh
          bash -n scripts/p2_no_goal_smoke_ci.sh
          echo AXIA_G07_C35_C33_C34_INTEGRATED_L0_PASS_NO_ROS_NO_GOAL
      - name: Erase private sealed code
        if: always()
        run: rm -rf -- scripts tools tests ros2_ws training docs
