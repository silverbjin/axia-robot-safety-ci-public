name: AXIA P3 S04 public PNU synthetic goal admission L0 RED GREEN
on:
  push:
    branches: [feat/p3-s04-risk-to-real-final-l2-20261114, release/p2-g06-cm-ttl-20261110]
    paths: ['tests/test_p3_s04_public_contract.py', 'tools/p3_s01_public_contract.py',
            '.github/workflows/axia-p3-s04-public-admission-l0.yml']
  pull_request:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['tests/test_p3_s04_public_contract.py', 'tools/p3_s01_public_contract.py',
            '.github/workflows/axia-p3-s04-public-admission-l0.yml']
permissions:
  contents: read
jobs:
  s04-single-sim-goal-pnu-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests -p test_p3_s04_public_contract.py -v
      - run: echo AXIA_P3_S04_PNU_PUBLIC_AUTHORITY_L0_ONLY_NO_REAL_GAZEBO
