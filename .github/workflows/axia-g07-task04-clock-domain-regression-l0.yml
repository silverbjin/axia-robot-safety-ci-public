name: AXIA G07 Task04 WSL2 foreign clock domain regression L0
on:
  push:
    branches: ['fix/g07-task04-wsl2-foreign-clock-domain-20261119']
  pull_request:
    branches: [main]
    paths:
      - 'scripts/axia_g07_task04_owner_moving_l3_once.sh'
      - 'scripts/axia_g07_task04_select_free_domain.py'
      - 'tests/test_g07_task04_foreign_clock_domain.py'
      - '.github/workflows/axia-g07-task04-clock-domain-regression-l0.yml'
permissions:
  contents: read
jobs:
  ros-free-clock-domain-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Field dual-time clock regression and immutable Owner smoke
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/axia_g07_task04_owner_moving_l3_once.sh
          python3 -m unittest discover -s tests -p test_g07_task04_foreign_clock_domain.py -v
          python3 -m unittest discover -s tests -p test_g07_task04_owner_startup_performance.py -v
          python3 -m unittest discover -s tests -p test_g07_task04_owner_native_cache_runtime.py -v
          python3 -m unittest discover -s tests -p test_g07_task04_owner_moving_bootstrap.py -v
