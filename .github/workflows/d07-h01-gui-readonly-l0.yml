name: D07 H01 GUI read-only L0 sealed public
on:
  push:
    branches: [feat/d07-h01-gui-rviz-no-goal-20261115]
    paths: ['.github/workflows/d07-h01-gui-readonly-l0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  no-goal-gui-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 7f3449b4cc1b0adb797491eac4339c2203b214cd
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Scoped no-Gazebo contract, exact Instructor SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = '7f3449b4cc1b0adb797491eac4339c2203b214cd'
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_d07_h01_gui_owner_contract.py -v
          echo 'D07_H01_GUI_L0_PASS_NO_ROS_NO_GAZEBO_NO_GOAL'
      - name: Remove sealed checkout
        if: always()
        run: rm -rf -- instructor
