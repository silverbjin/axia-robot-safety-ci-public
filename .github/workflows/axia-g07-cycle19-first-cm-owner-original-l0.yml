# Owner WSL2 first CM RMW gap causal narrowing, only read existing original.
name: AXIA G07 Cycle19 Owner first CM source gap raw attribution L0
on:
  push:
    branches: ['fix/g07-field-first-cm-gap-attribution-20261116']
    paths:
      - '.github/workflows/axia-g07-cycle19-first-cm-owner-original-l0.yml'
      - 'd06/live/g07_cycle19_first_cm_archive_readonly.py'
      - 'd06/tests/test_g07_cycle19_first_cm_archive_readonly.py'
      - 'd06/tests/test_g07_cycle18_field_first_owner_parity_v5.py'
      - 'scripts/axia_g07_cycle19_owner_existing_raw_readonly_once.sh'
      - 'd06/docs/G07_CYCLE19_FIRST_CM_SOURCE_VS_RPC_REPORT_20261116_KO.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-readonly-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: 'First source/receive and STOP RPC overlap: synthetic tests'
        run: |
          set -Eeuo pipefail
          python3 -m unittest discover -s d06/tests -p 'test_g07_cycle19_first_cm_archive_readonly.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_g07_cycle18_field_first_owner_parity_v5.py' -v
          python3 -m py_compile d06/live/g07_cycle19_first_cm_archive_readonly.py
          echo AXIA_G07_CYCLE19_PUBLIC_RAW_FIRST_GAP_L0_PASS_NO_ROS_NO_GOAL
      - name: Owner downloader only if present; syntax and no Goal contracts
        run: |
          set -Eeuo pipefail
          if [[ -f scripts/axia_g07_cycle19_owner_existing_raw_readonly_once.sh ]];then
            bash -n scripts/axia_g07_cycle19_owner_existing_raw_readonly_once.sh
            bash scripts/axia_g07_cycle19_owner_existing_raw_readonly_once.sh --self-check
          fi
          echo AXIA_G07_CYCLE19_OWNER_ORIGINAL_REQUIRED_FOR_ACTUAL_CAUSE_HOLD
      - name: 'Exact Owner entrypoint with missing original fails before ROS'
        run: |
          set -Eeuo pipefail
          TEMP_HOME="$(mktemp -d)"
          trap 'rm -rf -- "$TEMP_HOME"' EXIT
          export HOME="$TEMP_HOME"
          set +e
          bash scripts/axia_g07_cycle19_owner_existing_raw_readonly_once.sh > "$TEMP_HOME/no-original.log" 2>&1
          RESULT=$?
          set -e
          cat "$TEMP_HOME/no-original.log"
          [[ "$RESULT" == 3 ]]
          grep -Fq 'AXIA_G07_CYCLE19_ORIGINAL_OWNER_ARCHIVE_NOT_PRESENT_NO_ROS_NO_GOAL' "$TEMP_HOME/no-original.log"
          grep -Fq 'AXIA_MVP_DEMO_ACCEPTED=HOLD' "$TEMP_HOME/no-original.log"
          [[ ! -e "$HOME/.axia_g07_final_owner_attempts" ]]
          [[ ! -e "$HOME/.axia_g07_first_gap_readonly" ]]
          echo AXIA_G07_CYCLE19_REAL_OWNER_ENTRYPOINT_PRE_RMW_NO_ROS_NO_GOAL_PASS
