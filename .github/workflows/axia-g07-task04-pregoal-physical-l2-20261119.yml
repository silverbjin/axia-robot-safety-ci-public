# Target only the first physical PREGOAL clearance boundary. No simulated LaserScan.
# This is NOT the already-proven Task03/04 moving-Goal+GUI native run.
name: AXIA G07 Task04 physical PREGOAL baseline no-Goal L2
on:
  push:
    branches: ['fix/g07-task04-owner-wsl2-public-pregate-20261118']
    paths:
      - '.github/workflows/axia-g07-task04-pregoal-physical-l2-20261119.yml'
permissions:
  contents: read
concurrency:
  group: axia-g07-task04-pregoal-physical-l2
  cancel-in-progress: false
jobs:
  one-real-no-goal-pregoal:
    runs-on: ubuntu-24.04
    timeout-minutes: 28
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
    env:
      ROS_DOMAIN_ID: '90'
      ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
      GZ_PARTITION: axia_p2_task04_pregoal
      AXIA_P0_SIM_ONLY: '1'
      AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
      AXIA_P2_G07_OWNER_PREGOAL_L2: '1'
      AXIA_G07_CI_SIM_GOAL_ALLOWED: '0'
      AXIA_G07_TASK04_OWNER_MOVING_L3: '0'
      AXIA_NAV2_USE_COMPOSITION: 'False'
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 725b6168b381554e29add26e0dcc85a0e2fce8e7
          path: student
          persist-credentials: false
      - name: Verify exact Student source and source-only constraints
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = '725b6168b381554e29add26e0dcc85a0e2fce8e7'
          bash -n student/block_B/day07/h01_runtime/scripts/p2_no_goal_smoke_ci.sh
          python3 -m py_compile student/block_B/day07/h01_runtime/tools/p2_g07_owner_pregoal_l2.py
          echo AXIA_G07_PREG0AL_NATIVE_STUDENT_PIN_PASS_NO_GOAL
      - name: One real Gazebo LiDAR physical PREGOAL boundary, no Goal
        shell: bash
        timeout-minutes: 20
        run: |
          set -Eeuo pipefail
          set +u; source /opt/ros/jazzy/setup.bash; set -u
          export GZ_PARTITION="axia_p2_task04_pregoal_${GITHUB_RUN_ID}"
          export AXIA_P2_SMOKE_RESULTS="$GITHUB_WORKSPACE/native"
          mkdir -p "$GITHUB_WORKSPACE/native" "$GITHUB_WORKSPACE/public_evidence"
          cd student/block_B/day07/h01_runtime
          set +e
          timeout --signal=TERM --kill-after=15s 950s bash scripts/p2_no_goal_smoke_ci.sh > "$GITHUB_WORKSPACE/public_evidence/runner.log" 2>&1
          rc=$?
          set -e
          echo "AXIA_G07_PREG0AL_REAL_NATIVE_RC=$rc"
          if test -f "$GITHUB_WORKSPACE/native/g07_owner_pregoal/pregoal_baseline.json"; then
            python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'native/g07_owner_pregoal'
          x=json.loads((root/'pregoal_baseline.json').read_text())
          print('AXIA_G07_PREG0AL_REAL_NATIVE_BASELINE '+json.dumps({
              'status':x.get('status'),'first_failure':x.get('first_failure'),
              'front_m':x.get('front_m'),'side_m':x.get('side_m'),
              'scan_topic':x.get('scan_topic'),'scan_frame_id':x.get('scan_frame_id'),
              'scan_header_stamp':x.get('scan_header_stamp'),
              'publisher_count':len(x.get('publisher_identity') or []),
              'raw_scan':x.get('raw_scan'),
              'goal_sent':x.get('goal_sent'),
              'robot_world_pose':x.get('gazebo_robot_world_pose'),
              'obstacle_world_pose':x.get('initial_obstacle_world_pose')},
              sort_keys=True))
          assert x['goal_sent'] is False
          if x['status']=='CLEAR':
              assert x['front_m'] > .75 and x['side_m'] > 1.20
          else:
              assert x['first_failure'] in (
                  'OWNER_PREGOAL_NOT_CLEAR_BEFORE_FIXTURE',
                  'OWNER_PREGOAL_BASELINE_SCAN_ODOM_ABSENT')
          PY
          fi
          if [[ "$rc" != 0 ]];then
            for file in "$GITHUB_WORKSPACE/native/launch.log" "$GITHUB_WORKSPACE/native/clock_diagnostics.json" "$GITHUB_WORKSPACE/native/staged_startup.log" "$GITHUB_WORKSPACE/native/g07_owner_pregoal.log" "$GITHUB_WORKSPACE/public_evidence/runner.log";do
              if [[ -f "$file" ]];then echo "=== ${file##*/} ===";tail -n 45 "$file";fi
            done
            echo AXIA_G07_PREG0AL_REAL_NATIVE_L2_HOLD_NO_GOAL
            exit 3
          fi
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          root=Path(os.environ['GITHUB_WORKSPACE'])/'native'
          b=json.loads((root/'g07_owner_pregoal/pregoal_baseline.json').read_text())
          p=json.loads((root/'g07_owner_pregoal/owner_pregoal_l2.json').read_text())
          s=json.loads((root/'startup_verdict.json').read_text())
          assert b['status']=='CLEAR' and b['first_failure']=='NONE'
          assert b['front_m']>.75 and b['side_m']>1.2 and b['goal_sent'] is False
          assert p['status']=='P2_G07_OWNER_PREGOAL_L2_READY_NO_GOAL'
          assert p['post_ack_distinct_ros_scan_count']>=2
          assert s['status']=='SMOKE_READY' and s['goal_sent'] is False
          print('AXIA_G07_PREG0AL_REAL_CLEAR_NATIVE_L2_PASS_NO_GOAL')
          print('AXIA_G07_OWNER_WSL2_MOVING_L3_HOLD CERTIFIED_ESTOP=false')
          PY
      - name: Upload minimal text / numeric evidence (no SQLite, no source)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: axia-g07-task04-pregoal-real-l2-${{ github.run_id }}
          path: |
            native/g07_owner_pregoal/pregoal_baseline.json
            native/g07_owner_pregoal/owner_pregoal_l2.json
            native/g07_owner_pregoal/gz_pose_*.log
            native/g07_owner_pregoal.log
            native/clock_diagnostics.json
            native/g07_owner_pregoal/g07_preloaded_pose_ack.log
          if-no-files-found: warn
          retention-days: 14
