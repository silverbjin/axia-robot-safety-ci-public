name: AXIA D06 G07 WSLg LiDAR geometry versus RTF isolation L0
on:
  push:
    branches: ['fix/d06-wslg-lidar-vs-rtf-ci-20261118']
    paths:
      - '.github/workflows/axia-d06-g07-wslg-lidar-rtf-isolation-l0-20261118.yml'
      - 'd06/tests/test_d06_lidar_rtf_field_evidence.py'
      - 'd06/tools/axia_d06_lidar_rtf_compare.py'
      - 'd06/fixtures/g07_intel_d3d12_rtf_original_20261118.json'
      - 'd06/scripts/axia_d06_g07_wslg_gpu_rtf_compare_once.sh'
      - 'd06/scripts/axia_d06_g07_wslg_sensor_no_goal_once.sh'
      - 'd06/tests/test_d06_gpu_rtf_runner_safety.py'
      - 'd06/tests/test_d06_forensic_bundle_once.py'
      - 'd06/docs/AXIA_D06_D08_MVP_NVIDIA_NO_GOAL_REUSE_RCA_20261119_KO.md'
      - 'd06/tests/test_d06_native_raw_scan_ttl_boundary.py'
  pull_request:
    paths:
      - 'd06/scripts/axia_d06_g07_wslg_gpu_rtf_compare_once.sh'
      - 'd06/tests/test_d06_gpu_rtf_runner_safety.py'
      - 'd06/tests/test_d06_forensic_bundle_once.py'
      - 'd06/docs/AXIA_D06_D08_MVP_NVIDIA_NO_GOAL_REUSE_RCA_20261119_KO.md'
      - '.github/workflows/axia-d06-g07-wslg-lidar-rtf-isolation-l0-20261118.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  six-independent-axes:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: e4c2007064bec2103bb743bd27cdbdf0955961b7
          path: student
          persist-credentials: false
      - name: Verify immutable Student SHA and six independent geometry/RTF cases
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = e4c2007064bec2103bb743bd27cdbdf0955961b7
          python3 -m unittest discover -s student/block_B/day07/h01_runtime/tools -p 'test_g07_lidar_rtf_separation.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_d06_lidar_rtf_field_evidence.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_d06_gpu_rtf_runner_safety.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_d06_forensic_bundle_once.py' -v
          python3 -m unittest discover -s d06/tests -p 'test_d06_native_raw_scan_ttl_boundary.py' -v
          bash -n d06/scripts/axia_d06_g07_wslg_sensor_no_goal_once.sh
          bash -n d06/scripts/axia_d06_g07_wslg_gpu_rtf_compare_once.sh
          bash d06/scripts/axia_d06_g07_wslg_gpu_rtf_compare_once.sh --self-check
          echo 'AXIA_D06_G07_LIDAR_RTF_ISOLATION_L0_PASS_NO_ROS_NO_GAZEBO_NO_GOAL'
