name: AXIA P4 G07 exact Nav2 Goal cancel ACK before managed shutdown L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-exact-goal-cancel-l0.yml']
permissions:
  contents: read
jobs:
  cancel-before-lifecycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 2e35662cfdd52172e2fa3753faa612daf5e4958e
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 2e35662cfdd52172e2fa3753faa612daf5e4958e
          python3 -m unittest discover -s tests/unit -p test_p4_g07_exact_goal_cancel.py -v
          echo AXIA_P4_G07_EXACT_NAV2_GOAL_CANCEL_BEFORE_SHUTDOWN_L0_PASS_NO_GOAL
      - if: always()
        shell: bash
        run: rm -rf -- .git tools tests scripts docs configs ros2_ws
