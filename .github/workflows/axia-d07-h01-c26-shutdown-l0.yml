# RED/GREEN L0 for historical P4 ordered teardown reused by D07 no-goal.
name: AXIA D07 Cycle26 shutdown lifecycle and child exit L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-d07-h01-c26-shutdown-l0.yml']
permissions:
  contents: read
jobs:
  no-ros-static-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: d768a92ebfcd81fde14014d6a944184f8a9b6b7f
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact private RED source and Cycle26 teardown truth unit regression
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = 'd768a92ebfcd81fde14014d6a944184f8a9b6b7f'
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_d07_h01_clean_teardown.py -v
          bash -n scripts/p2_no_goal_smoke_ci.sh
          echo AXIA_D07_C26_SHUTDOWN_NO_ROS_L0_PASS
