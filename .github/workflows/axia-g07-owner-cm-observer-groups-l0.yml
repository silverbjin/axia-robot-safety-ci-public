name: AXIA G07 Owner CM Observer callback group A-B L0
on:
  push:
    branches: ['fix/g07-owner-1ibycgpg-cm120-firstclock-20261121']
    paths: ['.github/workflows/axia-g07-owner-cm-observer-groups-l0.yml']
permissions: {contents: read}
jobs:
  cm-readonly-observer-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {path: ci, persist-credentials: false}
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: b4851238cf1416b09f44223c7420167b2b8c79fa
          path: student
          persist-credentials: false
      - name: Existing safety/Goal no-runtime and isolated Observer behavioral test
        run: |
          set -Eeuo pipefail
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_cm_observer_group_isolation.py' -v
          python3 -m unittest discover -s tools -p 'test_g07_scan_wall_pregoal.py' -v
          echo 'G07_CM_OBSERVER_GROUPS_AB_L0_GREEN_ONLY_NO_GAZEBO_NO_GOAL'
