name: AXIA P1-T08 single Jazzy no-goal lifecycle phase oracle experiment
on:
  push:
    branches: [feat/secure-instructor-cloud-bridge]
    paths:
      - '.github/workflows/nav2-shutdown-phase-smoke1.yml'
      - 'scripts/private_nav2_phase_oracle_v2.py'
      - 'scripts/private_nav2_phase_smoke1.py'
      - 'tests/test_nav2_phase_oracle_v2.py'
      - 'tests/test_nav2_phase_smoke1.py'
permissions:
  contents: read
concurrency:
  group: axia-p1-t08-nav2-phase-single
  cancel-in-progress: false
jobs:
  public-phase-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Validate private log redaction and bounded tail extraction
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -p test_nav2_phase_oracle_v2.py -v
          python3 -m unittest discover -s tests -p test_nav2_phase_smoke1.py -v
  one-gazebo-readonly-diagnosis:
    needs: public-phase-contract
    if: github.repository == 'silverbjin/axia-robot-safety-ci-public' && github.actor == 'silverbjin' && github.ref == 'refs/heads/feat/secure-instructor-cloud-bridge' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    container:
      image: ros:jazzy-ros-base-noble
    environment:
      name: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify protected credential without echoing it
        env:
          PRIVATE_READ_TOKEN: ${{ secrets.AXIA_CLOUD_CI }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIVATE_READ_TOKEN"
          echo AXIA_NAV2_PHASE_AUTH_PRESENT
      - name: Pin private source SHA in ephemeral runner only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: d86ee9860de8924f6a5b2c5828d493fb7ef7f9eb
          token: ${{ secrets.AXIA_CLOUD_CI }}
          fetch-depth: 1
          persist-credentials: false
          path: _instructor_private
      - name: Install official Jazzy and Harmonic test dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends \
            git build-essential cmake procps python3-yaml python3-pytest \
            python3-colcon-common-extensions \
            ros-jazzy-navigation2 ros-jazzy-nav2-bringup \
            ros-jazzy-nav2-minimal-tb3-sim ros-jazzy-ros-gz \
            ros-jazzy-rosbag2 ros-jazzy-rosbag2-storage-default-plugins \
            ros-jazzy-rosgraph-msgs ros-jazzy-tf2-ros \
            ros-jazzy-nav2-msgs ros-jazzy-rclpy ros-jazzy-action-msgs \
            ros-jazzy-nav-msgs ros-jazzy-sensor-msgs ros-jazzy-std-msgs \
            ros-jazzy-std-srvs ros-jazzy-geometry-msgs ros-jazzy-lifecycle-msgs
      - name: One isolated official Gazebo no-goal log-phase probe
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          set -u
          echo AXIA_SINGLE_DIAGNOSTIC_ONLY
          echo 'G00/G03/G04 real acceptance NOT_RUN'
          python3 scripts/private_nav2_phase_smoke1.py --private-root _instructor_private
      - name: Remove all private source before runner teardown
        if: always()
        shell: bash
        run: |
          rm -rf _instructor_private
          echo AXIA_NAV2_PHASE_PRIVATE_CLEANUP
