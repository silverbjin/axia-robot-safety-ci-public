# RED/GREEN: actual Owner zoKAxNwF renderer segfault 139, no ROS or Goal.
name: AXIA D07 Cycle27 Owner OGRE-Next first SIGSEGV regression L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-d07-h01-c27-owner-wslg-ogre-gui-l0.yml']
permissions:
  contents: read
jobs:
  renderer-process-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 7306b27bc1d146d99d1657308549db45c9878407
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Exact private source and regression against original crash
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = 7306b27bc1d146d99d1657308549db45c9878407
          cd instructor
          python3 -m unittest discover -s tests/unit -p test_d07_h01_owner_wslg_gz_segv.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_gui_watcher_process_contract.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_ci_render_backend_parity.py -v
          python3 -m unittest discover -s tests/unit -p test_d07_h01_gpu_gui_trial.py -v
          bash -n tools/d07_h01_gpu_gui_watcher.sh
          echo AXIA_D07_C27_RENDERER_SEGFAULT_139_L0_PASS_NO_ROS_NO_GOAL
      - name: Remove private checkout
        if: always()
        run: rm -rf -- instructor
