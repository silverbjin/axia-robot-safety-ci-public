name: AXIA P4 G07 Owner first NAV startup fault and CI WSL2 execution parity L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-owner-startup-parity-l0.yml']
permissions:
  contents: read
jobs:
  first-boundary-and-executor:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 6ce9c41f0c0e6089ad9a971f318750112710725c
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Synthetic normalized Owner first failure 90s and shared protocol RED
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 6ce9c41f0c0e6089ad9a971f318750112710725c
          bash -n scripts/p4_g07_shared_runtime.sh scripts/p2_owner_l3_wsl2.sh scripts/p2_no_goal_smoke_ci.sh scripts/p2_g07_shared_staged_startup.sh
          python3 -m unittest discover -s tests/unit -p test_p4_g07_owner_startup_boundary.py -v
          echo AXIA_P4_G07_FIRST_OWNER_STARTUP_CLASSIFIER_AND_SHARED_EXECUTOR_L0_PASS_NO_ROS_NO_GOAL_OWNER_NOT_RUN
      - name: Remove private source
        if: always()
        shell: bash
        run: rm -rf -- .git docs tools tests configs scripts ros2_ws training
