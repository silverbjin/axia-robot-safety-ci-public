name: AXIA P3 S03 bounded real sim compound admission L0 RED GREEN
on:
  push:
    branches: [feat/p3-s03-compound-real-gazebo-20261113, release/p2-g06-cm-ttl-20261110]
    paths: ['tests/test_p3_s03_public_contract.py', 'tools/p3_s01_public_contract.py',
            '.github/workflows/axia-p3-s03-compound-admission-l0.yml']
  pull_request:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['tests/test_p3_s03_public_contract.py', 'tools/p3_s01_public_contract.py',
            '.github/workflows/axia-p3-s03-compound-admission-l0.yml']
permissions:
  contents: read
jobs:
  bounded-compound-fault-admission:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 -m unittest discover -s tests -p test_p3_s03_public_contract.py -v
      - run: echo AXIA_P3_S03_CI_ONLY_L0_PASS_REAL_GAZEBO_NOT_RUN
