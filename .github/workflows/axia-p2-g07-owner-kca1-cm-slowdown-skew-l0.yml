name: AXIA G07 Owner KcA1lXOe CM slowdown direction skew RED GREEN L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p2-g07-owner-kca1-cm-slowdown-skew-l0.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-owner-kca1-real-trace-l0
  cancel-in-progress: false
jobs:
  real-owner-trace-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: axia-instructor-sealed
    steps:
      - name: Checkout pinned exact Instructor source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 9fdd8c28b0c4ca9f4dc16ec85b3f04927a884a08
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Deterministic actual WSL2 owner trace and all existing safety guards
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = '9fdd8c28b0c4ca9f4dc16ec85b3f04927a884a08'
          python3 -m pip install -q --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q -ra \
            tests/unit/test_p2_g07_guard_kca1_cm_slowdown.py \
            tests/unit/test_p2_g07_guard_nearzero_owner_trace.py \
            tests/unit/test_p2_g07_guard_async_owner_trace.py \
            tests/unit/test_p2_base_guard_policy.py \
            tests/unit/test_p2_guard_cancel_contract.py \
            tests/unit/test_p2_guard_parameter_init_contract.py
          python3 -m py_compile ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py
          bash -n scripts/p2_guard_ros_smoke_ci.sh
          echo 'AXIA_G07_KCA1_OWNER_CM_SLOWDOWN_L0_GREEN_PASS_NO_GOAL'
      - name: Negative control must RED when historical slowdown direction exemption is removed
        shell: bash
        run: |
          set -euo pipefail
          TARGET=ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py
          cp "$TARGET" /tmp/kca1_policy_good.py
          trap 'cp /tmp/kca1_policy_good.py "$TARGET"' EXIT
          python3 - <<'PY'
          from pathlib import Path
          p=Path("ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py")
          s=p.read_text()
          part='or historical_slowdown_direction_crossing'
          assert s.count(part)==2, s.count(part)
          p.write_text(s.replace(part,''))
          PY
          set +e
          python3 -m pytest -q \
            tests/unit/test_p2_g07_guard_kca1_cm_slowdown.py::test_real_owner_delayed_cm_after_30pct_slowdown_zero_not_false_latch \
            >/tmp/kca1_expected_mutation_red.log 2>&1
          rc=$?
          set -e
          if [[ "$rc" == 0 ]]; then
            echo AXIA_KCA1_MUTATION_GATE_FAILED_TEST_WAS_BLIND
            exit 2
          fi
          grep -q 'bounded attributable CM delay must not permanently cancel Goal' \
            /tmp/kca1_expected_mutation_red.log || {
            cat /tmp/kca1_expected_mutation_red.log
            exit 2
          }
          echo AXIA_KCA1_MUTATION_EXPECTED_RED_CAUGHT_PASS
      - name: Purge private checkout
        if: always()
        shell: bash
        run: rm -rf -- .git tests ros2_ws tools scripts configs docs fixtures results
