name: AXIA P4 G07 RED-GREEN native prearmed STOP no CLI spawn L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-prearmed-stop-l0.yml']
permissions:
  contents: read
jobs:
  exact-source-stop-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 7
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 2fbb6679d0bfd0b361aa626c6ecd7e26a13b0a4a
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 2fbb6679d0bfd0b361aa626c6ecd7e26a13b0a4a
          python3 -m unittest discover -s tests/unit -p test_p4_g07_prearmed_stop.py -v
          echo AXIA_P4_G07_PREARMED_STOP_L0_GREEN_NO_ROS_NO_GOAL
      - if: always()
        shell: bash
        run: rm -rf -- .git tools tests scripts configs ros2_ws docs
