# Official Nav2 Simple TF only for slow Gazebo teaching scenario; never hardware.
name: AXIA G07 Task02 official simple TF public CI L0 L2
on:
  push:
    branches: ['fix/g07-task02-simple-tf-public-ci-20261118']
    paths:
      - '.github/workflows/axia-g07-task02-simple-tf-public-l0-l2-20261118.yml'
permissions:
  contents: read
jobs:
  task02-simple-tf-safety-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: f890c580b025dde1038296401aed251d384d98b8
          path: student
          persist-credentials: false
      - name: GREEN verify one public-only simple TF switch preserves STOP safety contracts
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C student rev-parse HEAD)" = f890c580b025dde1038296401aed251d384d98b8
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_task02_simple_tf.py' -v
          bash -n scripts/p2_no_goal_smoke_ci.sh
          python3 -m py_compile ros2_ws/src/axia_safety_bringup/launch/axia_p2_launch_policy.py
