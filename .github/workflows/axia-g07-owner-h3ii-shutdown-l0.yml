name: AXIA G07 Owner H3ii shutdown truth regression PUBLIC L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-g07-owner-h3ii-shutdown-l0.yml']
permissions:
  contents: read
jobs:
  owner-cm-teardown-l0:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: axia-instructor-sealed
    steps:
      - name: Checkout exact private Instructor commit to ephemeral PUBLIC CI only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 194f86df2c4cae411e8e6a385656922287c0febb
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Immutable source + sanitized CM abnormal shutdown marker contract
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 194f86df2c4cae411e8e6a385656922287c0febb
          python3 -m pip install -q --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q -ra tests/unit/test_p2_g07_owner_h3ii_shutdown_truth_20261112.py
          echo AXIA_G07_OWNER_H3II_SHUTDOWN_TRUTH_PUBLIC_L0_PASS_NO_ROS_NO_GOAL
      - name: Destroy ephemeral private source
        if: always()
        shell: bash
        run: rm -rf -- .git ros2_ws tests tools scripts docs configs training results
