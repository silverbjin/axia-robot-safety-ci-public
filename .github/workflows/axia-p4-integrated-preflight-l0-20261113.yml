name: AXIA P4 preflight exact staged P0 P3 source L0 no formal promotion
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - '.github/workflows/axia-p4-integrated-preflight-l0-20261113.yml'
permissions:
  contents: read
jobs:
  staged-p3-g09-g10-contract:
    environment: axia-instructor-sealed
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout current reviewed staging (NO main merge)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: f9c7b9a52e073174dd12508b929115db4b8cc961
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
          fetch-depth: 0
      - name: Verify immutable G07 ancestor, source and no unexpected safety-layer diff
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 'f9c7b9a52e073174dd12508b929115db4b8cc961'
          git merge-base --is-ancestor eb984b73138e592caa67426eed9c60dde2ca2ebd HEAD
          python3 - <<'PY'
          import subprocess
          delta=subprocess.check_output(['git','diff','--name-only','00d643efa1ed7d2d77a84ab1cf4decc77e4ff13c','HEAD'],text=True).splitlines()
          allowed=('fixtures/p3/','ros2_ws/src/axia_scenario_verifier/axia_scenario_verifier/p3_',
                   'tests/unit/test_p3_','tests/ros_integration/test_p3_')
          assert len(delta)==8,delta
          assert all(p.startswith(allowed) for p in delta),delta
          from pathlib import Path
          policy=Path('ros2_ws/src/axia_safety_supervisor/axia_safety_supervisor/p2_base_guard_policy.py').read_text()
          assert 'CM_TTL_SEC = 0.15' in policy
          assert 'ASYNC_RECONCILIATION_GRACE_SEC = 0.12' in policy
          assert 'TTL_SEC = 0.5' in policy
          print('AXIA_P4_PREP_SOURCE_SAFETY_G07_UNCHANGED_PASS files='+str(len(delta)))
          PY
      - name: Real P3 L0 full tests, output hash and strict NOT_ACCEPTED manifest
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/ros2_ws/src/axia_scenario_verifier"
          python3 -m unittest discover -s tests/unit -p 'test_p3*.py' -v
          python3 scripts/run_p3_mvp.py --scenario all --results-root "$RUNNER_TEMP/axia-p4-p3" --allow-partial-ci
          python3 - "$RUNNER_TEMP/axia-p4-p3" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          matches=list(Path(sys.argv[1]).glob('p3-*'))
          assert len(matches)==1
          p=matches[0]
          s=json.loads((p/'summary.json').read_text())
          m=json.loads((p/'manifest.json').read_text())
          assert s['status']=='INCONCLUSIVE' and s['formal_accepted'] is False
          assert s['gates']==dict.fromkeys(('G08','G09','G10','G11'),'NOT_ACCEPTED')
          assert m['runner_source_sha']=='f9c7b9a52e073174dd12508b929115db4b8cc961'
          assert m['goal_sent'] is False and m['fault_injected'] is False
          for line in (p/'SHA256SUMS').read_text().splitlines():
              h,name=line.split('  ',1)
              assert hashlib.sha256((p/name).read_bytes()).hexdigest()==h
          print('AXIA_P4_PREP_STAGED_RUNNER_INCONCLUSIVE_NO_FALSE_ACCEPTANCE_PASS')
          PY
          echo 'AXIA_P4_STAGING_P3_G09_G10_L0_PASS_NO_GAZEBO_NO_GOAL'
      - name: Remove private sources and evidence
        if: always()
        shell: bash
        run: rm -rf -- ros2_ws tools scripts tests docs fixtures scenarios configs .git
