name: D04 classroom guide WSL2 preflight regression (public CI)

on:
  push:
    branches:
      - 'fix/d04-course-field-preflight-20261112'
    paths:
      - '.github/workflows/d04-course-docs-regression.yml'
      - 'tests/test_d04_course_field_preflight.py'
      - 'scripts/axia_d04_course_once.sh'
      - 'scripts/axia_d04_classroom_wsl2_once.sh'
      - 'tests/test_d04_classroom_owner_entrypoint.py'
      - 'tests/test_d04_postrun_topic_evidence.py'
      - 'scripts/d04_classroom_read_evidence.py'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/d04-course-docs-regression.yml'
      - 'tests/test_d04_course_field_preflight.py'
      - 'scripts/axia_d04_course_once.sh'
      - 'scripts/axia_d04_classroom_wsl2_once.sh'
      - 'tests/test_d04_classroom_owner_entrypoint.py'
      - 'tests/test_d04_postrun_topic_evidence.py'
      - 'scripts/d04_classroom_read_evidence.py'

permissions:
  contents: read

jobs:
  public-field-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install minimal regression dependencies (no ROS/YOLO model/PyTorch)
        run: python -m pip install pytest==8.3.5
      - name: RED/GREEN user field error regression
        run: |
          set -euo pipefail
          python -m pytest -q -ra tests/test_d04_course_field_preflight.py tests/test_d04_classroom_owner_entrypoint.py tests/test_d04_postrun_topic_evidence.py

  public-student-document-command:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 946a8af8cc5785576367f126809db92f195c15da
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - name: Execute published D04 student lab fixture commands and EXPECTED RED
        shell: bash
        run: |
          set -euo pipefail
          test -f block_B/day04/D04_STUDENT_LAB_GUIDE_KO.md
          grep -q 'No module named' block_B/day04/D04_STUDENT_LAB_GUIDE_KO.md
          python -m pytest -q block_B/tests/test_fixture_io.py
          set +e
          python -m pytest -q block_B/tests/test_block_b_public.py \
            -k 'select_person or confidence or bbox' > /tmp/d04-student-red.log 2>&1
          RC=$?
          set -e
          grep -q 'TODO_D04_SELECT_PERSON' /tmp/d04-student-red.log
          if [[ "$RC" -eq 0 ]]; then
            echo "D04_STUDENT_UNEXPECTED_GREEN"; exit 1
          fi
          echo "D04_STUDENT_PUBLISHED_TODO_EXPECTED_RED rc=$RC"
          echo "D04_STUDENT_FIXTURE_ACTUAL_PASS; STUDENT_TODO_GREEN_NOT_CLAIMED"

  instructor-private-doc-commands:
    if: github.event_name == 'workflow_dispatch' && github.repository == 'silverbjin/axia-robot-safety-ci-public'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout exact existing private instructor source; do not upload
        uses: actions/checkout@v4
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: d68a6c03137dab315ee95759cb259e9b469ca559
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest==8.3.5
      - name: Run ACTUAL private instructor reference and hidden L0 tests
        run: |
          set -euo pipefail
          test -f instructor/training/block_B/instructor/D04_DEMO_GUIDE_KO.md
          test -f instructor/training/block_B/instructor/D04_SOLUTION_GUIDE_KO.md
          test -f instructor/training/block_B/instructor/D04_LECTURE_SCRIPT_32SLIDES_KO.md
          grep -q 'D04_IMAGE_PREFLIGHT_BLOCKED' instructor/training/block_B/instructor/D04_DEMO_GUIDE_KO.md
          python -m pytest -q \
            instructor/training/block_B/tests/test_block_b_reference.py \
            instructor/training/block_B/instructor/hidden_tests/test_block_b_hidden.py
          echo "D04_INSTRUCTOR_PRIVATE_REFERENCE_ACTUAL_PYTEST_PASS"
      - name: Run ACTUAL private single-image program with mocked model API (not inference)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/d04-mock/ultralytics" "$RUNNER_TEMP/d04-artifacts"
          cat > "$RUNNER_TEMP/d04-mock/ultralytics/__init__.py" <<'PY'
          class Tensor:
              def __init__(self, values):
                  self.values = values
              def cpu(self):
                  return self
              def tolist(self):
                  return self.values

          class Result:
              orig_shape = (480, 640)
              class Boxes:
                  cls = Tensor([0, 56])
                  conf = Tensor([0.92, 0.97])
                  xyxy = Tensor([[100, 50, 250, 300], [1, 1, 50, 50]])
              boxes = Boxes()

          class YOLO:
              def __init__(self, path):
                  self.names = {0: "person", 56: "chair"}
              def predict(self, source, device, verbose, save):
                  assert device == "cpu" and save is False
                  return [Result()]
          PY
          printf 'stub model, never actual YOLO weights' > "$RUNNER_TEMP/d04-artifacts/sample.pt"
          printf 'stub image, never actual photograph' > "$RUNNER_TEMP/d04-artifacts/person.jpg"
          mkdir -p "$RUNNER_TEMP/d04-cwd"
          cd "$RUNNER_TEMP/d04-cwd"
          export PYTHONPATH="$RUNNER_TEMP/d04-mock"
          AXIA_D04_PYTHON=python3 bash "$GITHUB_WORKSPACE/scripts/axia_d04_course_once.sh" \
            --run-image --instructor "$GITHUB_WORKSPACE/instructor" \
            --model "$RUNNER_TEMP/d04-artifacts/sample.pt" \
            --image "$RUNNER_TEMP/d04-artifacts/person.jpg" \
            --out "$RUNNER_TEMP/d04-artifacts/output"
          python3 - <<'PY'
          from pathlib import Path
          import csv, json, os
          root = Path(os.environ["RUNNER_TEMP"]) / "d04-artifacts/output"
          rows = list(csv.DictReader((root/"detections.csv").open()))
          info = json.loads((root/"run_manifest.json").read_text())
          assert len(rows) == 1 and rows[0]["category"] == "person"
          assert info["detections"] == 1
          assert info["ros_verified"] is False and info["gazebo_verified"] is False
          print("D04_INSTRUCTOR_PRIVATE_SCRIPT_MOCKED_API_PASS; REAL_YOLO_NOT_RUN")
          PY
