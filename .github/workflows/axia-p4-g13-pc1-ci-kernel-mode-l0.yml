name: AXIA P4 G13 PC1 original CI-kernel pre-ROS failure classification L0
on:
  pull_request:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - 'scripts/axia_p4_g13_external_no_goal_once.sh'
      - '.github/workflows/axia-p4-g13-pc1-ci-kernel-mode-l0.yml'
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - 'scripts/axia_p4_g13_external_no_goal_once.sh'
      - '.github/workflows/axia-p4-g13-pc1-ci-kernel-mode-l0.yml'
permissions:
  contents: read
jobs:
  public-sanitized-actual-owner-pc1-failure:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Exact public PR/script source only
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Reproduce FIRST real PC1 pre-ROS failure using sanitized small fixture
        shell: bash
        run: |
          set -Eeuo pipefail
          SCRIPT=scripts/axia_p4_g13_external_no_goal_once.sh
          bash -n "$SCRIPT"
          ROOT="$HOME/.axia_g13_external_pc_evidence/g13-PC1-ci_kernel_fixture"
          mkdir -p "$ROOT/actual"
          printf '%s\n' \
            'AXIA_G07_ENV_PARITY_BLOCKED mismatches=ci_kernel' \
            'P2_G07_NO_GOAL_CI_USERSPACE_PARITY_BLOCKED' \
            'G07_REAL_SHUTDOWN_L2_NO_NAV2_ACK' \
            'P2_L2_SMOKE_RC=3' >"$ROOT/smoke.log"
          printf '%s\n' 'AXIA_G07_ENV_PARITY_BLOCKED mismatches=ci_kernel' >"$ROOT/actual/g07_userspace_parity.log"
          printf '%s\n' '{"mode":"ci","wsl_detected":true,"status":"PARITY_BLOCKED","mismatch":{"ci_kernel":"CI_NOT_WSL2_REQUIRED"},"goal_sent":false}' >"$ROOT/actual/g07_userspace_parity.json"
          printf '%s\n' '{"label":"PC1","run_exit_code":3,"goal_sent":false,"no_goal_smoke_pass":false}' >"$ROOT/g13_no_goal_receipt.json"
          bash "$SCRIPT" --inspect "$ROOT" > "$RUNNER_TEMP/first.txt"
          grep -Fq 'AXIA_G13_PREVIOUS_RUN_FIRST_FAILURE=CI_KERNEL_MODE_ON_WSL2' "$RUNNER_TEMP/first.txt"
          grep -Fq 'AXIA_G13_PREVIOUS_RUN_FIRST_FAILURE_PHASE=BEFORE_GAZEBO_LAUNCH_AND_NAV2_LIFECYCLE' "$RUNNER_TEMP/first.txt"
          grep -Fq 'AXIA_G13_PREVIOUS_RUN_DIAGNOSTIC_ONLY_NO_GOAL_NO_RETRY' "$RUNNER_TEMP/first.txt"
          ! grep -Fq 'REAL_JAZZY_HARMONIC_NO_GOAL_L2_PASS' "$RUNNER_TEMP/first.txt"
          grep -Fq 'AXIA_G07_CI_SIM_GOAL_ALLOWED=0' "$SCRIPT"
          ! grep -Fq 'ros2 action send_goal' "$SCRIPT"
          echo AXIA_G13_ORIGINAL_PC1_CI_KERNEL_FIRST_STAGE_PUBLIC_L0_PASS_NO_ROS_NO_GOAL
