          persist-credentials: false
      - name: Official Nav2 /plan first physical fixture boundary RED
        shell: bash
        run: |
          set -Eeuo pipefail
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_g20_nav2_plan_witness.py' -v
          echo 'AXIA_G07_G20_NAV2_GLOBAL_PLAN_FIRST_FIXTURE_L0_PASS_NATIVE_GOAL_NOT_RUN_HOLD'
