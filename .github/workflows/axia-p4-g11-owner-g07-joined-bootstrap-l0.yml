name: AXIA P4 G11 Owner G07 postrun original-join WSL2 bootstrap L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths:
      - .github/workflows/axia-p4-g11-owner-g07-joined-bootstrap-l0.yml
      - scripts/axia_p4_g11_owner_g07_joined_once.sh
permissions:
  contents: read
jobs:
  no-goal-consent-and-original-join-static:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Exact PUBLIC bootstrap candidate, never execute Goal
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: b48743624f20f0bd5ca4dc4085dc69408aa7b5e2
          persist-credentials: false
      - name: Bash syntax, interactive Owner consent and no-upload contract
        shell: bash
        run: |
          set -Eeuo pipefail
          bash -n scripts/axia_p4_g11_owner_g07_joined_once.sh
          python3 - <<'PY'
          from pathlib import Path
          s=Path("scripts/axia_p4_g11_owner_g07_joined_once.sh").read_text()
          for required in (
              'PRIVATE_SHA="8275ecd163320aad7a3ea8b02411242cdaee50fa"',
              'PRIVATE_TREE="1897bde19382016ae60013629d34b84901e16174"',
              'INTERACTIVE_OWNER_TTY_REQUIRED',
              'AXIA_G11_RUN_CUSTODY_REQUIRED=1',
              '--case G07 --mvp-relocated-obstacle',
              'YES-P2-G07-GOAL',
              'p4_g11_g07_joined_raw_review.py',
              'g07-$(date -u',
              'FORMAL_0_OF_15_OWNER_ACCEPTANCE_HOLD',
              'OWNER_RUNNER_EXIT_CODE'
          ):
              assert required in s, required
          for forbidden in ('ros2 action send_goal','YES-P2-G07-GOAL\\n',
                            'rclone copy', 'gh release upload', 'git push'):
              assert forbidden not in s, forbidden
          assert s.index('p2_owner_l3_wsl2.sh') < s.index('p4_g11_g07_joined_raw_review.py')
          print('AXIA_G11_OWNER_SINGLE_GOAL_TTY_MANUAL_CONSENT_STATIC_PASS')
          PY
      - name: Protected Instructor exact tree and no-goal reviewer exists
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 8275ecd163320aad7a3ea8b02411242cdaee50fa
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Source-lock both scripts, no actual Owner/Gazebo
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = 8275ecd163320aad7a3ea8b02411242cdaee50fa
          test "$(git -C instructor rev-parse 'HEAD^{tree}')" = 1897bde19382016ae60013629d34b84901e16174
          bash -n instructor/scripts/p2_owner_l3_wsl2.sh
          python3 -m py_compile instructor/tools/p4_g11_g07_joined_raw_review.py
          python3 - <<'PY'
          from pathlib import Path
          s=Path("instructor/scripts/p2_owner_l3_wsl2.sh").read_text()
          assert 'YES-P2-%s-GOAL' in s
          assert s.index('sha256sum "$OUT.tar.gz" > "$OUT.tar.gz.sha256"') < s.index('p4_g11_session_archive_custody.py')
          p=Path("instructor/tools/p4_g11_g07_joined_raw_review.py").read_text()
          assert 'LOOSE_EVIDENCE_DIFFERS_FROM_ARCHIVED_TAR' in p
          assert 'first_timing_violation' in p
          assert 'first_safety_transition' in p
          assert 'goal_sent_by_review_tool' in p
          print('AXIA_G11_OWNER_G07_JOINED_BOOTSTRAP_L0_PASS_NO_ROS_NO_GOAL_FORMAL_HOLD')
          PY
      - name: Erase private source
        if: always()
        shell: bash
        run: rm -rf -- instructor
