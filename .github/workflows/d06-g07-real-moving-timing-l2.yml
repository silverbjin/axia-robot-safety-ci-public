# D06 public CI only; sealed private source and one SIMULATION-ONLY Gazebo G07 Goal.
# One controlled CI attempt. NEVER a substitute for Owner WSL2 visual signoff.
name: D06 G07 actual Gazebo one-Goal Scan CM Guard timing L2
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    # Only this workflow file triggers the costly single CI-only simulation.
    paths: ['.github/workflows/d06-g07-real-moving-timing-l2.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-ci-real-gazebo-moving-goal-l2
  cancel-in-progress: false
jobs:
  real-gazebo-nav2-moving-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      # Docker bridge resolver failed in #43041110273 and #43042223936;
      # use explicit public resolvers only for this GitHub CI container.
      # This does not change ROS networking, source, TTL or WSL2 runtime.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Private Instructor exact commit sealed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 97f2044404a8b90e9c8f4b3010c0796eef87feff
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Pinned PUBLIC failfirst shutdown triage (no private script upload)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: f21287a46c92f8c4d579ae083c939781b2ffe0e8
          path: ci-tools
          persist-credentials: false

      - name: RED or GREEN - exact G07 CI and Owner rosbag CPU priority parity (no Goal)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          ci=Path('instructor/scripts/p2_no_goal_smoke_ci.sh').read_text()
          owner=Path('instructor/scripts/p2_owner_l3_wsl2.sh').read_text()
          assert 'setsid nice -n 10 ros2 bag record' in ci, 'G07_CI_BAG_NICE10_MISSING'
          assert 'AXIA_G07_CI_OWNER_BAG_PARITY' in ci, 'G07_CI_SCOPE_MISSING'
          assert 'BAG_NICE=(nice -n 10)' in owner, 'G07_OWNER_BAG_NICE10_MISSING'
          assert '"$CASE" == G07 && "$MVP_RELOCATED" == 1' in owner
          assert 'setsid "${BAG_NICE[@]}" ros2 bag record' in owner
          assert 'AXIA_P2_GUARD_BYPASS' not in ci+owner
          print('D06_G07_CI_OWNER_ROSBAG_NICE10_PARITY_STATIC_PASS NO_ROS_NO_GOAL')
          PY

      - name: RED or GREEN - Localization after-Goal ACK max 40s within original total 60s (NO GOAL)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import sys
          sys.path.insert(0, 'instructor/tools')
          from p2_g07_ordered_shutdown import manager_shutdown_budget
          assert manager_shutdown_budget('navigation',57)==40, 'G07_NAV_SHUTDOWN_BUDGET_CHANGED'
          assert manager_shutdown_budget('localization',57)==40, 'G07_LOC_POSTGOAL_ACK_25S_EXHAUSTED'
          assert manager_shutdown_budget('localization',10)==10, 'G07_GLOBAL_LIMIT_NOT_RESPECTED'
          print('D06_G07_LOC_POSTGOAL_NATIVE_ACK_40S_BOUNDED_WITHIN_60S_STATIC_PASS')
          PY
          python3 -m unittest discover -s instructor/tests/unit \
            -p 'test_p4_g07_ordered_shutdown_localization_budget.py' -q

      - name: Exact immutable runtime image and 25-package/5-file parity without apt reinstall
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = '97f2044404a8b90e9c8f4b3010c0796eef87feff'
          test "$ROS_DISTRO" = jazzy
          cd instructor
          mkdir -p results/p2-g07-ci-moving
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          export ROS_DOMAIN_ID=83 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION=axia_p2_ci_moving_83 AXIA_P0_SIM_ONLY=1
          python3 tools/p2_g07_owner_env_parity.py --mode ci \
            --output results/p2-g07-ci-moving/core_parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/p2-g07-ci-moving/core_parity.json').read_text())
          assert v['status']=='CORE_PARITY_PASS'
          assert v['checked_packages']==25 and v['checked_official_files']==5
          assert v['wsl_kernel_equal_ci'] is False
          print('AXIA_G07_RUNTIME_DIGEST_25_5_ENV_PARITY_PASS_NO_APT')
          PY
      - name: Use independently GREEN L0 oracle; syntax-check actual runner without pip
        shell: bash
        run: |
          set -euo pipefail
          cd instructor
          python3 -m py_compile tools/p2_g07_ci_moving_goal.py tools/p2_g07_ci_moving_goal_oracle.py tools/p2_g07_lifecycle_service.py tools/p2_staged_no_goal.py
          bash -n scripts/p2_no_goal_smoke_ci.sh scripts/p2_owner_l3_wsl2.sh
          echo 'AXIA_G07_CI_MOVING_GOAL_RUNNER_STATIC_PASS_L0_VERIFIED_SEPARATELY'
      - name: Real Harmonic official TB3 Waffle and Nav2 ONE bounded simulation Goal
        shell: bash
        env:
          ROS_DOMAIN_ID: '83'
          ROS_AUTOMATIC_DISCOVERY_RANGE: LOCALHOST
          GZ_PARTITION: axia_p2_ci_moving_83
          AXIA_P0_SIM_ONLY: '1'
          AXIA_P2_G07_PHYSICAL_PREFLIGHT: '1'
          AXIA_G07_CI_SIM_GOAL_ALLOWED: '1'
          AXIA_G07_CI_OWNER_OBSERVER_PARITY: '1'
          AXIA_G07_OWNER_STARTUP_PARITY: '1'
          AXIA_G07_CI_OWNER_BAG_PARITY: '1'
          AXIA_P2_SMOKE_RESULTS: results/p2-g07-ci-moving/real-l2
        run: |
          set -euo pipefail
          cd instructor
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '97f2044404a8b90e9c8f4b3010c0796eef87feff'
          # CI-only CM CFS scheduler witness, read-only /proc statistics.
          # No ROS publisher, no Goal and NO WSL2 Owner admission from this diagnostic.
          python3 ../ci-tools/d06/live/d06_cm_proc_sched_probe.py sample \
            --output ../d06_g07_cm_sched_private.jsonl \
            --partition axia_p2_ci_moving_83 --domain 83 \
            --duration 900 --interval .025 \
            > ../d06_g07_cm_sched_sampler.log 2>&1 &
          SCHED_PROBE_PID=$!
          set +e
          timeout --signal=TERM --kill-after=10s 900s \
            bash scripts/p2_no_goal_smoke_ci.sh > ../d06_g07_sealed_runner.log 2>&1
          runner_rc=$?
          kill -TERM "$SCHED_PROBE_PID" 2>/dev/null || true
          wait "$SCHED_PROBE_PID" 2>/dev/null || true
          set -e
          echo "$runner_rc" > ../d06_g07_sealed_runner_rc
          if [[ "$runner_rc" != 0 ]];then
            echo "D06_G07_REAL_L2_OWNER_MATCHED_CI_BLOCKED rc=$runner_rc NO_PRIVATE_RAW_IN_PUBLIC_LOG"
            exit 2
          fi
          echo 'D06_G07_REAL_CI_RUNNER_RC0 PENDING_REAL_SCAN_CM_GUARD_ORACLE'
          python3 - <<'PY'
          from pathlib import Path
          import json
          root=Path('results/p2-g07-ci-moving/real-l2')
          startup=json.loads((root/'startup_verdict.json').read_text())
          preg=json.loads((root/'g07_ci_pregoal/owner_pregoal_l2.json').read_text())
          data=json.loads((root/'g07_ci_moving/ci_moving_goal_result.json').read_text())
          assert startup['status']=='SMOKE_READY' and startup['goal_sent'] is False
          assert (root/'g07_demo_waffle_manifest.json').exists()
          for gate in ('localization_start','navigation_start'):
            native=json.loads((root/('startup_verdict.'+gate+'.native.json')).read_text())
            assert native['status']=='ACK' and native['success'] is True
            assert native['goal_sent'] is False and native['command']=='startup'
          print('AXIA_G07_SHARED_CI_OWNER_STAGED_NATIVE_STARTUP_L2_ACK_PASS')
          assert preg['status']=='P2_G07_OWNER_PREGOAL_L2_READY_NO_GOAL'
          assert (root/'rosbag2/metadata.yaml').is_file(), 'OWNER_14_TOPIC_BAG_NOT_RECORDED'
          import sqlite3
          dbs=list((root/'rosbag2').glob('*.db3'))
          assert len(dbs)==1
          conn=sqlite3.connect('file:'+str(dbs[0])+'?mode=ro',uri=True)
          assert conn.execute('pragma quick_check').fetchone()[0]=='ok'
          counts=dict(conn.execute('select topics.name,count(messages.id) from topics left join messages on topics.id=messages.topic_id group by topics.name'))
          for name in ('/clock','/scan','/odom','/cmd_vel_supervised','/cmd_vel_pre_guard','/axia/p2/base_guard'):
            assert counts.get(name,0)>0,(name,counts)
          print('AXIA_G07_PUBLIC_CI_WSL2_MATCHED_14_TOPIC_REAL_BAG_L2_PASS')
          assert data['status']=='CI_GAZEBO_MOVING_GOAL_CANDIDATE'
          assert data['goal_sent'] is True and data['goal_status_executing'] is True
          assert all(data['goal_status_at_'+k]==2 for k in ('clear','slow','stop'))
          assert data['odom_stopped_dwell_sec']>=1
          assert data['guard_latched'] is False
          assert data['owner_observer_parity_survived_15s'] is True
          print('AXIA_G07_CI_OWNER_OBSERVER_PARITY_L2_VALIDATED_2_WORKERS_NO_SIGSEGV')
          assert data['certified_estop'] is False and data['gate_accepted'] is False
          # Same official ordered shutdown and native CM exit audit as Owner.
          # These are actual POST-GOAL processes, not a separate NO-GOAL run.
          teardown=json.loads((root/'g07_ordered_shutdown.json').read_text())
          cm_audit=json.loads((root/'g07_shutdown_audit.json').read_text())
          assert teardown['status']=='NAV2_LIFECYCLE_SHUTDOWN_ACK'
          assert teardown['cm_managed_by_navigation'] is True
          assert teardown['navigation_ack'] and teardown['localization_ack']
          assert cm_audit['status']=='SHUTDOWN_CLEAN_CANDIDATE'
          assert cm_audit['cm_exit_code']==0
          assert 'P2_L2_GRACEFUL_TEARDOWN' in (root/'teardown.txt').read_text()
          print('AXIA_G07_REAL_POST_GOAL_OWNER_IDENTICAL_NAV2_SHUTDOWN_CM_EXIT0_PASS')
          assert data['owner_l3_accepted'] is False
          print('AXIA_G07_CI_REAL_HARMONIC_NAV2_MOVING_GOAL_CLEAR_SLOW_STOP_L2_PASS_OWNER_L3_NOT_RUN')
          PY
      - name: CI-only CM RMW first gap versus Linux scheduler read-only witness
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f ci-tools/d06/live/d06_cm_proc_sched_probe.py
          python3 ci-tools/d06/live/d06_cm_proc_sched_probe.py analyze \
            --events instructor/results/p2-g07-ci-moving/real-l2/g07_ci_moving/actual_ros_events.jsonl \
            --samples d06_g07_cm_sched_private.jsonl
          echo 'D06_CM_PROC_SCHED_DIAGNOSTIC_ONLY NOT_FULL_L2_ACCEPTANCE NO_OWNER_L3'

      - name: Post-Goal cross-node first CM TTL read-only diagnostic
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,str(Path('tools').resolve()))
          from p2_g07_ci_moving_goal_oracle import first_guard_cm_delivery_boundary
          folder=Path('results/p2-g07-ci-moving/real-l2/g07_ci_moving')
          summary=folder/'ci_moving_goal_result.json'
          events=folder/'actual_ros_events.jsonl'
          if not summary.is_file() or not events.is_file():
              print('AXIA_P4_G07_L2_CROSS_NODE_DIAGNOSTIC_BLOCKED_NO_ORIGINAL_RUN')
              sys.exit(3)
          verdict=json.loads(summary.read_text())
          rows=[json.loads(line) for line in events.read_text().splitlines()]
          starts=[row['t'] for row in rows if row.get('kind')=='owner_goal_published']
          if len(starts)!=1:
              print('AXIA_P4_G07_L2_GOAL_START_AMBIGUOUS_NO_SIGNOFF')
              sys.exit(3)
          result=first_guard_cm_delivery_boundary(
              rows,verdict.get('first_guard_latch'),goal_start=starts[0])
          print('AXIA_P4_G07_L2_FIRST_CM_GUARD_BOUNDARY '+json.dumps(result,sort_keys=True))
          assert result['safety_pass'] is False
          assert result['cm_publisher_stopped_proven'] is False
          if result['status']=='GUARD_INTERNAL_CM_TTL_BREACH':
              print('AXIA_P4_G07_REAL_L2_FIRST_GUARD_CM_STALE_BLOCKED_150MS')
              sys.exit(3)
          if result['status']!='NO_FIRST_GUARD_LATCH_TRACE':
              print('AXIA_P4_G07_L2_FIRST_GUARD_BOUNDARY_INCONCLUSIVE')
              sys.exit(3)
          if (verdict.get('status')!='CI_GAZEBO_MOVING_GOAL_CANDIDATE'
                  or verdict.get('first_timing_violation') is not None
                  or verdict.get('guard_latched') is not False):
              print('AXIA_P4_G07_L2_G07_ORIGINAL_ORACLE_HOLD')
              sys.exit(3)
          print('AXIA_P4_G07_L2_CROSS_NODE_FIRST_CM_GUARD_NO_BREACH_IN_CI_ONLY')
          print('AXIA_P4_G07_OWNER_WSL2_NOT_RUN_SCHEDULER_UNVERIFIED_FORMAL_HOLD')
          PY
      - name: Verify genuine Jazzy MessageInfo publish/receive timestamps in actual Goal
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          python3 - <<'PY'
          from pathlib import Path
          import sys,json
          sys.path.insert(0,str(Path('tools').resolve()))
          from p2_g07_ci_moving_goal_oracle import cm_rmw_provenance
          root=Path('results/p2-g07-ci-moving/real-l2/g07_ci_moving')
          event_file=root/'actual_ros_events.jsonl'
          result_file=root/'ci_moving_goal_result.json'
          if not event_file.is_file() or not result_file.is_file():
              print('AXIA_P4_G07_NATIVE_RMW_MISSING_ACTUAL_GOAL_EVIDENCE')
              sys.exit(3)
          rows=[json.loads(line) for line in event_file.read_text().splitlines()]
          goal=[v['t'] for v in rows if v.get('kind')=='owner_goal_published']
          if len(goal)!=1:
              print('AXIA_P4_G07_NATIVE_RMW_GOAL_NOT_UNIQUE')
              sys.exit(3)
          cm=[v for v in rows if v.get('kind')=='pre_guard' and v.get('t',0)>=goal[0]]
          sup=[v for v in rows if v.get('kind')=='supervised' and v.get('t',0)>=goal[0]]
          def valid(v):
              return type(v.get('rmw_source_ns')) is int and v['rmw_source_ns']>0 and (
                  type(v.get('rmw_received_ns')) is int
                  and v['rmw_received_ns']>=v['rmw_source_ns'])
          if len(cm)<10 or len(sup)<10 or not all(map(valid,cm+sup)):
              print('AXIA_P4_G07_NATIVE_RMW_MESSAGE_INFO_UNAVAILABLE_CM_OR_SUPERVISOR')
              sys.exit(3)
          cmseq=[v.get('rmw_publication_seq') for v in cm]
          if not all(type(n) is int for n in cmseq):
              print('AXIA_P4_G07_NATIVE_RMW_PUBLICATION_SEQ_UNSUPPORTED_NO_CAUSAL_CREDIT')
              sys.exit(3)
          if any(b<=a for a,b in zip(cmseq,cmseq[1:])):
              print('AXIA_P4_G07_NATIVE_RMW_PUBLISHER_SEQUENCE_NONMONOTONIC')
              sys.exit(3)
          provenance=cm_rmw_provenance(rows,goal_start=goal[0],end=rows[-1]['t'])
          summary=json.loads(result_file.read_text())
          source_gaps=[(b['rmw_source_ns']-a['rmw_source_ns'])/1e9
                       for a,b in zip(cm,cm[1:])]
          print('AXIA_P4_G07_REAL_RMW_CM_SOURCE_MAX_GAP_SEC='+str(round(max(source_gaps),6)))
          print('AXIA_P4_G07_REAL_RMW_PROVENANCE='+json.dumps(provenance,sort_keys=True))
          if (summary.get('status')!='CI_GAZEBO_MOVING_GOAL_CANDIDATE'
                  or summary.get('guard_latched') is not False
                  or summary.get('first_timing_violation') is not None):
              print('AXIA_P4_G07_RMW_L2_ORIGINAL_G07_SAFETY_HOLD')
              sys.exit(3)
          if provenance['status']!='NO_CM_OBSERVED_GAP_IN_BOUND':
              print('AXIA_P4_G07_RMW_L2_UNSAFE_CM_OBSERVED_GAP')
              sys.exit(3)
          print('AXIA_P4_G07_NATIVE_RMW_SOURCE_RECEIPT_SEQ_L2_PASS_CI_ONLY')
          print('AXIA_P4_G07_OWNER_WSL2_NOT_RUN_FORMAL_G11_0_OF_15')
          PY
      - name: First CM publication gap vs actual Supervisor publication window
        if: always()
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          python3 - <<'PY'
          from pathlib import Path
          import json,sys
          sys.path.insert(0,str(Path("tools").resolve()))
          from p2_g07_ci_moving_goal_oracle import cm_upstream_rmw_gap_window
          folder=Path("results/p2-g07-ci-moving/real-l2/g07_ci_moving")
          event_file=folder/"actual_ros_events.jsonl"
          result_file=folder/"ci_moving_goal_result.json"
          if not event_file.is_file() or not result_file.is_file():
              print("AXIA_P4_G07_CM_SUPERVISOR_REAL_L2_NO_ACTUAL_GOAL_EVIDENCE")
              sys.exit(3)
          rows=[json.loads(line) for line in event_file.read_text().splitlines()]
          starts=[e["t"] for e in rows if e.get("kind")=="owner_goal_published"]
          if len(starts)!=1:
              print("AXIA_P4_G07_CM_SUPERVISOR_REAL_L2_AMBIGUOUS_GOAL")
              sys.exit(3)
          limit=max(e["t"] for e in rows if type(e.get("t")) in (int,float))
          result=cm_upstream_rmw_gap_window(rows,goal_start=starts[0],end=limit)
          summary=json.loads(result_file.read_text())
          print("AXIA_P4_G07_REAL_CM_SUPERVISOR_FIRST_RMW_WINDOW "+
                json.dumps(result,sort_keys=True))
          print("AXIA_P4_G07_REAL_G07_RUN_STATUS="+str(summary.get("status")))
          print("AXIA_P4_G07_REAL_G07_FIRST_GUARD_REASON="+
                str((summary.get("first_guard_latch") or {}).get("reason")))
          if result["status"]=="RMW_PROVENANCE_MISSING_OR_INVALID":
              print("AXIA_P4_G07_REAL_CM_SUPERVISOR_METADATA_UNVERIFIED")
              sys.exit(3)
          # A confirmed CM output breach is deliberately a FAIL even when
          # continuous upstream messages narrow the explanation.
          if result["status"]=="CM_SOURCE_GAP_EXCEEDS_150MS":
              print("AXIA_P4_G07_REAL_CM_SUPERVISOR_TTL_BREACH_DIAGNOSTIC_ONLY")
              sys.exit(3)
          if (summary.get("status")!="CI_GAZEBO_MOVING_GOAL_CANDIDATE"
              or summary.get("guard_latched") is not False
              or summary.get("first_timing_violation") is not None):
              print("AXIA_P4_G07_REAL_CM_SUPERVISOR_ORIGINAL_SAFETY_ORACLE_HOLD")
              sys.exit(3)
          print("AXIA_P4_G07_REAL_CM_SUPERVISOR_WINDOW_WITHIN_TTL_L2_PASS_CI_ONLY")
          print("AXIA_P4_G07_OWNER_NOT_RUN_G11_FORMAL_0_OF_15")
          PY

      - name: Review ACTUAL cross-node Scan 300ms, CM Guard 150ms, RMW first-boundary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd instructor
          python3 - <<'PY'
          import json,sys,sqlite3
          from pathlib import Path
          sys.path.insert(0,str(Path('tools').resolve()))
          from p2_g07_ci_moving_goal_oracle import (
              first_pre_latch_delivery_timing, cm_rmw_provenance,
              first_guard_cm_delivery_boundary)
          root=Path('results/p2-g07-ci-moving/real-l2')
          run=root/'g07_ci_moving'
          verdict_path=run/'ci_moving_goal_result.json'
          events_path=run/'actual_ros_events.jsonl'
          if not verdict_path.is_file() or not events_path.is_file():
              print('D06_G07_REAL_L2_HOLD_NO_ORIGINAL_GOAL_OR_MONOTONIC_EVENTS')
              raise SystemExit(3)
          verdict=json.loads(verdict_path.read_text())
          events=[json.loads(x) for x in events_path.read_text().splitlines() if x.strip()]
          goals=[e.get('t') for e in events if e.get('kind')=='owner_goal_published']
          if len(goals)!=1:
              print('D06_G07_REAL_L2_HOLD_GOAL_NOT_UNIQUE')
              raise SystemExit(3)
          goal=goals[0]
          end=max(e['t'] for e in events if type(e.get('t')) in (int,float))
          latch=verdict.get('first_guard_latch')
          if isinstance(latch,dict) and type(latch.get('tick_monotonic')) in (int,float):
              end=min(end,latch['tick_monotonic'])
          chronology=first_pre_latch_delivery_timing(events,goal_start=goal,end=end)
          first=chronology['first_timing_violation']
          internal=first_guard_cm_delivery_boundary(events,latch,goal_start=goal)
          rmw=cm_rmw_provenance(events,goal_start=goal,end=end,limit_sec=0.15)
          source=verdict.get('delivery_interval_diagnostics')
          if not isinstance(source,dict):
              source={}
          limits={'scan':0.3,'odom':0.3,'clock':0.3,
                  'cm':0.15,'source':0.15,'guard':0.15,'supervisor':0.15}
          failures=[k for k,lim in limits.items()
                    if (not isinstance(source.get(k),dict)
                        or type(source[k].get('max_gap_sec')) not in (float,int)
                        or source[k]['max_gap_sec']>=lim)]
          summary={
              'source_sha_checked':True,
              'actual_goal_observed':True,
              'actual_gazebo_candidate':verdict.get('status')=='CI_GAZEBO_MOVING_GOAL_CANDIDATE',
              'earliest_callback_channel':first['channel'] if first else None,
              'earliest_callback_gap_ms':round(first['first_violation_sec']*1000,3) if first else None,
              'earliest_callback_limit_ms':round(first['limit_sec']*1000,3) if first else None,
              'guard_internal_cm_age_ms':round(latch['cm_age_sec']*1000,3)
                if isinstance(latch,dict) and type(latch.get('cm_age_sec')) in (int,float) else None,
              'guard_latch_reason':latch.get('reason') if isinstance(latch,dict) else None,
              'guard_internal_boundary_status':internal.get('status'),
              'cm_rmw_status':rmw.get('status'),
              'scan_max_ms':round(verdict['max_scan_interval_sec']*1000,3)
                if type(verdict.get('max_scan_interval_sec')) in (float,int) else None,
              'cm_max_ms':round(verdict['max_cm_interval_sec']*1000,3)
                if type(verdict.get('max_cm_interval_sec')) in (float,int) else None,
              'odom_stopped_dwell_sec':verdict.get('odom_stopped_dwell_sec'),
              'not_within_bound':failures,
              'certified_estop':False,'owner_l3_accepted':False,
          }
          print('D06_G07_REAL_L2_FIRST_CROSS_NODE_BOUNDARY '+json.dumps(summary,sort_keys=True))
          # No use of final zero Twist/Action 3 to replace physical STOP evidence.
          if summary['actual_gazebo_candidate'] is False or latch is not None or first is not None or failures:
              print('D06_G07_REAL_L2_HOLD_FIRST_TIMING_OR_ORIGINAL_SAFETY_ORACLE')
              raise SystemExit(3)
          if verdict.get('guard_latched') is not False or verdict.get('first_timing_violation') is not None:
              print('D06_G07_REAL_L2_HOLD_FIRST_GUARD_LATCH_OR_SCAN')
              raise SystemExit(3)
          if not isinstance(verdict.get('odom_stopped_dwell_sec'),(float,int)) or verdict['odom_stopped_dwell_sec']<1:
              print('D06_G07_REAL_L2_HOLD_ACTUAL_ODOM_STOP_DWELL')
              raise SystemExit(3)
          if rmw.get('status')!='NO_CM_OBSERVED_GAP_IN_BOUND':
              print('D06_G07_REAL_L2_HOLD_RMW_CM_PUBLICATION_RECEIVE_NOT_PROVEN')
              raise SystemExit(3)
          bag=root/'rosbag2'
          dbs=list(bag.glob('*.db3'))
          if not (bag/'metadata.yaml').is_file() or len(dbs)!=1:
              print('D06_G07_REAL_L2_HOLD_ORIGINAL_ROSBAG_MISSING')
              raise SystemExit(3)
          conn=sqlite3.connect('file:'+str(dbs[0])+'?mode=ro',uri=True)
          try:
              good=conn.execute('pragma quick_check').fetchone()[0]=='ok'
              counts=dict(conn.execute(
                  'SELECT topics.name,count(messages.id) FROM topics '
                  'LEFT JOIN messages ON topics.id=messages.topic_id GROUP BY topics.name'))
          finally:
              conn.close()
          required=('/clock','/scan','/odom','/cmd_vel_supervised',
                    '/cmd_vel_pre_guard','/axia/p2/base_guard')
          if not good or any(counts.get(k,0)==0 for k in required):
              print('D06_G07_REAL_L2_HOLD_ORIGINAL_ROSBAG_INCOMPLETE')
              raise SystemExit(3)
          print('D06_REAL_G07_CI_L2_SCAN_CM_GUARD_ODOM_TTL_PASS NO_WSL2_OWNER_ACCEPTANCE')
          PY

      - name: First ordered Nav2, rosbag, launch and CM exit boundary, sanitized only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f ci-tools/d06/live/d06_ci_shutdown_triage.py ]];then
            echo 'D06_G07_SHUTDOWN_TRIAGE_MISSING_PUBLIC_PINNED_SOURCE'
            exit 3
          fi
          python3 ci-tools/d06/live/d06_ci_shutdown_triage.py \
            --root instructor/results/p2-g07-ci-moving/real-l2 \
            --runner-log d06_g07_sealed_runner.log \
            --runner-rc d06_g07_sealed_runner_rc

      - name: Delete all Instructor source and raw ROS / Gazebo evidence
        if: always()
        shell: bash
        run: rm -rf -- instructor ci-tools d06_g07_sealed_runner.log d06_g07_sealed_runner_rc d06_g07_cm_sched_private.jsonl d06_g07_cm_sched_sampler.log
