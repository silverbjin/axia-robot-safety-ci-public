name: AXIA P4 G07 CM scheduling vs callback processing first gap L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-cm-proc-sched-l0.yml']
permissions:
  contents: read
jobs:
  first-schedstat-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 21e9c4de6d71d24baaa68329c99383e8eeaf19af
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Model process scheduler time vs CM gap, no ROS
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 21e9c4de6d71d24baaa68329c99383e8eeaf19af
          python3 -m unittest discover -s tests/unit -p test_p4_g07_cm_proc_sched.py -v
          echo AXIA_P4_G07_FIRST_CM_SCHEDSTAT_L0_PASS_NO_GOAL
      - name: Remove sealed source
        if: always()
        shell: bash
        run: rm -rf -- .git tools tests scripts docs configs ros2_ws
