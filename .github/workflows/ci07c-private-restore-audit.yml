name: AXIA CI07C private read-only restore audit Python (NO AWS)
on:
  push:
    branches: [feat/secure-instructor-cloud-bridge]
    paths:
      - '.github/workflows/ci07c-private-restore-audit.yml'
permissions:
  contents: read
concurrency:
  group: axia-ci07c-no-upload
  cancel-in-progress: false
jobs:
  ci07c-private-python:
    if: github.repository == 'silverbjin/axia-robot-safety-ci-public' && github.actor == 'silverbjin' && github.ref == 'refs/heads/feat/secure-instructor-cloud-bridge' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    environment:
      name: axia-instructor-sealed
    steps:
      - name: Fetch exact instructor test-only commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 2ef139b12d2a2bf7d79717e5cd881c65cdf79b63
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
          fetch-depth: 1
          path: _instructor_private
      - name: Synthetic read-only object restoration tests
        shell: bash
        run: |
          set -euo pipefail
          LOG="$(mktemp)"
          trap 'rm -f "$LOG"' EXIT
          set +e
          ( cd _instructor_private && PYTHONPATH=.:tests/unit python3 -m unittest discover -s tests/unit -p test_p1_s3_custody_restore.py -v ) > "$LOG" 2>&1
          RC=$?
          set -e
          if [[ "$RC" == 0 ]] && grep -Eq '^Ran 4 tests in ' "$LOG" && grep -qx 'OK' "$LOG"; then
            echo 'AXIA_CI07C_RESTORE_UNIT=PASS tests=4 remote_aws=false independent_audit_verified=false gate_accepted=false'
          else
            echo 'AXIA_CI07C_RESTORE_UNIT=BLOCKED reason=UNIT_CONTRACT_FAILED remote_aws=false independent_audit_verified=false gate_accepted=false'
            exit 2
          fi
      - name: Classify private synthetic case failures without filenames or tracebacks
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          cd _instructor_private
          PYTHONPATH=.:tests/unit python3 - <<'PY'
          import contextlib, io, unittest
          suite = unittest.defaultTestLoader.discover(
              "tests/unit", pattern="test_p1_s3_custody_restore.py")
          def walk(group):
              for item in group:
                  if isinstance(item, unittest.TestSuite):
                      yield from walk(item)
                  else:
                      yield item
          for i, case in enumerate(walk(suite), 1):
              result = unittest.TestResult()
              with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                  case.run(result)
              status = "PASS" if result.wasSuccessful() else (
                  "ERROR" if result.errors else "FAIL")
              print(f"AXIA_CI07C_CASE_{i}={status}")
          PY
      - name: Cleanup private checkout
        if: always()
        shell: bash
        run: |
          rm -rf _instructor_private
          echo AXIA_PRIVATE_TEMP_CLEANUP_DONE
