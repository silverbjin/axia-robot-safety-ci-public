name: AXIA G07 WSL2 Scan pregoal Student policy L0
on:
  push:
    branches: ['fix/g07-wsl2-first-scan300-20261121']
    paths:
      - '.github/workflows/axia-g07-scan-pregoal-student-l0.yml'
      - '.github/workflows/axia-g07-fv17-owner-evidence-parity-native-l2.yml'
      - 'tests/test_g07_scan_pregoal_artifact_contract.py'
permissions:
  contents: read
jobs:
  student-same-session-pregoal-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: ci
          persist-credentials: false
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: 589ebaea166130c1fba233c8f3af02352fa0211c
          path: student
          persist-credentials: false
      - name: Student read-only Scan pregoal 12s synthetic tests (NO ROS, NO Goal)
        run: |
          set -Eeuo pipefail
          cd student/block_B/day07/h01_runtime
          python3 -m unittest discover -s tools -p 'test_g07_scan_wall_pregoal.py' -v
          cd "$GITHUB_WORKSPACE/ci"
          python3 -m unittest discover -s tests -p 'test_g07_scan_pregoal_artifact_contract.py' -v
          echo 'AXIA_G07_SCAN_PREFLIGHT_STUDENT_L0_PASS_REAL_ROS_NOT_RUN'
