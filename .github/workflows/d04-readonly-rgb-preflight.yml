name: AXIA D04 official Waffle RGB predevelopment (NO GOAL / NO FAULT)

on:
  pull_request:
    paths:
      - 'scripts/d04_rgb_discovery_readonly.py'
      - 'tests/test_d04_rgb_discovery.py'
      - '.github/workflows/d04-readonly-rgb-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rgb-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          set -euo pipefail
          python -m pip install pytest==8.3.5
          python -m compileall -q scripts/d04_rgb_discovery_readonly.py
          python -m pytest -q tests/test_d04_rgb_discovery.py

  official-waffle-rgb:
    needs: rgb-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container:
      image: ros:jazzy-ros-base-noble
    steps:
      - uses: actions/checkout@v4
      - name: Install official Jazzy/Harmonic stack once for this probe
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            procps python3 ros-jazzy-nav2-bringup ros-jazzy-nav2-minimal-tb3-sim \
            ros-jazzy-ros-gz ros-jazzy-ros2cli ros-jazzy-rclpy ros-jazzy-sensor-msgs
      - name: Official Waffle read-only RGB topic and image probe
        shell: bash
        run: |
          set -eo pipefail
          source /opt/ros/jazzy/setup.bash
          python3 scripts/d04_rgb_discovery_readonly.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d04-gazebo-rgb-preflight
          path: results/d04-readonly-camera/
          retention-days: 14
          if-no-files-found: warn
