# Read-only capability check for official ROS 2 Jazzy callback/Executor tracing.
# Same pinned G07 container, no private Instructor, no Gazebo, ROS Goal, cmd_vel.
name: AXIA G07 callback tracing capability preflight no Goal
on:
  push:
    branches: ['release/p2-g06-cm-ttl-20261110']
    paths: ['.github/workflows/axia-g07-cm-first-callback-trace-preflight-l0.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  official-jazzy-runtime-no-goal:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: 'Read-only trace instrumentation preflight'
        shell: bash
        run: |
          set -Eeuo pipefail
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          echo AXIA_G07_TRACE_PRECHECK_NO_ROS_NO_GOAL=true
          echo "ROS_DISTRO=$ROS_DISTRO"
          if ros2 pkg prefix tracetools >/dev/null 2>&1;then
            echo AXIA_G07_TRACE_TOOLS_ROS_PKG_PRESENT=true
          else
            echo AXIA_G07_TRACE_TOOLS_ROS_PKG_PRESENT=false
          fi
          if ros2 trace --help >/tmp/g07-trace-help.txt 2>&1;then
            echo AXIA_G07_ROS2_TRACE_CLI_PRESENT=true
          else
            echo AXIA_G07_ROS2_TRACE_CLI_PRESENT=false
          fi
          if command -v lttng >/dev/null;then
            echo AXIA_G07_LTTNG_CLI_PRESENT=true
            lttng version | head -n 3 || true
          else
            echo AXIA_G07_LTTNG_CLI_PRESENT=false
          fi
          if command -v babeltrace2 >/dev/null;then
            echo AXIA_G07_BABELTRACE2_PRESENT=true
          else
            echo AXIA_G07_BABELTRACE2_PRESENT=false
          fi
          python3 - <<'PY'
          import importlib.util
          for pkg in ('tracetools_trace','tracetools_read','lttngpy','ros2trace'):
              print('AXIA_G07_TRACE_MODULE_'+pkg.upper()+'='+str(importlib.util.find_spec(pkg) is not None).lower())
          PY
          if command -v babeltrace >/dev/null;then
            echo AXIA_G07_BABELTRACE_V1_PRESENT=true
          else
            echo AXIA_G07_BABELTRACE_V1_PRESENT=false
          fi
          SESSION=axia_g07_capability_preflight
          TRACE_DIR="$(mktemp -d)"
          if timeout 8 lttng create "$SESSION" --output="$TRACE_DIR" >/tmp/axia-lttng-create.log 2>&1;then
            echo AXIA_G07_LTTNG_USER_SESSION_CREATE=true
            if timeout 8 lttng enable-event -s "$SESSION" --userspace 'ros2:callback_start' >/tmp/axia-lttng-enable.log 2>&1 &&
               timeout 8 lttng enable-event -s "$SESSION" --userspace 'ros2:callback_end' >>/tmp/axia-lttng-enable.log 2>&1;then
              echo AXIA_G07_LTTNG_CALLBACK_EVENTS_ENABLE=true
            else
              echo AXIA_G07_LTTNG_CALLBACK_EVENTS_ENABLE=false
            fi
            timeout 8 lttng destroy "$SESSION" >/dev/null 2>&1 || true
          else
            echo AXIA_G07_LTTNG_USER_SESSION_CREATE=false
          fi
          rm -rf -- "$TRACE_DIR"
          echo AXIA_G07_TRACE_CAPABILITY_SCOPED_ONLY_NOT_CM_CAUSE_NOT_OWNER_RELEASE
      - name: 'Cycle27: real Jazzy callback trace decode proof, no Nav2 Goal'
        shell: bash
        run: |
          set -Eeuo pipefail
          export DEBIAN_FRONTEND=noninteractive
          timeout 120 apt-get update -qq
          timeout 120 apt-get install -y -qq --no-install-recommends babeltrace2 python3-bt2
          command -v babeltrace2
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          if ! ros2 pkg prefix nav2_collision_monitor >/dev/null 2>&1;then
            echo AXIA_G07_TRACE_OFFICIAL_CM_PACKAGE_NOT_AVAILABLE_NO_GOAL
            exit 3
          fi
          WORK="$(mktemp -d)"
          SESSION="axia_g07_callback_l1_${RANDOM}_${RANDOM}"
          trap 'lttng destroy "$SESSION" >/dev/null 2>&1 || true; rm -rf -- "$WORK"' EXIT
          lttng create "$SESSION" --output="$WORK/trace" >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:callback_start' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:callback_end' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rclcpp_callback_register' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rcl_subscription_init' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rclcpp_subscription_init' >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:rclcpp_subscription_callback_added' >/dev/null
          echo AXIA_G07_CYCLE31_JAZZY_SUBSCRIPTION_TOPIC_CALLBACK_TRACEPOINTS_ENABLED_NO_GOAL
          lttng add-context --userspace -s "$SESSION" -t vpid >/dev/null
          lttng start "$SESSION" >/dev/null
          START_ANCHOR="$(python3 -c 'import json,time; print(json.dumps({"mono_ns":time.monotonic_ns(),"wall_ns":time.time_ns()}))')"
          export ROS_DOMAIN_ID=97
          # The exact official CM executable, but NO lifecycle activation,
          # /cmd_vel publisher, Nav2 Goal, Gazebo or moving robot.
          ros2 run nav2_collision_monitor collision_monitor >"$WORK/cm.log" 2>&1 &
          CM_PID=$!
          sleep 2
          timeout 9 ros2 lifecycle get /collision_monitor >"$WORK/readonly_lifecycle.log" 2>&1 || true
          sleep 1
          kill "$CM_PID" >/dev/null 2>&1 || true
          wait "$CM_PID" >/dev/null 2>&1 || true
          echo AXIA_G07_CYCLE27_OFFICIAL_CM_LIFECYCLE_ONLY_NO_GOAL
          END_ANCHOR="$(python3 -c 'import json,time; print(json.dumps({"mono_ns":time.monotonic_ns(),"wall_ns":time.time_ns()}))')"
          lttng stop "$SESSION" >/dev/null
          lttng destroy "$SESSION" >/dev/null
          babeltrace2 "$WORK/trace" > "$WORK/events.txt"
          python3 - "$WORK/events.txt" <<'PY'
          from pathlib import Path
          import sys
          rows=Path(sys.argv[1]).read_text().splitlines()
          start=sum("ros2:callback_start" in row for row in rows)
          end=sum("ros2:callback_end" in row for row in rows)
          assert start>=2 and end>=2,(start,end)
          print("AXIA_G07_CYCLE27_RCLCPP_CALLBACK_START_END_TRACE_DECODE_L1_PASS_NO_GOAL"+
                " callback_start="+str(start)+" callback_end="+str(end))
          PY
          /usr/bin/python3 - "$WORK/trace" "$START_ANCHOR" "$END_ANCHOR" <<'PY'
          import bt2,json,sys
          rows=[]; registered=[]; symbols=[]; ticks=[]
          for msg in bt2.TraceCollectionMessageIterator(sys.argv[1]):
              if not isinstance(msg,bt2._EventMessageConst):
                  continue
              if msg.event.name in ("ros2:callback_start","ros2:callback_end"):
                  rows.append({
                      "name":msg.event.name,
                      "payload_keys":sorted(list(msg.event.payload_field)),
                      "common_context_keys":sorted(list(msg.event.common_context_field)),
                      "clock_snapshot_ns_available": msg.default_clock_snapshot is not None,
                  })
                  if msg.default_clock_snapshot:
                      ticks.append(msg.default_clock_snapshot.ns_from_origin)
              elif msg.event.name=="ros2:rclcpp_callback_register":
                  p=msg.event.payload_field
                  registered.append({
                      "payload_keys":sorted(list(p)),
                      "has_callback": "callback" in p,
                      "has_symbol": "symbol" in p,
                  })
                  symbols.append(str(p["symbol"])[:180])
          assert len(rows)>=4,len(rows)
          print("AXIA_G07_CYCLE27_BABELTRACE_BT2_SCHEMA_L1 "+
                json.dumps(rows[:2],sort_keys=True))
          assert registered, "NO_RCLCPP_CALLBACK_REGISTER_TRACEPOINT"
          assert ticks, "TRACE_EVENT_CLOCK_MISSING"
          begin=json.loads(sys.argv[2]); end=json.loads(sys.argv[3])
          # Babeltrace ns_from_origin may be epoch (wall) even for a kernel
          # monotonic-backed trace clock; NEVER assume its domain.
          def aligned(key):
              return (begin[key]-2_000_000_000 <= min(ticks)<=end[key]+2_000_000_000
                      and begin[key]-2_000_000_000 <=max(ticks)<=end[key]+2_000_000_000)
          is_mono=aligned("mono_ns");is_wall=aligned("wall_ns")
          offset_start=begin["wall_ns"]-begin["mono_ns"]
          offset_end=end["wall_ns"]-end["mono_ns"]
          offset_drift_ms=abs(offset_end-offset_start)/1e6
          source=("HOST_MONOTONIC" if is_mono else "HOST_WALL_EPOCH" if is_wall
                  else "UNVERIFIED_CLOCK_DOMAIN")
          print("AXIA_G07_CYCLE29_CALLBACK_REGISTRATION_SCHEMA_L1 "+
                json.dumps({
                    "register_count":len(registered),"first":registered[0],
                    "last":registered[-1],"clock_domain":source,
                    "trace_vs_mono_start_sec":round((min(ticks)-begin["mono_ns"])/1e9,3),
                    "trace_vs_wall_start_sec":round((min(ticks)-begin["wall_ns"])/1e9,3),
                    "host_wall_mono_offset_drift_ms":round(offset_drift_ms,3),
                },sort_keys=True))
          print("AXIA_G07_CYCLE29_OFFICIAL_CM_CALLBACK_SYMBOLS_NO_GOAL "+
                json.dumps({"cmdvel_like_count":sum("cmdvel" in s.lower()
                                                    or "cmd_vel" in s.lower() for s in symbols),
                            "unique_names":sorted(set(symbols))[:14]},sort_keys=True))
          assert is_mono or is_wall, "LTTNG_CLOCK_DOMAIN_UNVERIFIED"
          assert offset_drift_ms<50, "HOST_WALL_TO_MONOTONIC_STEP_DETECTED_NOT_PROVEN"
          PY
          /usr/bin/python3 - "$WORK/trace" <<'PY'
          import bt2,collections,json,sys
          names=("ros2:rcl_subscription_init",
                 "ros2:rclcpp_subscription_init",
                 "ros2:rclcpp_subscription_callback_added")
          seen=collections.Counter()
          schemas={}
          for msg in bt2.TraceCollectionMessageIterator(sys.argv[1]):
              if not isinstance(msg,bt2._EventMessageConst):
                  continue
              event=msg.event
              if event.name in names:
                  seen[event.name]+=1
                  schemas.setdefault(event.name,sorted(list(event.payload_field)))
          print("AXIA_G07_CYCLE31_JAZZY_SUBSCRIPTION_TRACE_FIELDS_NO_GOAL "+
                json.dumps({"counts":dict(seen),"payload_keys":schemas},sort_keys=True))
          missing=[n for n in names if seen[n]<=0]
          if missing:
              print("AXIA_G07_CYCLE31_TRACE_TOPIC_LINK_EVENTS_ABSENT_NO_GOAL "+",".join(missing))
              raise SystemExit(3)
          required={"ros2:rcl_subscription_init":("subscription_handle","topic_name"),
                    "ros2:rclcpp_subscription_init":("subscription_handle","subscription"),
                    "ros2:rclcpp_subscription_callback_added":("subscription","callback")}
          if any(not set(fields).issubset(schemas.get(name,[])) for name,fields in required.items()):
              raise SystemExit("AXIA_G07_CYCLE31_JAZZY_TRACE_PAYLOAD_SHAPE_INVALID")
          print("AXIA_G07_CYCLE31_JAZZY_TRACEPOINT_SCHEMA_VERIFIED_NO_GOAL")
          PY
          echo AXIA_G07_CYCLE27_TRACE_TOOLS_CI_DIAGNOSTIC_ONLY_FORMAL_OWNER_HOLD
