name: AXIA P4 G07 original first delivery recorder priority L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-recorder-priority-first-delivery-l0.yml']
permissions:
  contents: read
jobs:
  instructor-scoped-ttl-regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    environment: axia-instructor-sealed
    steps:
      - name: Exact sealed instructor commit; no private source in public artifacts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 1b28919b916ab2266a03d0ae2032adf7f501e8a0
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: First delivery boundary G07 recorder priority RED GREEN
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = 1b28919b916ab2266a03d0ae2032adf7f501e8a0
          python3 -m unittest discover -s tests/unit -p test_p4_g07_recorder_priority_first_delivery.py -v
          python3 -m unittest discover -s tests/unit -p test_p4_g07_rmw_source_receive_provenance.py -v
          python3 -m unittest discover -s tests/unit -p test_p4_demo_acceptance_profile.py -v
          python3 tools/p4_demo_acceptance.py --verify-current --output "$RUNNER_TEMP/g07_recorder_demo_state.json"
          python3 - "$RUNNER_TEMP/g07_recorder_demo_state.json" <<'PY'
          import json,sys
          a=json.load(open(sys.argv[1]))
          assert a['status']=='HOLD'
          assert 'G07_FIRST_CM_GUARD_TTL_VIOLATION_UNRESOLVED' in a['blockers']
          assert 'S02_NATIVE_CONTACT_ZERO_NOT_VERIFIED' in a['blockers']
          assert 'INSTRUCTOR_WSL2_INTEGRATED_DEMO_NOT_VERIFIED' in a['blockers']
          assert not a['certified_estop'] and not a['is_formally_accepted']
          print('AXIA_G07_RECORDER_PRIORITY_SOURCE_CONTRACT_PASS_G07_S02_WSL2_HOLD_NO_ROS_NO_GOAL')
          PY
      - name: Delete Instructor checkout and derived report
        if: always()
        shell: bash
        run: rm -rf -- .git tests tools ros2_ws docs configs scripts training
