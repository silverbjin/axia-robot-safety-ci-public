name: AXIA D08 offline 4h integration + student ZIP (L0 only)
on:
  push:
    branches: ['main','feature/d08-online-integration-ci-20261110']
    paths: ['.github/workflows/d08-offline-integration-ci.yml', 'd08/**']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  student-public-scaffold:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-student
          ref: d94af661b160ab9a3aa90d1817e95a77fa010574
          persist-credentials: false
      - name: Verify exact public student fixture/ZIP source and TODO RED (not learner GREEN)
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 'd94af661b160ab9a3aa90d1817e95a77fa010574'
          python3 -m pip install --quiet --disable-pip-version-check pytest==8.3.5
          python3 -m pytest -q \
            block_B/day08/tests/test_d08_public.py::test_d08_synthetic_fixture_contract \
            block_B/day08/tests/test_d08_submission_zip.py
          python3 - <<'PY'
          import subprocess,sys
          cmd=[sys.executable,'-m','pytest','-q',
            'block_B/day08/tests/test_d08_public.py::test_d08_integrated_six_scenarios_expected_red_until_todos_complete']
          r=subprocess.run(cmd,capture_output=True,text=True,timeout=30)
          assert r.returncode!=0 and 'TODO_D08_INTEGRATE_CASE' in (r.stdout+r.stderr)
          print('D08_PUBLIC_STUDENT_EXPECTED_RED_VERIFIED; NO_TEACHER_SOLUTION')
          PY
      - name: Remove public checkout
        if: always()
        shell: bash
        run: rm -rf -- block_B .github .git
  owner-python-env-regression:
    # Run only the public fixture; WSL2 owner must rerun the pinned private code.
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: RED reproducer and GREEN pytest11 isolation regression
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -q pytest==8.3.5
          PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 python -m pytest -q d08/tests/test_d08_owner_pytest_isolation.py
          bash -n d08/scripts/axia_d08_instructor_wsl2_once.sh
          bash d08/scripts/axia_d08_instructor_wsl2_once.sh --self-check

  # Private instructor source is tested on the existing approved sealed
  # public-CI release lane instead of requiring Environment access on
  # untrusted feature branches. Evidence run is recorded in private report.
