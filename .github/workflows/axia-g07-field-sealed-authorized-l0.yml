# Exact sealed Instructor candidate; no ROS, no Goal, no release authority.
name: AXIA G07 field official CM scheduler sealed L0
on:
  push:
    branches: ['release/p2-g06-cm-ttl-20261110']
    paths: ['.github/workflows/axia-g07-field-sealed-authorized-l0.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-field-cm-scheduler-sealed-l0
  cancel-in-progress: false
jobs:
  sealed-private-no-ros-no-goal:
    runs-on: ubuntu-24.04
    environment: axia-instructor-sealed
    timeout-minutes: 12
    steps:
      - name: Start sanitized checkpoint
        run: |
          echo RUNNER_INITIALIZED_NO_PRIVATE_DATA > field-l0-result.txt
      - name: Checkout exact private candidate, never publish solution
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: d31118661048ae5d7e1c63340d59abbb0ca05629
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Field CM scheduling RED or GREEN
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor rev-parse HEAD)" = d31118661048ae5d7e1c63340d59abbb0ca05629
          cd instructor
          set +e
          python3 -m unittest discover -s tests/unit -p 'test_g07_field_official_cm_cpu_parity_20261115.py' -v >../sealed-test-1.log 2>&1
          rc1=$?
          python3 -m unittest discover -s tests/unit -p 'test_p4_g07_goal_observer_cpu_parity_20261115.py' -v >../sealed-test-2.log 2>&1
          rc2=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_field_poststop_zero_cancel_uuid_20261115.py' -v >../sealed-test-3.log 2>&1
          rc6=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_first_cm_rpc_thread_state_20261115.py' -v >../sealed-test-4.log 2>&1
          rc7=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle11_cm_tf_headroom_20261115.py' -v >../sealed-test-5.log 2>&1
          rc8=$?
          python3 -m unittest discover -s tests/unit -p 'test_p4_g07_cm_tf_bounded.py' -v >../sealed-test-6.log 2>&1
          rc9=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle12_stop_rpc_cm_fresh_alignment_20261115.py' -v >../sealed-test-7.log 2>&1
          rc10=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle13_first_localization_startup_20261115.py' -v >../sealed-test-8.log 2>&1
          rc11=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle14_first_120ms_rmw_margin_20261115.py' -v >../sealed-test-9.log 2>&1
          rc12=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle15_combined_tf_fast_fail_and_stop_alignment_20261115.py' -v >../sealed-test-10.log 2>&1
          rc13=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle16_first_localization_shutdown_20261115.py' -v >../sealed-test-11.log 2>&1
          rc14=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle22_wsl2_cm_exclusive_cpu_first_gap_20261116.py' -v >../sealed-test-12.log 2>&1
          rc15=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle25_fourcpu_cm_goal_nonoverlap_20261116.py' -v >../sealed-test-13.log 2>&1
          rc16=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle26_first_cm_gap_scheduler_probe_20261116.py' -v >../sealed-test-14.log 2>&1
          rc17=$?
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle33_sim_odom_100hz_tf_headroom_20261116.py' -v >../sealed-test-15.log 2>&1
          rc18=$?
          bash -n scripts/p2_no_goal_smoke_ci.sh; rc3=$?
          bash -n scripts/p2_owner_l3_wsl2.sh && bash -n scripts/p4_g07_shared_runtime.sh; rc4=$?
          python3 -m py_compile tools/p2_g07_official_cm_cpu_affinity.py tools/p2_g07_goal_observer_cpu_plan.py; rc5=$?
          set -e
          cd ..
          printf 'CHECKOUT_OK_NO_PRIVATE_CONTENT\nTEST_FIELD_RC=%s\nTEST_PRIOR_CPU_RC=%s\nBASH_CI_RC=%s\nBASH_OWNER_RC=%s\nCOMPILE_RC=%s\nTEST_POSTSTOP_CANCEL_RC=%s\nTEST_RPC_PROC_RC=%s\nTEST_TF_20MS_RC=%s\nTEST_PRIOR_TF_RC=%s\nTEST_STOP_CM_ALIGNMENT_RC=%s\nTEST_FIRST_LOCALIZATION_RC=%s\nTEST_120MS_RMW_RC=%s\nTEST_TF_AND_CM_FRESH_RC=%s\nTEST_FIRST_LOCALIZATION_SHUTDOWN_RC=%s\nTEST_CYCLE22_CM_CPU_RC=%s\nTEST_CYCLE25_GOAL_CPU_RC=%s\nTEST_CYCLE26_FIRST_GAP_RC=%s\nTEST_CYCLE33_ODOM100_RC=%s\n' "$rc1" "$rc2" "$rc3" "$rc4" "$rc5" "$rc6" "$rc7" "$rc8" "$rc9" "$rc10" "$rc11" "$rc12" "$rc13" "$rc14" "$rc15" "$rc16" "$rc17" "$rc18" > field-l0-result.txt
          for f in sealed-test-1.log sealed-test-2.log sealed-test-3.log sealed-test-4.log sealed-test-5.log sealed-test-6.log sealed-test-7.log sealed-test-8.log sealed-test-9.log sealed-test-10.log sealed-test-11.log sealed-test-12.log sealed-test-13.log sealed-test-14.log sealed-test-15.log;do
            grep -E '^(FAIL|ERROR): test_[a-z0-9_]+|^Ran [0-9]+ tests|^FAILED \(' "$f" >> field-l0-result.txt || true
          done
          cat field-l0-result.txt
          if (( rc1+rc2+rc3+rc4+rc5+rc6+rc7+rc8+rc9+rc10+rc11+rc12+rc13+rc14+rc15+rc16+rc17+rc18 != 0 ));then exit 3;fi
          echo AXIA_G07_FIELD_CM_SCHEDULER_L0_PASS_NO_ROS_NO_GOAL
      - name: Publish only sanitized test verdict
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axia-g07-field-sealed-l0-verdict
          path: field-l0-result.txt
          if-no-files-found: error
          retention-days: 3
      - name: Delete all sealed instructor source
        if: always()
        run: rm -rf -- instructor sealed-test-1.log sealed-test-2.log sealed-test-3.log sealed-test-4.log sealed-test-5.log sealed-test-6.log sealed-test-7.log sealed-test-8.log sealed-test-9.log sealed-test-10.log sealed-test-11.log sealed-test-12.log sealed-test-13.log sealed-test-14.log sealed-test-15.log
