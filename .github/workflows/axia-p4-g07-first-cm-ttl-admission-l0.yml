name: AXIA P4 G07 first CM RMW 161ms and Guard 155ms owner admission L0
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    paths: ['.github/workflows/axia-p4-g07-first-cm-ttl-admission-l0.yml']
permissions:
  contents: read
jobs:
  first-guard-timing-fail-closed:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    environment: axia-instructor-sealed
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: f358bda2d5c5f59ab638a40075bfb6319c009fea
          token: ${{ secrets.AXIA_CLOUD_CI }}
          persist-credentials: false
      - name: Replay first CM source/Guard threshold and reject old successful SHA
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git rev-parse HEAD)" = f358bda2d5c5f59ab638a40075bfb6319c009fea
          python3 -m unittest discover -s tests/unit -p test_p4_g07_first_cm_ttl_admission.py -v
          echo AXIA_P4_G07_FIRST_CM_TTL_FAIL_CLOSED_L0_PASS_OWNER_NOT_ADMITTED
      - name: Purge Instructor source
        if: always()
        shell: bash
        run: rm -rf -- .git docs tools tests configs scripts ros2_ws training
