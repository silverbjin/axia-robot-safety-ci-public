# Historical workflow retained for immutable audit; automatic GOAL trigger retired until a separate reviewed release.
# Cycle37: Cycle36 exact real safety/navigation Goal oracle, original native S02,
# D07 Owner-validated SceneBroadcaster with separate gz sim -g/RViz2.
# All 7 delivery timing constraints remain fail-closed. NO Owner WSLg claim.
# Cycle36: same original safety/Goal runtime + exact new GUI-only integrated mode.
# Single source-pinned CI real Gazebo proof; WSLg Owner remains NOT_RUN.
# P4 prior L2 PASS #43674784552; new GUI overlay is unverified until actual L2 pass.
# PIYO actual public bag-loaded Goal L2 #43338381501: CLEAR/SLOW/STOP/odom
# and real 14-topic SQLite bag PASS, official Nav2 shutdown ACK PASS,
# but 10s Gazebo launch cleanup expired (rc3). Actual CM children exit0.
# Regressed first post-goal cleanup boundary RED #43339194903
# -> GREEN #43339388986 (53 PASS); both WSL2 Owner and CI use
# a bounded 26s post-ACK launch grace, no CM/Scan TTL changes.
name: AXIA G07 S2 official CM TF 10ms polling-sleep vs scheduler ONE GOAL L2
on:
  push:
    branches: [release/p2-g06-cm-ttl-20261110]
    # Authorized release-only CI simulation; preserve unmerged integration branch.
    # HOLD: only an explicit source-reviewed CI trigger after the CM
    # STOP-period cause has a GREEN regression may authorize the costly
    # simulation Goal. Editing this workflow alone never auto-moves a robot.
    paths: ['.github/workflows/axia-g07-cm120-s2-one-diagnostic-moving-l2.yml']
permissions:
  contents: read
concurrency:
  group: axia-g07-s2-one-diagnostic-sleep-vs-runqueue
  cancel-in-progress: false
jobs:
  real-gazebo-nav2-moving-simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 48
    environment: axia-instructor-sealed
    container:
      image: ghcr.io/silverbjin/axia-g07-runtime@sha256:861ae1df0560f991698d8967193380b1619589ba7770b5e2ca91ea4ef31f0c8e
      # Docker bridge resolver failed in #43041110273 and #43042223936;
      # use explicit public resolvers only for this GitHub CI container.
      # This does not change ROS networking, source, TTL or WSL2 runtime.
      options: --dns 1.1.1.1 --dns 8.8.8.8
    steps:
      - name: Private Instructor exact commit sealed
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-instructor
          ref: 966886c4627deb2bb3b37111fe336eeee6b9ebb4
          token: ${{ secrets.AXIA_CLOUD_CI }}
          path: instructor
          persist-credentials: false
      - name: Public Unified CI candidate and public main display assets (separate SHAs)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 352ea7c2197b937e8566ba90cd4d8fff46dd9f88
          path: unified-public
          persist-credentials: false
      - name: Published D06 read-only viewer sources pinned at public main
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 0f66059d9110f8e667200bbca22396bd0c78c02e
          path: visual
          persist-credentials: false
      - name: Public Cycle05 scoped official CM callback window analyzer
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: silverbjin/axia-robot-safety-ci-public
          ref: 9bcdc5cb92ff4da61efb2eba1d2fd77c30dfff96
          path: cm-diag-public
          persist-credentials: false
      - name: Public L0 GREEN, SHA fidelity, and no additional command publisher
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C unified-public rev-parse HEAD)" = "352ea7c2197b937e8566ba90cd4d8fff46dd9f88"
          test "$(git -C visual rev-parse HEAD)" = '0f66059d9110f8e667200bbca22396bd0c78c02e'
          python3 - <<'PY'
          from pathlib import Path
          s=Path('unified-public/d06/scripts/g07_shared_gui_clients.sh').read_text()
          assert 'setsid taskset -c "$GUI_CPU" nice -n 19 gz sim -g' in s
          assert 'headless_server_required":True' in s
          assert 'unset LIBGL_ALWAYS_SOFTWARE GALLIUM_DRIVER' in s
          print('AXIA_G07_C37_SOURCE_PINNED_SEPARATE_GAZEBO_GUI_CI_AND_WSLG_POLICY_L0_PASS')
          PY
          export PYTHONPATH="$PWD/unified-public"
          python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_unified_first_timing_regression.py' -v
          python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_unified_gui_sidecar_contract.py' -v
          python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_rollback_wslg_actual_evidence_20261116.py' -v
          python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_cycle37_readonly_monitor_noncm_cpu.py' -v
          bash -n unified-public/d06/scripts/g07_unified_ci_readonly_display.sh
          python3 - <<'PY'
          from pathlib import Path
          import re
          s=Path('visual/d06/live/d06_readonly_monitor.py').read_text()
          pubs=re.findall(r'create_publisher\([^\n]+',s)
          assert len(pubs)==1 and 'MarkerArray' in pubs[0]
          assert not re.search(r'create_publisher\(\s*(?:Twist|Pose)',s)
          print('AXIA_G07_UNIFIED_READONLY_MARKER_SINGLE_PUBLISHER_L0_PASS')
          PY
      - name: Field RED to GREEN owned official CM CPU and 2-core native STOP L0
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = '966886c4627deb2bb3b37111fe336eeee6b9ebb4'
          cd instructor
          python3 -m unittest discover -s tests/unit -p 'test_g07_field_official_cm_cpu_parity_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle22_wsl2_cm_exclusive_cpu_first_gap_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle25_fourcpu_cm_goal_nonoverlap_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle26_first_cm_gap_scheduler_probe_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle33_sim_odom_100hz_tf_headroom_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle36_integrated_gui_mode_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle36_gui_priority_isolation_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle36_sim_server_cm_cpu_separation_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle36_initial_obstacle_lane_offset_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle36_postack_gui_cleanup_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle28_prearmed_native_stop_priority_parity_20261116.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_p4_g07_goal_observer_cpu_parity_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_first_cm_rpc_thread_state_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle11_cm_tf_headroom_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle12_stop_rpc_cm_fresh_alignment_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle13_first_localization_startup_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle14_first_120ms_rmw_margin_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle15_combined_tf_fast_fail_and_stop_alignment_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_g07_cycle16_first_localization_shutdown_20261115.py' -v
          python3 -m unittest discover -s tests/unit -p 'test_p4_g07_scene_broadcaster_overlay.py' -v
          bash -n scripts/p2_no_goal_smoke_ci.sh
          bash -n scripts/p2_owner_l3_wsl2.sh
          python3 -m py_compile tools/p2_g07_official_cm_cpu_affinity.py tools/p2_g07_goal_observer_cpu_plan.py
          echo AXIA_G07_FIELD_OFFICIAL_CM_L0_GREEN_NO_ROS_NO_GOAL
      - name: Exact immutable runtime image and 25-package/5-file parity without apt reinstall
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C instructor -c safe.directory="$PWD/instructor" rev-parse HEAD)" = '966886c4627deb2bb3b37111fe336eeee6b9ebb4'
          test "$ROS_DISTRO" = jazzy
          cd instructor
          mkdir -p results/p2-g07-ci-moving
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          export ROS_DOMAIN_ID=83 ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
          export GZ_PARTITION=axia_p2_ci_moving_83 AXIA_P0_SIM_ONLY=1
          python3 tools/p2_g07_owner_env_parity.py --mode ci \
            --output results/p2-g07-ci-moving/core_parity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          v=json.loads(Path('results/p2-g07-ci-moving/core_parity.json').read_text())
          assert v['status']=='CORE_PARITY_PASS'
          assert v['checked_packages']==25 and v['checked_official_files']==5
          assert v['wsl_kernel_equal_ci'] is False
          print('AXIA_G07_RUNTIME_DIGEST_25_5_ENV_PARITY_PASS_NO_APT')
          PY
      - name: Use independently GREEN L0 oracle; syntax-check actual runner without pip
        shell: bash
        run: |
          set -euo pipefail
          cd instructor
          python3 -m py_compile tools/p4_g07_proc_sched.py
          python3 -m py_compile tools/p2_g07_ci_moving_goal.py tools/p2_g07_ci_moving_goal_oracle.py tools/p2_g07_lifecycle_service.py tools/p2_staged_no_goal.py tools/p4_g07_prearmed_stop.py
          python3 -m unittest discover -s tests/unit -p 'test_p4_g07_scene_broadcaster_overlay.py' -v
          bash -n scripts/p2_no_goal_smoke_ci.sh
          echo 'AXIA_G07_CI_MOVING_GOAL_RUNNER_STATIC_PASS_L0_VERIFIED_SEPARATELY'
      - name: Install test-only official RViz and Xvfb overlay without upgrading base ROS
        shell: bash
        run: |
          set -Eeuo pipefail
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 'ros-jazzy-*' 2>/dev/null | sort > /tmp/g07_ros_before.tsv
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq --no-install-recommends --no-upgrade             ros-jazzy-rviz2 ros-jazzy-visualization-msgs xvfb xauth x11-utils libgl1-mesa-dri
          dpkg-query -W -f='${binary:Package}\t${Version}\n' 'ros-jazzy-*' 2>/dev/null | sort > /tmp/g07_ros_after.tsv
          python3 - <<'PY'
          from pathlib import Path
          def pkgs(f):return dict(x.split('\t',1) for x in Path(f).read_text().splitlines() if '\t' in x)
          before=pkgs('/tmp/g07_ros_before.tsv');after=pkgs('/tmp/g07_ros_after.tsv')
          changed={k:(v,after.get(k)) for k,v in before.items() if after.get(k)!=v}
          assert before and not changed,'AXIA_G07_EXISTING_ROS_PACKAGE_DRIFT_'+repr(changed)
          print('AXIA_G07_GUI_OVERLAY_BASE_VERSION_FROZEN_DIGEST_PLUS_OVERLAY_NOT_IDENTICAL')
          PY
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          for cmd in Xvfb rviz2 xwininfo gz;do command -v "$cmd" || exit 3;done
          echo AXIA_G07_REAL_GUI_L2_PREREQUISITES_PRESENT_NO_GOAL
      - name: CI-only GUI role CPU preflight before original P4 Goal (no safety process changes)
        shell: bash
        run: |
          set -Eeuo pipefail
          export PYTHONPATH="$PWD/unified-public"
          # Historical D06 contract is intentionally the LEGACY default role;
          # new SceneBroadcaster role is separately regression-tested below.
          # Do not let the Cycle37 opt-in change the legacy test's meaning.
          AXIA_G07_GUI_SCENE_OVERLAY=0 python3 -m unittest discover -s unified-public/d06/tests -p 'test_g07_unified_gui_sidecar_contract.py' -v
          # Match the real Goal step exactly before the live role readback.
          export AXIA_G07_GUI_SCENE_OVERLAY=1
          # Gazebo Harmonic official state_hertz plugin parameter, session
          # display only. ~25FPS is sufficient for the MVP visual; it does
          # not alter simulation physics, LiDAR, CM code or safety TTL.
          export AXIA_G07_C37_SCENE_RATE_HZ=25 AXIA_G07_CYCLE36_INTEGRATED_GUI=0
          GUI_CPU="$(python3 unified-public/d06/live/d06_gui_cpu_plan.py)"
          MONITOR_CPU="$(python3 unified-public/d06/live/d06_gui_cpu_plan.py --role monitor)"
          [[ "$GUI_CPU" =~ ^[0-9]+$ && "$MONITOR_CPU" =~ ^[0-9]+$ && "$GUI_CPU" != "$MONITOR_CPU" ]]
          # Candidate-only GUI scheduling change, validated against the exact
          # unchanged private CM mask on this runner, BEFORE any moving Goal.
          export MONITOR_CPU
          python3 - <<'PY'
          import os,sys
          sys.path.insert(0,'instructor/tools')
          from p2_g07_official_cm_cpu_affinity import select_cm_cpu_mask
          official=set(select_cm_cpu_mask(set(os.sched_getaffinity(0))))
          monitor=int(os.environ['MONITOR_CPU'])
          assert monitor not in official,(monitor,sorted(official))
          print('AXIA_G07_C37_READONLY_MARKER_EXCLUDES_OWNED_CM_CORE_NO_GOAL')
          PY
          echo "G07_UNIFIED_GUI_CPU_PREFLIGHT_NO_GOAL_PASS renderer=$GUI_CPU observer=$MONITOR_CPU"
      - name: Isolated S02 native physics observer build and identical positive calibration blob
        shell: bash
        run: |
          set -Eeuo pipefail
          cd instructor
          test "$(git -c safe.directory="$PWD" rev-parse HEAD)" = '966886c4627deb2bb3b37111fe336eeee6b9ebb4'
          test "$(git hash-object tools/native_s02/s02_physics_witness.cc)" = 2035cf411972e35fa7d9b6d16766bbc784051ff8
          if ! command -v c++ >/dev/null || ! test -e /usr/include/gz/sim8/gz/sim/System.hh;then
            apt-get update -qq
            DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends g++ make libgz-sim8-dev
          fi
          cmake -S tools/native_s02 -B "$RUNNER_TEMP/s02-native-one-goal-build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$RUNNER_TEMP/s02-native-one-goal-build" --parallel 2
          test -s "$RUNNER_TEMP/s02-native-one-goal-build/libaxia_s02_physics_witness.so"
          python3 -m unittest discover -s tests/unit -p test_p4_s02_same_goal_review.py -q
          echo AXIA_S02_NATIVE_PLUGIN_SAME_VERIFIED_POSITIVE_BLOB_COMPILED_NO_GOAL
      # Cycle32: all-node LTTng instrumentation is a separate DIAGNOSTIC,
      # not part of the scoped safety admission Goal. Prior traced L2
      # #43814208942 first failed SLOW reachability, not Guard TTL.
      # Retain prior pinned trace workflows/diagnostics for attribution.
      - name: Cycle05 CM-filtered LTTng capability and public analysis L0 before Goal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C cm-diag-public rev-parse HEAD)" = 9bcdc5cb92ff4da61efb2eba1d2fd77c30dfff96
          # First CI RED #43995476156: nested checkout is NOT importable without
          # an explicit Python module root. Assert the exact real CI layout.
          PYTHONPATH="$PWD/cm-diag-public" python3 -c \
             'from d06.live.g07_cycle05_cm_callback_window import classify; assert callable(classify)'
          PYTHONPATH="$PWD/cm-diag-public" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
             -s cm-diag-public/d06/tests -p 'test_g07_cycle05_cmd_callback_window.py' -v
          echo AXIA_G07_C05_NESTED_PUBLIC_CHECKOUT_IMPORT_GREEN_BEFORE_GOAL
          command -v lttng
          if ! /usr/bin/python3 -c 'import bt2' >/dev/null 2>&1;then
            export DEBIAN_FRONTEND=noninteractive
            timeout 120 apt-get update -qq
            timeout 120 apt-get install -y -qq --no-install-recommends python3-bt2
          fi
          SESSION=axia_g07_c05_filter_preflight_${{ github.run_id }}
          DIR="$(mktemp -d)"
          trap 'lttng destroy "$SESSION" >/dev/null 2>&1 || true; rm -rf -- "$DIR"' EXIT
          lttng create "$SESSION" --output="$DIR/trace" >/dev/null
          lttng add-context --userspace -s "$SESSION" -t vpid -t vtid -t procname >/dev/null
          CM_FILTER='$ctx.procname == "collision_monit" || $ctx.procname == "collision_monitor"'
          lttng enable-event --userspace -s "$SESSION" 'ros2:callback_start' --filter "$CM_FILTER" >/dev/null
          lttng enable-event --userspace -s "$SESSION" 'ros2:callback_end' --filter "$CM_FILTER" >/dev/null
          lttng destroy "$SESSION" >/dev/null
          echo AXIA_G07_C05_LTTNG_ONLY_CM_PROCNAMES_FILTER_PREFLIGHT_PASS_NO_ROS_NO_GOAL
      - name: Bounded official TF-ABI interposition and exact first-gap join L0 BEFORE Goal
        shell: bash
        run: |
          set -Eeuo pipefail
          test "$(git -C cm-diag-public rev-parse HEAD)" = '9bcdc5cb92ff4da61efb2eba1d2fd77c30dfff96'
          set +u
          source /opt/ros/jazzy/setup.bash
          set -u
          PYTHONPATH="$PWD/cm-diag-public" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
             -s cm-diag-public/d06/tests -p 'test_g07_cm120_tf_first_gap_join.py' -v
          for suite in test_g07_cm120_s2_offcpu_classification.py test_g07_cm120_s2_exact_tf_offcpu_join.py test_g07_cm120_s2_actual_sleep_provenance.py;do
            PYTHONPATH="$PWD/cm-diag-public" PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
               -s cm-diag-public/d06/tests -p "$suite" -v
          done
          cmake -S cm-diag-public/d06/diagnostic -B /tmp/axia_g07_cm120_abi \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build /tmp/axia_g07_cm120_abi --parallel 2
          SO=/tmp/axia_g07_cm120_abi/libaxia_g07_cm120_tf_diag.so
          test -s "$SO"
          nm -D -C "$SO" | grep -F 'nav2_util::getTransform(' | grep -F 'tf2::Transform&'
          env LD_PRELOAD="$SO" AXIA_G07_CM120_LIB="$SO" python3 - <<'PY'
          import ctypes,glob,os
          src=glob.glob('/opt/ros/jazzy/lib/libnav2_util*.so')
          assert src, 'AXIA_G07_CM120_ORIGINAL_NAV2_LIB_MISSING_NO_GOAL'
          libs=[ctypes.CDLL(x,mode=ctypes.RTLD_GLOBAL) for x in src]
          d=ctypes.CDLL(os.environ['AXIA_G07_CM120_LIB'])
          d.axia_cm120_original_transform_linkage_selftest.restype=ctypes.c_int
          assert d.axia_cm120_original_transform_linkage_selftest()==1, 'AXIA_G07_CM120_ORIGINAL_ABI_LINK_UNVERIFIED_NO_GOAL'
          d.axia_g07_s2_sleep_interposition_selftest.restype=ctypes.c_int
          assert d.axia_g07_s2_sleep_interposition_selftest()==1, 'AXIA_G07_S2_SLEEP_FOR_LIBC_INTERPOSITION_UNVERIFIED_NO_GOAL'
          print('AXIA_G07_CM120_PREGOAL_EXACT_ORIGINAL_TF_ABI_L0_PASS')
          PY
          echo AXIA_G07_CM120_TF_USERSpace_DIAGNOSTIC_ARMABLE_ONLY_NO_GOAL
          echo AXIA_G07_S2_SAME_REAL_JAZZY_TF_SLEEP_FOR_ABI_PREGOAL_PASS
      - name: Real Harmonic official TB3 Waffle and Nav2 ONE bounded simulation Goal
